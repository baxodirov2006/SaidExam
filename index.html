‘shatish<\/b> natijasida ro‘yxat sonining o‘zgarishi. Balans: <b>son (oxir) = son (bosh) + qabul qilinganlar − bo‘shaganlar<\/b>.<\/p><p>Koeffitsientlar (o‘rtacha ro‘yxatdagi songa nisbatan, %):<\/p><ul><li>qabul bo‘yicha aylanma koeffitsienti = qabul qilinganlar / o‘rtacha son · 100;<\/li><li>bo‘shash bo‘yicha aylanma koeffitsienti = bo‘shaganlar / o‘rtacha son · 100;<\/li><li>umumiy aylanma koeffitsienti = (qabul qilinganlar + bo‘shaganlar) / o‘rtacha son · 100;<\/li><li>qo‘nimsizlik koeffitsienti = o‘z xohishi bilan va intizom buzilishi sababli bo‘shaganlar / o‘rtacha son · 100;<\/li><li>kadrlar doimiyligi koeffitsienti = yil bo‘yi to‘liq ishlaganlar / o‘rtacha son · 100;<\/li><li>o‘rnini to‘ldirish koeffitsienti = qabul qilinganlar / bo‘shaganlar.<\/li><\/ul><p>Xodimlar <b>tarkib<\/b>i jins, yosh, ma’lumot, malaka, staj, lavozim bo‘yicha guruhlash va tuzilma ulushlari orqali tahlil qilinadi; yuqori qo‘nimsizlik mehnat sharoiti va ish haqidagi muammolarni bildiradi.<\/p>", "t": "mehnat", "id": "sv-165", "src": "savdo"}, {"n": 166, "q": "Ish vaqti fondlari. Ish vaqtini o‘lchash va undan foydalanish ko‘rsatkichlari.", "k": "kalendar, tabel, maksimal, haqiqiy.", "a": "<p>Ish vaqti kishi-kun va kishi-soatlarda o‘lchanadi; asosiy manba — <b>tabel<\/b> (ish vaqtini hisobga olish varaqasi).<\/p><p>Ish vaqti fondlari:<\/p><ul><li><b>kalendar<\/b> fond = ishlangan + ishlanmagan kishi-kunlar (= kalendar kunlar × o‘rtacha ro‘yxatdagi son);<\/li><li>tabel fondi = kalendar fond − bayram va dam olish kishi-kunlari;<\/li><li><b>maksimal<\/b> mumkin bo‘lgan fond = tabel fondi − navbatdagi ta’til kishi-kunlari;<\/li><li><b>haqiqiy<\/b> ishlangan vaqt = maksimal fond − barcha ishlanmagan vaqt (kasallik, ruxsat bilan, sababsiz kelmaslik, bekor turish).<\/li><\/ul><p>Foydalanish ko‘rsatkichlari:<\/p><ul><li>kalendar, tabel va maksimal fonddan foydalanish koeffitsientlari = haqiqiy ishlangan vaqt / tegishli fond · 100%;<\/li><li>ish davri (kunlar)dan foydalanish = haqiqiy o‘rtacha ish kunlari / rejadagi; ish kuni davomiyligidan foydalanish = haqiqiy o‘rtacha ish soati / normativ;<\/li><li>integral koeffitsient = ikkalasining ko‘paytmasi.<\/li><\/ul><p>Yo‘qotilgan vaqt tahlili unumdorlikni oshirish zaxiralarini aniqlaydi.<\/p>", "t": "mehnat", "id": "sv-166", "src": "savdo"}, {"n": 167, "q": "Savdo tashkilotlarida mehnat unumdorligi ko‘rsatkichlari. Mehnat unumdorligi dinamikasini tahlil qilishda indeks usuli.", "k": "tovar aylanmasi, xodim, indeks, dinamika.", "a": "<p>Savdoda mehnat unumdorligining to‘g‘ri ko‘rsatkichi — bir <b>xodim<\/b>ga to‘g‘ri keladigan <b>tovar aylanmasi<\/b>: <b>W = T / S̄<\/b> (T — tovar aylanmasi, S̄ — xodimlarning o‘rtacha soni); shuningdek bir kishi-kun, bir kishi-soatga aylanma. Teskari ko‘rsatkich — mehnat sig‘imi t = S̄ / T. Narx ta’sirini chiqarish uchun aylanma taqqoslama narxlarda olinadi.<\/p><p>Unumdorlik <b>dinamika<\/b>sini <b>indeks<\/b> usulida tahlil qilish:<\/p><ul><li>individual indeks: <b>Iw = W1 / W0<\/b>;<\/li><li>o‘zgaruvchan tarkibli indeks: (ΣW1S1 / ΣS1) : (ΣW0S0 / ΣS0);<\/li><li>doimiy tarkibli indeks: ΣW1S1 / ΣW0S1;<\/li><li>tarkibiy siljishlar indeksi = o‘zgaruvchan tarkibli / doimiy tarkibli indeks;<\/li><li>omillar bo‘yicha: <b>IT = Iw · Is<\/b>; aylanma o‘sishi unumdorlik hisobiga = (W1 − W0) · S1, xodimlar soni hisobiga = (S1 − S0) · W0.<\/li><\/ul><p>Unumdorlik o‘sish sur’atining o‘rtacha ish haqi o‘sish sur’atidan yuqori bo‘lishi samarali rivojlanishni bildiradi.<\/p>", "t": "mehnat", "id": "sv-167", "src": "savdo"}, {"n": 168, "q": "Tovar aylanmasining mehnat sig‘imi indeksi va uning savdoda mehnat unumdorligini o‘rganishdagi ahamiyati.", "k": "mehnat sig‘imi, teskari ko‘rsatkich, indeks.", "a": "<p>Tovar aylanmasining <b>mehnat sig‘imi<\/b> — bir birlik (masalan, 1 mln so‘m) tovar aylanmasiga sarflangan mehnat (xodimlar soni yoki kishi-soat): <b>t = S / T<\/b>. U mehnat unumdorligining <b>teskari ko‘rsatkich<\/b>i: t = 1 / W.<\/p><p>Mehnat sig‘imi <b>indeks<\/b>i: <b>It = Σt1T1 / Σt0T1<\/b> — hisobot davri aylanmasini (taqqoslama narxlarda) hisobot va bazis davri mehnat sig‘imi bo‘yicha sarflanadigan mehnat bilan taqqoslaydi.<\/p><p>Ahamiyati:<\/p><ul><li>turli tovar guruhlari yoki korxonalar bo‘yicha unumdorlikning umumiy indeksini topish imkonini beradi: <b>Iw = 1 / It = Σt0T1 / Σt1T1<\/b>;<\/li><li>mehnat tejalishini ko‘rsatadi: Σt0T1 − Σt1T1 (tejalgan xodimlar yoki kishi-soatlar);<\/li><li>har xil mehnat sig‘imli tovarlar aylanmasi tarkibining ta’sirini hisobga oladi.<\/li><\/ul><p>It < 1 bo‘lsa, mehnat sig‘imi kamaygan, ya’ni unumdorlik oshgan.<\/p>", "t": "mehnat", "id": "sv-168", "src": "savdo"}, {"n": 169, "q": "Mehnatga haq to‘lash statistikasi ko‘rsatkichlari: ish haqi fondini aniqlash va uning tarkibi. O‘rtacha ish haqini hisoblash.", "k": "fond, tarkib, o‘rtacha ish haqi.", "a": "<p>Ish haqi <b>fond<\/b>i — davr mobaynida xodimlarga ishlangan va ishlanmagan vaqt uchun hisoblangan barcha mehnat haqi summasi.<\/p><p>Fond <b>tarkib<\/b>i:<\/p><ul><li>ishlangan vaqt uchun to‘lovlar: tarif stavkasi, lavozim maoshi, ishbay haq, tovar aylanmasidan foiz, mukofotlar, qo‘shimcha to‘lovlar (tungi, bayram kunlari, o‘rindoshlik);<\/li><li>ishlanmagan vaqt uchun to‘lovlar: navbatdagi ta’til haqi, bekor turish uchun to‘lov va boshqalar;<\/li><li>bir martalik rag‘batlantirish to‘lovlari (yil yakuni bo‘yicha mukofot, moddiy yordam).<\/li><\/ul><p>Soatlik, kunlik va oylik (to‘liq) fondlar ajratiladi.<\/p><p><b>O‘rtacha ish haqi<\/b>:<\/p><ul><li>o‘rtacha oylik = oylik ish haqi fondi / o‘rtacha ro‘yxatdagi xodimlar soni;<\/li><li>o‘rtacha kunlik = kunlik fond / ishlangan kishi-kunlar; o‘rtacha soatlik = soatlik fond / ishlangan kishi-soatlar;<\/li><li>dinamika — o‘zgaruvchan va doimiy tarkibli indekslar; real ish haqi indeksi = nominal ish haqi indeksi / iste’mol narxlari indeksi.<\/li><\/ul>", "t": "mehnat", "id": "sv-169", "src": "savdo"}, {"n": 170, "q": "Savdo va umumiy ovqatlanishda ishlab chiqarish va muomala xarajatlari hamda sarf-xarajatlarni tavsiflovchi ko‘rsatkichlarning iqtisodiy mohiyati, tarkibi va statistik hisoboti.", "k": "xarajat, tarkib, hisobot, muomala.", "a": "<p>Savdoda <b>muomala<\/b> xarajatlari — tovarlarni ishlab chiqaruvchidan iste’molchiga yetkazish (tashish, saqlash, sotish) jarayonidagi mehnat, moddiy va pul sarflarining pul ifodasi. Umumiy ovqatlanishda ular taom tayyorlash bilan bog‘liq ishlab chiqarish xarajatlari bilan birga “ishlab chiqarish va muomala xarajatlari” deb ataladi.<\/p><p><b>Xarajat<\/b>lar <b>tarkib<\/b>i (moddalar bo‘yicha): transport xarajatlari; mehnatga haq to‘lash va ijtimoiy to‘lovlar; bino va inshootlar ijarasi va saqlash; asosiy vositalar amortizatsiyasi; tovarlarni saqlash, saralash, qadoqlash; reklama; kredit foizlari; tabiiy yo‘qotishlar; tara xarajatlari va boshqalar.<\/p><p>Guruhlanishi: shartli-doimiy va o‘zgaruvchan; to‘g‘ri va bilvosita; joriy va bir martalik xarajatlar.<\/p><p>Statistik <b>hisobot<\/b>: korxonalar moliyaviy va statistik hisobotlarida xarajatlar summasini moddalar bo‘yicha ko‘rsatadi; ular asosida xarajatlar summasi, nisbiy darajasi (tovar aylanmasiga % da), tejam yoki ortiqcha sarf va ularning dinamikasi hisoblanadi.<\/p>", "t": "xarajat", "id": "sv-170", "src": "savdo"}, {"n": 171, "q": "Xarajatlarning nisbiy darajasi va uning dinamikasi ko‘rsatkichlarini hisoblash.", "k": "xarajat / tovar aylanmasi × 100, dinamika.", "a": "<p><b>Xarajatlarning nisbiy darajasi<\/b> — muomala xarajatlari summasining tovar aylanmasiga nisbati: <b>U = X / T · 100%<\/b> (X — xarajatlar summasi, T — tovar aylanmasi). U har 100 so‘m tovar aylanmasiga necha so‘m xarajat to‘g‘ri kelishini ko‘rsatadi.<\/p><p><b>Dinamika<\/b> ko‘rsatkichlari:<\/p><ul><li>darajaning o‘zgarish hajmi (foiz punktlarda): <b>ΔU = U1 − U0<\/b>;<\/li><li>darajaning o‘zgarish sur’ati: ΔU / U0 · 100%;<\/li><li>tejam (−) yoki ortiqcha sarf (+) summasi: <b>ΔX = ΔU · T1 / 100<\/b>;<\/li><li>xarajatlar summasi indeksi Ix = X1 / X0; daraja indeksi Iu = U1 / U0 = Ix / IT.<\/li><\/ul><p>Masalan, T0 = 500, X0 = 40 (U0 = 8%); T1 = 600, X1 = 45 (U1 = 7,5%), mln so‘m. ΔU = −0,5 foiz punkt; o‘zgarish sur’ati = −6,25%; tejam = 0,5 · 600 / 100 = 3 mln so‘m.<\/p>", "t": "xarajat", "id": "sv-171", "src": "savdo"}, {"n": 172, "q": "Muomala xarajatlari summasi va darajasini tahlil qilishning statistik usullari.", "k": "summa, daraja, indeks, omil.", "a": "<p>Muomala xarajatlarining <b>summa<\/b>si va <b>daraja<\/b>si quyidagi statistik usullar bilan tahlil qilinadi:<\/p><ul><li>taqqoslash — haqiqiy xarajatlarni reja, o‘tgan davr va boshqa korxonalar bilan solishtirish;<\/li><li>guruhlash — moddalar, shartli-doimiy va o‘zgaruvchan xarajatlar, tovar guruhlari bo‘yicha; tuzilma ulushlari;<\/li><li><b>indeks<\/b> usuli — xarajatlar summasi o‘zgarishini <b>omil<\/b>larga ajratish: <b>ΔX = (T1 − T0) · U0 / 100 + (U1 − U0) · T1 / 100<\/b> — birinchi qism aylanma hajmi, ikkinchisi xarajatlar darajasi hisobiga;<\/li><li>aylanma tarkibi ta’siri — o‘zgaruvchan va doimiy tarkibli daraja indekslari, tarkibiy siljishlar indeksi;<\/li><li>dinamika qatorlari va trend;<\/li><li>korrelyatsion-regression tahlil — xarajatlar darajasining aylanma hajmi, aylanish tezligi, unumdorlikka bog‘liqligi (hajm oshganda shartli-doimiy xarajatlar hisobiga daraja pasayadi).<\/li><\/ul>", "t": "xarajat", "id": "sv-172", "src": "savdo"}, {"n": 173, "q": "Savdo samaradorligining statistik ko‘rsatkichlari tizimi.", "k": "foyda, rentabellik, unumdorlik, xarajat.", "a": "<p>Savdo samaradorligi — natijaning (samaraning) sarflangan resurslar yoki xarajatlarga nisbati. Ko‘rsatkichlar tizimi:<\/p><ul><li>umumlashtiruvchi: <b>foyda<\/b> summasi (yalpi daromad − muomala xarajatlari); <b>rentabellik<\/b>: aylanma rentabelligi = foyda / tovar aylanmasi · 100%, <b>xarajat<\/b>lar rentabelligi = foyda / muomala xarajatlari · 100%, aktivlar rentabelligi = foyda / aktivlarning o‘rtacha qiymati · 100%;<\/li><li>mehnatdan foydalanish: mehnat <b>unumdorlik<\/b>i (bir xodimga aylanma), bir xodimga foyda, mehnat sig‘imi;<\/li><li>asosiy vositalardan foydalanish: fond qaytimi, 1 kv. m savdo maydoniga aylanma va foyda;<\/li><li>aylanma mablag‘lardan foydalanish: zaxiralar aylanish koeffitsienti va aylanish kunlari;<\/li><li>xarajatlar samaradorligi: xarajatlarning nisbiy darajasi, 1 so‘m xarajatga aylanma.<\/li><\/ul><p>Ko‘rsatkichlar to‘g‘ri (natija / resurs) va teskari (resurs / natija) shaklda hisoblanadi, dinamikada va korxonalar bo‘yicha taqqoslanadi.<\/p>", "t": "samara", "id": "sv-173", "src": "savdo"}, {"n": 174, "q": "Savdo samaradorligini tahlil qilishda korrelyatsion-regression tahlildan foydalanish.", "k": "korrelyatsiya, regressiya, omil, model.", "a": "<p>Savdo samaradorligi ko‘p <b>omil<\/b>larga bog‘liq: aylanma hajmi, aylanish tezligi, mehnat unumdorligi, xarajatlar darajasi, savdo maydoni, joylashuv. Ularning ta’sirini o‘lchash uchun <b>korrelyatsiya<\/b> va <b>regressiya<\/b> tahlili qo‘llanadi.<\/p><p>Bosqichlar:<\/p><ul><li>natijaviy belgi (rentabellik, foyda, bir xodimga aylanma) va omil belgilarni tanlash, ma’lumotlarni yig‘ish;<\/li><li>bog‘lanish zichligini o‘lchash — Pirson korrelyatsiya koeffitsienti r, ko‘p omilli R, determinatsiya koeffitsienti R²;<\/li><li>regressiya <b>model<\/b>ini tuzish: juft <b>ŷ = a + bx<\/b> yoki ko‘p omilli ŷ = a + b1x1 + b2x2 + …; parametrlar eng kichik kvadratlar usulida baholanadi;<\/li><li>ahamiyatlilikni tekshirish (F- va t-mezonlar), multikollinearlikni aniqlash;<\/li><li>izohlash: b — omil bir birlikka oshganda natija o‘rtacha qanchaga o‘zgarishi; elastiklik E = b · x̄ / ȳ.<\/li><\/ul><p>Shartli misol: rentabellik = 2,1 + 0,35 · (aylanish koeffitsienti), R² = 0,64 — rentabellik variatsiyasining 64% i aylanish tezligi bilan izohlanadi. Model samaradorlik zaxiralarini aniqlash va prognoz uchun ishlatiladi.<\/p>", "t": "samara", "id": "sv-174", "src": "savdo"}, {"n": 175, "q": "Tashqi savdo statistikasining ahamiyati, vazifalari va metodologik standartlari.", "k": "eksport, import, standart, tahlil.", "a": "<p>Tashqi savdo statistikasi mamlakatning boshqa davlatlar bilan tovar va xizmatlar ayirboshlashini — <b>eksport<\/b> va <b>import<\/b>ning hajmi, tarkibi, geografiyasi va dinamikasini o‘rganadi. Ahamiyati: to‘lov balansi va milliy hisoblar tizimini tuzish, tashqi savdo, bojxona-tarif va valyuta siyosati uchun asos.<\/p><p>Vazifalari: eksport, import, tashqi savdo aylanmasi va saldoni aniqlash; tovar va geografik tarkibni o‘rganish; narx va fizik hajm indekslari, savdo shartlarini hisoblash; iqtisodiyot ochiqligi (kvotalar) va samaradorlikni <b>tahlil<\/b> qilish.<\/p><p>Metodologik <b>standart<\/b>lar:<\/p><ul><li>BMTning xalqaro tovarlar savdosi statistikasi bo‘yicha tavsiyalari (IMTS) — umumiy va maxsus savdo tizimlari, eksportni FOB, importni CIF narxlarida baholash;<\/li><li>XVJning To‘lov balansi qo‘llanmasi (BPM6) va xizmatlar savdosi statistikasi qo‘llanmasi (MSITS);<\/li><li>tasniflagichlar: HS asosidagi TIF TN, SITC (Standart xalqaro savdo tasnifi), BEC (keng iqtisodiy toifalar).<\/li><\/ul><p>Standartlar ma’lumotlarning xalqaro taqqoslanishini ta’minlaydi.<\/p>", "t": "tashqi", "id": "sv-175", "src": "savdo"}, {"n": 176, "q": "O‘zbekiston Respublikasida tovarlar tashqi savdosi statistikasining axborot bazasi.", "k": "bojxona, bank, hisobot, deklaratsiya.", "a": "<p>O‘zbekistonda tovarlar tashqi savdosi statistikasining axborot bazasi:<\/p><ul><li><b>bojxona<\/b> ma’lumotlari — asosiy manba: bojxona yuk <b>deklaratsiya<\/b>lari (asosan elektron) bo‘yicha tovar kodi (TIF TN), miqdori, qiymati, hamkor mamlakat, bojxona rejimi; bojxona organlari ularni qayta ishlab statistika organiga uzatadi;<\/li><li>korxonalarning statistik <b>hisobot<\/b>lari — deklaratsiyada to‘liq aks etmaydigan tashqi savdo operatsiyalari bo‘yicha qo‘shimcha ma’lumot;<\/li><li><b>bank<\/b> ma’lumotlari — Markaziy bank va tijorat banklari: eksport-import bo‘yicha to‘lovlar, valyuta tushumi, to‘lov balansi;<\/li><li>qo‘shimcha manbalar: jismoniy shaxslar olib o‘tgan tovarlar bo‘yicha baholar, hamkor mamlakatlar ma’lumotlari (“oyna” statistikasi), elektron tijorat ma’lumotlari.<\/li><\/ul><p>Ma’lumotlarni Statistika agentligi umumlashtirib, rasmiy tashqi savdo statistikasi sifatida (oylik, choraklik, yillik) e’lon qiladi.<\/p>", "t": "tashqi", "id": "sv-176", "src": "savdo"}, {"n": 177, "q": "Tovarlar tashqi savdosini hisobga olish xususiyatlari, tashqi savdo operatsiyalarining turlari, tashqi savdoning tovar va geografik nomenklaturasi.", "k": "eksport, import, geografiya, nomenklatura.", "a": "<p>Tovarlar tashqi savdosini hisobga olish xususiyatlari:<\/p><ul><li>hisobga olish payti — tovar mamlakatning bojxona (statistik) chegarasini kesib o‘tganda; asosiy manba — bojxona deklaratsiyasi;<\/li><li>savdo tizimlari: umumiy (bojxona omborlari va erkin zonalar orqali o‘tgan barcha tovarlar) va maxsus (faqat ichki iste’mol uchun rasmiylashtirilgan tovarlar);<\/li><li>baholash: <b>eksport<\/b> — FOB, <b>import<\/b> — CIF narxlarida, AQSh dollarida;<\/li><li>hamkor mamlakat: importda — kelib chiqish mamlakati, eksportda — belgilangan mamlakat.<\/li><\/ul><p>Operatsiyalar turlari: oddiy eksport va import, reeksport va reimport, qayta ishlash uchun olib kirish va olib chiqish, barter, lizing, vaqtincha olib kirish; tranzit tashqi savdoga kiritilmaydi.<\/p><p>Tovar <b>nomenklatura<\/b>si — TIF TN (HS asosida) bo‘yicha guruhlash; iqtisodiy tasnif — SITC, BEC (iste’mol, oraliq, investitsiya tovarlari). <b>Geografiya<\/b> (geografik nomenklatura) — mamlakatlar va ularning guruhlari (MDH, Yevropa Ittifoqi, Osiyo va h.k.) bo‘yicha tarkib va hamkorlar ulushi.<\/p>", "t": "tashqi", "id": "sv-177", "src": "savdo"}, {"n": 178, "q": "Tashqi savdo oqimlari hajmi va muvozanatini statistik o‘rganish.", "k": "hajm, saldo, muvozanat, oqim.", "a": "<p>Tashqi savdo <b>oqim<\/b>lari — eksport va import <b>hajm<\/b>i, ularning nisbati va dinamikasi. Ko‘rsatkichlar:<\/p><ul><li>tashqi savdo aylanmasi = <b>E + I<\/b>; hajm qiymatda (AQSh dollarida) va natural birliklarda;<\/li><li><b>saldo<\/b> = <b>E − I<\/b>: musbat — aktiv, manfiy — passiv; <b>muvozanat<\/b> darajasi = (E − I) / (E + I) · 100%;<\/li><li>qoplash koeffitsienti = E / I · 100%;<\/li><li>dinamika: o‘sish sur’atlari, narx (Paashe) va fizik hajm (Laspeyres) indekslari — qiymat indeksi = narx indeksi × fizik hajm indeksi;<\/li><li>tarkib: tovar guruhlari va mamlakatlar bo‘yicha ulushlar, tarkibiy siljishlar;<\/li><li>tashqi savdo kvotasi = (E + I) / YaIM · 100%.<\/li><\/ul><p>Masalan, E = 33,8, I = 47,4 mlrd $: aylanma = 81,2 mlrd $; saldo = −13,6 mlrd $ (manfiy); qoplash koeffitsienti ≈ 71,3%.<\/p>", "t": "tashqi", "id": "sv-178", "src": "savdo"}, {"n": 179, "q": "Makro va mikro darajada tovarlar tashqi savdosi samaradorligini baholash.", "k": "makro, mikro, samaradorlik, tahlil.", "a": "<p>Tashqi savdo samaradorligi ikki darajada baholanadi.<\/p><p><b>Makro<\/b> darajada (mamlakat bo‘yicha):<\/p><ul><li>savdo shartlari indeksi = eksport narx indeksi / import narx indeksi · 100;<\/li><li>saldo, qoplash koeffitsienti, eksport va import kvotalari (ochiqlik);<\/li><li>eksport tarkibi — yuqori qo‘shilgan qiymatli tayyor mahsulotlar ulushi, diversifikatsiya;<\/li><li>tashqi savdoning YaIM o‘sishi, byudjet daromadi va valyuta tushumiga hissasi.<\/li><\/ul><p><b>Mikro<\/b> darajada (korxona bo‘yicha):<\/p><ul><li>eksport samaradorligi koeffitsienti = eksportdan valyuta tushumi (so‘mda) / eksport mahsulotining to‘liq tannarxi; 1 dan katta bo‘lsa, eksport foydali;<\/li><li>import samaradorligi = import tovarini ichki bozorda sotishdan tushum / import xarajatlari (CIF qiymati, boj, transport);<\/li><li>eksport rentabelligi = eksportdan foyda / xarajatlar · 100%.<\/li><\/ul><p><b>Samaradorlik<\/b> <b>tahlil<\/b>ida indeks usuli, dinamika qatorlari, guruhlash va taqqoslash qo‘llaniladi.<\/p>", "t": "tashqi", "id": "sv-179", "src": "savdo"}, {"n": 180, "q": "Xizmatlar tashqi savdosi statistikasi ko‘rsatkichlari tizimi.", "k": "xizmat eksporti, importi, hajm, tarkib.", "a": "<p>Xizmatlar tashqi savdosi — rezidentlar va norezidentlar o‘rtasida xizmatlar ko‘rsatish bo‘yicha operatsiyalar. Xizmatlar bojxona chegarasidan o‘tmagani uchun asosiy manbalar — korxonalar hisoboti, bank to‘lovlari, so‘rovlar; metodologiya — XVJ BPM6 va MSITS, tasnif — EBOPS.<\/p><p>Ko‘rsatkichlar tizimi:<\/p><ul><li><b>xizmat eksporti<\/b> va <b>importi<\/b> <b>hajm<\/b>i, xizmatlar savdosi aylanmasi, saldosi va qoplash koeffitsienti;<\/li><li><b>tarkib<\/b> — xizmat turlari bo‘yicha: transport, sayohat (turizm), telekommunikatsiya, kompyuter va axborot, qurilish, moliyaviy, sug‘urta, ishbilarmonlik xizmatlari; har birining ulushi;<\/li><li>geografik tarkib — hamkor mamlakatlar bo‘yicha;<\/li><li>dinamika — o‘sish sur’atlari, tarkibiy siljishlar;<\/li><li>xizmatlarning jami tashqi savdodagi ulushi va YaIMga nisbati.<\/li><\/ul><p>Xizmat yetkazib berish usullari (GATS): transchegaraviy yetkazish, chet elda iste’mol (turizm), tijorat mavjudligi, jismoniy shaxslar mavjudligi.<\/p>", "t": "tashqi", "id": "sv-180", "src": "savdo"}, {"n": 1, "q": "Statistika fanining predmetini va o‘ziga xos xususiyatlarini (ommaviylik, miqdor va sifat birligi, o‘zgaruvchanlik) tushuntiring. Nima uchun yakka hodisani o‘rganish statistikaning predmeti hisoblanmaydi?", "k": "", "a": "<p><b>Statistika<\/b> ommaviy ijtimoiy-iqtisodiy hodisalarning <b>miqdoriy tomonini<\/b> ularning sifat mazmuni, muayyan joy va vaqt sharoiti bilan uzviy bog‘liq holda o‘rganadi. <b>Ommaviylik<\/b> ko‘p birliklar bo‘yicha takrorlanadigan qonuniyatni ochadi; <b>miqdor va sifat birligi<\/b> sonning iqtisodiy mazmunini tushuntiradi (son faqat aniq sifat doirasida ma’noga ega); <b>o‘zgaruvchanlik (variatsiya)<\/b> esa birliklarning belgi bo‘yicha bir-biridan farq qilishidir. Yakka hodisaga tasodifiy omillar kuchli ta’sir qiladi, shuning uchun u umumiy qonuniyatni ko‘rsatmaydi. <b>Katta sonlar qonuni<\/b>ga ko‘ra ko‘p birliklar umumlashtirilganda tasodifiy chetlanishlar o‘zaro so‘nadi va barqaror qonuniyat namoyon bo‘ladi; shu sababli yakka hodisa statistikaning predmeti hisoblanmaydi.<\/p>", "t": "asos", "status": "fixed", "note": "Correct but incomplete: did not explain WHY single cases are excluded; added the law of large numbers.", "id": "st-1", "src": "stat"}, {"n": 2, "q": "Tavsifiy va xulosaviy statistikaning farqini misollar bilan izohlang. Ular bir-birini qanday to‘ldiradi?", "k": "", "a": "<p><b>Tavsifiy statistika<\/b> mavjud ma’lumotlarni yig‘adi, tartiblaydi va umumlashtiradi: jadval, diagramma, o‘rtacha, mediana va tarqoqlik ko‘rsatkichlari. <b>Xulosaviy statistika<\/b> tanlanma natijalaridan bosh to‘plam haqida ehtimoliy xulosa chiqaradi: <b>ishonch oralig‘i<\/b> va <b>gipoteza testi<\/b>. Masalan, 100 talabaning o‘rtacha bahosini topish tavsifiy, shu asosda universitet bo‘yicha o‘rtacha bahoni baholash xulosaviy statistikadir. Birinchisi ma’lumotni tasvirlaydi, ikkinchisi noaniqlikni hisobga olib umumlashtiradi.<\/p>", "t": "asos", "status": "ok", "note": "", "id": "st-2", "src": "stat"}, {"n": 3, "q": "Statistikada ma’lumot turlarini (kategorik va miqdoriy; diskret va uzluksiz) tasniflang. Nominal, tartib, interval va nisbiy o‘lchov shkalalarining farqini hamda ularda mumkin bo‘lgan statistik amallarni ko‘rsating.", "k": "", "a": "<p><b>Kategorik belgi<\/b> toifalarni bildiradi (hudud, ta’lim turi); <b>miqdoriy belgi<\/b> son bilan ifodalanadi. <b>Diskret belgi<\/b> sanaladigan (farzandlar soni), <b>uzluksiz<\/b> o‘lchanadigan (vazn, vaqt) qiymatdir. <b>Nominal shkala<\/b> — faqat toifalar, chastota va moda; <b>tartib shkalasi<\/b> — reyting, mediana va rang testlari; <b>interval shkalasi<\/b> — ayirmalar mazmunli, ammo mutlaq nol yo‘q (°C), o‘rtacha va dispersiya; <b>nisbat shkalasi<\/b> — mutlaq nol bor (daromad), nisbatlar ham ma’noli.<\/p>", "t": "asos", "status": "ok", "note": "Correct; only typo/wording fixes.", "id": "st-3", "src": "stat"}, {"n": 4, "q": "Bosh to‘plam, tanlanma, kuzatish birligi, parametr va statistika tushunchalarini ta’riflang.", "k": "", "a": "<p><b>Bosh to‘plam<\/b> — o‘rganilayotgan barcha birliklar; <b>tanlanma —<\/b> undan tanlab olingan qism. <b>Kuzatish birligi<\/b> — har bir alohida talaba, korxona yoki mahsulot. <b>Parametr<\/b> — bosh to‘plamning noma’lum yoki ma’lum ko‘rsatkichi (μ, σ, p); <b>statistika —<\/b> tanlanmadan hisoblangan ko‘rsatkich (x̄, s, p̂). Tanlanma statistikasi parametrni baholashga xizmat qiladi.<\/p>", "t": "asos", "status": "ok", "note": "", "id": "st-4", "src": "stat"}, {"n": 5, "q": "Statistik kuzatishning tashkiliy shakllari (hisobot, maxsus tekshirish, ro‘yxatga olish, registrlar) va ularning o‘ziga xosligini izohlang. Kuzatish dasturi qanday talablarga javob berishi kerak?", "k": "", "a": "<p><b>Hisobot<\/b> tashkilotlar tomonidan belgilangan davr va shaklda taqdim etiladi. <b>Maxsus tekshirish<\/b> muayyan masala uchun alohida tashkil etiladi; <b>ro‘yxatga olish<\/b> muayyan sanada birliklarni keng qamrab oladi; <b>registr<\/b> esa birliklar haqidagi muntazam yangilanib turuvchi ma’lumotlar tizimidir. <b>Kuzatish dasturi<\/b> maqsadga mos, aniq, izchil, xolis, tushunarli, solishtiriladigan va tekshiriladigan savollardan iborat bo‘lishi kerak.<\/p>", "t": "asos", "status": "ok", "note": "", "id": "st-5", "src": "stat"}, {"n": 6, "q": "Kuzatish xatolari turlari (qayd etish va reprezentativlik; tasodifiy va muntazam) hamda ularni aniqlash va bartaraf etish usullarini bayon qiling.", "k": "", "a": "<p><b>Qayd etish xatosi<\/b> ma’lumotni o‘lchash, yozish yoki kiritishda paydo bo‘ladi; <b>reprezentativlik xatosi<\/b> tanlanma bosh to‘plamni to‘liq aks ettirmasligidan keladi. <b>Tasodifiy xatolar<\/b> turli yo‘nalishda, <b>muntazam xatolar<\/b> bir tomonga og‘adi. <b>Mantiqiy va arifmetik nazorat<\/b>, qayta tekshirish, aniq yo‘riqnoma, xodimlarni o‘qitish, tasodifiy tanlash hamda tanlanma hajmini oshirish ularni kamaytiradi.<\/p>", "t": "asos", "status": "ok", "note": "", "id": "st-6", "src": "stat"}, {"n": 7, "q": "Statistik guruhlashning vazifalari va turlari (tipologik, tuzilmaviy, analitik). Miqdoriy belgi bo‘yicha guruhlashda guruhlar soni va interval uzunligi qanday aniqlanadi (Sterdjess formulasi)?", "k": "", "a": "<p><b>Tipologik guruhlash<\/b> sifat jihatdan farqli turlarni ajratadi; <b>tuzilmaviy guruhlash<\/b> tarkibni; <b>analitik guruhlash<\/b> omil va natija bog‘lanishini ko‘rsatadi. Sterdjess formulasi: <b>k ≈ 1 + 3,322·lg(n)<\/b>. Teng interval uzunligi: <b>h = (xmax − xmin)/k<\/b>. Guruh chegaralari takrorlanmasligi va barcha qiymatlarni qamrashi zarur.<\/p>", "t": "asos", "status": "ok", "note": "", "id": "st-7", "src": "stat"}, {"n": 8, "q": "Statistik jadvalning elementlari (ega, kesim, sarlovha) va jadval tuzish qoidalari. Oddiy, guruhli va kombinatsion jadvallarning farqi nimada?", "k": "", "a": "<p><b>Jadval egasi<\/b> — satrlarda tasvirlangan obyekt yoki guruhlar, <b>kesimi<\/b> — ustunlarda berilgan ko‘rsatkichlar. <b>Sarlavha<\/b> mazmun, hudud, vaqt va o‘lchov birligini aks ettiradi. <b>Oddiy jadval<\/b> egasida birliklar (hudud, davr) guruhlanmasdan sanab o‘tiladi; <b>guruhli jadval<\/b> bir belgi bo‘yicha; <b>kombinatsion jadval<\/b> ikki yoki undan ko‘p belgi kesimida ma’lumot beradi. Yig‘indilar to‘g‘ri, davrlar va birliklar bir xil bo‘lishi kerak.<\/p>", "t": "asos", "status": "ok", "note": "Correct; only typo/wording fixes.", "id": "st-8", "src": "stat"}, {"n": 9, "q": "Nisbiy miqdorlarning turlari (dinamika, tuzilma, koordinatsiya, intensivlik, taqqoslash, reja topshirig‘i va uning bajarilishi) va ularning o‘zaro bog‘liqligini formulalar bilan ko‘rsating.", "k": "", "a": "<p><b>Dinamika:<\/b> y1/y0·100%; <b>tuzilma:<\/b> qism/jami·100%; <b>koordinatsiya:<\/b> bir qism/ikkinchi qism; <b>intensivlik:<\/b> hodisa soni/muhit hajmi (masalan 1000 kishiga); <b>taqqoslash:<\/b> A hudud/B hudud. <b>Reja topshirig‘i:<\/b> reja/oldingi haqiqiy·100%; <b>reja bajarilishi:<\/b> haqiqiy/reja·100%. <b>Dinamika indeksi = reja topshirig‘i indeksi · reja bajarilishi indeksi<\/b> /100 (agar ikkalasi foizlarda berilgan bo‘lsa).<\/p>", "t": "ortacha", "status": "ok", "note": "", "id": "st-9", "src": "stat"}, {"n": 10, "q": "O‘rtacha miqdorlarning turlari (arifmetik, garmonik, geometrik, kvadratik, xronologik) qaysi hollarda qo‘llaniladi? Oddiy va tortilgan o‘rtachaning farqi nima? Nima uchun o‘rtacha faqat sifat jihatidan bir jinsli to‘plam uchun hisoblanishi kerak?", "k": "", "a": "<p><b>Arifmetik o‘rtacha<\/b> belgining umumiy hajmi qiymatlar yig‘indisidan iborat bo‘lganda: oddiy <b>x̄=Σx/n<\/b>, tortilgan <b>x̄=Σxf/Σf<\/b>. <b>Garmonik o‘rtacha<\/b> chastotalar (f) emas, balki belgining umumiy hajmi M=x·f ma’lum bo‘lganda (masalan, narx va savdo summasi, tezlik va masofa): <b>x̄=ΣM/Σ(M/x)<\/b>. <b>Geometrik o‘rtacha<\/b> o‘sish koeffitsientlari (ko‘paytma) uchun: x̄=ⁿ√(x₁·x₂·…·xn); <b>kvadratik o‘rtacha<\/b> kvadrat bilan ifodalangan belgilar va standart chetlanish uchun: x̄=√(Σx²/n); <b>xronologik o‘rtacha<\/b> teng oraliqli moment qatorida: ȳ=(y₁/2+y₂+…+yn/2)/(n−1). <b>Oddiy<\/b> o‘rtachada har bir qiymat bir martadan (vaznlar teng), <b>tortilgan<\/b> o‘rtachada chastota yoki vazn bilan hisobga olinadi. O‘rtacha faqat <b>sifat jihatidan bir jinsli<\/b> to‘plam uchun ma’noli: aks holda turli tipdagi birliklar aralashib, hech qaysi guruhga xos bo‘lmagan «soxta» o‘rtacha chiqadi.<\/p>", "t": "ortacha", "status": "fixed", "note": "Harmonic-mean condition was vague ('inverse weights'); stated the M = x·f rule and added a formula for every mean.", "id": "st-10", "src": "stat"}, {"n": 11, "q": "Variatsiya nima va uni o‘rganish nima uchun zarur? O‘rtacha miqdor va variatsiyaning o‘zaro bog‘liqligini tushuntiring.", "k": "", "a": "<p><b>Variatsiya<\/b> — belgining birliklar bo‘yicha o‘zgarib, turlicha qiymat qabul qilishi. U o‘rtacha qanchalik <b>tipikligini<\/b> va to‘plamning <b>bir jinsliligini<\/b> ko‘rsatadi. Bir xil o‘rtachaga ega ikki to‘plamning tarqoqligi keskin farq qilishi mumkin, shu bois o‘rtacha bilan birga <b>dispersiya va standart chetlanishni<\/b> baholash kerak.<\/p>", "t": "ortacha", "status": "ok", "note": "", "id": "st-11", "src": "stat"}, {"n": 12, "q": "Variatsiya ko‘rsatkichlari tizimini (variatsion kenglik, o‘rtacha chiziqli tafovut, dispersiya, standart chetlanish, variatsiya koeffitsienti) formulalari va iqtisodiy mazmuni bilan bayon qiling.", "k": "", "a": "<p><b>Variatsion kenglik R=xmax−xmin<\/b>; <b>o‘rtacha chiziqli tafovut d=Σ|xi−x̄|/n<\/b>; <b>bosh dispersiyasi σ²=Σ(xi−μ)²/N<\/b>; <b>tanlanma dispersiyasi s²=Σ(xi−x̄)²/(n−1)<\/b>; <b>standart chetlanish σ=√σ²<\/b>; <b>variatsiya koeffitsienti V=σ/x̄·100%<\/b> (x̄&gt;0). R umumiy chegarani, d o‘rtacha absolyut og‘ishni, dispersiya va σ tarqoqlikni, V esa nisbiy tarqoqlikni ko‘rsatadi.<\/p>", "t": "ortacha", "status": "ok", "note": "", "id": "st-12", "src": "stat"}, {"n": 13, "q": "Bosh to‘plam va tanlanma dispersiyasi formulalarida nima uchun mos ravishda n va n−1 ga bo‘linadi? Erkinlik darajasi tushunchasini izohlang.", "k": "", "a": "<p><b>Bosh to‘plam dispersiyasi<\/b> barcha N birlik va haqiqiy μ bo‘yicha hisoblanadi, shuning uchun <b>σ²=Σ(x−μ)²/N<\/b>. Tanlanmada μ noma’lum, o‘rniga shu ma’lumotdan topilgan x̄ ishlatiladi; x̄ ga nisbatan kvadrat og‘ishlar yig‘indisi μ ga nisbatan olinganidan doim kichik yoki teng, shuning uchun n ga bo‘lish dispersiyani kamaytirib baholaydi. <b>n−1 ga bo‘lish (Bessel tuzatmasi)<\/b> <b>s²=Σ(x−x̄)²/(n−1)<\/b> ni <b>siljimagan baho<\/b> qiladi: E(s²)=σ². <b>Erkinlik darajasi<\/b> — erkin o‘zgara oladigan mustaqil qiymatlar soni: df = kuzatuvlar soni − ma’lumotdan baholangan parametrlar soni. Σ(x−x̄)=0 sharti tufayli n ta og‘ishdan faqat n−1 tasi erkin, oxirgisi qolganlaridan aniqlanadi, shuning uchun df=n−1.<\/p>", "t": "ortacha", "status": "fixed", "note": "Imprecise: n−1 makes s² an UNBIASED estimator (not merely 'reduces bias'); added the general definition of degrees of freedom.", "id": "st-13", "src": "stat"}, {"n": 14, "q": "Variatsiya koeffitsienti qaysi hollarda standart chetlanishdan afzal? Uning qiymatlari bo‘yicha to‘plamning bir jinsliligi qanday baholanadi (33% mezoni)?", "k": "", "a": "<p><b>V=σ/x̄·100%<\/b> o‘lchov birliklari va o‘rtacha darajasi turlicha to‘plamlarni qiyoslashda foydali. Amaliy o‘quv mezoni bo‘yicha <b>V≤33%<\/b> bo‘lsa nisbatan bir jinsli, <b>V&gt;33%<\/b> bo‘lsa bir jinslilik pastroq deyiladi. Bu qat’iy universal qonun emas; x̄ nolga yaqin yoki manfiy bo‘lsa V noto‘g‘ri talqin qilinishi mumkin.<\/p>", "t": "ortacha", "status": "ok", "note": "", "id": "st-14", "src": "stat"}, {"n": 15, "q": "Chebishev tengsizligi va empirik qoida (68–95–99,7) nimani bildiradi? Ular o‘rtasidagi farq nima va qaysi holatda qo‘llaniladi?", "k": "", "a": "<p><b>Chebishev tengsizligi<\/b> har qanday chekli dispersiyali taqsimot uchun <b>P(|X−μ|&lt;kσ)≥1−1/k²<\/b> (k&gt;1) ekanini kafolatlaydi. Masalan, ±2σ ichida kamida 75%, ±3σ ichida kamida 88,9% qiymat bo‘ladi. <b>Empirik qoida<\/b> taxminan normal taqsimot uchun ±1σ da 68%, ±2σ da 95%, ±3σ da 99,7%. Chebishev umumiyroq, ammo bahosi qo‘polroq; empirik qoida normal shaklga tayanadi.<\/p>", "t": "taqsimot", "status": "ok", "note": "Correct; only typo/wording fixes.", "id": "st-15", "src": "stat"}, {"n": 16, "q": "Normal taqsimotning xossalari (simmetriklik, μ va σ parametrlari, egri chiziq ostidagi yuza) va uning statistikada markaziy o‘rin tutishining sabablarini tushuntiring.", "k": "", "a": "<p>Normal taqsimot <b>qo‘ng‘iroqsimon<\/b>, μ atrofida simmetrik; <b>o‘rtacha=mediana=moda<\/b>. <b>μ markazni<\/b>, <b>σ tarqoqlikni<\/b> belgilaydi; egri ostidagi <b>umumiy yuza 1<\/b>. Ko‘p o‘lchov xatolari va yig‘indi ko‘rsatkichlar normalga yaqinlashadi; <b>markaziy limit teoremasi<\/b> ko‘plab statistik baholashlarning asosidir.<\/p>", "t": "taqsimot", "status": "ok", "note": "", "id": "st-16", "src": "stat"}, {"n": 17, "q": "Standart normal taqsimot va z-ko‘rsatkich nima? Standartlash turli o‘lchov birliklaridagi ko‘rsatkichlarni solishtirishga qanday imkon beradi?", "k": "", "a": "<p>Standart normal taqsimot <b>Z~N(0,1)<\/b>, ya’ni μ=0 va σ=1. Standartlash: <b>z=(x−μ)/σ<\/b>; z qiymat kuzatuvning o‘rtachadan necha standart chetlanishga uzoqligini ko‘rsatadi. Masalan, ikki turli testda z=1,5 ball qiymatning o‘z sinovida o‘rtachadan 1,5σ yuqori ekanini bildiradi.<\/p>", "t": "taqsimot", "status": "ok", "note": "", "id": "st-17", "src": "stat"}, {"n": 18, "q": "Empirik qoida (68–95–99,7) va uning amaliy qo‘llanilishi. Normal taqsimotda 1, 2 va 3 sigma oralig‘ida qiymatlarning qancha ulushi joylashadi?", "k": "", "a": "<p>Normal taqsimotda qiymatlarning taxminan <b>68,27%<\/b> i μ±1σ; <b>95,45%<\/b> i μ±2σ; <b>99,73%<\/b> i μ±3σ oralig‘idadir. Masalan, μ=70, σ=10 bo‘lsa ballarning qariyb 95% i 50 va 90 orasida. Qoida normalga yaqin taqsimotda tez baholash va chet qiymatni ko‘rish uchun ishlatiladi.<\/p>", "t": "taqsimot", "status": "ok", "note": "", "id": "st-18", "src": "stat"}, {"n": 19, "q": "Taqsimotning normalligini baholash metodlari: simmetrik holat, chap va o’ng og’ish, assimmetriya va ekssess koeffitsientlari, har birining afzallik va kamchiliklari.", "k": "", "a": "<p><b>Simmetrik<\/b> taqsimotda o‘rtacha=mediana=moda va dumlar teng. <b>O‘ngga (musbat) og‘ish<\/b>da uzun dum katta qiymatlar tomonida va x̄&gt;Me&gt;Mo; <b>chapga (manfiy) og‘ish<\/b>da aksincha, x̄&lt;Me&lt;Mo. <b>Assimmetriya koeffitsienti<\/b>: Pirson bo‘yicha <b>As=(x̄−Mo)/σ<\/b> yoki moment bo‘yicha <b>As=μ₃/σ³<\/b>; As&gt;0 — o‘ng, As&lt;0 — chap og‘ish, |As|&gt;0,5 bo‘lsa og‘ish sezilarli. <b>Ekssess Ex=μ₄/σ⁴−3<\/b>: normal taqsimotda 0, Ex&gt;0 — o‘tkir cho‘qqili, Ex&lt;0 — yassi cho‘qqili taqsimot. Koeffitsientlar sodda va bitta son bilan ifodalanadi, ammo chet qiymatlarga sezgir va kichik n da beqaror, ahamiyatini standart xato orqali tekshirish kerak. Grafik usullar (gistogramma, Q–Q plot) ko‘rgazmali, lekin subyektiv; Shapiro–Wilk kabi rasmiy testlar aniq qaror beradi, ammo n juda katta bo‘lsa kichik farqni ham rad etadi.<\/p>", "t": "taqsimot", "status": "fixed", "note": "Incomplete: pros/cons of the skewness/kurtosis coefficients were missing; added Pearson As=(x̄−Mo)/σ and interpretation of signs.", "id": "st-19", "src": "stat"}, {"n": 20, "q": "Tanlab kuzatishning mohiyati, qo‘llash sabablari, afzalliklari va kamchiliklarini (yoppasiga kuzatish bilan taqqoslab) bayon qiling.", "k": "", "a": "<p><b>Tanlab kuzatish<\/b> bosh to‘plamning bir qismini o‘rganib, umumiy parametrlarni baholashdir. Yoppasiga kuzatishdan <b>arzon, tez<\/b> va ba’zan chuqurroq; mahsulotni buzadigan sinovlarda zarur. Kamchiligi — <b>tanlanma xatosi<\/b> va noto‘g‘ri tanlash xavfi. <b>Ehtimolli tanlash<\/b> va xato chegarasini hisoblash natijaning ishonchliligini oshiradi.<\/p>", "t": "tanlanma", "status": "ok", "note": "", "id": "st-20", "src": "stat"}, {"n": 21, "q": "Tasodifiy, mexanik, seriyali tanlash usullarini taqqoslang. Qaysi biri natijalarni bosh to‘plamga tarqatishga imkon beradi va nima uchun?", "k": "", "a": "<p><b>Oddiy tasodifiy tanlash<\/b>da har bir birlik tanlanmaga <b>teng ehtimol<\/b> bilan tushadi (qur’a, tasodifiy sonlar jadvali). <b>Mexanik (sistematik) tanlash<\/b>da tartiblangan ro‘yxatdan tasodifiy boshlang‘ich nuqtadan so‘ng har k-birlik olinadi (k=N/n); ro‘yxatda davriylik bo‘lmasa natija tasodifiy tanlashga yaqin. <b>Seriyali (uyali) tanlash<\/b>da alohida birliklar emas, guruhlar (seriyalar) tasodifiy tanlanadi va tanlangan seriya ichida yoppasiga kuzatiladi; bu arzon, lekin seriyalar orasidagi farq katta bo‘lsa xato kattaroq. Natijani bosh to‘plamga tarqatish uchun tanlash <b>ehtimolli (tasodifiy)<\/b> bo‘lishi shart: shundagina tanlanma xatosini hisoblab, ishonch chegarasini aniqlash mumkin. Uchala usul ham tasodiflik saqlansa bunga imkon beradi; nazariy asosi eng sodda va ishonchli bo‘lgani — oddiy tasodifiy tanlash.<\/p>", "t": "tanlanma", "status": "fixed", "note": "Error: simple random sampling means EQUAL (not just 'known') selection probability; also added how series sampling works and its larger error.", "id": "st-21", "src": "stat"}, {"n": 22, "q": "Tanlanmaning reprezentativligi nima va uni ta’minlash shartlari qanday?", "k": "", "a": "<p><b>Reprezentativlik<\/b> tanlanmaning bosh to‘plam muhim xususiyatlari va tarkibini yetarli aks ettirishidir. Aniq bosh to‘plam ro‘yxati, <b>tasodifiy tanlash<\/b>, <b>mos hajm<\/b>, guruhlarni qamrash, javob bermaslikni nazorat qilish va zarur bo‘lsa vaznlash talab etiladi. Katta hajmning o‘zi tizimli tanlash xatosini bartaraf qilmaydi.<\/p>", "t": "tanlanma", "status": "ok", "note": "", "id": "st-22", "src": "stat"}, {"n": 23, "q": "Ishonch oralig‘ining ma’nosi: 95% ishonch darajasi aynan nimani bildiradi?", "k": "", "a": "<p><b>95% ishonch oralig‘i<\/b> shunday usul bilan qayta-qayta tuzilgan intervallarning taxminan 95% i haqiqiy o‘zgarmas parametrni qamrashini anglatadi. Aniq bir hisoblangan interval uchun klassik yondashuvda “parametr 95% ehtimol bilan shu yerda” deyish to‘g‘ri emas. Formula: <b>x̄±kritik qiymat·standart xato<\/b>.<\/p>", "t": "tanlanma", "status": "ok", "note": "", "id": "st-23", "src": "stat"}, {"n": 24, "q": "Styudent t-taqsimoti: standart normal taqsimotdan farqi, erkinlik darajasi tushunchasi, n ortganda t → z. Qaysi hollarda z, qaysi hollarda t qo‘llaniladi?", "k": "", "a": "<p><b>Styudent t-taqsimoti<\/b> simmetrik, normalga nisbatan <b>dumlari qalin<\/b>; erkinlik darajasi <b>df=n−1<\/b>. n katta bo‘lganda t normalga yaqinlashadi. <b>σ ma’lum bo‘lsa<\/b> normal sharoitda z, <b>σ noma’lum<\/b> va s bilan baholanganda (ayniqsa kichik n da) t ishlatiladi. Kichik tanlanma uchun taxminiy normallik muhim.<\/p>", "t": "tanlanma", "status": "ok", "note": "", "id": "st-24", "src": "stat"}, {"n": 25, "q": "Ishonch oralig‘i kengligi va tanlanma hajmi o‘rtasidagi bog‘liqlik. Berilgan aniqlik uchun zarur n ni qanday topish mumkin?", "k": "", "a": "<p>O‘rtacha uchun interval yarim kengligi <b>E≈z·σ/√n<\/b>; n to‘rt baravar oshsa xato taxminan ikki baravar kamayadi. Rejalashtirish: <b>n≥(zσ/E)²<\/b> (yuqoriga yaxlitlanadi). Ulush uchun <b>n≥z²p(1−p)/E²<\/b>; p noma’lum bo‘lsa <b>p=0,5<\/b> eng ehtiyotkor tanlovdir. Chekli bosh to‘plamda tuzatish kiritilishi mumkin.<\/p>", "t": "tanlanma", "status": "ok", "note": "", "id": "st-25", "src": "stat"}, {"n": 26, "q": "Statistik gipoteza nima? Noll (H₀) va muqobil (H₁) gipotezalar qanday shakllantiriladi? Bir tomonlama va ikki tomonlama muqobillarning farqi nimada?", "k": "", "a": "<p><b>Statistik gipoteza<\/b> bosh to‘plam parametri yoki taqsimoti haqidagi tekshiriladigan taxmin. <b>H₀ odatda<\/b> tenglik yoki ta’sir yo‘qligini (μ=μ₀), <b>H₁ esa<\/b> muqobilni (μ≠μ₀, μ&gt;μ₀ yoki μ&lt;μ₀) bildiradi. <b>Ikki tomonlama test<\/b> har ikki yo‘nalishni, <b>bir tomonlama test<\/b> faqat oldindan belgilangan yo‘nalishni tekshiradi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-26", "src": "stat"}, {"n": 27, "q": "I tur (α) va II tur (β) xatolar nimani anglatadi? Ularning o‘zaro bog‘liqligi va tanlanma hajmiga ta’sirini tushuntiring.", "k": "", "a": "<p><b>I tur xato<\/b> — to‘g‘ri H₀ ni rad etish, uning maksimal ehtimoli α. <b>II tur xato<\/b> — noto‘g‘ri H₀ ni rad etmaslik, ehtimoli β; <b>test quvvati 1−β<\/b>. Boshqa shartlar bir xil bo‘lsa α ni kamaytirish β ni oshirishi mumkin. n ni ko‘paytirish ikkala xatoni nazorat qilish va quvvatni oshirishga yordam beradi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-27", "src": "stat"}, {"n": 28, "q": "Gipotezani tekshirish bosqichlarini sanab o‘ting. Bitta bosh to‘plam o‘rtachasi (z va t) hamda ulushi uchun testlar qanday qo‘llaniladi? Ishonch oralig‘i va gipoteza testi o‘rtasida qanday bog‘liqlik bor?", "k": "", "a": "<p><b>Ketma-ketlik:<\/b> H₀/H₁ ni belgilash → α tanlash → mos test va farazlarni tekshirish → statistika/p-qiymat → qaror → iqtisodiy xulosa. O‘rtacha uchun <b>z=(x̄−μ₀)/(σ/√n)<\/b> yoki <b>t=(x̄−μ₀)/(s/√n)<\/b>; ulush uchun <b>z=(p̂−p₀)/√[p₀(1−p₀)/n]<\/b>. Ikki tomonlama α testi H₀ qiymati mos 1−α ishonch oralig‘idan tashqarida bo‘lsa rad etiladi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-28", "src": "stat"}, {"n": 29, "q": "Ikki mustaqil tanlanma o‘rtachalarini taqqoslashni tushuntiring.", "k": "", "a": "<p>Ikki mustaqil tanlanma o‘rtachalarini taqqoslashda <b>H₀: μ₁=μ₂<\/b> (μ₁−μ₂=0), H₁: μ₁≠μ₂ (yoki bir tomonlama). σ₁, σ₂ ma’lum yoki tanlanmalar katta bo‘lsa <b>z=(x̄₁−x̄₂)/√(σ₁²/n₁+σ₂²/n₂)<\/b>. Dispersiyalar teng deb faraz qilinsa <b>birlashtirilgan (pooled) t-test<\/b>: s_p²=[(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2), t=(x̄₁−x̄₂)/(s_p·√(1/n₁+1/n₂)), <b>df=n₁+n₂−2<\/b>. Dispersiyalar teng bo‘lmasa <b>Welch testi<\/b>: t=(x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂), df Welch–Satterthwaite formulasi bilan topiladi. |t| kritik qiymatdan katta (yoki p&lt;α) bo‘lsa H₀ rad etiladi. Shartlar: tanlanmalar mustaqil, taqsimot taxminan normal (yoki n katta).<\/p>", "t": "gipoteza", "status": "fixed", "note": "Correct but incomplete: added hypotheses, the z-test case and the pooled-variance t-test with df = n1+n2−2.", "id": "st-29", "src": "stat"}, {"n": 30, "q": "Bog‘liq (juft) va mustaqil tanlanmalar farqi nimada? Juft t-testning afzalligi nimada va u qanday tuziladi?", "k": "", "a": "<p><b>Mustaqil tanlanmalarda<\/b> kuzatuvlar bir-biriga bog‘lanmagan; <b>juft tanlanmada<\/b> bir shaxsning oldin-keyin natijasi yoki mos juftlik mavjud. dᵢ=xᵢ,keyin−xᵢ,oldin olinadi va <b>t=d̄/(s_d/√n), df=n−1<\/b> hisoblanadi. Juft t-test shaxslararo doimiy farqlarni ayirib, natijaning aniqligini ko‘pincha oshiradi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-30", "src": "stat"}, {"n": 31, "q": "Ikki o‘rtacha ayirmasi uchun ishonch oralig‘i va uning gipoteza testi bilan bog‘liqligi ifodalang.", "k": "", "a": "<p>Ikki mustaqil o‘rtacha ayirmasining ishonch oralig‘i: <b>(x̄₁−x̄₂) ± t*√(s₁²/n₁+s₂²/n₂)<\/b> (Welch varianti). <b>Interval 0 ni qamramasa<\/b> H₀:μ₁=μ₂ ikki tomonlama testda mos α darajada rad etiladi. Aks holda statistik jihatdan farq isbotlanmagan bo‘ladi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-31", "src": "stat"}, {"n": 32, "q": "Ikki bosh to‘plam dispersiyalarini solishtirish: F-test ni tushuntiring.", "k": "", "a": "<p><b>F-test<\/b> ikki normal bosh to‘plam dispersiyalarini taqqoslaydi: <b>H₀: σ₁²=σ₂²<\/b>, <b>F=s₁²/s₂²<\/b>, df₁=n₁−1, df₂=n₂−1. Odatda <b>kattaroq dispersiya suratga<\/b> qo‘yiladi (F≥1) va F kritik qiymat (yoki p-qiymat) bilan solishtiriladi: F&gt;F_kr bo‘lsa H₀ rad etiladi, ya’ni dispersiyalar farqi ahamiyatli. Test normal taqsimotdan chetlanishga sezgir, shuning uchun amaliyotda Levene yoki Brown–Forsythe testlari ham qo‘llanadi. F-test natijasi ikki tanlanmali t-testda pooled yoki Welch variantini tanlashda ham ishlatiladi.<\/p>", "t": "gipoteza", "status": "fixed", "note": "Correct but incomplete: added the larger-variance-in-numerator convention and the decision rule.", "id": "st-32", "src": "stat"}, {"n": 33, "q": "Dispersion tahlilning mohiyati va vazifasi.", "k": "", "a": "<p><b>Dispersion tahlil (ANOVA)<\/b> ikki va undan ortiq (amalda odatda uch va undan ko‘p) guruh o‘rtachalari orasida statistik ahamiyatli farq bor-yo‘qligini tekshiradi. Uning mohiyati — natijaviy belgining <b>umumiy variatsiyasini<\/b> omil ta’siridagi <b>guruhlararo<\/b> va qolgan tasodifiy omillar ta’siridagi <b>guruh ichidagi<\/b> (qoldiq) qismlarga ajratish. Vazifasi — omilning natijaga ta’siri ahamiyatli ekanini <b>F=MSB/MSW<\/b> orqali baholash va ta’sir ulushini η² bilan o‘lchash. Ahamiyatli F kamida bitta guruh o‘rtachasi farqlanishini bildiradi; qaysi guruhlar farq qilishi <b>post-hoc<\/b> testlar (Tukey, Bonferroni) bilan aniqlanadi.<\/p>", "t": "gipoteza", "status": "fixed", "note": "Minor: ANOVA works for two or more groups (not only three+); added its task of measuring the factor's influence (F, η²).", "id": "st-33", "src": "stat"}, {"n": 34, "q": "Umumiy, guruhlararo va guruhlar ichidagi dispersiya; dispersiyalarni qo‘shish qoidasi.", "k": "", "a": "<p><b>Umumiy dispersiya<\/b> σ²=Σ(x−x̄)²f/Σf — barcha omillar ta’sirida yuzaga kelgan variatsiya. <b>Guruhlararo dispersiya<\/b> δ²=Σ(x̄ᵢ−x̄)²nᵢ/Σnᵢ — guruhlash belgisi (omil) ta’siridagi variatsiya. <b>Guruh ichidagi dispersiya<\/b> σᵢ²=Σ(x−x̄ᵢ)²f/Σf — har bir guruh ichida hisobga olinmagan boshqa omillar ta’siri; ularning o‘rtachasi σ̄ᵢ²=Σσᵢ²nᵢ/Σnᵢ. <b>Dispersiyalarni qo‘shish qoidasi: σ² = δ² + σ̄ᵢ²<\/b> (kvadratlar yig‘indisi shaklida SST=SSB+SSW). Bu qoida omilning natijaga ta’sir ulushini <b>η²=δ²/σ²<\/b> orqali baholash imkonini beradi.<\/p>", "t": "gipoteza", "status": "fixed", "note": "Correct but incomplete: gave only sums of squares; added the variance-form formulas (δ², σᵢ², mean within-group variance) and η².", "id": "st-34", "src": "stat"}, {"n": 35, "q": "Bir omilli ANOVA gipotezalari, F-statistika, erkinlik darajalari va ANOVA jadvali tuzilishini bayon qiling.", "k": "", "a": "<p>Bir omilli ANOVA: <b>H₀:μ₁=…=μk<\/b>; H₁: kamida bittasi farqli. <b>F=MSB/MSW<\/b>, <b>MSB=SSB/(k−1)<\/b>, <b>MSW=SSW/(N−k)<\/b>. Jadval satrlari: guruhlararo (SSB, k−1, MSB, F), guruh ichida (SSW, N−k, MSW), jami (SST, N−1). Mustaqillik, taxminiy normallik va dispersiyalar tengligi tekshiriladi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-35", "src": "stat"}, {"n": 36, "q": "Determinatsiya koeffitsienti (η²) va empirik korrelyatsion nisbat: mazmuni, qiymatlar oralig‘i va talqini.", "k": "", "a": "<p><b>η²=SSB/SST<\/b> omil tushuntirgan umumiy kvadrat og‘ishlar ulushi bo‘lib 0 dan 1 gacha. Empirik korrelyatsion nisbat <b>η=√η²<\/b> ham 0…1 oralig‘ida, bog‘lanish zichligini ifodalaydi. Masalan, η²=0,40 bo‘lsa umumiy dispersiyaning 40% i guruhlararo tafovut bilan bog‘liq; bu o‘zi sababiylikni isbotlamaydi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-36", "src": "stat"}, {"n": 37, "q": "Kategorik (sifat) ma’lumotlar va ularni jadvallashtirish: chastota, nisbiy chastota, kontingensiya (kesishgan) jadvallari. Misollar keltiring.", "k": "", "a": "<p>Sifat ma’lumotlari toifalar bo‘yicha <b>chastota<\/b> (son) va <b>nisbiy chastota<\/b> (son/jami) bilan ifodalanadi. Masalan, 100 mijozdan 60 tasi karta, 40 tasi naqd to‘lagan bo‘lsa ulushlar 60% va 40%. <b>Kontingensiya jadvali<\/b> ikki sifat belgisini kesishadi (jins × to‘lov usuli); satr/ustun foizlari guruhlarni solishtirish uchun qulay.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-37", "src": "stat"}, {"n": 38, "q": "Xi-kvadrat (χ²) taqsimoti va uning xossalari; erkinlik darajasi qanday topiladi?", "k": "", "a": "<p>Xi-kvadrat χ² taqsimoti faqat <b>nomanfiy, o‘ngga qiyshiq<\/b>, df oshgan sari simmetriklashadi. U mustaqil standart normal qiymatlar kvadratlari yig‘indisidan hosil bo‘ladi. Moslik testida <b>df=k−1−m<\/b> (m — ma’lumotdan baholangan parametrlar soni), r×c mustaqillik testida <b>df=(r−1)(c−1)<\/b>.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-38", "src": "stat"}, {"n": 39, "q": "Moslik testi : gipotezalar, kutilayotgan chastotalar va test statistikasi. Qachon qo‘llaniladi?", "k": "", "a": "<p><b>Moslik testi<\/b> kuzatilgan Oi chastotalar nazariy Ei chastotalarga mos kelishini tekshiradi: H₀ — ko‘rsatilgan taqsimot to‘g‘ri; H₁ — kamida bir toifada farq bor. <b>χ²=Σ(Oi−Ei)²/Ei<\/b>. <b>Ei=n·pi<\/b>; kutilgan chastotalar yetarlicha katta bo‘lishi kerak (odatda <b>≥5<\/b> tavsiya etiladi). Test taqsimot yoki bozor ulushlarini solishtiradi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-39", "src": "stat"}, {"n": 40, "q": "Funksional va korrelyatsion bog‘lanishning farqi nimada? Bog‘lanishni o‘rganish usullarini (guruhlash, parallel qatorlarni taqqoslash, grafik, dispersion va korrelyatsion regression usullar) sanab o‘ting.", "k": "", "a": "<p><b>Funksional bog‘lanishda<\/b> x ning aniq qiymatiga y ning yagona aniq qiymati mos keladi (y=2x); <b>korrelyatsion bog‘lanishda<\/b> x ma’lum bo‘lsa ham y tasodifiy tarqaladi. <b>O‘rganish usullari:<\/b> analitik guruhlash, parallel qatorlarni solishtirish, nuqtali grafik, ANOVA, korrelyatsiya va regressiya. Bog‘lanish sababiylikni avtomatik isbotlamaydi.<\/p>", "t": "boglanish", "status": "ok", "note": "", "id": "st-40", "src": "stat"}, {"n": 41, "q": "Fexner va Spirman koeffitsientlari: formulalari, qo‘llash shartlari va afzalliklari. Ular qaysi hollarda Pirson koeffitsientidan ustun?", "k": "", "a": "<p>Fexner ishoralar koeffitsienti <b>K=(C−H)/(C+H)<\/b>, bunda C — x va y o‘rtachadan og‘ish ishoralari mos, H — mos bo‘lmagan juftliklar. Spirman <b>ρ=1−6Σd²/[n(n²−1)]<\/b> (teng ranglar bo‘lmaganda). Fexner sodda va chet qiymatlarga chidamli; Spirman monoton bog‘lanish va tartib ma’lumotida foydali. Pirson chiziqli miqdoriy bog‘lanish uchun samaraliroq.<\/p>", "t": "boglanish", "status": "ok", "note": "Correct; only typo/wording fixes.", "id": "st-41", "src": "stat"}, {"n": 42, "q": "Pirson chiziqli korrelyatsiya koeffitsienti: xossalari, qiymatlar oralig‘i va ahamiyatliligini tekshirish.", "k": "", "a": "<p>Pirson <b>r=Σ(x−x̄)(y−ȳ)/√[Σ(x−x̄)²·Σ(y−ȳ)²]<\/b>, <b>−1≤r≤1<\/b>. Musbat/manfiy ishora yo‘nalishni, |r| qiymati chiziqli zichlikni ko‘rsatadi; r=0 chiziqli bog‘lanish yo‘qligini anglatadi. Test: <b>t=r√[(n−2)/(1−r²)], df=n−2<\/b>. Kuchli r ham sababiylikni isbotlamaydi.<\/p>", "t": "boglanish", "status": "ok", "note": "", "id": "st-42", "src": "stat"}, {"n": 43, "q": "Juft chiziqli regressiya tenglamasi va uning parametrlarini eng kichik kvadratlar usulida baholash; a va b koeffitsientlarining iqtisodiy ma’nosi.", "k": "", "a": "<p>Juft chiziqli regressiya <b>ŷ=a+bx<\/b>; EKK qoldiq kvadratlari yig‘indisi Σ(yi−a−bxi)² ni minimallashtiradi. <b>b=Σ(x−x̄)(y−ȳ)/Σ(x−x̄)²<\/b>; <b>a=ȳ−bx̄<\/b>. b — x bir birlikka oshganda y ning kutilgan o‘rtacha o‘zgarishi, a — x=0 dagi prognoz (faqat iqtisodiy mazmunli bo‘lsa).<\/p>", "t": "boglanish", "status": "ok", "note": "", "id": "st-43", "src": "stat"}, {"n": 44, "q": "Determinatsiya koeffitsienti R², regressiyaning standart xatosi, regressiya koeffitsientining ahamiyatliligi izohlang.", "k": "", "a": "<p><b>R²=1−SSE/SST<\/b> — kuzatilgan y ning umumiy kvadrat tarqoqligidan model tushuntirgan ulush (interseptli EKKda 0…1). Regressiya standart xatosi <b>s_e=√[SSE/(n−k−1)]<\/b> model qoldig‘ining odatiy o‘lchamidir. Koeffitsient uchun <b>t=b̂/SE(b̂)<\/b>, p-qiymat yoki ishonch oralig‘i bilan H₀:β=0 tekshiriladi.<\/p>", "t": "boglanish", "status": "ok", "note": "", "id": "st-44", "src": "stat"}, {"n": 45, "q": "Ko‘p omilli regressiya modeli, uning juft regressiyadan farqi.", "k": "", "a": "<p>Ko‘p omilli model <b>y=β₀+β₁x₁+…+βkxk+ε<\/b> bo‘lib natijaga bir nechta omil ta’sirini birgalikda baholaydi. βj <b>boshqa omillar doimiy qolganida<\/b> xj ning bir birlik o‘zgarishiga mos y farqini bildiradi. Juft regressiyadan farqli ravishda nazorat omillari, multikollinearlik, moslashtirilgan R² va model diagnostikasi muhim.<\/p>", "t": "boglanish", "status": "ok", "note": "", "id": "st-45", "src": "stat"}, {"n": 46, "q": "Multikollinearlik: oqibatlari, aniqlash usullari va bartaraf etish yo‘llari.", "k": "", "a": "<p><b>Multikollinearlik<\/b> — mustaqil o‘zgaruvchilarning kuchli chiziqli bog‘lanishi. Natija: standart xatolar kattalashadi, baholar beqarorlashadi, alohida koeffitsientning t testi zaiflashadi. Aniqlash: korrelyatsiya matritsasi, <b>VIF=1/(1−Rj²)<\/b>, condition number. Yechim: takroriy omilni chiqarish/birlashtirish, ko‘proq ma’lumot, nazariy asoslangan o‘zgaruvchi tanlash, ridge usuli.<\/p>", "t": "boglanish", "status": "ok", "note": "", "id": "st-46", "src": "stat"}, {"n": 47, "q": "Vaqt qatori tushunchasi, turlari (moment va interval; mutlaq, nisbiy, o‘rtacha miqdorlar qatori) va tuzish qoidalari (taqqoslanuvchanlik).", "k": "", "a": "<p><b>Vaqt qatori<\/b> — ko‘rsatkichning vaqt bo‘yicha ketma-ket qiymatlari. <b>Moment qatori<\/b> muayyan sanadagi zaxirani (aholi soni), <b>interval qatori<\/b> davrdagi oqimni (oylik savdo) bildiradi. Mutlaq, nisbiy va o‘rtacha qiymatlar qatori mavjud. Solishtirishda hudud, baho, uslub, birlik, davr uzunligi bir xil bo‘lishi kerak.<\/p>", "t": "dinamika", "status": "ok", "note": "", "id": "st-47", "src": "stat"}, {"n": 48, "q": "Vaqt qatorining analitik ko‘rsatkichlari: mutlaq o‘sish, o‘sish sur’ati, qo‘shimcha o‘sish sur’ati, 1% o‘sishning mutlaq qiymati; zanjirsimon va bazisli usullar.", "k": "", "a": "<p>Bazisli mutlaq o‘sish <b>Δb=yt−y0<\/b>, zanjirsimon <b>Δz=yt−yt−1<\/b>; o‘sish sur’ati <b>Tb=yt/y0·100%<\/b>, <b>Tz=yt/yt−1·100%<\/b>. Qo‘shimcha o‘sish sur’ati <b>T−100%<\/b>. Bir foiz o‘sishning mutlaq qiymati (zanjirsimon) <b>yt−1/100<\/b>. Bazisli usul boshlang‘ich davr bilan, zanjirsimon ketma-ket davrlar bilan solishtiradi.<\/p>", "t": "dinamika", "status": "ok", "note": "", "id": "st-48", "src": "stat"}, {"n": 49, "q": "O‘rtacha daraja (arifmetik, xronologik) va o‘rtacha o‘sish sur’ati (geometrik o‘rtacha) hisoblash tartibi. Xronologik o‘rtacha qachon qo‘llaniladi?", "k": "", "a": "<p>Teng davrli <b>interval qatori<\/b>da o‘rtacha daraja oddiy arifmetik o‘rtacha: <b>ȳ=Σy/n<\/b>. <b>Xronologik o‘rtacha<\/b> <b>moment qatori<\/b>da qo‘llaniladi, chunki moment darajalarini qo‘shish mazmunsiz: teng oraliqli momentlar uchun <b>ȳ=(y₁/2+y₂+…+yn−1+yn/2)/(n−1)<\/b>; oraliqlar teng bo‘lmasa tortilgan xronologik o‘rtacha ȳ=Σ[(yᵢ+yᵢ₊₁)/2·tᵢ]/Σtᵢ (tᵢ — oraliq uzunligi). <b>O‘rtacha o‘sish koeffitsienti<\/b> geometrik o‘rtacha bilan: <b>K̄=ⁿ⁻¹√(yn/y₁)<\/b> yoki zanjirsimon koeffitsientlar ko‘paytmasidan K̄=ᵐ√(K₁·K₂·…·Km). O‘rtacha o‘sish sur’ati T̄=K̄·100%, o‘rtacha qo‘shimcha o‘sish sur’ati T̄−100%. O‘rtacha mutlaq o‘sish Δ̄=(yn−y₁)/(n−1).<\/p>", "t": "dinamika", "status": "fixed", "note": "Correct but incomplete: did not state explicitly WHEN the chronological mean is used; added unequal-interval case and average absolute growth.", "id": "st-49", "src": "stat"}, {"n": 50, "q": "Vaqt qatori komponentalari: trend, mavsumiylik, sikl, tasodifiy komponenta; additiv va multiplikativ modellar.", "k": "", "a": "<p>Vaqt qatori <b>trend T<\/b> (uzoq muddatli yo‘nalish), <b>mavsumiy S<\/b> (yil ichida takrorlanish), <b>sikl C<\/b> (uzoqroq to‘lqinlar) va <b>tasodifiy I<\/b> komponentlarga ajratiladi. Additiv model <b>Y=T+S+C+I<\/b>, multiplikativ <b>Y=T·S·C·I<\/b>. Tebranishlar darajaga mutanosib oshsa multiplikativ model qulay.<\/p>", "t": "dinamika", "status": "ok", "note": "", "id": "st-50", "src": "stat"}, {"n": 51, "q": "Trendni aniqlash usullari: qatorni yiriklashtirish, sirpanuvchi o‘rtacha, analitik tekislash (EKK). Mavsumiylik indekslari qanday hisoblanadi?", "k": "", "a": "<p>Trendni <b>yiriklashtirishda<\/b> qisqa davrlar birlashtiriladi; <b>sirpanuvchi o‘rtacha<\/b> vaqt bo‘yicha tekislaydi; <b>EKK<\/b> trendni ŷ=a+bt kabi funksiya bilan baholaydi. Oddiy mavsumiylik indeksi <b>Si=muayyan chorak (oy) o‘rtachasi/umumiy o‘rtacha·100%<\/b>; to‘rt chorak bo‘yicha indekslar yig‘indisi <b>400%<\/b> atrofida. Kuchli trend bo‘lsa avval trend ta’sirini ajratish lozim.<\/p>", "t": "dinamika", "status": "ok", "note": "", "id": "st-51", "src": "stat"}, {"n": 52, "q": "Indeks tushunchasi, vazifalari va turlari (individual va umumiy; bazisli va zanjirsimon; hajm, narx va qiymat indekslari).", "k": "", "a": "<p><b>Indeks<\/b> — murakkab hodisa darajasining vaqt, hudud yoki reja bo‘yicha o‘zgarishini ko‘rsatuvchi nisbiy ko‘rsatkich. Vazifalari: dinamikani o‘lchash, reja bajarilishini va hududlarni taqqoslash, umumiy o‘zgarishni omillarga (narx va hajm) ajratish. <b>Individual indeks<\/b> bitta mahsulotga tegishli: ip=p₁/p₀, iq=q₁/q₀; <b>umumiy (agregat) indeks<\/b> bevosita qo‘shib bo‘lmaydigan ko‘p mahsulotlar to‘plamini vaznlar orqali umumlashtiradi. <b>Bazisli<\/b> indeks doimiy boshlang‘ich davrga, <b>zanjirsimon<\/b> indeks avvalgi davrga nisbatan hisoblanadi; zanjirsimon indekslar ko‘paytmasi bazisli indeksga teng. Turlari: <b>qiymat indeksi<\/b> Ipq=Σp₁q₁/Σp₀q₀, <b>narx indeksi<\/b> Ip=Σp₁q₁/Σp₀q₁, <b>fizik hajm indeksi<\/b> Iq=Σp₀q₁/Σp₀q₀.<\/p>", "t": "indeks", "status": "fixed", "note": "Correct but incomplete: index functions (factor decomposition) were missing; added chain–base relation and aggregate formulas.", "id": "st-52", "src": "stat"}, {"n": 53, "q": "Laspeyres va Paashe indekslari: formulalari, afzalliklari va kamchiliklari.", "k": "", "a": "<p><b>Laspeyres narx indeksi IpL=Σp₁q₀/Σp₀q₀<\/b> — bazis davri miqdorlari vazn; <b>Paashe narx indeksi IpP=Σp₁q₁/Σp₀q₁<\/b> — joriy davr miqdorlari vazn. Laspeyres afzalligi: vaznlar o‘zgarmas, davrlar qatorini solishtirish oson, joriy miqdor ma’lumoti talab qilinmaydi; kamchiligi: xaridorlarning arzonlashgan tovarlarga o‘tishini (o‘rnini bosish) hisobga olmaydi, shuning uchun narx o‘sishini <b>oshirib<\/b> ko‘rsatishga moyil. Paashe afzalligi: joriy iste’mol tuzilmasini aks ettiradi; kamchiligi: har davr uchun joriy miqdorlarni talab qiladi va narx o‘sishini <b>kamaytirib<\/b> ko‘rsatishga moyil. Ikkisining o‘rtasi — <b>Fisher indeksi<\/b> IF=√(IpL·IpP). Hajm indekslarida narxlar vazn bo‘ladi: IqL=Σp₀q₁/Σp₀q₀.<\/p>", "t": "indeks", "status": "fixed", "note": "Correct but incomplete: added the Laspeyres upward / Paasche downward bias and the Fisher index.", "id": "st-53", "src": "stat"}, {"n": 54, "q": "Indekslarning o‘zaro bog‘liqligi (qiymat indeksi = narx indeksi × hajm indeksi) va mutlaq o‘zgarishni omillar bo‘yicha ajratish.", "k": "", "a": "<p>Qiymat indeksi <b>Iv=Σp1q1/Σp0q0<\/b>. Ayniyat: <b>Iv=IpP·IqL<\/b>, bunda IpP=Σp1q1/Σp0q1 va IqL=Σp0q1/Σp0q0. Mutlaq qiymat o‘zgarishi: Σp1q1−Σp0q0 = [Σp1q1−Σp0q1] (narx ta’siri) + [Σp0q1−Σp0q0] (hajm ta’siri).<\/p>", "t": "indeks", "status": "ok", "note": "", "id": "st-54", "src": "stat"}, {"n": 55, "q": "O‘rtacha arifmetik va o‘rtacha garmonik indekslar: qaysi holatlarda agregat indeksga muqobil sifatida qo‘llaniladi?", "k": "", "a": "<p>Agregat hajm indeksi uchun individual indeks iq=q1/q0 va bazis qiymatlar v0=p0q0 mavjud bo‘lsa <b>Iq=Σ(iq·v0)/Σv0<\/b> — tortilgan arifmetik shakl. Joriy qiymat v1=p1q1 va individual narx indeksi ip=p1/p0 bo‘lsa <b>Ip=Σv1/Σ(v1/ip)<\/b> — tortilgan garmonik shakl. Bu formulalar mos agregat indeksning algebraik muqobilidir.<\/p>", "t": "indeks", "status": "ok", "note": "", "id": "st-55", "src": "stat"}, {"n": 56, "q": "Noparametrik testlarning mohiyati. Qachon parametrik testlar o‘rniga noparametrik testlar qo‘llanadi (normallik buzilganda, kichik n, tartib shkalasi)? Ularning afzallik va kamchiliklari.", "k": "", "a": "<p><b>Noparametrik testlar<\/b> taqsimot parametriga qat’iy normal faraz qo‘ymasdan, ko‘pincha <b>ranglar va ishoralardan<\/b> foydalanadi. Tartib shkalasi, keskin chet qiymatlar, kichik n yoki normal farazning jiddiy buzilishida qulay. <b>Afzalligi<\/b> — barqarorlik; <b>kamchiligi<\/b> — ba’zi parametrik sharoitlarda quvvati pastroq va natijasi ko‘pincha o‘rtacha emas, taqsimot/ranglar haqida bo‘ladi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-56", "src": "stat"}, {"n": 57, "q": "Bitta bosh to‘plam uchun noparametrik testlarni izohlang. Gipotezalari va qo‘llanish shartlari.", "k": "", "a": "<p>Bitta bosh to‘plam uchun noparametrik testlar normallik farazisiz mediana yoki taqsimot shakli haqidagi gipotezani tekshiradi. <b>Ishora testi<\/b>: H₀: mediana=m₀; har bir xᵢ−m₀ farqining ishorasi olinadi, H₀ to‘g‘ri bo‘lsa «+» lar soni Bin(n; 0,5) taqsimlanadi (nol farqlar tashlanadi); faqat tartib shkalasi kerak. <b>Wilcoxon ishorali-rang testi<\/b>: dᵢ=xᵢ−m₀ farqlarning mutlaq qiymatlari ranglanadi va musbat ranglar yig‘indisi W⁺ orqali H₀: mediana=m₀ tekshiriladi; taqsimot mediana atrofida simmetrik deb faraz qilinadi, shu bois u ishora testidan quvvatliroq. <b>χ² moslik testi<\/b> va <b>Kolmogorov–Smirnov testi<\/b> kuzatilgan taqsimotning nazariy F₀ ga mosligini tekshiradi (K–S uzluksiz taqsimot uchun; parametrlar ma’lumotdan baholansa Lilliefors tuzatmasi kerak). <b>Seriyalar testi<\/b> kuzatuvlar ketma-ketligining tasodifiyligini tekshiradi.<\/p>", "t": "gipoteza", "status": "fixed", "note": "Wilcoxon description mixed up the one-sample and paired cases ('paired differences'); clarified d = x − m0 and added χ² goodness-of-fit and runs test.", "id": "st-57", "src": "stat"}, {"n": 58, "q": "Statistika predmeti va uning o‘ziga xos xususiyatlari.", "k": "miqdor, sifat, ommaviy hodisalar, boshqa fanlar bilan bog‘liqligi va farqi", "a": "<p><b>Statistika predmeti<\/b> — <b>ommaviy hodisalar<\/b> va jarayonlarning <b>miqdor<\/b> tomonini ularning <b>sifat<\/b> mazmuni bilan uzviy bog‘liq holda, aniq joy va vaqt sharoitida o‘rganish. Uning o‘ziga xos xususiyatlari: <b>ommaviylik<\/b> (qonuniyat ko‘p birliklarda, katta sonlar qonuni asosida namoyon bo‘ladi), <b>miqdor va sifat birligi<\/b> (har bir son aniq iqtisodiy mazmunga ega) va <b>o‘zgaruvchanlik (variatsiya)<\/b> — birliklarning belgi qiymatlari bo‘yicha bir-biridan farq qilishi. Yakka hodisa ommaviy qonuniyatni ochib bera olmaydi, shuning uchun u statistika predmeti hisoblanmaydi. <b>Boshqa fanlar bilan bog‘liqligi<\/b>: statistika iqtisodiyot nazariyasi, sotsiologiya va demografiya tushunchalariga tayanadi, matematika va ehtimollar nazariyasi usullaridan foydalanadi hamda bu fanlarni raqamli ma’lumotlar bilan ta’minlaydi. <b>Farqi<\/b>: iqtisodiyot nazariyasi qonuniyatlarni mantiqiy-sifat jihatdan tushuntiradi, matematika mavhum sonlar bilan ishlaydi, statistika esa aniq joy va vaqtdagi real ommaviy hodisalarning miqdoriy o‘lchovi bilan shug‘ullanadi.<\/p>", "t": "asos", "status": "fixed", "note": "Answer was copied from Q1 and omitted the required link with and difference from other sciences.", "id": "st-58", "src": "stat"}, {"n": 59, "q": "Statistika to‘g‘risida umumiy tushuncha.", "k": "hodisa, jarayon, statistika, ahvol, holat, davlat, davlat ahvoli, ijtimoiy fan, rivojlanish bosqichlari", "a": "<p><b>Statistika<\/b> so‘zi lotincha <b>status<\/b> — <b>holat, ahvol<\/b> va italyancha <b>stato<\/b> — <b>davlat<\/b> so‘zlaridan kelib chiqqan; dastlab u <b>davlat ahvoli<\/b> haqidagi ma’lumotlarni bildirgan. Hozir bu atama uch ma’noda ishlatiladi: 1) ommaviy <b>hodisa<\/b> va <b>jarayon<\/b>lar haqida ma’lumot yig‘ish va qayta ishlash bo‘yicha amaliy faoliyat; 2) shu faoliyat natijasida olingan raqamli ma’lumotlar majmui; 3) ommaviy hodisalarning miqdoriy tomonini o‘rganuvchi <b>ijtimoiy fan<\/b>. <b>Rivojlanish bosqichlari<\/b>: qadimgi davlatlarda aholi, yer va mol-mulkni hisobga olishdan boshlangan; XVII asrda Angliyada «siyosiy arifmetika» maktabi (J. Graunt, U. Petti) ommaviy hodisalardagi miqdoriy qonuniyatlarni izlagan. XVIII asrda Germaniyada «davlatshunoslik» maktabi (G. Axenval) «statistika» atamasini fanga kiritgan. XIX–XX asrlarda A. Ketle, F. Galton, K. Pirson va R. Fisher ishlari bilan matematik statistika shakllanib, statistika zamonaviy fanga aylangan.<\/p>", "status": "rewritten", "note": "Question 59 was merged into the text of Q58 and had no answer of its own.", "t": "asos", "id": "st-59", "src": "stat"}, {"n": 60, "q": "Statistika fanining asosiy kategoriyalari va tushunchalari.", "k": "o‘rganish ob’ekti va birligi, statistik to‘plam, statistik qonuniyat, statistik ko‘rsatkichlar", "a": "<p><b>Statistik to‘plam<\/b> — umumiy sifat asosiga ega, lekin ayrim belgilari bo‘yicha farqlanuvchi ko‘plab birliklar majmui (masalan, viloyatdagi barcha savdo korxonalari); u statistik <b>o‘rganish ob’ekti<\/b> hisoblanadi. <b>To‘plam birligi<\/b> — to‘plamning har bir alohida elementi (korxona, xodim, oila); u belgilarning tashuvchisi va hisob asosi. <b>Belgi<\/b> — birlikning xususiyati: miqdoriy (ish haqi, tovar aylanmasi) yoki sifat — atributiv (jinsi, mulkchilik shakli); belgining birliklar bo‘yicha o‘zgarishi <b>variatsiya<\/b> deyiladi. <b>Statistik qonuniyat<\/b> — alohida birliklarda tasodifiy ko‘rinsa ham, ommaviy kuzatishda katta sonlar qonuni tufayli namoyon bo‘ladigan barqaror takrorlanuvchanlik (masalan, yangi tug‘ilganlar orasida o‘g‘il bolalar ulushi taxminan 51%). <b>Statistik ko‘rsatkich<\/b> — hodisaning aniq joy va vaqtdagi miqdor va sifat birligidagi umumlashtiruvchi tavsifi (masalan, 2025-yilda viloyat chakana tovar aylanmasi, mlrd so‘m); o‘zaro bog‘liq ko‘rsatkichlar <b>ko‘rsatkichlar tizimi<\/b>ni tashkil etadi.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer was copied from Q4 (population, sample, parameter) and did not cover the listed categories.", "id": "st-60", "src": "stat"}, {"n": 61, "q": "Statistika fanining metodi.", "k": "statistik kuzatish, jamlash, guruhlash, mutlaq va nisbiy miqdorlar, o‘rtacha miqdorlar, variatsiya ko‘rsatkichlari, indekslar, korrelyatsion va regression tahlil", "a": "<p><b>Statistika metodi<\/b> — ommaviy hodisalarni o‘rganishda qo‘llaniladigan usul va yo‘llar majmui bo‘lib, statistik tadqiqotning uch bosqichiga mos keladi. 1-bosqich — <b>statistik kuzatish<\/b>: ommaviy hodisa birliklari haqida birlamchi ma’lumotlarni ilmiy asosda, reja bo‘yicha yig‘ish. 2-bosqich — <b>jamlash<\/b> va <b>guruhlash<\/b>: yig‘ilgan ma’lumotlarni tekshirish, jami natijalarni hisoblash, birliklarni muhim belgilar bo‘yicha bir jinsli guruhlarga ajratish va natijalarni jadval hamda grafiklarda ifodalash. 3-bosqich — tahlil: umumlashtiruvchi ko‘rsatkichlar hisoblanadi — <b>mutlaq va nisbiy miqdorlar<\/b> (hajm, tuzilma, dinamika), <b>o‘rtacha miqdorlar<\/b> (tipik daraja), <b>variatsiya ko‘rsatkichlari<\/b> (tebranish va bir jinslilik), <b>indekslar<\/b> (murakkab hodisalar o‘zgarishi va omillar ta’siri), <b>korrelyatsion va regression tahlil<\/b> (belgilar orasidagi bog‘lanish zichligi va shakli). Tahlil natijasida qonuniyatlar aniqlanadi, xulosa va prognozlar ishlab chiqiladi.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer was copied from the grouping question (Q7) and described only grouping types.", "id": "st-61", "src": "stat"}, {"n": 62, "q": "Bozor iqtisodiyoti sharoitida statistikaning roli va ahamiyati.", "k": "makroiqtisodiyot va statistika, mikroiqtisodiyot va statistika, ma’lumotlarning haqqoniyligi va keng qamrovliligi", "a": "<p>Bozor iqtisodiyotida qarorlarni davlat, korxonalar va aholi mustaqil qabul qiladi, shuning uchun ularning barchasiga ishonchli statistik axborot zarur. <b>Makroiqtisodiyot va statistika<\/b>: milliy hisoblar tizimi asosida YaIM, inflyatsiya, bandlik va ishsizlik, aholi daromadlari, tashqi savdo va to‘lov balansi ko‘rsatkichlari hisoblanadi; ular asosida davlat pul-kredit, soliq va ijtimoiy siyosatni ishlab chiqadi va natijalarini baholaydi. <b>Mikroiqtisodiyot va statistika<\/b>: korxona darajasida talab va narxlar, sotuv, xarajatlar, mehnat unumdorligi, raqobatchilar va bozor ulushi tahlil qilinib, marketing, ishlab chiqarish va investitsiya qarorlari asoslanadi. Statistik axborot investorlar, banklar va xalqaro tashkilotlar uchun ham iqtisodiyotga ishonch manbai hisoblanadi. Buning uchun <b>ma’lumotlarning haqqoniyligi<\/b> (to‘g‘ri, xolis, xalqaro metodologiyaga mos bo‘lishi) va <b>keng qamrovliligi<\/b> (barcha tarmoqlar, hududlar, mulkchilik shakllari va norasmiy sektorni qamrab olishi, o‘z vaqtida va ochiq e’lon qilinishi) ta’minlanishi kerak.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer was copied from Q2 (descriptive vs inferential statistics) and was off-topic.", "id": "st-62", "src": "stat"}, {"n": 63, "q": "O‘zbekistonda rasmiy statistikaning tashkil etilishi.", "k": "Statistika agentligi, viloyat statistika boshqarmalari, shahar, tuman statistika bo‘limlari", "a": "<p>O‘zbekistonda rasmiy statistika markazlashgan tizim asosida tashkil etilgan bo‘lib, «Rasmiy statistika to‘g‘risida»gi Qonun bilan tartibga solinadi. Tizimning markaziy organi — <b>O‘zbekiston Respublikasi Prezidenti huzuridagi Statistika agentligi<\/b> (avvalgi Davlat statistika qo‘mitasi negizida tashkil etilgan). Hududiy bo‘g‘in — Qoraqalpog‘iston Respublikasi, <b>viloyat statistika boshqarmalari<\/b> va Toshkent shahar statistika boshqarmasi; quyi bo‘g‘in — <b>shahar va tuman statistika bo‘limlari<\/b>. Agentlik statistik ishlar dasturini tuzadi, hisobot shakllari va metodologiyani tasdiqlaydi, kuzatish va ro‘yxatga olishlarni o‘tkazadi, ma’lumotlarni yig‘adi, qayta ishlaydi va rasmiy saytda (stat.uz) e’lon qiladi. Hududiy boshqarma va bo‘limlar korxona va tashkilotlardan hisobotlarni qabul qiladi, tekshiradi, jamlaydi va hudud bo‘yicha tahlil tayyorlaydi. Rasmiy statistikani shakllantirishda boshqa davlat organlari (masalan, Markaziy bank, Moliya vazirligi, bojxona organlari) ham o‘z sohasi bo‘yicha ishtirok etadi; respondentlar haqidagi shaxsiy ma’lumotlarning maxfiyligi kafolatlanadi.<\/p>", "t": "asos", "status": "rewritten", "note": "Original answer was vague and did not name the Statistics Agency or its regional/city/district structure.", "id": "st-63", "src": "stat"}, {"n": 64, "q": "Statistik kuzatish turlari va ularning o‘ziga xos jihatlari.", "k": "", "a": "<p>Statistik kuzatish turlari uch belgi bo‘yicha tasniflanadi. <b>Vaqt bo‘yicha<\/b>: <b>joriy (uzluksiz)<\/b> kuzatish hodisalarni sodir bo‘lishi bilan muntazam qayd etadi (tug‘ilish, tovar sotuvi); <b>davriy<\/b> kuzatish muayyan vaqt oralig‘ida takrorlanadi (aholi ro‘yxati, yillik hisobot); <b>bir martalik<\/b> kuzatish zarurat tug‘ilganda bir marta o‘tkaziladi. <b>Qamrovi bo‘yicha<\/b>: <b>yoppasiga<\/b> kuzatishda to‘plamning barcha birliklari, <b>yoppasiga bo‘lmagan (qisman)<\/b> kuzatishda faqat bir qismi o‘rganiladi; uning turlari — tanlanma, asosiy massiv, monografik va anketa kuzatishi. <b>Ma’lumot olish manbai bo‘yicha<\/b>: <b>bevosita<\/b> kuzatish (sanash, o‘lchash, tortish), <b>hujjatli<\/b> kuzatish (buxgalteriya va boshqa birlamchi hujjatlar asosida) va <b>so‘rov<\/b> (ekspeditsion, o‘z-o‘zini ro‘yxatga olish, korrespondent, anketa usullari). Har bir tur kuzatish maqsadi, ob’ekt hajmi, vaqt va mablag‘ imkoniyatlariga qarab tanlanadi.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer described only sample observation (copied from Q20), not the classification of observation types.", "id": "st-64", "src": "stat"}, {"n": 65, "q": "Statistik kuzatishning mohiyati va ahamiyati.", "k": "kuzatish turlari, shakllari, statistik hisobot, maxsus uyushtirilgan tekshirishlar", "a": "<p><b>Statistik kuzatish<\/b> — ommaviy ijtimoiy-iqtisodiy hodisalar to‘g‘risida oldindan ishlab chiqilgan dastur asosida, ilmiy tashkil etilgan holda birlamchi ma’lumotlarni yig‘ish va qayd etish. U statistik tadqiqotning birinchi bosqichi bo‘lib, keyingi jamlash, guruhlash va tahlil natijalari to‘liq kuzatish sifatiga bog‘liq; shu sababli ma’lumotlar to‘liq, aniq, ishonchli va taqqoslanadigan bo‘lishi kerak. Kuzatishning tashkiliy <b>shakllari<\/b>: <b>statistik hisobot<\/b> — korxona va tashkilotlar belgilangan shakl, dastur va muddatda majburiy taqdim etadigan rasmiy hujjat; <b>maxsus uyushtirilgan tekshirishlar<\/b> — hisobotda aks etmaydigan hodisalarni o‘rganish uchun alohida tashkil etiladigan kuzatishlar (aholi ro‘yxati, inventarizatsiya, uy xo‘jaliklari so‘rovi); shuningdek <b>registrlar<\/b> — birliklar haqida muntazam yangilanadigan ma’lumotlar bazasi. <b>Kuzatish turlari<\/b> vaqt bo‘yicha (joriy, davriy, bir martalik) va qamrov bo‘yicha (yoppasiga va yoppasiga bo‘lmagan) farqlanadi. Kuzatish ma’lumotlari davlat boshqaruvi, rejalashtirish va biznes qarorlari uchun asos bo‘ladi.<\/p>", "t": "asos", "status": "rewritten", "note": "Same generic paragraph was pasted into Q65–68 and Q71; it did not explain the essence and importance of observation.", "id": "st-65", "src": "stat"}, {"n": 66, "q": "Statistik kuzatishning dasturiy-uslubiy masalalari.", "k": "kuzatish birligi va ob’ekti, kuzatish maqsadi va vazifalari, kuzatishni tashkil etish, kuzatish dasturi", "a": "<p>Dasturiy-uslubiy masalalar kuzatishga tayyorgarlikda «nimani, nima uchun va qanday kuzatamiz?» degan savollarga javob beradi. Avval <b>kuzatish maqsadi va vazifalari<\/b> aniqlanadi: qanday ma’lumot va qaysi qarorlar uchun kerakligi. So‘ng <b>kuzatish ob’ekti<\/b> — o‘rganiladigan to‘plam (masalan, shahardagi chakana savdo do‘konlari) va uning chegaralari belgilanadi. <b>Kuzatish birligi<\/b> — ma’lumot qayd etiladigan belgilar tashuvchisi (do‘kon, xodim), <b>hisobot birligi<\/b> esa ma’lumotni taqdim etuvchi sub’ekt (korxona, tashkilot); ular ba’zan mos keladi, ba’zan farqlanadi. <b>Kuzatish dasturi<\/b> — har bir birlik bo‘yicha javob olinadigan savollar (belgilar) ro‘yxati; savollar aniq, qisqa, bir xil tushuniladigan va maqsadga mos bo‘lishi kerak, ular statistik formulyar (blanka) va uni to‘ldirish yo‘riqnomasida rasmiylashtiriladi. <b>Kuzatishni tashkil etish<\/b> usuli — ma’lumot olish manbai va yo‘li (bevosita, hujjatli, so‘rov) ham shu bosqichda tanlanadi.<\/p>", "t": "asos", "status": "rewritten", "note": "Generic copy-pasted answer; did not cover the unit/object, aims or programme of observation.", "id": "st-66", "src": "stat"}, {"n": 67, "q": "Statistik kuzatishning tashkiliy masalalari.", "k": "kuzatishni tashkil etuvchi tashkilotlar, kuzatish birligi va ob’ektini aniqlash, kuzatish sanasi va davri, kritik moment", "a": "<p>Tashkiliy masalalar kuzatishning tashkiliy rejasida hal qilinadi: «kim, qayerda, qachon va qanday resurslar bilan kuzatadi?». Rejada <b>kuzatishni tashkil etuvchi tashkilotlar<\/b> (Statistika agentligi va uning hududiy boshqarmalari, vazirliklar), o‘tkaziladigan joy, kadrlarni tanlash va o‘qitish, blanka va yo‘riqnomalarni tayyorlash, aholiga tushuntirish ishlari va moliyalashtirish ko‘rsatiladi. <b>Kuzatish birligi va ob’ektini aniqlash<\/b> birliklarning takrorlanmasligi va tushib qolmasligini ta’minlaydi. <b>Kuzatish sanasi va davri<\/b> belgilanadi: kuzatish davri (sub’ektiv vaqt) — ma’lumot yig‘iladigan muddat, masalan 10 kun. <b>Kritik moment<\/b> (ob’ektiv vaqt) — ma’lumotlar qaysi aniq vaqt holatiga qayd etilishi, masalan aholi ro‘yxatida belgilangan kunning soat 00:00 holati; u birliklarning ikki marta hisoblanishi yoki tushib qolishining oldini oladi. Tashkiliy rejada sinov (pilot) kuzatuvi va natijalarni nazorat qilish tartibi ham nazarda tutiladi.<\/p>", "t": "asos", "status": "rewritten", "note": "Generic copy-pasted answer; did not mention organisers, observation date/period or the critical moment.", "id": "st-67", "src": "stat"}, {"n": 68, "q": "Statistik kuzatish tushunchasi, mohiyati va ahamiyati.", "k": "kuzatish turlari, usullari, shakllari, statistik hisobot, maxsus uyushtirilgan tekshirishlar", "a": "<p><b>Statistik kuzatish<\/b> — ommaviy hodisalar birliklari haqida oldindan belgilangan dastur bo‘yicha birlamchi ma’lumotlarni rejali, ilmiy asosda yig‘ish; u statistik tadqiqotning birinchi va asosiy bosqichi, chunki keyingi barcha hisob-kitoblarning ishonchliligi shu ma’lumotlarga bog‘liq. <b>Shakllari<\/b>: <b>statistik hisobot<\/b> (korxonalar belgilangan shakl va muddatda majburiy topshiradigan hujjat), <b>maxsus uyushtirilgan tekshirishlar<\/b> (ro‘yxatga olish, so‘rovlar, inventarizatsiya) va registrlar. <b>Turlari<\/b>: vaqt bo‘yicha — joriy, davriy va bir martalik; qamrov bo‘yicha — yoppasiga va yoppasiga bo‘lmagan (tanlanma, asosiy massiv, monografik). <b>Usullari<\/b> (ma’lumot olish manbai bo‘yicha): bevosita kuzatish (sanash, o‘lchash, tortish), hujjatli kuzatish (birlamchi hisob hujjatlari asosida) va so‘rov — og‘zaki (ekspeditsion), o‘z-o‘zini ro‘yxatga olish, korrespondent va anketa usullari. Kuzatishning ahamiyati — davlat va korxonalarni qaror qabul qilish, rejalashtirish va nazorat uchun zarur haqqoniy axborot bilan ta’minlash.<\/p>", "t": "asos", "status": "rewritten", "note": "Generic copy-pasted answer; did not explain the concept or list the types, methods and forms asked.", "id": "st-68", "src": "stat"}, {"n": 69, "q": "Statistik kuzatish turlari va ularning o‘ziga xos jihatlari.", "k": "muntazam kuzatish, bir yo‘lakay, fursatli kuzatish, yoppasiga va qisman kuzatish", "a": "<p>Statistik kuzatish turlari vaqt va qamrov belgilari bo‘yicha ajratiladi. Vaqt bo‘yicha: <b>muntazam (joriy, uzluksiz) kuzatish<\/b> hodisalarni sodir bo‘lishi bilan doimiy qayd etadi (tug‘ilish va o‘limni ro‘yxatga olish, kassa orqali tovar sotuvi hisobi); <b>fursatli (davriy) kuzatish<\/b> muayyan vaqt oralig‘ida takrorlanib turadi (aholi ro‘yxati, chorakli va yillik hisobotlar); <b>bir yo‘lakay (bir martalik) kuzatish<\/b> biror masala bo‘yicha zarurat tug‘ilganda bir marta o‘tkaziladi (masalan, yangi tovarga talabni bir martalik so‘rov orqali o‘rganish). Qamrov bo‘yicha: <b>yoppasiga kuzatish<\/b> to‘plamning barcha birliklarini qamraydi — to‘liq ma’lumot beradi, lekin qimmat va ko‘p vaqt talab qiladi. <b>Qisman (yoppasiga bo‘lmagan) kuzatish<\/b> birliklarning faqat bir qismini o‘rganadi: tanlanma kuzatish (natija butun to‘plamga tarqatiladi), asosiy massiv usuli (eng yirik birliklar o‘rganiladi), monografik (alohida tipik birlik chuqur tavsiflanadi) va anketa kuzatishi. Qisman kuzatish arzon va tez, ammo reprezentativlik xatosiga ega.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer described only sample observation (copied from Q20) instead of the listed observation types.", "id": "st-69", "src": "stat"}, {"n": 70, "q": "Statistik kuzatish xatolari va ularni aniqlash usullari.", "k": "muntazam xatolar, qayd etish xatolari, ataylab yo‘l qo‘yilgan xatolar, arifmetik va mantiqiy tekshirish", "a": "<p>Kuzatish xatosi — kuzatishda qayd etilgan qiymat bilan haqiqiy qiymat orasidagi farq. <b>Qayd etish xatolari<\/b> ma’lumotni o‘lchash, yozish yoki kiritishda paydo bo‘ladi va har qanday kuzatishga xos; <b>reprezentativlik xatolari<\/b> esa faqat yoppasiga bo‘lmagan kuzatishda, tanlangan qism butun to‘plamni to‘liq aks ettirmasligidan kelib chiqadi. Xususiyatiga ko‘ra <b>tasodifiy xatolar<\/b> turli yo‘nalishda bo‘lib, ko‘p birliklarda o‘zaro qisman so‘nadi; <b>muntazam xatolar<\/b> bir tomonga og‘adi (noto‘g‘ri o‘lchov asbobi, yoshni yaxlitlab aytish) va natijani sistematik buzadi. <b>Ataylab yo‘l qo‘yilgan xatolar<\/b> — respondent yoki xodim tomonidan ma’lumotni qasddan buzib ko‘rsatish (daromadni kamaytirib yoki hisobotni «qo‘shib» yozish). Xatolarni aniqlash uchun <b>arifmetik tekshirish<\/b> (satr va ustun jamilari, hisob-kitob bo‘yicha bog‘liq ko‘rsatkichlar, masalan narx × miqdor = summa) va <b>mantiqiy tekshirish<\/b> (javoblarning o‘zaro muvofiqligi, masalan 10 yoshli bola «oliy ma’lumotli» bo‘la olmaydi) qo‘llaniladi.<\/p>", "t": "asos", "status": "fixed", "note": "Correct, but it omitted deliberate (intentional) errors and did not explain arithmetic vs logical checking.", "id": "st-70", "src": "stat"}, {"n": 71, "q": "Statistik hisobotning xususiyatlari.", "k": "hisobotlarni tuzish va taqdim etish, yoppasiga kuzatish, qisman kuzatish, muntazam kuzatish, belgilangan dastur, tartib va muddatda taqdim etish", "a": "<p><b>Statistik hisobot<\/b> — kuzatishning asosiy tashkiliy shakli bo‘lib, unda korxona va tashkilotlar o‘z faoliyati haqidagi ma’lumotlarni vakolatli statistika organlari tasdiqlagan shaklda taqdim etadi. Uning xususiyatlari: hisobot <b>belgilangan dastur<\/b> (ko‘rsatkichlar ro‘yxati) bo‘yicha tuziladi va <b>belgilangan tartib va muddatda taqdim etish<\/b> majburiy; u birlamchi buxgalteriya va operativ hisob hujjatlari asosida tuziladi, rahbar va mas’ul shaxslar imzosi bilan tasdiqlanadi, ma’lumotlarning to‘g‘riligi uchun javobgarlik belgilangan. <b>Hisobotlarni tuzish va taqdim etish<\/b> davriyligiga ko‘ra kundalik, haftalik, oylik, choraklik va yillik bo‘ladi — shu sababli hisobot <b>muntazam kuzatish<\/b> hisoblanadi. Qamroviga ko‘ra hisobot <b>yoppasiga kuzatish<\/b> (barcha korxonalar topshiradi) yoki <b>qisman kuzatish<\/b> (faqat tanlangan yoki yirik korxonalar topshiradi, masalan kichik biznes uchun tanlanma hisobot) shaklida bo‘lishi mumkin. Hozirda hisobotlar ko‘pincha elektron shaklda topshiriladi, bu ma’lumot yig‘ishni tezlashtiradi va xatolarni kamaytiradi.<\/p>", "t": "asos", "status": "rewritten", "note": "Generic copy-pasted answer; did not describe the features of statistical reporting.", "id": "st-71", "src": "stat"}, {"n": 72, "q": "Statistik kuzatish xatolarini bartaraf etish usullari.", "k": "statistik hisobot, maxsus tashkil etilgan tekshirishlar, kuzatish ob’ektini va birligini aniqlash", "a": "<p>Kuzatish xatolarining oldini olish va bartaraf etish kuzatishni tayyorlash, o‘tkazish va ma’lumotlarni qabul qilish bosqichlarida amalga oshiriladi. Tayyorgarlikda <b>kuzatish ob’ektini v
