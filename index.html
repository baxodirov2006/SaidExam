a birligini aniq belgilash<\/b> birliklarning takroran hisoblanishi yoki tushib qolishining oldini oladi; aniq dastur, tushunarli savollar, yo‘riqnoma va xodimlarni o‘qitish qayd etish xatolarini kamaytiradi. <b>Statistik hisobot<\/b> bo‘yicha xatolar hisobotni birlamchi hujjatlar (buxgalteriya hisobi, ombor kitoblari) bilan solishtirish, arifmetik va mantiqiy nazorat hamda oldingi davr ma’lumotlari bilan taqqoslash orqali aniqlanadi va korxonadan tuzatish talab qilinadi; noto‘g‘ri ma’lumot berganlik uchun javobgarlik belgilangan. <b>Maxsus tashkil etilgan tekshirishlar<\/b> — nazorat tekshiruvlari (masalan, aholi ro‘yxatidan keyin birliklarning bir qismini qayta so‘rov qilish) yordamida qayd etish xatolari miqdori baholanadi va natijalarga tuzatish kiritiladi. Tanlanma kuzatishda tasodifiy tanlash qoidalariga rioya qilish va yetarli tanlanma hajmi reprezentativlik xatosini kamaytiradi.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer was copied from Q70 and did not cover the key terms (reports, special checks, defining object and unit).", "id": "st-72", "src": "stat"}, {"n": 73, "q": "Statistik kuzatishning dastur-uslubiy va tashkiliy masalalari.", "k": "kuzatish birligi va ob’ekti, kuzatish maqsadi va vazifalari, kuzatishni tashkil etish, kuzatish dasturi, kuzatishni tashkil etuvchi tashkilotlar, kuzatish sanasi, davri va kritik momenti", "a": "<p>Har qanday kuzatishga tayyorgarlik ikki guruh masalani hal qilishni talab etadi. <b>Dastur-uslubiy masalalar<\/b>: <b>kuzatish maqsadi va vazifalari<\/b> aniqlanadi; <b>kuzatish ob’ekti<\/b> (o‘rganiladigan to‘plam va uning chegaralari) va <b>kuzatish birligi<\/b> (belgilar tashuvchisi, masalan do‘kon) belgilanadi; <b>kuzatish dasturi<\/b> — har bir birlik bo‘yicha javob olinadigan savollar ro‘yxati tuziladi, formulyar va yo‘riqnoma ishlab chiqiladi. <b>Tashkiliy masalalar<\/b> tashkiliy rejada aks etadi: <b>kuzatishni tashkil etuvchi tashkilotlar<\/b> (Statistika agentligi, hududiy boshqarmalar), o‘tkazish joyi, kadrlar tayyorlash, blankalarni tarqatish va moliyalashtirish — ya’ni <b>kuzatishni tashkil etish<\/b> tartibi. <b>Kuzatish sanasi va davri<\/b> — ma’lumot yig‘ish boshlanadigan sana va uning davomiyligi (sub’ektiv vaqt). <b>Kritik moment<\/b> — ma’lumotlar qayd etiladigan aniq vaqt holati (ob’ektiv vaqt), masalan ro‘yxatga olish kunining soat 00:00 holati; u birliklarning ikki marta hisoblanishi yoki tushib qolishining oldini oladi.<\/p>", "status": "rewritten", "note": "Question 73 was merged into the text of Q72 and had no answer of its own.", "t": "asos", "id": "st-73", "src": "stat"}, {"n": 74, "q": "Statistikada jamlash va guruhlashning mohiyati hamda vazifalari.", "k": "guruhlashning maqsadi, vazifalari, iqtisodiy-ijtimoiy hodisalar bo‘yicha guruhlash, tipologik guruhlash, analitik guruhlash, tuzilmaviy guruhlash", "a": "<p><b>Statistik jamlash (svodka)<\/b> — statistik tadqiqotning ikkinchi bosqichi: kuzatishda yig‘ilgan alohida birliklar ma’lumotlarini tekshirish, tartiblash, guruhlash, jami natijalarni hisoblash va jadvallarda umumlashtirish; oddiy jamlash faqat yakunlarni hisoblaydi, murakkab jamlash guruhlashni ham o‘z ichiga oladi. <b>Guruhlash<\/b> — to‘plam birliklarini muhim belgi bo‘yicha sifat jihatdan bir jinsli guruhlarga ajratish; u jamlashning markaziy qismi. <b>Guruhlashning maqsadi<\/b> — ommaviy <b>iqtisodiy-ijtimoiy hodisalar<\/b>ning ichki tuzilishi, turlari va o‘zaro bog‘lanishlarini ochib berish. Bunga mos <b>vazifalari<\/b> va turlari: <b>tipologik guruhlash<\/b> sifat jihatdan farqli turlarni ajratadi (korxonalarni mulkchilik shakli bo‘yicha); <b>tuzilmaviy guruhlash<\/b> bir jinsli to‘plam tarkibi va uning o‘zgarishini ko‘rsatadi (xodimlarni yoshi bo‘yicha); <b>analitik guruhlash<\/b> omil va natija belgilari orasidagi bog‘lanishni aniqlaydi (ish staji va mehnat unumdorligi). Guruhlar soni Sterdjess formulasi <b>k ≈ 1 + 3,322·lg n<\/b>, interval kengligi <b>h = (x<sub>max<\/sub> − x<sub>min<\/sub>)/k<\/b> bilan aniqlanadi.<\/p>", "t": "asos", "status": "fixed", "note": "Grouping types were correct, but summarisation (jamlash) and the aims of grouping were not explained.", "id": "st-74", "src": "stat"}, {"n": 75, "q": "Statistik guruhlashning mohiyati va ahamiyati.", "k": "guruhlashning maqsadi, vazifalari, ijtimoiy sohalar bo‘yicha guruhlash, tipologik guruhlash, analitik guruhlash, tuzilmaviy guruhlash", "a": "<p><b>Statistik guruhlash<\/b> — o‘rganilayotgan to‘plam birliklarini muhim belgilar bo‘yicha sifat jihatdan bir jinsli guruhlarga ajratish. U statistikaning asosiy metodlaridan biri: guruhlashsiz hisoblangan o‘rtacha va boshqa umumlashtiruvchi ko‘rsatkichlar sifat jihatdan har xil birliklarni aralashtirib, noto‘g‘ri xulosaga olib kelishi mumkin. <b>Guruhlashning maqsadi<\/b> — to‘plamdagi turlar, tuzilma va bog‘lanishlarni ochib berish; bunga uchta <b>vazifa<\/b> mos keladi. <b>Tipologik guruhlash<\/b> ijtimoiy-iqtisodiy turlarni ajratadi (aholini ijtimoiy guruhlar bo‘yicha, korxonalarni tarmoq va mulkchilik shakli bo‘yicha); <b>tuzilmaviy guruhlash<\/b> to‘plam tarkibini tavsiflaydi (aholining yoshi, ma’lumot darajasi bo‘yicha tarkibi); <b>analitik guruhlash<\/b> belgilar orasidagi bog‘lanishni aniqlaydi (daromad darajasi va iste’mol xarajatlari). <b>Ijtimoiy sohalar bo‘yicha guruhlash<\/b> ta’lim, sog‘liqni saqlash, bandlik, turmush darajasi kabi sohalardagi tafovutlarni ko‘rsatib, ijtimoiy siyosatni asoslashga xizmat qiladi.<\/p>", "status": "rewritten", "note": "Question 75 was merged into the text of Q74 and had no answer of its own.", "t": "asos", "id": "st-75", "src": "stat"}, {"n": 76, "q": "Statistik guruhlash: mohiyati, turlari va uni tuzish qoidalari.", "k": "guruhlashning maqsadi, vazifalari, ijtimoiy guruhlar bo‘yicha guruhlash, tipologik guruhlash, analitik guruhlash, tuzilmaviy guruhlash, oddiy guruhlash, murakkab guruhlash, birlamchi guruhlash, ikkilamchi guruhlash", "a": "<p><b>Statistik guruhlash<\/b> — to‘plam birliklarini muhim belgilar bo‘yicha bir jinsli guruhlarga ajratish; uning <b>maqsadi<\/b> — to‘plamdagi turlar, tuzilma va bog‘lanishlarni ochib berish. <b>Vazifalariga<\/b> ko‘ra turlari: <b>tipologik guruhlash<\/b> (sifat turlarini, masalan <b>ijtimoiy guruhlar bo‘yicha<\/b> ajratish), <b>tuzilmaviy guruhlash<\/b> (tarkibni ko‘rsatish) va <b>analitik guruhlash<\/b> (omil va natija bog‘lanishini aniqlash). Guruhlash belgilari soniga ko‘ra: <b>oddiy guruhlash<\/b> — bitta belgi bo‘yicha; <b>murakkab guruhlash<\/b> — ikki va undan ortiq belgi bo‘yicha (kombinatsion — guruhlar ichida kichik guruhlar ajratiladi, yoki ko‘p o‘lchovli). Ma’lumot manbaiga ko‘ra: <b>birlamchi guruhlash<\/b> kuzatish ma’lumotlari asosida tuziladi; <b>ikkilamchi guruhlash<\/b> avval tuzilgan guruhlashni qayta guruhlash (intervallarni yiriklashtirish yoki ulushlar asosida yangi guruhlar hosil qilish), odatda turli guruhlashlarni taqqoslanadigan qilish uchun. Tuzish qoidalari: muhim guruhlash belgisini tanlash, guruhlar sonini aniqlash (<b>k ≈ 1 + 3,322·lg n<\/b>), interval kengligini topish (<b>h = (x<sub>max<\/sub> − x<sub>min<\/sub>)/k<\/b>) va chegaralarni har bir birlik faqat bitta guruhga tushadigan qilib belgilash.<\/p>", "t": "asos", "status": "fixed", "note": "Correct but missed simple vs complex and primary vs secondary grouping listed in the key terms.", "id": "st-76", "src": "stat"}, {"n": 77, "q": "Miqdoriy belgilar bo‘yicha guruhlashni tuzish tamoyillari.", "k": "guruhlash belgisini aniqlash, interval uzunligini aniqlash, guruhlarning quyi va yuqori chegaralarini aniqlash", "a": "<p>Miqdoriy belgi bo‘yicha guruhlash bir necha ketma-ket bosqichda tuziladi. 1) <b>Guruhlash belgisini aniqlash<\/b>: tadqiqot maqsadiga mos, hodisaning mohiyatini aks ettiruvchi muhim belgi tanlanadi (masalan, do‘konlarni tovar aylanmasi hajmi bo‘yicha). 2) Guruhlar soni to‘plam hajmi va belgi variatsiyasiga qarab yoki Sterdjess formulasi bo‘yicha belgilanadi: <b>k ≈ 1 + 3,322·lg n<\/b>. 3) <b>Interval uzunligini aniqlash<\/b>: belgi bir tekis taqsimlangan bo‘lsa teng intervallar olinadi — <b>h = (x<sub>max<\/sub> − x<sub>min<\/sub>)/k<\/b>; notekis taqsimotda o‘sib boruvchi yoki iqtisodiy asoslangan notekis intervallar qo‘llaniladi. 4) <b>Guruhlarning quyi va yuqori chegaralarini aniqlash<\/b>: birinchi guruhning quyi chegarasi x<sub>min<\/sub> (yoki unga yaqin yaxlit son), yuqori chegarasi = quyi chegara + h va hokazo; chegara qiymatiga teng birlik qaysi guruhga kirishi oldindan kelishib olinadi («...gacha» yoki «...dan ...gacha» qoidasi). Chetdagi kam sonli birliklar uchun ochiq intervallar («450 gacha», «650 va undan yuqori») ishlatilishi mumkin; har bir birlik faqat bitta guruhga tushishi va barcha birliklar qamrab olinishi shart.<\/p>", "t": "asos", "status": "fixed", "note": "Answer mixed in unrelated grouping types and did not explain choosing the grouping attribute or open/unequal intervals.", "id": "st-77", "src": "stat"}, {"n": 78, "q": "Statistik guruhlash yordamida yechiladigan iqtisodiy masalalar.", "k": "tipik guruhlash, tuzilmaviy guruhlash, analitik guruhlash, birlamchi guruhlash, ikkilamchi guruhlash", "a": "<p>Guruhlash yordamida uchta asosiy iqtisodiy masala yechiladi. Birinchisi — ijtimoiy-iqtisodiy turlarni ajratish; bunda <b>tipik (tipologik) guruhlash<\/b> qo‘llaniladi, masalan korxonalarni mulkchilik shakli (davlat, xususiy, xorijiy kapitalli) yoki tarmoq bo‘yicha ajratish. Ikkinchisi — hodisalar tarkibi va tarkibiy siljishlarni o‘rganish; bunda <b>tuzilmaviy guruhlash<\/b> ishlatiladi, masalan chakana tovar aylanmasini oziq-ovqat va nooziq-ovqat tovarlari bo‘yicha yoki ishchilarni ish haqi miqdori bo‘yicha taqsimlash. Uchinchisi — belgilar orasidagi bog‘lanishni aniqlash; bunda <b>analitik guruhlash<\/b> qo‘llaniladi: omil belgi bo‘yicha guruhlar tuzilib, har bir guruhda natija belgining o‘rtachasi hisoblanadi (masalan, savdo maydoni ortgan sari tovar aylanmasi qanday o‘zgarishi). <b>Birlamchi guruhlash<\/b> kuzatishning dastlabki ma’lumotlari asosida tuziladi, <b>ikkilamchi guruhlash<\/b> esa tayyor guruhlashni qayta guruhlab, turli davr yoki hududlar ma’lumotlarini taqqoslanadigan holga keltiradi.<\/p>", "t": "asos", "status": "fixed", "note": "Answer listed grouping types but did not describe the economic problems they solve or primary/secondary grouping.", "id": "st-78", "src": "stat"}, {"n": 79, "q": "Statistik guruhlash tasnifi va turlari.", "k": "guruhlashning maqsadi, vazifalari, ijtimoiy guruhlar bo‘yicha guruhlash, tipologik guruhlash, analitik guruhlash, tuzilmaviy guruhlash, oddiy guruhlash, murakkab guruhlash, birlamchi guruhlash, ikkilamchi guruhlash", "a": "<p>Guruhlashlar bir necha mezon bo‘yicha tasniflanadi. <b>Guruhlashning maqsadi va vazifalariga<\/b> ko‘ra: <b>tipologik guruhlash<\/b> (sifat turlarini ajratish, masalan aholini <b>ijtimoiy guruhlar bo‘yicha<\/b>), <b>tuzilmaviy guruhlash<\/b> (bir jinsli to‘plam tarkibini o‘rganish) va <b>analitik guruhlash<\/b> (omil va natija belgilari bog‘lanishini aniqlash). Guruhlash belgilari soniga ko‘ra: <b>oddiy guruhlash<\/b> — bitta belgi bo‘yicha, <b>murakkab guruhlash<\/b> — ikki va undan ortiq belgi bo‘yicha (kombinatsion va ko‘p o‘lchovli). Ma’lumotlar manbaiga ko‘ra: <b>birlamchi guruhlash<\/b> — kuzatish ma’lumotlari bo‘yicha, <b>ikkilamchi guruhlash<\/b> — avval guruhlangan ma’lumotlarni qayta guruhlash. Guruhlash belgisining turiga ko‘ra atributiv (sifat) va miqdoriy belgilar bo‘yicha guruhlashlar farqlanadi. Atributiv belgilar bo‘yicha rasmiy tasdiqlangan barqaror guruhlashlar <b>tasniflagichlar (klassifikatorlar)<\/b> deyiladi, masalan iqtisodiy faoliyat turlari yoki mahsulotlar tasniflagichi.<\/p>", "t": "asos", "status": "fixed", "note": "Answer omitted simple/complex and primary/secondary grouping and the classification criteria asked.", "id": "st-79", "src": "stat"}, {"n": 80, "q": "Statistik guruhlash usulining hodisa va jarayonlarni tahlil qilishdagi ahamiyati.", "k": "guruhlashning maqsadi, vazifalari, ijtimoiy-iqtisodiy belgilar bo‘yicha guruhlash, tipologik guruhlash, analitik guruhlash, tuzilmaviy guruhlash", "a": "<p>Guruhlash statistik tahlilning asosi hisoblanadi: u yalpi ma’lumotlarni tizimlashtirib, umumlashtiruvchi ko‘rsatkichlarni bir jinsli guruhlar bo‘yicha hisoblash imkonini beradi. <b>Guruhlashning maqsadi<\/b> — hodisa va jarayonlarning ichki tuzilishi va qonuniyatlarini ochib berish; bir jinsli bo‘lmagan to‘plam uchun hisoblangan umumiy o‘rtacha haqiqiy holatni yashirishi mumkin. Uning tahliliy <b>vazifalari<\/b>: <b>tipologik guruhlash<\/b> orqali ijtimoiy-iqtisodiy turlarni aniqlash; <b>tuzilmaviy guruhlash<\/b> orqali tarkib va tarkibiy siljishlarni kuzatish (masalan, savdoda xususiy sektor ulushining o‘sishi); <b>analitik guruhlash<\/b> orqali omillar ta’sirini o‘lchash. <b>Ijtimoiy-iqtisodiy belgilar bo‘yicha guruhlash<\/b> (daromad, ma’lumot, tarmoq, hudud) tengsizlik va hududiy tafovutlarni ko‘rsatadi. Guruhlash natijalari keyingi tahlil usullari — o‘rtachalar, variatsiya, dispersion va korrelyatsion tahlil uchun asos bo‘ladi.<\/p>", "t": "asos", "status": "fixed", "note": "Answer only listed grouping types and formulas; it did not explain the analytical importance asked.", "id": "st-80", "src": "stat"}, {"n": 81, "q": "Statistik ko‘rsatkichlarning mazmuni va ahamiyati.", "k": "miqdor, me’yor, iqtisodiy ko‘rsatkich, sifat va miqdorning bog‘liqligi, ob’ekt unsurlari, fazoviy chegaralar, son va o‘lchov birligi", "a": "<p><b>Statistik ko‘rsatkich<\/b> — ijtimoiy-iqtisodiy hodisaning aniq joy va vaqt sharoitidagi <b>miqdor<\/b> va sifat jihatlarini birgalikda ifodalovchi umumlashtiruvchi tavsif. Har bir <b>iqtisodiy ko‘rsatkich<\/b> ikki tomonga ega: sifat mazmuni (nimani o‘lchashi — hodisaning mohiyati) va miqdoriy qiymati; bu <b>sifat va miqdorning bog‘liqligi<\/b>ni ifodalaydi. Ko‘rsatkich to‘g‘ri tuzilishi uchun quyidagilar aniq belgilanadi: <b>ob’ekt unsurlari<\/b> (qaysi birliklar kiritiladi), <b>fazoviy chegaralar<\/b> (hudud), vaqt (sana yoki davr), <b>son va o‘lchov birligi<\/b> (natural, shartli-natural, qiymat yoki mehnat birliklari). Masalan, «2025-yilda Toshkent shahri bo‘yicha chakana tovar aylanmasi hajmi, mlrd so‘m» ko‘rsatkichida ob’ekt, hudud, vaqt va o‘lchov birligi aniq ko‘rsatilgan. <b>Me’yor<\/b> (norma) — rejalashtirilgan yoki ilmiy asoslangan daraja; haqiqiy ko‘rsatkichni me’yor bilan solishtirish orqali faoliyat baholanadi. Ko‘rsatkichlar hajmiy va sifat, mutlaq, nisbiy va o‘rtacha turlarga bo‘linadi; ular boshqaruv, rejalashtirish va nazorat uchun axborot asosidir.<\/p>", "t": "asos", "status": "rewritten", "note": "Answer was copied from Q9 (types of relative values) and was off-topic.", "id": "st-81", "src": "stat"}, {"n": 82, "q": "Statistik jadval turlari va ularni tuzish qoidalari.", "k": "jadval maketi, jadval egasi, jadval kesimi, oddiy, guruhiy, kombinatsion jadval", "a": "<p><b>Statistik jadval<\/b> — statistik ma’lumotlarni satr va ustunlarda tizimli, ko‘rgazmali ifodalash shakli. <b>Jadval egasi<\/b> — jadvalda tavsiflanayotgan ob’ekt (to‘plam, uning birliklari yoki guruhlari), odatda satrlarda joylashadi; <b>jadval kesimi<\/b> — egani tavsiflovchi ko‘rsatkichlar, odatda ustunlarda beriladi. <b>Jadval maketi<\/b> — raqamlar bilan to‘ldirilmagan, faqat nomi, satr va ustun sarlavhalari ko‘rsatilgan jadval skeleti; u kuzatishdan oldin jamlash dasturi sifatida tuziladi. Ega tuzilishiga ko‘ra turlari: <b>oddiy jadval<\/b> — egasida birliklar ro‘yxati, hududlar (hududiy) yoki davrlar (xronologik) beriladi, guruhlash yo‘q; <b>guruhiy jadval<\/b> — ega bitta belgi bo‘yicha guruhlangan; <b>kombinatsion jadval<\/b> — ega ikki va undan ortiq belgi bo‘yicha guruhlangan (guruhlar ichida kichik guruhlar). Tuzish qoidalari: jadval ixcham bo‘lishi, aniq nom (nima, qayerda, qachon), o‘lchov birliklari, jami satr va ustunlar bo‘lishi, ma’lumot bo‘lmasa «...», hodisa sodir bo‘lmagan bo‘lsa «–» belgisi qo‘yilishi va manba ko‘rsatilishi kerak.<\/p>", "t": "asos", "status": "fixed", "note": "Correct, but it lacked the table layout (maket) and the subtypes of simple tables.", "id": "st-82", "src": "stat"}, {"n": 83, "q": "Oddiy va kombinatsion jadvallarni tuzish.", "k": "jadval nomi, jadval tartib raqami, jadval egasi va kesimi, o‘lchov birliklari, davrlar, sanalar", "a": "<p>Har bir jadval <b>jadval tartib raqami<\/b> (1-jadval, 2-jadval …) va <b>jadval nomi<\/b>ga ega bo‘lishi kerak; nom qisqa va aniq bo‘lib, nima, qayerda va qachon haqida ekanini ko‘rsatadi (<b>davrlar<\/b> yoki <b>sanalar<\/b>, masalan «2025-yil 1-yanvar holatiga»). Avval <b>jadval egasi<\/b> (satrlar — o‘rganilayotgan ob’ekt) va <b>jadval kesimi<\/b> (ustunlar — ko‘rsatkichlar) aniqlanadi, ular uchun qisqa va tushunarli sarlavhalar yoziladi. <b>O‘lchov birliklari<\/b> barcha ko‘rsatkichlar uchun bir xil bo‘lsa jadval nomida, turlicha bo‘lsa har bir ustun yoki satr sarlavhasida ko‘rsatiladi. <b>Oddiy jadval<\/b>da ega guruhlanmaydi — unda birliklar, hududlar yoki davrlar ro‘yxati va jami satri beriladi. <b>Kombinatsion jadval<\/b>da ega ikki yoki undan ortiq belgi bo‘yicha guruhlanadi: har bir guruh ichida ikkinchi belgi bo‘yicha kichik guruhlar va oraliq jamilar ko‘rsatiladi; o‘qish qiyinlashmasligi uchun belgilar soni odatda uchtadan oshirilmaydi. Jadvaldagi ma’lumotlar bir xil aniqlikda yaxlitlanadi, jamilar tekshiriladi va manba ko‘rsatiladi.<\/p>", "t": "asos", "status": "fixed", "note": "Answer was identical to Q82 and did not cover numbering, title, units, periods/dates or how each table type is built.", "id": "st-83", "src": "stat"}, {"n": 84, "q": "Arifmetik o‘rtachaning xossalari va ulardan foydalanish.", "k": "to‘plam bir jinsliligi, o‘xshash birlik o‘rtachasini aniqlash, katta sonlar qonuniyati, “shartli moment” usuli", "a": "<p><b>Arifmetik o‘rtacha<\/b> (oddiy x̄ = Σx/n, tortilgan x̄ = Σxf/Σf) <b>o‘xshash birlik o‘rtachasini aniqlash<\/b> uchun, ya’ni to‘plamning tipik darajasi sifatida ishlatiladi. Asosiy xossalari: 1) o‘rtachadan chetlanishlar yig‘indisi nolga teng: <b>Σ(x − x̄)f = 0<\/b>; 2) o‘rtachadan chetlanishlar kvadratlari yig‘indisi eng kichik: <b>Σ(x − x̄)²f = min<\/b>; 3) har bir variantdan A ayirilsa (qo‘shilsa), o‘rtacha ham A ga kamayadi (ortadi); 4) variantlar k ga bo‘linsa (ko‘paytirilsa), o‘rtacha ham k marta kamayadi (ortadi); 5) barcha vaznlar bir xil songa ko‘paytirilsa yoki bo‘linsa, o‘rtacha o‘zgarmaydi. 3–5-xossalar asosida <b>«shartli moment» usuli<\/b> qurilgan: <b>x̄ = A + h·Σuf/Σf<\/b>, bunda u = (x − A)/h; bu hisoblashni soddalashtiradi. O‘rtacha faqat <b>to‘plam bir jinsliligi<\/b> sharoitida haqiqiy tipik darajani ifodalaydi; bir jinsli bo‘lmagan to‘plamda avval guruhlash zarur. O‘rtachaning barqarorligi <b>katta sonlar qonuniyati<\/b>ga asoslanadi: birliklar soni ko‘p bo‘lganda tasodifiy chetlanishlar o‘zaro so‘nib, o‘rtacha umumiy qonuniyatni aks ettiradi.<\/p>", "t": "ortacha", "status": "rewritten", "note": "Answer was copied from Q10 (types of averages) and did not state the properties of the arithmetic mean.", "id": "st-84", "src": "stat"}, {"n": 85, "q": "Arifmetik o‘rtachaning xossalaridan foydalanib, uni «shartli moment» usulida aniqlash.", "k": "o‘rtachaning matematik xossalari, teng intervalli guruhlangan qatorlar", "a": "<p><b>O‘rtachaning matematik xossalari<\/b>: barcha qiymatlarga a qo‘shilsa (ayirilsa), o‘rtacha ham a ga ortadi (kamayadi); qiymatlar c ga ko‘paytirilsa (bo‘linsa), o‘rtacha ham c marta o‘zgaradi; Σf(x − x̄) = 0. <b>Teng intervalli guruhlangan qatorlar<\/b> va katta sonlar bilan ishlaganda shu xossalarga asoslangan <b>shartli moment usuli<\/b> qo‘llaniladi: <b>u = (x − A)/h<\/b>, <b>x̄ = A + h·Σfu/Σf<\/b>, bunda A — shartli boshlang‘ich nuqta (odatda eng katta chastotali yoki qator o‘rtasidagi intervalning markazi), h — interval kengligi. m<sub>1<\/sub> = Σfu/Σf birinchi tartibli shartli moment deyiladi. Usul katta sonlar bilan hisoblashni kichik butun sonlarga keltirib, hisob-kitobni ancha yengillashtiradi.<\/p>", "t": "ortacha", "status": "ok", "note": "", "id": "st-85", "src": "stat"}, {"n": 86, "q": "O‘rtacha garmonik miqdorning mohiyati, shakllari va uni qo‘llash sharoitlari.", "k": "oddiy garmonik miqdor, tortilgan garmonik miqdor", "a": "<p><b>O‘rtacha garmonik<\/b> — belgi qiymatlariga teskari sonlar o‘rtacha arifmetigining teskari qiymati; u chastotalar (f) to‘g‘ridan-to‘g‘ri berilmagan, lekin belgi va chastota ko‘paytmasi W = x·f (umumiy hajm) ma’lum bo‘lgan hollarda qo‘llaniladi. <b>Tortilgan garmonik miqdor<\/b>: <b>x̄ = ΣW / Σ(W/x)<\/b>; masalan, bir nechta do‘konda tovar narxi (x) va sotuvdan tushum (W) ma’lum bo‘lsa, o‘rtacha narx = jami tushum / jami sotilgan miqdor = ΣW/Σ(W/x). <b>Oddiy garmonik miqdor<\/b>: <b>x̄ = n / Σ(1/x)<\/b>; u barcha W lar teng bo‘lganda ishlatiladi. Masalan, ikki ishchi bir xil vaqt ishlab, bir detalga biri 2, ikkinchisi 6 daqiqa sarflasa, o‘rtacha sarf = 2/(1/2 + 1/6) = 3 daqiqa (arifmetik o‘rtacha 4 daqiqa noto‘g‘ri bo‘lardi). Qaysi o‘rtacha qo‘llanishini o‘rtachaning mantiqiy formulasi hal qiladi: maxrajdagi miqdor noma’lum bo‘lsa — garmonik, suratdagi miqdor noma’lum bo‘lsa — arifmetik o‘rtacha olinadi.<\/p>", "t": "ortacha", "status": "rewritten", "note": "Answer was copied from Q10 and gave no formulas or conditions for the harmonic mean.", "id": "st-86", "src": "stat"}, {"n": 87, "q": "Moda va mediana hamda ularni hisoblash tartibi.", "k": "tuzilmaviy o‘rtachalar; ular o‘rtasidagi o‘xshashlik va tafovutlar, iqtisodiy mohiyati", "a": "<p><b>Moda (Mo)<\/b> va <b>mediana (Me)<\/b> — <b>tuzilmaviy o‘rtachalar<\/b>; ular qator tuzilishidagi o‘rni bo‘yicha aniqlanadi. Moda — to‘plamda eng ko‘p takrorlanadigan qiymat: diskret qatorda eng katta chastotali variant, interval qatorda <b>Mo = x<sub>0<\/sub> + h·(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / [(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)]<\/b>, bunda x<sub>0<\/sub> — modal intervalning quyi chegarasi. Mediana — tartiblangan qatorni teng ikkiga bo‘luvchi qiymat: n toq bo‘lsa (n+1)/2-o‘rindagi qiymat, juft bo‘lsa o‘rtadagi ikki qiymatning o‘rtachasi; interval qatorda <b>Me = x<sub>0<\/sub> + h·(Σf/2 − S<sub>Me−1<\/sub>) / f<sub>Me<\/sub><\/b>, S<sub>Me−1<\/sub> — mediana intervalidan oldingi jamlangan chastota. <b>O‘xshashligi<\/b>: ikkalasi ham to‘plamning markaziy (tipik) darajasini bildiradi va chetki qiymatlarga arifmetik o‘rtachadan kam sezgir. <b>Tafovuti<\/b>: moda eng keng tarqalgan qiymatni, mediana o‘rta pozitsiyani ko‘rsatadi; simmetrik taqsimotda x̄ = Me = Mo, assimetriyada ular farqlanadi. <b>Iqtisodiy mohiyati<\/b>: moda — eng ko‘p uchraydigan narx yoki eng talabgir o‘lcham; mediana — xodimlarning yarmi undan kam, yarmi undan ko‘p ish haqi oladigan daraja.<\/p>", "t": "ortacha", "status": "fixed", "note": "Formulas were correct, but similarities/differences and economic meaning (the key terms) were missing.", "id": "st-87", "src": "stat"}, {"n": 88, "q": "Dispersiyalarni qo‘shish qoidasi. Guruhlar ichidagi va guruhlararo dispersiyalar.", "k": "umumiy dispersiya, tafovut, omil belgi, guruhlash", "a": "<p>To‘plam omil belgi bo‘yicha <b>guruhlash<\/b>dan so‘ng natija belgisining variatsiyasini manbalarga ajratish mumkin. <b>Umumiy dispersiya<\/b> <b>σ² = Σ(x − x̄)²f / Σf<\/b> barcha omillar ta’siridagi variatsiyani o‘lchaydi. <b>Guruhlararo dispersiya<\/b> <b>δ² = Σ(x̄<sub>i<\/sub> − x̄)²n<sub>i<\/sub> / Σn<sub>i<\/sub><\/b> guruh o‘rtachalarining umumiy o‘rtachadan <b>tafovut<\/b>ini, ya’ni guruhlashga asos bo‘lgan <b>omil belgi<\/b> ta’sirida yuzaga kelgan variatsiyani ko‘rsatadi. <b>Guruhlar ichidagi dispersiya<\/b> σ<sub>i<\/sub>² = Σ(x − x̄<sub>i<\/sub>)²f / Σf har bir guruh ichidagi, hisobga olinmagan boshqa omillar ta’siridagi variatsiyani o‘lchaydi; ularning o‘rtachasi <b>σ̄² = Σσ<sub>i<\/sub>²n<sub>i<\/sub> / Σn<sub>i<\/sub><\/b>. <b>Dispersiyalarni qo‘shish qoidasi<\/b>: <b>σ² = δ² + σ̄²<\/b> (kvadratlar yig‘indisi shaklida SST = SSB + SSW). Bu qoidadan determinatsiya koeffitsienti <b>η² = δ²/σ²<\/b> va empirik korrelyatsion nisbat <b>η = √(δ²/σ²)<\/b> topiladi — ular omil belgining natijaga ta’siri ulushini va bog‘lanish zichligini bildiradi.<\/p>", "t": "ortacha", "status": "fixed", "note": "Correct, but it did not define the group variances or connect them to the factor attribute and η².", "id": "st-88", "src": "stat"}, {"n": 89, "q": "Tanlanma kuzatishning mohiyati va uni qo‘llash sabablari.", "k": "vaqt va mablag‘ni tejash, bosh to‘plamni tekshirish, to‘plamni chuqurroq o‘rganish, sifati buziladigan birliklar sonini kamaytirish", "a": "<p><b>Tanlanma kuzatish<\/b> — bosh to‘plamning tasodifiy tanlangan bir qismini o‘rganib, olingan natijalarni ehtimollar nazariyasiga asoslanib butun bosh to‘plamga tarqatish usuli. Uni qo‘llash sabablari: <b>vaqt va mablag‘ni tejash<\/b> — kam birlik o‘rganiladi va natija tezroq olinadi; <b>to‘plamni chuqurroq o‘rganish<\/b> — kam birlik bo‘yicha kengroq dastur va malakali kuzatuvchilarni qo‘llash mumkin, natijada qayd etish xatolari kamayadi. Mahsulot sifatini tekshirish uni yaroqsiz qiladigan hollarda (konserva, elektr lampa, gugurt sinovi) tanlanma yagona yo‘l bo‘lib, <b>sifati buziladigan birliklar sonini kamaytirish<\/b>ga imkon beradi. Shuningdek, tanlanma yoppasiga kuzatish natijalarini nazorat qilish, ya’ni <b>bosh to‘plamni tekshirish<\/b> uchun ham qo‘llaniladi (masalan, aholi ro‘yxatidan keyingi nazorat so‘rovi). Kamchiligi — reprezentativlik xatosi; u tasodifiy tanlash va yetarli tanlanma hajmi orqali nazorat qilinadi.<\/p>", "t": "tanlanma", "status": "fixed", "note": "Correct, but it missed the key term about using sampling to check full-coverage (census) results.", "id": "st-89", "src": "stat"}, {"n": 90, "q": "Reprezentativ tanlanma xatolari va ularni aniqlash usullari.", "k": "bosh va tanlanma to‘plam, dispersiya, o‘rtacha xato, ishonch koeffitsienti", "a": "<p><b>Reprezentativlik xatosi<\/b> — <b>tanlanma to‘plam<\/b> ko‘rsatkichi (x̄, w) bilan <b>bosh to‘plam<\/b> parametri (X̄, p) orasidagi farq. U muntazam (tanlash qoidalari buzilganda bir tomonga og‘uvchi) va tasodifiy (tanlash tasodifiy bo‘lgani uchun muqarrar) bo‘ladi; statistik usullar tasodifiy xatoni baholaydi. <b>O‘rtacha xato<\/b> tanlanma <b>dispersiya<\/b>si va hajmiga bog‘liq: takroriy tanlashda o‘rtacha uchun <b>μ = √(σ²/n)<\/b>, ulush uchun <b>μ = √(w(1 − w)/n)<\/b>; notakroriy tanlashda ildiz ostidagi ifoda (1 − n/N) ga ko‘paytiriladi. <b>Chegaraviy xato<\/b> <b>Δ = t·μ<\/b>, bunda t — <b>ishonch koeffitsienti<\/b>: t = 1 da ehtimol 0,683, t = 2 da 0,954, t = 3 da 0,997 (95% uchun t = 1,96). Bosh to‘plam o‘rtachasi x̄ − Δ ≤ X̄ ≤ x̄ + Δ, ulushi w − Δ ≤ p ≤ w + Δ oralig‘ida bo‘ladi. Xatoni kamaytirish uchun tanlanma hajmini oshirish, tasodifiy (ehtimolli) tanlash va to‘plamni tiplarga ajratib tanlash qo‘llaniladi.<\/p>", "t": "tanlanma", "status": "fixed", "note": "Correct, but it missed the error formula for a proportion, the confidence-coefficient values and systematic vs random error.", "id": "st-90", "src": "stat"}, {"n": 99, "q": "Bog‘liqlikning zichligini o‘rganish usullari.", "k": "G.B. Fexner koeffitsienti, K. Spirmen yoki ranglar koeffitsienti, korrelyatsiya koeffitsienti, determinatsiya koeffitsienti, korrelyatsion nisbat, Kendall koeffitsienti, assotsiatsiya koeffitsienti", "a": "<p>Bog‘lanish zichligi turli koeffitsientlar bilan o‘lchanadi. <b>G.B. Fexner koeffitsienti<\/b> (ishoralar koeffitsienti): <b>K = (C − H)/(C + H)<\/b>, C — x va y o‘rtachadan chetlanish ishoralari mos kelgan, H — mos kelmagan juftlar soni; sodda, taxminiy baho beradi. <b>K. Spirmen (ranglar) koeffitsienti<\/b>: <b>ρ = 1 − 6Σd²/[n(n² − 1)]<\/b>, d — x va y ranglari farqi; <b>Kendall koeffitsienti<\/b> ham ranglarga asoslanadi: <b>τ = 2S/[n(n − 1)]<\/b>, S = P − Q (tartibi mos va teskari juftlar sonlari farqi). Chiziqli bog‘lanishda Pirson <b>korrelyatsiya koeffitsienti<\/b> <b>r = (Σxy/n − x̄·ȳ)/(σ<sub>x<\/sub>·σ<sub>y<\/sub>)<\/b>, −1 ≤ r ≤ 1, ishlatiladi; uning kvadrati — <b>determinatsiya koeffitsienti<\/b> r² natija variatsiyasining omil bilan tushuntirilgan ulushini bildiradi. Har qanday shakldagi bog‘lanish uchun <b>korrelyatsion nisbat<\/b> <b>η = √(δ²/σ²)<\/b> (0 ≤ η ≤ 1) qo‘llaniladi. Ikki muqobil sifat belgisi uchun (2×2 jadval, kataklar a, b, c, d) <b>assotsiatsiya koeffitsienti<\/b> <b>K<sub>a<\/sub> = (ad − bc)/(ad + bc)<\/b> hisoblanadi; |K<sub>a<\/sub>| ≥ 0,5 bo‘lsa bog‘lanish mavjud deb hisoblanadi.<\/p>", "t": "boglanish", "status": "fixed", "note": "Fechner/Spearman were correct, but Kendall, Pearson r, determination coefficient, correlation ratio and association coefficient were missing.", "id": "st-99", "src": "stat"}, {"n": 100, "q": "Qaysi gipoteza — nol yoki muqobil gipoteza — tadqiqot gipotezasi hisoblanadi? Tadqiqot gipotezasi qanday aniqlanadi?", "k": "", "a": "<p><b>Nol gipoteza (H₀)<\/b> — mavjud holat (status quo), «farq yo‘q», «ta’sir yo‘q» degan taxmin; u doimo tenglik belgisini o‘z ichiga oladi (=, ≤ yoki ≥), masalan H₀: μ = 500 g. <b>Muqobil gipoteza (H₁)<\/b> — H₀ rad etilganda qabul qilinadigan, tadqiqotchi isbotlashga harakat qilayotgan taxmin (≠, &gt; yoki &lt;); shuning uchun <b>tadqiqot gipotezasi odatda muqobil gipoteza (H₁)<\/b> hisoblanadi. Tadqiqot gipotezasi tadqiqot savolidan kelib chiqib, ma’lumot yig‘ishdan oldin aniqlanadi: tasdiqlanishi kerak bo‘lgan da’vo (yangilik, farq, o‘sish) H₁ ga, unga zid mavjud holat esa H₀ ga yoziladi. Masalan, «yangi reklama sotuvni oshiradi» degan da’vo uchun H₀: μ ≤ μ₀, H₁: μ &gt; μ₀ (bir tomonlama test); yo‘nalish ko‘rsatilmasa (faqat «farq bor») ikki tomonlama H₁: μ ≠ μ₀ olinadi. Bunda H₀ ni noto‘g‘ri rad etish ehtimoli α bilan cheklanadi, ya’ni tadqiqot da’vosi faqat yetarli dalil bo‘lgandagina qabul qilinadi.<\/p>", "t": "gipoteza", "status": "fixed", "note": "Definitions were correct, but it never answered which one is the research hypothesis (H₁; H₀ is the status quo).", "id": "st-100", "src": "stat"}, {"n": 101, "q": "Muqobil gipoteza foydasiga nol gipotezani rad etish yoki qabul qilish to‘g‘risida qaror qabul qilish uchun gipoteza testining qaysi elementi qo‘llaniladi?", "k": "", "a": "<p>Gipoteza bo‘yicha qaror chiqarishda asosiy element — <b>test statistikasi<\/b> va undan topilgan <b>p-qiymat<\/b> (yoki <b>kritik soha<\/b>). p-qiymat usulida: agar <b>p ≤ α<\/b> bo‘lsa H₀ rad etiladi (H₁ foydasiga), <b>p &gt; α<\/b> bo‘lsa H₀ rad etilmaydi. Kritik qiymat usulida: test statistikasi kritik sohaga tushsa (masalan, ikki tomonlama testda |z| &gt; z<sub>kr<\/sub>) H₀ rad etiladi. «H₀ qabul qilinadi» deyishdan ko‘ra «H₀ ni rad etish uchun dalil yetarli emas» deyish ilmiy jihatdan to‘g‘ri.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-101", "src": "stat"}, {"n": 102, "q": "Gipotezani tekshirishda I va II turdagi xatolar o‘rtasidagi farq nima? α va β ning I va II turdagi xatolarga qanday aloqasi bor?", "k": "", "a": "<p><b>I tur xato<\/b> — aslida to‘g‘ri bo‘lgan H₀ ni rad etish; uning ehtimoli (maksimal qiymati) <b>α<\/b> — muhimlik darajasi bo‘lib, tadqiqotchi uni oldindan belgilaydi (0,05; 0,01). <b>II tur xato<\/b> — aslida noto‘g‘ri bo‘lgan H₀ ni rad etmaslik; uning ehtimoli <b>β<\/b>, testning quvvati esa <b>1 − β<\/b> (noto‘g‘ri H₀ ni to‘g‘ri rad etish ehtimoli). Tanlanma hajmi o‘zgarmasa, α ni kamaytirish β ni oshiradi va aksincha. Tanlanma hajmi n ni ko‘paytirish ikkala xatoni bir vaqtda kamaytirish va test quvvatini oshirish imkonini beradi.<\/p>", "t": "gipoteza", "status": "ok", "note": "", "id": "st-102", "src": "stat"}, {"n": 103, "q": "z-statistika va t-test statistikasining taqsimotlari qaysi jihatlari bilan bir xil? Ular qanday farq qiladi?", "k": "", "a": "<p><b>O‘xshashligi<\/b>: ikkala taqsimot ham 0 atrofida <b>simmetrik<\/b>, qo‘ng‘iroqsimon shaklga ega, o‘rtachasi 0; ular o‘rtacha (yoki o‘rtachalar farqi) haqidagi gipotezalarni tekshirish va ishonch oraliqlarini qurishda bir xil mantiqda ishlatiladi: statistika = (x̄ − μ₀)/standart xato. <b>Farqi<\/b>: z-statistika <b>z = (x̄ − μ₀)/(σ/√n)<\/b> bosh to‘plam standart chetlanishi σ <b>ma’lum<\/b> bo‘lganda (yoki n katta bo‘lganda) qo‘llanadi va standart normal N(0; 1) taqsimotga ega. t-statistika <b>t = (x̄ − μ₀)/(s/√n)<\/b> σ <b>noma’lum<\/b> bo‘lib, tanlanma s bilan almashtirilganda qo‘llanadi va <b>erkinlik darajasi df = n − 1<\/b> bo‘lgan Styudent taqsimotiga ega. t-taqsimotning «dumlari» qalinroq, dispersiyasi 1 dan katta (df/(df − 2)), shuning uchun kritik qiymatlari kattaroq: masalan, 95% ikki tomonlama uchun z = 1,96, df = 9 da esa t = 2,262. Erkinlik darajasi ortishi bilan t-taqsimot standart normal taqsimotga yaqinlashadi (n ≥ 30 da farq juda kichik); kichik tanlanmada t-test bosh to‘plam taxminan normal taqsimlanganligini talab qiladi.<\/p>", "status": "rewritten", "note": "Question 103 was merged into the text of Q102 and had no answer of its own.", "t": "gipoteza", "id": "st-103", "src": "stat"}], "tasks": [{"n": 1, "title": "Tashqi savdo: nisbiy miqdorlar", "cond": "<p>O‘zbekistonda tashqi savdo aylanmasi to‘g‘risida quyidagi ma’lumotlar mavjud (mlrd. AQSh dollari):<\/p><table><tr><th>Ko‘rsatkichlar<\/th><th>2023 yil<\/th><th>2025 yil<\/th><\/tr><tr><td>Eksport<\/td><td>20,6<\/td><td>33,8<\/td><\/tr><tr><td>Import<\/td><td>32,3<\/td><td>47,4<\/td><\/tr><tr><td>Tashqi savdo aylanmasi<\/td><td>52,9<\/td><td>81,2<\/td><\/tr><\/table><p>Dinamika, tuzilmaviy va koordinatsiya nisbiy miqdorlarini aniqlang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>1) Dinamika nisbiy miqdori: i = y<sub>2025<\/sub> / y<sub>2023<\/sub> · 100%<\/b><\/p><table><tr><th>Ko‘rsatkich<\/th><th>Hisob<\/th><th>Dinamika<\/th><th>O‘sish<\/th><\/tr><tr><td>Eksport<\/td><td>33,8 / 20,6 · 100<\/td><td>164,1%<\/td><td>+64,1%<\/td><\/tr><tr><td>Import<\/td><td>47,4 / 32,3 · 100<\/td><td>146,7%<\/td><td>+46,7%<\/td><\/tr><tr><td>Tashqi savdo aylanmasi<\/td><td>81,2 / 52,9 · 100<\/td><td>153,5%<\/td><td>+53,5%<\/td><\/tr><\/table><p><b>2) Tuzilma nisbiy miqdori: d = qism / jami · 100%<\/b><\/p><table><tr><th>Yil<\/th><th>Eksport ulushi<\/th><th>Import ulushi<\/th><th>Jami<\/th><\/tr><tr><td>2023<\/td><td>20,6 / 52,9 = 38,9%<\/td><td>32,3 / 52,9 = 61,1%<\/td><td>100,0%<\/td><\/tr><tr><td>2025<\/td><td>33,8 / 81,2 = 41,6%<\/td><td>47,4 / 81,2 = 58,4%<\/td><td>100,0%<\/td><\/tr><\/table><p><b>3) Koordinatsiya nisbiy miqdori (bir qismni ikkinchisiga nisbati)<\/b><\/p><table><tr><th>Yil<\/th><th>1 $ eksportga import, $<\/th><th>Eksportning importni qoplashi<\/th><th>Saldo (E − I), mlrd $<\/th><\/tr><tr><td>2023<\/td><td>32,3 / 20,6 = 1,57<\/td><td>20,6 / 32,3 · 100 = 63,8%<\/td><td>−11,7<\/td><\/tr><tr><td>2025<\/td><td>47,4 / 33,8 = 1,40<\/td><td>33,8 / 47,4 · 100 = 71,3%<\/td><td>−13,6<\/td><\/tr><\/table><p><b>Xulosa:<\/b> 2025-yilda 2023-yilga nisbatan eksport 164,1% ga (+64,1%), import 146,7% ga, tashqi savdo aylanmasi 153,5% ga teng bo‘ldi. Eksport importdan tezroq o‘sgani uchun eksport ulushi 38,9% dan 41,6% gacha oshdi, qoplash koeffitsienti 63,8% dan 71,3% ga ko‘tarildi. Biroq saldo manfiyligicha qolmoqda (−13,6 mlrd $).<\/p>", "ans": "Dinamika: eksport 164,1%, import 146,7%, aylanma 153,5%. Eksport ulushi 38,9% → 41,6%; eksportning importni qoplashi 63,8% → 71,3%; saldo manfiy (−13,6 mlrd $).", "t": "tashqi", "id": "stp-1", "src": "savdo"}, {"n": 2, "title": "Intervalli qator: o‘rtacha, moda, mediana", "cond": "<p>Savdo firmalarining oylik tovar aylanmasi hajmi bo‘yicha taqsimlanishi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Tovar aylanmasi, mln so‘m<\/th><th>450 gacha<\/th><th>450–500<\/th><th>500–550<\/th><th>550–600<\/th><th>600–650<\/th><th>650 va yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Firmalar soni<\/td><td>18<\/td><td>22<\/td><td>28<\/td><td>12<\/td><td>11<\/td><td>13<\/td><td>104<\/td><\/tr><\/table><p>Aniqlang: 1) bir firmaga to‘g‘ri keladigan o‘rtacha oylik tovar aylanmasi hajmini; 2) oylik tovar aylanmasi bo‘yicha moda va medianani; 3) muayyan taqsimotning xarakteri to‘g‘risida xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar qo‘shni interval kengligi (h = 50) bo‘yicha yopiladi: 400–450 va 650–700.<\/i><\/p><p><b>1) O‘rtacha (tortilgan arifmetik): x̄ = Σx·f / Σf, x — interval o‘rtasi<\/b><\/p><table><tr><th>Interval<\/th><th>x<\/th><th>f<\/th><th>x·f<\/th><th>Jamlangan f<\/th><\/tr><tr><td>450 gacha<\/td><td>425<\/td><td>18<\/td><td>7 650<\/td><td>18<\/td><\/tr><tr><td>450–500<\/td><td>475<\/td><td>22<\/td><td>10 450<\/td><td>40<\/td><\/tr><tr><td>500–550<\/td><td>525<\/td><td>28<\/td><td>14 700<\/td><td>68<\/td><\/tr><tr><td>550–600<\/td><td>575<\/td><td>12<\/td><td>6 900<\/td><td>80<\/td><\/tr><tr><td>600–650<\/td><td>625<\/td><td>11<\/td><td>6 875<\/td><td>91<\/td><\/tr><tr><td>650 va yuqori<\/td><td>675<\/td><td>13<\/td><td>8 775<\/td><td>104<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>104<\/th><th>55 350<\/th><th><\/th><\/tr><\/table><p>x̄ = 55 350 / 104 = <b>532,21 mln so‘m<\/b><\/p><p><b>2) Moda: Mo = x<sub>Mo<\/sub> + h · (f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / [(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)]<\/b><\/p><p>Modal interval 500–550 (eng katta f = 28). Mo = 500 + 50 · (28 − 22) / [(28 − 22) + (28 − 12)] = 500 + 50 · 6 / 22 = <b>513,64 mln so‘m<\/b><\/p><p><b>Mediana: Me = x<sub>Me<\/sub> + h · (Σf/2 − S<sub>Me−1<\/sub>) / f<sub>Me<\/sub><\/b><\/p><p>Σf/2 = 104 / 2 = 52. Jamlangan chastota 52 dan birinchi marta oshadigan interval — 500–550 (S = 68), oldingi jamlangan chastota S<sub>Me−1<\/sub> = 40.<\/p><p>Me = 500 + 50 · (52 − 40) / 28 = 500 + 50 · 12 / 28 = <b>521,43 mln so‘m<\/b><\/p><p><b>3) Taqsimot xarakteri<\/b><\/p><p>x̄ = 532,21 &gt; Me = 521,43 &gt; Mo = 513,64 — taqsimotda <b>o‘ng tomonga (musbat) asimmetriya<\/b> bor: yuqori aylanmali firmalar (650 va yuqori — 13 ta) o‘rtachani yuqoriga tortmoqda.<\/p><p><b>Xulosa:<\/b> bir firmaning o‘rtacha oylik tovar aylanmasi 532,21 mln so‘m; eng ko‘p uchraydigan qiymat 513,64 mln so‘m; firmalarning yarmi 521,43 mln so‘mdan kam, yarmi ko‘p savdo qiladi.<\/p>", "ans": "x̄ = 532,21 mln so‘m, Mo = 513,64 mln so‘m, Me = 521,43 mln so‘m. x̄ &gt; Me &gt; Mo bo‘lgani uchun taqsimot o‘ng tomonga (musbat) asimmetrik.", "t": "umumiy", "id": "stp-2", "src": "savdo"}, {"n": 3, "title": "O‘rtacha, moda, o‘rtacha kvadratik tafovut, variatsiya", "cond": "<p>Savdo firmalarining oylik tovar aylanmasi bo‘yicha taqsimlanishi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Tovar aylanmasi, mlrd so‘m<\/th><th>10 gacha<\/th><th>10–14<\/th><th>14–18<\/th><th>18–22<\/th><th>22–26<\/th><th>26 va yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Firmalar soni<\/td><td>20<\/td><td>26<\/td><td>20<\/td><td>14<\/td><td>10<\/td><td>10<\/td><td>100<\/td><\/tr><\/table><p>Aniqlang: a) o‘rtachani; b) modani; c) o‘rtacha kvadratik tafovutni; d) variatsiya (o‘zgaruvchanlik) koeffitsientini. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar h = 4 bo‘yicha yopiladi: 6–10 va 26–30.<\/i><\/p><table><tr><th>Interval<\/th><th>x<\/th><th>f<\/th><th>x·f<\/th><th>x − x̄<\/th><th>(x − x̄)²·f<\/th><\/tr><tr><td>10 gacha<\/td><td>8<\/td><td>20<\/td><td>160<\/td><td>−7,92<\/td><td>1 254,53<\/td><\/tr><tr><td>10–14<\/td><td>12<\/td><td>26<\/td><td>312<\/td><td>−3,92<\/td><td>399,53<\/td><\/tr><tr><td>14–18<\/td><td>16<\/td><td>20<\/td><td>320<\/td><td>0,08<\/td><td>0,13<\/td><\/tr><tr><td>18–22<\/td><td>20<\/td><td>14<\/td><td>280<\/td><td>4,08<\/td><td>233,05<\/td><\/tr><tr><td>22–26<\/td><td>24<\/td><td>10<\/td><td>240<\/td><td>8,08<\/td><td>652,86<\/td><\/tr><tr><td>26 va yuqori<\/td><td>28<\/td><td>10<\/td><td>280<\/td><td>12,08<\/td><td>1 459,26<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>100<\/th><th>1 592<\/th><th><\/th><th>3 999,36<\/th><\/tr><\/table><p><b>a) O‘rtacha: x̄ = Σx·f / Σf<\/b><\/p><p>x̄ = 1 592 / 100 = <b>15,92 mlrd so‘m<\/b><\/p><p><b>b) Moda<\/b><\/p><p>Modal interval 10–14 (f = 26). Mo = 10 + 4 · (26 − 20) / [(26 − 20) + (26 − 20)] = 10 + 4 · 6 / 12 = <b>12 mlrd so‘m<\/b><\/p><p><b>c) O‘rtacha kvadratik tafovut: σ = √[Σ(x − x̄)²·f / Σf]<\/b><\/p><p>σ² = 3 999,36 / 100 = 39,99; σ = √39,99 = <b>6,32 mlrd so‘m<\/b><\/p><p><b>d) Variatsiya koeffitsienti: V = σ / x̄ · 100%<\/b><\/p><p>V = 6,32 / 15,92 · 100 = <b>39,7%<\/b><\/p><p><b>Xulosa:<\/b> firmaning o‘rtacha oylik tovar aylanmasi 15,92 mlrd so‘m, eng ko‘p uchraydigan qiymat 12 mlrd so‘m. Firmalar o‘rtachadan o‘rtacha 6,32 mlrd so‘mga farq qiladi; V = 39,7% — 33% dan katta — to‘plam bir jinsli emas, o‘rtacha unchalik tipik emas.<\/p>", "ans": "x̄ = 15,92 mlrd so‘m, Mo = 12 mlrd so‘m, σ = 6,32 mlrd so‘m, V = 39,7% — to‘plam bir jinsli emas.", "t": "umumiy", "id": "stp-3", "src": "savdo"}, {"n": 4, "title": "Fizik hajm indekslari (bazisli va zanjirsimon)", "cond": "<p>Qandolatchilik bo‘limi bo‘yicha sotilgan mahsulotlar hajmi ma’lum:<\/p><table><tr><th>Mahsulot turi<\/th><th>Yanvar, kg<\/th><th>Fevral, kg<\/th><th>Mart, kg<\/th><th>Aprel, kg<\/th><th>1 kg uchun o‘zgarmas narx, ming so‘m<\/th><\/tr><tr><td>Parvarda<\/td><td>4 800<\/td><td>4 950<\/td><td>5 000<\/td><td>6 410<\/td><td>12,2<\/td><\/tr><tr><td>Konfetlar<\/td><td>6 450<\/td><td>7 110<\/td><td>8 100<\/td><td>9 000<\/td><td>34,5<\/td><\/tr><tr><td>Shokolad<\/td><td>1 400<\/td><td>1 600<\/td><td>1 750<\/td><td>1 500<\/td><td>49,6<\/td><\/tr><\/table><p>Yanvar–aprel oylari uchun qandolatchilik bo‘limida sotilgan mahsulotlar fizik hajmining bazisli va zanjirsimon indekslarini hisoblang. Indekslarni hisoblashda qaysi vaznlardan (o‘zgaruvchan va o‘zgarmas) foydalandingiz? Xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p><b>Formula: I<sub>q<\/sub> = Σq<sub>1<\/sub>p / Σq<sub>0<\/sub>p, bu yerda p — o‘zgarmas narx (vazn)<\/b><\/p><p>1) Har oy uchun o‘zgarmas narxlardagi sotuv qiymati Σq·p (ming so‘m):<\/p><table><tr><th>Mahsulot<\/th><th>Yanvar<\/th><th>Fevral<\/th><th>Mart<\/th><th>Aprel<\/th><\/tr><tr><td>Parvarda<\/td><td>58 560<\/td><td>60 390<\/td><td>61 000<\/td><td>78 202<\/td><\/tr><tr><td>Konfetlar<\/td><td>222 525<\/td><td>245 295<\/td><td>279 450<\/td><td>310 500<\/td><\/tr><tr><td>Shokolad<\/td><td>69 440<\/td><td>79 360<\/td><td>86 800<\/td><td>74 400<\/td><\/tr><tr><th>Σq·p<\/th><th>350 525<\/th><th>385 045<\/th><th>427 250<\/th><th>463 102<\/th><\/tr><\/table><p>2) Indekslar:<\/p><table><tr><th>Oy<\/th><th>Bazisli (Yanvarga nisbatan)<\/th><th>Zanjirsimon (oldingi oyga nisbatan)<\/th><\/tr><tr><td>Fevral<\/td><td>385 045 / 350 525 = 109,8%<\/td><td>385 045 / 350 525 = 109,8%<\/td><\/tr><tr><td>Mart<\/td><td>427 250 / 350 525 = 121,9%<\/td><td>427 250 / 385 045 = 111,0%<\/td><\/tr><tr><td>Aprel<\/td><td>463 102 / 350 525 = 132,1%<\/td><td>463 102 / 427 250 = 108,4%<\/td><\/tr><\/table><p>Tekshiruv: zanjirsimon indekslar ko‘paytmasi = 1,0985 · 1,1096 · 1,0839 = 132,1% = aprel bazisli indeksi (132,1%). Bu tenglik vaznlar o‘zgarmas bo‘lgani uchun bajariladi.<\/p><p><b>Vaznlar:<\/b> barcha indekslarda <b>o‘zgarmas vaznlar<\/b> — 1 kg uchun o‘zgarmas narxlar ishlatildi; shuning uchun bazisli va zanjirsimon indekslar o‘zaro bog‘langan.<\/p><p><b>Xulosa:<\/b> sotilgan mahsulotlarning fizik hajmi yanvarga nisbatan fevralda 109,8%, martda 121,9%, aprelda 132,1% ni tashkil etdi, ya’ni 4 oyda +32,1% ga oshdi. Har oy oldingi oyga nisbatan o‘sish bo‘ldi: +9,8%, +11,0%, +8,4%.<\/p>", "ans": "Bazisli: Fevral 109,8%, Mart 121,9%, Aprel 132,1%. Zanjirsimon: 109,8%, 111,0%, 108,4%. Vazn — o‘zgarmas narxlar, shu sabab zanjirsimonlar ko‘paytmasi bazisliga teng.", "t": "narx", "id": "stp-4", "src": "savdo"}, {"n": 5, "title": "Dinamika qatori: o‘rtacha daraja va analitik tekislash", "cond": "<p>Davlat zaxiralari fondining Jizzax viloyati filialida jami go‘sht mahsulotlari to‘g‘risida quyidagi ma’lumotlar keltirilgan:<\/p><table><tr><th>Yillar<\/th><th>Go‘sht mahsulotlari, ming tonna<\/th><th>Yillar<\/th><th>Go‘sht mahsulotlari, ming tonna<\/th><\/tr><tr><td>2020<\/td><td>181,8<\/td><td>2020<\/td><td>177,8<\/td><\/tr><tr><td>2021<\/td><td>173,8<\/td><td>2021<\/td><td>128,6<\/td><\/tr><tr><td>2022<\/td><td>184,2<\/td><td>2022<\/td><td>182,3<\/td><\/tr><tr><td>2023<\/td><td>167<\/td><td>2023<\/td><td>185,7<\/td><\/tr><tr><td>2024<\/td><td>172,4<\/td><td>2024<\/td><td>187,2<\/td><\/tr><tr><td>2025<\/td><td>175<\/td><td>2025<\/td><td>193,7<\/td><\/tr><\/table><p>Aniqlang: go‘sht mahsulotlarining umumiy holatini o‘rganish uchun: 1) qatorning o‘rtacha darajasini aniqlang; 2) qator hadlarini analitik tekislang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: jadvalda bir xil yillar uchun ikkita ustun berilgan — ular ikki variant deb qabul qilinib, har biri alohida yechildi.<\/i><\/p><h4>1-variant (chap ustun)<\/h4><p><b>1) Qatorning o‘rtacha darajasi (interval qator, o‘rtacha arifmetik): ȳ = Σy / n<\/b><\/p><p>ȳ = 1 054,20 / 6 = <b>175,70 ming tonna<\/b><\/p><p><b>2) Analitik tekislash (to‘g‘ri chiziqli trend ŷ = a + b·t, eng kichik kvadratlar usuli)<\/b><\/p><table><tr><th>Yil<\/th><th>y<\/th><th>t<\/th><th>t²<\/th><th>y·t<\/th><th>ŷ<\/th><\/tr><tr><td>2020<\/td><td>181,8<\/td><td>−5<\/td><td>25<\/td><td>−909<\/td><td>179,66<\/td><\/tr><tr><td>2021<\/td><td>173,8<\/td><td>−3<\/td><td>9<\/td><td>−521,40<\/td><td>178,07<\/td><\/tr><tr><td>2022<\/td><td>184,2<\/td><td>−1<\/td><td>1<\/td><td>−184,20<\/td><td>176,49<\/td><\/tr><tr><td>2023<\/td><td>167<\/td><td>+1<\/td><td>1<\/td><td>167<\/td><td>174,91<\/td><\/tr><tr><td>2024<\/td><td>172,4<\/td><td>+3<\/td><td>9<\/td><td>517,20<\/td><td>173,33<\/td><\/tr><tr><td>2025<\/td><td>175<\/td><td>+5<\/td><td>25<\/td><td>875<\/td><td>171,74<\/td><\/tr><tr><th>Jami<\/th><th>1 054,20<\/th><th>0<\/th><th>70<\/th><th>−55,40<\/th><th>1 054,20<\/th><\/tr><\/table><p>Shartli vaqt: t = −5, −3, −1, +1, +3, +5 (juft sonli qator, qadam 2), Σt = 0 bo‘lgani uchun: a = Σy / n, b = Σy·t / Σt².<\/p><p>a = 1 054,20 / 6 = <b>175,70<\/b>; b = −55,40 / 70 = <b>−0,79<\/b><\/p><p>Trend tenglamasi: <b>ŷ = 175,70 − 0,79·t<\/b>. Tekshiruv: Σŷ = Σy = 1 054,20.<\/p><p><b>Xulosa:<\/b> o‘rtacha daraja 175,70 ming tonna. Trend tenglamasining b = −0,79 (t qadami 2 bo‘lgani uchun yillik o‘zgarish 2b = −1,58 ming tonna) — umumiy tendensiya: sekin pasayish.<\/p><h4>2-variant (o‘ng ustun)<\/h4><p><b>1) Qatorning o‘rtacha darajasi (interval qator, o‘rtacha arifmetik): ȳ = Σy / n<\/b><\/p><p>ȳ = 1 055,30 / 6 = <b>175,88 ming tonna<\/b><\/p><p><b>2) Analitik tekislash (to‘g‘ri chiziqli trend ŷ = a + b·t, eng kichik kvadratlar usuli)<\/b><\/p><table><tr><th>Yil<\/th><th>y<\/th><th>t<\/th><th>t²<\/th><th>y·t<\/th><th>ŷ<\/th><\/tr><tr><td>2020<\/td><td>177,8<\/td><td>−5<\/td><td>25<\/td><td>−889<\/td><td>157,40<\/td><\/tr><tr><td>2021<\/td><td>128,6<\/td><td>−3<\/td><td>9<\/td><td>−385,80<\/td><td>164,80<\/td><\/tr><tr><td>2022<\/td><td>182,3<\/td><td>−1<\/td><td>1<\/td><td>−182,30<\/td><td>172,19<\/td><\/tr><tr><td>2023<\/td><td>185,7<\/td><td>+1<\/td><td>1<\/td><td>185,70<\/td><td>179,58<\/td><\/tr><tr><td>2024<\/td><td>187,2<\/td><td>+3<\/td><td>9<\/td><td>561,60<\/td><td>186,97<\/td><\/tr><tr><td>2025<\/td><td>193,7<\/td><td>+5<\/td><td>25<\/td><td>968,50<\/td><td>194,36<\/td><\/tr><tr><th>Jami<\/th><th>1 055,30<\/th><th>0<\/th><th>70<\/th><th>258,70<\/th><th>1 055,30<\/th><\/tr><\/table><p>Shartli vaqt: t = −5, −3, −1, +1, +3, +5 (juft sonli qator, qadam 2), Σt = 0 bo‘lgani uchun: a = Σy / n, b = Σy·t / Σt².<\/p><p>a = 1 055,30 / 6 = <b>175,88<\/b>; b = 258,70 / 70 = <b>3,70<\/b><\/p><p>Trend tenglamasi: <b>ŷ = 175,88 + 3,70·t<\/b>. Tekshiruv: Σŷ = Σy = 1 055,30.<\/p><p><b>Xulosa:<\/b> o‘rtacha daraja 175,88 ming tonna. Trend tenglamasining b = 3,70 (t qadami 2 bo‘lgani uchun yillik o‘zgarish 2b = 7,40 ming tonna) — umumiy tendensiya: o‘sish.<\/p><p><i>Izoh: agar ma’lumotlar sanadagi zaxira qoldig‘i (moment qatori) deb qaralsa, o‘rtacha daraja xronologik o‘rtacha bilan topiladi: ȳ = (y₁/2 + y₂ + … + y<sub>n−1<\/sub> + y<sub>n<\/sub>/2) / (n − 1); 1-variant: 175,16, 2-variant: 173,91 ming tonna.<\/i><\/p>", "ans": "1-variant: ȳ = 175,70 ming tonna; ŷ = 175,70 − 0,79t (yiliga −1,58 ming tonna). 2-variant: ȳ = 175,88 ming tonna; ŷ = 175,88 + 3,70t (yiliga +7,40 ming tonna).", "t": "umumiy", "id": "stp-5", "src": "savdo"}, {"n": 6, "title": "Tovar aylanmasi, narx va fizik hajm indekslari", "cond": "<p>Oziq-ovqat do‘koni bo‘yicha quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Mahsulot turlari<\/th><th>Kunlik tovar aylanmasi, bazis davr, mln so‘m<\/th><th>Kunlik tovar aylanmasi, joriy davr, mln so‘m<\/th><th>Joriy davrda bazis davrga nisbatan narx o‘zgarishi, %<\/th><\/tr><tr><td>Go‘sht<\/td><td>32,8<\/td><td>36,6<\/td><td>+15,5<\/td><\/tr><tr><td>Kolbasa<\/td><td>107,2<\/td><td>113,5<\/td><td>+8,7<\/td><\/tr><\/table><p>Aniqlang: 1. Tovar aylanmasi hajmi umumiy indeksini. 2. Bahoning umumiy indeksini. 3. Umumiy fizik hajm indeksini. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p>Individual narx indekslari: i<sub>p<\/sub>(go‘sht) = 1 + 15,5/100 = 1,155; i<sub>p<\/sub>(kolbasa) = 1 + 8,7/100 = 1,087.<\/p><table><tr><th>Mahsulot<\/th><th>p₀q₀<\/th><th>p₁q₁<\/th><th>i<sub>p<\/sub><\/th><th>p₁q₁ / i<sub>p<\/sub> = p₀q₁<\/th><\/tr><tr><td>Go‘sht<\/td><td>32,8<\/td><td>36,6<\/td><td>1,155<\/td><td>36,6 / 1,155 = 31,69<\/td><\/tr><tr><td>Kolbasa<\/td><td>107,2<\/td><td>113,5<\/td><td>1,087<\/td><td>113,5 / 1,087 = 104,42<\/td><\/tr><tr><th>Jami<\/th><th>140<\/th><th>150,1<\/th><th><\/th><th>136,10<\/th><\/tr><\/table><p><b>1) Tovar aylanmasi (qiymat) umumiy indeksi: I<sub>pq<\/sub> = Σp₁q₁ / Σp₀q₀<\/b><\/p><p>I<sub>pq<\/sub> = 150,1 / 140 = 1,0721 = <b>107,2%<\/b>; mutlaq o‘zgarish: 150,1 − 140 = +10,10 mln so‘m<\/p><p><b>2) Narx umumiy indeksi (o‘rtacha garmonik shakl, Paashe): I<sub>p<\/sub> = Σp₁q₁ / Σ(p₁q₁ / i<sub>p<\/sub>)<\/b><\/p><p>I<sub>p<\/sub> = 150,1 / 136,10 = 1,1028 = <b>110,3%<\/b>; narx hisobiga o‘zgarish: 150,1 − 136,10 = +14,00 mln so‘m<\/p><p><b>3) Fizik hajm umumiy indeksi: I<sub>q<\/sub> = I<sub>pq<\/sub> / I<sub>p<\/sub> (yoki Σp₀q₁ / Σp₀q₀)<\/b><\/p><p>I<sub>q<\/sub> = 1,0721 / 1,1028 = 136,10 / 140 = <b>97,2%<\/b>; hajm hisobiga o‘zgarish: 136,10 − 140 = −3,90 mln so‘m<\/p><p>Tekshiruv: +14,00 + (−3,90) = +10,10 mln so‘m.<\/p><p><b>Xulosa:<\/b> kunlik tovar aylanmasi 107,2% ga teng bo‘lib, +10,10 mln so‘mga oshdi. Bu o‘sish to‘liq narxlar hisobiga (narxlar o‘rtacha +10,3%, +14,00 mln so‘m); sotilgan tovarlarning fizik hajmi esa 2,8% ga kamaydi (−3,90 mln so‘m).<\/p>", "ans": "I<sub>pq<\/sub> = 107,2% (+10,10 mln so‘m), I<sub>p<\/sub> = 110,3% (+14,00 mln so‘m), I<sub>q<\/sub> = 97,2% (−3,90 mln so‘m): aylanma faqat narx o‘sishi hisobiga ko‘paygan, fizik hajm kamaygan.", "t": "narx", "id": "stp-6", "src": "savdo"}, {"n": 7, "title": "O‘rtacha tannarx (tortilgan o‘rtacha arifmetik)", "cond": "<p>Savdo tashkilotiga tovar yetkazib beruvchi korxonada ishlab chiqariladigan A nomli mahsulotning tannarxi va uning hajmi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Sexlar<\/th><th>1-sex: tannarx, ming so‘m/dona<\/th><th>1-sex: ishlab chiqarilgan, dona<\/th><th>2-sex: tannarx, ming so‘m/dona<\/th><th>2-sex: ishlab chiqarilgan, dona<\/th><\/tr><tr><td>1<\/td><td>55<\/td><td>1 200<\/td><td>54<\/td><td>1 250<\/td><\/tr><tr><td>2<\/td><td>52<\/td><td>1 300<\/td><td>51<\/td><td>1 325<\/td><\/tr><tr><td>3<\/td><td>50<\/td><td>1 000<\/td><td>53<\/td><td>1 410<\/td><\/tr><\/table><p>Aniqlang: 1) har bir sex bo‘yicha tannarxning o‘rtacha darajasini; 2) 1-sex tannarxining o‘rtacha darajasini 2-sexga nisbatini aniqlang. Xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: jadvaldagi 1, 2, 3 qatorlar har bir sex ichidagi uchta partiya (davr) deb qabul qilindi.<\/i><\/p><p><b>1) O‘rtacha tannarx — tortilgan o‘rtacha arifmetik: x̄ = Σx·f / Σf (x — tannarx, f — dona)<\/b><\/p><p>1-sex: x̄ = (55·1 200 + 52·1 300 + 50·1 000) / (1 200 + 1 300 + 1 000) = 183 600 / 3 500 = <b>52,46 ming so‘m/dona<\/b><\/p><p>2-sex: x̄ = (54·1 250 + 51·1 325 + 53·1 410) / (1 250 + 1 325 + 1 410) = 209 805 / 3 985 = <b>52,65 ming so‘m/dona<\/b><\/p><p><b>2) Taqqoslash nisbiy miqdori: 1-sex x̄ / 2-sex x̄ · 100%<\/b><\/p><p>52,46 / 52,65 · 100 = <b>99,6%<\/b> (farq −0,19 ming so‘m)<\/p><p><b>Xulosa:<\/b> 1-sexda bir dona mahsulotning o‘rtacha tannarxi 52,46 ming so‘m, 2-sexda 52,65 ming so‘m. 1-sex tannarxi 2-sexnikidan 0,4% ga (0,19 ming so‘m) past, ya’ni 1-sex biroz samaraliroq ishlaydi.<\/p>", "ans": "O‘rtacha tannarx: 1-sex 52,46, 2-sex 52,65 ming so‘m/dona; nisbat 99,6% — 1-sexda tannarx 0,4% ga past.", "t": "umumiy", "id": "stp-7", "src": "savdo"}, {"n": 8, "title": "O‘rtacha tovar zaxirasi (xronologik o‘rtacha)", "cond": "<p>Chakana savdo tashkilotidagi tovar zaxiralarining qiymati quyidagilarni tashkil etdi, mlrd so‘m:<\/p><table><tr><th>Sana<\/th><th>1.01<\/th><th>1.02<\/th><th>1.03<\/th><th>1.04<\/th><\/tr><tr><td>Zaxira<\/td><td>125<\/td><td>137<\/td><td>112<\/td><td>153<\/td><\/tr><\/table><p>Har bir oy uchun hamda birinchi chorak uchun tovar zaxiralarining o‘rtacha qiymatini aniqlang.<\/p>", "cond_raw": "", "sol": "<p>Bu moment qatori (zaxira sana holatiga), shuning uchun o‘rtacha xronologik o‘rtacha bilan topiladi.<\/p><p><b>1) Har oy uchun: z̄ = (z<sub>boshi<\/sub> + z<sub>oxiri<\/sub>) / 2<\/b><\/p><table><tr><th>Oy<\/th><th>Hisob<\/th><th>O‘rtacha zaxira, mlrd so‘m<\/th><\/tr><tr><td>Yanvar<\/td><td>(125 + 137) / 2<\/td><td>131<\/td><\/tr><tr><td>Fevral<\/td><td>(137 + 112) / 2<\/td><td>124,50<\/td><\/tr><tr><td>Mart<\/td><td>(112 + 153) / 2<\/td><td>132,50<\/td><\/tr><\/table><p><b>2) I chorak uchun — xronologik o‘rtacha: z̄ = (z₁/2 + z₂ + z₃ + z₄/2) / (n − 1)<\/b><\/p><p>z̄ = (125/2 + 137 + 112 + 153/2) / (4 − 1) = (62,5 + 137 + 112 + 76,5) / 3 = 388 / 3 = <b>129,33 mlrd so‘m<\/b><\/p><p>Tekshiruv: oylik o‘rtachalarning o‘rtachasi (131 + 124,50 + 132,50) / 3 = 129,33.<\/p><p><b>Xulosa:<\/b> o‘rtacha zaxira yanvarda 131, fevralda 124,50, martda 132,50 mlrd so‘m; I chorakda 129,33 mlrd so‘m. Eng past zaxira fevralda, martda zaxira oshgan.<\/p>", "ans": "Yanvar 131, fevral 124,50, mart 132,50 mlrd so‘m; I chorak (xronologik o‘rtacha) 129,33 mlrd so‘m.", "t": "zaxira", "id": "stp-8", "src": "savdo"}, {"n": 9, "title": "Tovar zaxirasining aylanishi", "cond": "<p>Oziq-ovqat do‘koni (savdo korxonasi) bo‘yicha ma’lumotlar:<\/p><table><tr><th>Ko‘rsatkich<\/th><th>mln so‘m<\/th><\/tr><tr><td>Yil boshidagi tovar zaxirasi<\/td><td>170<\/td><\/tr><tr><td>Yil oxiridagi tovar zaxirasi<\/td><td>220<\/td><\/tr><tr><td>Yillik chakana tovar aylanmasi<\/td><td>4 250<\/td><\/tr><\/table><ol><li>O‘rtacha tovar zaxirasini aniqlang.<\/li><li>Tovar zaxirasining aylanish koeffitsiyentini hisoblang.<\/li><li>Bir kunlik o‘rtacha savdo hajmini aniqlang.<\/li><li>Tovar zaxirasi necha kunlik savdoni ta’minlashini hisoblang.<\/li><\/ol>", "cond_raw": "", "sol": "<p><i>Izoh: savdo statistikasida yil = 360 kun deb olinadi (chorak 90, oy 30 kun).<\/i><\/p><p><b>1) O‘rtacha tovar zaxirasi: z̄ = (z<sub>boshi<\/sub> + z<sub>oxiri<\/sub>) / 2<\/b><\/p><p>z̄ = (170 + 220) / 2 = <b>195 mln so‘m<\/b><\/p><p><b>2) Aylanish koeffitsienti (aylanishlar soni): K = T / z̄<\/b><\/p><p>K = 4 250 / 195 = <b>21,79 marta<\/b><\/p><p><b>3) Bir kunlik o‘rtacha tovar aylanmasi: m = T / D<\/b><\/p><p>m = 4 250 / 360 = <b>11,81 mln so‘m<\/b><\/p><p><b>4) Bir aylanish davomiyligi (zaxira necha kunlik savdoga yetadi): t = z̄ / m = D / K<\/b><\/p><p>t = 195 / 11,81 = 360 / 21,79 = <b>16,52 kun<\/b><\/p><p><b>Xulosa:<\/b> o‘rtacha zaxira 195 mln so‘m yil davomida 21,79 marta aylangan; kuniga o‘rtacha 11,81 mln so‘mlik tovar sotiladi va zaxira taxminan 16,52 kunlik savdoni ta’minlaydi.<\/p>", "ans": "z̄ = 195 mln so‘m, K = 21,79 marta, m = 11,81 mln so‘m/kun, t = 16,52 kun.", "t": "zaxira", "id": "stp-9", "src": "savdo"}, {"n": 10, "title": "Tovar zaxirasining aylanishi", "cond": "<p>Kiyim-kechak do‘koni (savdo korxonasi) bo‘yicha ma’lumotlar:<\/p><table><tr><th>Ko‘rsatkich<\/th><th>mln so‘m<\/th><\/tr><tr><td>Yil boshidagi tovar zaxirasi<\/td><td>265<\/td><\/tr><tr><td>Yil oxiridagi tovar zaxirasi<\/td><td>325<\/td><\/tr><tr><td>Yillik chakana tovar aylanmasi<\/td><td>5 630<\/td><\/tr><\/table><ol><li>O‘rtacha yillik tovar zaxirasini aniqlang.<\/li><li>Tovar zaxirasining aylanish koeffitsiyentini hisoblang.<\/li><li>Bir kunlik tovar aylanmasini aniqlang.<\/li><li>O‘rtacha zaxiraning necha kunlik savdoga tengligini hisoblang.<\/li><li>Tovar zaxirasi yil davomida necha marta aylanganini izohlang.<\/li><\/ol>", "cond_raw": "", "sol": "<p><i>Izoh: savdo statistikasida yil = 360 kun deb olinadi (chorak 90, oy 30 kun).<\/i><\/p><p><b>1) O‘rtacha tovar zaxirasi: z̄ = (z<sub>boshi<\/sub> + z<sub>oxiri<\/sub>) / 2<\/b><\/p><p>z̄ = (265 + 325) / 2 = <b>295 mln so‘m<\/b><\/p><p><b>2) Aylanish koeffitsienti (aylanishlar soni): K = T / z̄<\/b><\/p><p>K = 5 630 / 295 = <b>19,08 marta<\/b><\/p><p><b>3) Bir kunlik o‘rtacha tovar aylanmasi: m = T / D<\/b><\/p><p>m = 5 630 / 360 = <b>15,64 mln so‘m<\/b><\/p><p><b>4) Bir aylanish davomiyligi (zaxira necha kunlik savdoga yetadi): t = z̄ / m = D / K<\/b><\/p><p>t = 295 / 15,64 = 360 / 19,08 = <b>18,86 kun<\/b><\/p><p><b>5) Izoh<\/b><\/p><p>K = 19,08 — o‘rtacha zaxira hajmidagi tovar yil davomida taxminan 19,08 marta to‘liq sotilib, qayta to‘ldirilgan; har bir aylanish o‘rtacha 18,86 kun davom etgan.<\/p><p><b>Xulosa:<\/b> z̄ = 295 mln so‘m, K = 19,08 marta, m = 15,64 mln so‘m, t = 18,86 kun. Kiyim-kechak sekin aylanadigan tovar bo‘lgani uchun aylanish davri oziq-ovqatga nisbatan uzunroq.<\/p>", "ans": "z̄ = 295 mln so‘m, K = 19,08 marta, m = 15,64 mln so‘m/kun, zaxira 18,86 kunlik savdoga teng; yilda ≈19,08 marta aylangan.", "t": "zaxira", "id": "stp-10", "src": "savdo"}, {"n": 11, "title": "Tovar zaxirasining aylanishi va kerakli zaxira", "cond": "<p>Maishiy texnika savdo korxonasida (yillik tovar aylanmasi):<\/p><table><tr><th>Ko‘rsatkich<\/th><th>mln so‘m<\/th><\/tr><tr><td>Yil boshidagi tovar zaxirasi<\/td><td>445<\/td><\/tr><tr><td>Yil oxiridagi tovar zaxirasi<\/td><td>625<\/td><\/tr><tr><td>Yillik chakana tovar aylanmasi<\/td><td>9 850<\/td><\/tr><\/table><ol><li>O‘rtacha tovar zaxirasini aniqlang.<\/li><li>Tovar zaxirasining aylanish koeffitsiyentini aniqlang.<\/li><li>Bir kunlik o‘rtacha savdo hajmini hisoblang.<\/li><li>Tovar zaxirasining aylanish davrini kunlarda aniqlang.<\/li><li>Natijani iqtisodiy jihatdan izohlang.<\/li><\/ol><p>Agar korxona kelgusi yilda tovar aylanmasini o‘zgartirmagan holda zaxiraning aylanish davrini 20 kungacha qisqartirsa, o‘rtacha zaxira qanday bo‘lishi kerak?<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: savdo statistikasida yil = 360 kun deb olinadi (chorak 90, oy 30 kun).<\/i><\/p><p><b>1) O‘rtacha tovar zaxirasi: z̄ = (z<sub>boshi<\/sub> + z<sub>oxiri<\/sub>) / 2<\/b><\/p><p>z̄ = (445 + 625) / 2 = <b>535 mln so‘m<\/b><\/p><p><b>2) Aylanish koeffitsienti (aylanishlar soni): K = T / z̄<\/b><\/p><p>K = 9 850 / 535 = <b>18,41 marta<\/b><\/p><p><b>3) Bir kunlik o‘rtacha tovar aylanmasi: m = T / D<\/b><\/p><p>m = 9 850 / 360 = <b>27,36 mln so‘m<\/b><\/p><p><b>4) Bir aylanish davomiyligi (zaxira necha kunlik savdoga yetadi): t = z̄ / m = D / K<\/b><\/p><p>t = 535 / 27,36 = 360 / 18,41 = <b>19,55 kun<\/b><\/p><p><b>5) Iqtisodiy izoh<\/b><\/p><p>Zaxira yilda 18,41 marta aylanadi, bir aylanish 19,55 kun. Zaxira ≈19,55 kunlik savdoga yetadi.<\/p><p><b>Qo‘shimcha savol: aylanish davri t = 20 kun bo‘lsa, z̄ = m · t<\/b><\/p><p>z̄ = 27,36 · 20 = <b>547,22 mln so‘m<\/b> (aylanish koeffitsienti 360 / 20 = 18 marta).<\/p><p><i>Izoh: hozirgi aylanish davri (19,55 kun) allaqachon 20 kundan qisqa; shuning uchun 20 kunlik davrda o‘rtacha zaxira 547,22 mln so‘m bo‘lishi mumkin, bu hozirgidan 12,22 mln so‘mga ko‘p. Agar yil 365 kun deb olinsa: m = 26,99, t = 19,82 kun, kerakli zaxira 539,73 mln so‘m.<\/i><\/p><p><b>Xulosa:<\/b> z̄ = 535 mln so‘m, K = 18,41, m = 27,36 mln so‘m, t = 19,55 kun; 20 kunlik aylanish uchun o‘rtacha zaxira 547,22 mln so‘m.<\/p>", "ans": "z̄ = 535 mln so‘m, K = 18,41 marta, m = 27,36 mln so‘m/kun, t = 19,55 kun; t = 20 kun uchun z̄ = 547,22 mln so‘m (hozirgi davr allaqachon 20 kundan qisqa).", "t": "zaxira", "id": "stp-11", "src": "savdo"}, {"n": 12, "title": "Ikki korxona zaxira aylanishini taqqoslash", "cond": "<p>A va B savdo korxonalarining faoliyati bo‘yicha quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Ko‘rsatkich<\/th><th>A korxona<\/th><th>B korxona<\/th><\/tr><tr><td>Yil boshidagi zaxira, mln so‘m<\/td><td>225<\/td><td>215<\/td><\/tr><tr><td>Yil oxiridagi zaxira, mln so‘m<\/td><td>335<\/td><td>345<\/td><\/tr><tr><td>Yillik tovar aylanmasi, mln so‘m<\/td><td>3 750<\/td><td>5 350<\/td><\/tr><\/table><p>Har bir korxona uchun: 1. O‘rtacha tovar zaxirasini; 2. Aylanish koeffitsiyentini; 3. Bir kunlik tovar aylanmasini; 4. Zaxiraning aylanish davrini kunlarda hisoblang. So‘ngra: 5. Ikki korxonaning natijalarini taqqoslang. 6. Qaysi korxonada zaxira necha kunlik savdoni ta’minlayotganini aniqlang. Aylanish koeffitsiyentlari o‘rtasidagi farqni aniqlang.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: savdo statistikasida yil = 360 kun deb olinadi (chorak 90, oy 30 kun).<\/i><\/p><p>Formulalar: z̄ = (z<sub>boshi<\/sub> + z<sub>oxiri<\/sub>)/2; K = T / z̄; m = T / 360; t = z̄ / m = 360 / K.<\/p><table><tr><th>Ko‘rsatkich<\/th><th>A korxona<\/th><th>B korxona<\/th><\/tr><tr><td>1) z̄, mln so‘m<\/td><td>(225 + 335)/2 = 280<\/td><td>(215 + 345)/2 = 280<\/td><\/tr><tr><td>2) K, marta<\/td><td>3 750 / 280 = 13,39<\/td><td>5 350 / 280 = 19,11<\/td><\/tr><tr><td>3) m, mln so‘m/kun<\/td><td>3 750 / 360 = 10,42<\/td><td>5 350 / 360 = 14,86<\/td><\/tr><tr><td>4) t, kun<\/td><td>280 / 10,42 = 26,88<\/td><td>280 / 14,86 = 18,84<\/td><\/tr><\/table><p><b>5–6) Taqqoslash<\/b><\/p><p>O‘rtacha zaxira ikkala korxonada bir xil (280 mln so‘m), lekin B korxona ko‘proq sotadi. A da zaxira 26,88 kunlik, B da 18,84 kunlik savdoni ta’minlaydi. Aylanish koeffitsientlari farqi: 19,11 − 13,39 = <b>5,71 marta<\/b> (B da 42,7% ga tez); aylanish davri farqi 8,04 kun.<\/p><p><b>Xulosa:<\/b> B korxona zaxirani samaraliroq ishlatadi: tovar tezroq aylanadi, aylanma mablag‘lar kamroq muddatga bog‘lanadi. A korxona zaxira hajmini kamaytirishi yoki sotuvni oshirishi kerak.<\/p>", "ans": "z̄: A = B = 280 mln so‘m; K: A 13,39, B 19,11 (farq 5,71); m: A 10,42, B 14,86 mln so‘m; t: A 26,88 kun, B 18,84 kun — B samaraliroq.", "t": "zaxira", "id": "stp-12", "src": "savdo"}, {"n": 13, "title": "Yalpi va sof tovar aylanmasi, bo‘g‘inlilik koeffitsienti", "cond": "<p>Shahar posyolkasidagi to‘rtta savdo tashkilotining hisobot yilidagi shakarni ulgurji va chakana sotish hajmlari, kg:<\/p><table><tr><th>Ko‘rsatkich<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Ulgurji savdo, jami<\/td><td>2 200<\/td><td>1 300<\/td><td>750<\/td><td>2 550<\/td><\/tr><tr><td>shu jumladan: o‘z shahar posyolkasidagi boshqa tashkilotlarga<\/td><td>1 600<\/td><td>1 000<\/td><td>500<\/td><td>1 750<\/td><\/tr><tr><td>shu jumladan: boshqa aholi punktlari tashkilotlariga<\/td><td>600<\/td><td>300<\/td><td>250<\/td><td>800<\/td><\/tr><tr><td>Chakana savdo<\/td><td>1 500<\/td><td>2 500<\/td><td>1 250<\/td><td>2 300<\/td><\/tr><\/table><p>Butun shahar posyolkasi bo‘yicha quyidagilarni aniqlang: 1. Shakarning yalpi va sof tovar aylanmasini; 2. Tovar harakati bo‘g‘inliligi (zvenolik) koeffitsiyentini.<\/p>", "cond_raw": "", "sol": "<p>Yalpi tovar aylanmasi — barcha tashkilotlar sotuvlari yig‘indisi (takroriy sotuvlar bilan). Sof tovar aylanmasi — posyolka ichidagi qayta sotuvlarsiz, ya’ni tovar tizimdan (posyolkadan) chiqib ketgan sotuvlar: chakana savdo + boshqa aholi punktlariga ulgurji sotuv.<\/p><table><tr><th>Ko‘rsatkich<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>Jami<\/th><\/tr><tr><td>Ulgurji, jami<\/td><td>2 200<\/td><td>1 300<\/td><td>750<\/td><td>2 550<\/td><td>6 800<\/td><\/tr><tr><td>o‘z posyolkasiga (ichki)<\/td><td>1 600<\/td><td>1 000<\/td><td>500<\/td><td>1 750<\/td><td>4 850<\/td><\/tr><tr><td>boshqa punktlarga<\/td><td>600<\/td><td>300<\/td><td>250<\/td><td>800<\/td><td>1 950<\/td><\/tr><tr><td>Chakana<\/td><td>1 500<\/td><td>2 500<\/td><td>1 250<\/td><td>2 300<\/td><td>7 550<\/td><\/tr><\/table><p><b>1) Yalpi tovar aylanmasi = Σ ulgurji + Σ chakana<\/b><\/p><p>YTA = 6 800 + 7 550 = <b>14 350 kg<\/b><\/p><p><b>Sof tovar aylanmasi = yalpi − posyolka ichidagi ulgurji sotuv<\/b><\/p><p>STA = 14 350 − 4 850 = <b>9 500 kg<\/b> (tekshiruv: chakana + boshqa punktlarga = 7 550 + 1 950 = 9 500)<\/p><p><b>2) Bo‘g‘inlilik (zvenolik) koeffitsienti: K<sub>b<\/sub> = YTA / STA<\/b><\/p><p>K<sub>b<\/sub> = 14 350 / 9 500 = <b>1,51<\/b><\/p><p><b>Xulosa:<\/b> posyolkada shakarning yalpi aylanmasi 14 350, sof aylanmasi 9 500 kg. K<sub>b<\/sub> = 1,51 — tovar iste’molchiga yetib borguncha o‘rtacha 1,51 ta savdo bo‘g‘inidan o‘tgan; koeffitsient 1 ga qancha yaqin bo‘lsa, tovar harakati shuncha qisqa va arzon.<\/p>", "ans": "Yalpi aylanma 14 350 kg, sof aylanma 9 500 kg, bo‘g‘inlilik koeffitsienti 1,51.", "t": "aylanma", "id": "stp-13", "src": "savdo"}, {"n": 14, "title": "Yalpi va sof tovar aylanmasi, bo‘g‘inlilik koeffitsienti", "cond": "<p>Toshkent shahridagi to‘rtta savdo tashkilotining hisobot yilidagi un mahsulotining ulgurji va chakana savdo aylanmasi (mln so‘m):<\/p><table><tr><th>Ko‘rsatkich<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Ulgurji savdo, jami<\/td><td>2 300<\/td><td>1 200<\/td><td>650<\/td><td>2 550<\/td><\/tr><tr><td>shu jumladan: o‘z shahar posyolkasidagi boshqa tashkilotlarga<\/td><td>1 600<\/td><td>1 000<\/td><td>500<\/td><td>1 750<\/td><\/tr><tr><td>shu jumladan: boshqa aholi punktlari tashkilotlariga<\/td><td>700<\/td><td>200<\/td><td>150<\/td><td>800<\/td><\/tr><tr><td>Chakana savdo<\/td><td>1 500<\/td><td>2 500<\/td><td>1 250<\/td><td>2 300<\/td><\/tr><\/table><p>Butun shahar posyolkasi bo‘yicha quyidagilarni aniqlang: 1. Un mahsulotining yalpi va sof tovar aylanmasini; 2. Tovar harakati bo‘g‘inliligi (zvenolik) koeffitsiyentini.<\/p>", "cond_raw": "", "sol": "<p>Yalpi tovar aylanmasi — barcha tashkilotlar sotuvlari yig‘indisi (takroriy sotuvlar bilan). Sof tovar aylanmasi — posyolka ichidagi qayta sotuvlarsiz, ya’ni tovar tizimdan (posyolkadan) chiqib ketgan sotuvlar: chakana savdo + boshqa aholi punktlariga ulgurji sotuv.<\/p><table><tr><th>Ko‘rsatkich<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>Jami<\/th><\/tr><tr><td>Ulgurji, jami<\/td><td>2 300<\/td><td>1 200<\/t 0<\/td><td>1 250<\/td><td>2 300<\/td><\/tr><\/table><p>Butun shahar posyolkasi bo‘yicha quyidagilarni aniqlang: 1. Kolbasa mahsulotlarining yalpi va sof tovar aylanmasini; 2. Tovar harakati bo‘g‘inliligi (zvenolik) koeffitsiyentini.<\/p>", "cond_raw": "", "sol": "<p>Yalpi tovar aylanmasi — barcha tashkilotlar sotuvlari yig‘indisi (takroriy sotuvlar bilan). Sof tovar aylanmasi — posyolka ichidagi qayta sotuvlarsiz, ya’ni tovar tizimdan (posyolkadan) chiqib ketgan sotuvlar: chakana savdo + boshqa aholi punktlariga ulgurji sotuv.<\/p><table><tr><th>Ko‘rsatkich<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>Jami<\/th><\/tr><tr><td>Ulgurji, jami<\/td><td>2 500<\/td><td>1 500<\/td><td>650<\/td><td>2 700<\/td><td>7 350<\/td><\/tr><tr><td>o‘z posyolkasiga (ichki)<\/td><td>1 600<\/td><td>1 000<\/td><td>500<\/td><td>1 600<\/td><td>4 700<\/td><\/tr><tr><td>boshqa punktlarga<\/td><td>900<\/td><td>500<\/td><td>150<\/td><td>1 100<\/td><td>2 650<\/td><\/tr><tr><td>Chakana<\/td><td>1 500<\/td><td>2 500<\/td><td>1 250<\/td><td>2 300<\/td><td>7 550<\/td><\/tr><\/table><p><b>1) Yalpi tovar aylanmasi = Σ ulgurji + Σ chakana<\/b><\/p><p>YTA = 7 350 + 7 550 = <b>14 900 mln so‘m<\/b><\/p><p><b>Sof tovar aylanmasi = yalpi − posyolka ichidagi ulgurji sotuv<\/b><\/p><p>STA = 14 900 − 4 700 = <b>10 200 mln so‘m<\/b> (tekshiruv: chakana + boshqa punktlarga = 7 550 + 2 650 = 10 200)<\/p><p><b>2) Bo‘g‘inlilik (zvenolik) koeffitsienti: K<sub>b<\/sub> = YTA / STA<\/b><\/p><p>K<sub>b<\/sub> = 14 900 / 10 200 = <b>1,46<\/b><\/p><p><b>Xulosa:<\/b> posyolkada kolbasa mahsulotlarining yalpi aylanmasi 14 900, sof aylanmasi 10 200 mln so‘m. K<sub>b<\/sub> = 1,46 — tovar iste’molchiga yetib borguncha o‘rtacha 1,46 ta savdo bo‘g‘inidan o‘tgan; koeffitsient 1 ga qancha yaqin bo‘lsa, tovar harakati shuncha qisqa va arzon.<\/p>", "ans": "Yalpi aylanma 14 900 mln so‘m, sof aylanma 10 200 mln so‘m, bo‘g‘inlilik koeffitsienti 1,46.", "t": "aylanma", "id": "stp-15", "src": "savdo"}, {"n": 16, "title": "Yetkazib berish bir maromliligi (variatsiya va tekislik)", "cond": "<p>Ikki yetkazib beruvchidan haftalik go‘sht mahsulotlarining ulgurji yetkazib berilishi bo‘yicha ma’lumotlar (savdo tashkilotlari tomonidan chakana savdo do‘konlariga bir oylik yetkazib berish hajmi, tonna):<\/p><table><tr><th>Oyning haftasi<\/th><th>Oy boshidan beri jami: 1-yetkazib beruvchi<\/th><th>Oy boshidan beri jami: 2-yetkazib beruvchi<\/th><\/tr><tr><td>1<\/td><td>13<\/td><td>20<\/td><\/tr><tr><td>2<\/td><td>26<\/td><td>34<\/td><\/tr><tr><td>3<\/td><td>39<\/td><td>48<\/td><\/tr><tr><td>4<\/td><td>52<\/td><td>60<\/td><\/tr><\/table><p>Har bir yetkazib beruvchi uchun aniqlang: 1) har bir hafta uchun jamlanma (o‘sib boruvchi) yakunsiz yetkazib berish hajmi; 2) o‘rtacha haftalik yetkazib berish hajmi; 3) taklifning o‘zgaruvchanlik koeffitsienti va tekislik (bir maromlilik) koeffitsienti. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: jadvalda oy boshidan beri jamlanma (o‘sib boruvchi) yakun berilgan; 1-bandda har bir haftaning o‘zidagi hajm (jamlanmasiz) topiladi: x<sub>i<\/sub> = S<sub>i<\/sub> − S<sub>i−1<\/sub>.<\/i><\/p><h4>1-yetkazib beruvchi<\/h4><table><tr><th>Hafta<\/th><th>Jamlanma S<\/th><th>Haftalik x = S<sub>i<\/sub> − S<sub>i−1<\/sub><\/th><th>(x − x̄)²<\/th><\/tr><tr><td>1<\/td><td>13<\/td><td>13<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>26<\/td><td>26 − 13 = 13<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>39<\/td><td>39 − 26 = 13<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>52<\/td><td>52 − 39 = 13<\/td><td>0<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>52<\/th><th>0<\/th><\/tr><\/table><p>2) x̄ = Σx / n = 52 / 4 = <b>13 t<\/b><\/p><p>3) σ = √[Σ(x − x̄)² / n] = √(0 / 4) = 0 t; V = σ / x̄ · 100 = 0 / 13 · 100 = <b>0,0%<\/b>; tekislik koeffitsienti K<sub>tek<\/sub> = 100 − V = <b>100,0%<\/b><\/p><h4>2-yetkazib beruvchi<\/h4><table><tr><th>Hafta<\/th><th>Jamlanma S<\/th><th>Haftalik x = S<sub>i<\/sub> − S<sub>i−1<\/sub><\/th><th>(x − x̄)²<\/th><\/tr><tr><td>1<\/td><td>20<\/td><td>20<\/td><td>25<\/td><\/tr><tr><td>2<\/td><td>34<\/td><td>34 − 20 = 14<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>48<\/td><td>48 − 34 = 14<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>60<\/td><td>60 − 48 = 12<\/td><td>9<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>60<\/th><th>36<\/th><\/tr><\/table><p>2) x̄ = Σx / n = 60 / 4 = <b>15 t<\/b><\/p><p>3) σ = √[Σ(x − x̄)² / n] = √(36 / 4) = 3 t; V = σ / x̄ · 100 = 3 / 15 · 100 = <b>20,0%<\/b>; tekislik koeffitsienti K<sub>tek<\/sub> = 100 − V = <b>80,0%<\/b><\/p><p><b>Xulosa:<\/b> 1-yetkazib beruvchi haftasiga o‘rtacha 13 t (V = 0,0%, tekislik 100,0%), 2-yetkazib beruvchi 15 t (V = 20,0%, tekislik 80,0%) yetkazgan. 1-yetkazib beruvchi tovarni bir maromda (ritmik) yetkazib beradi; V qancha kichik bo‘lsa, yetkazib berish shuncha tekis.<\/p>", "ans": "Haftalik hajmlar: 1-yetk. 13, 13, 13, 13; 2-yetk. 20, 14, 14, 12 t. x̄: 13 va 15 t; V: 0,0% va 20,0%; tekislik: 100,0% va 80,0% — 1-yetkazib beruvchi bir maromliroq.", "t": "aylanma", "id": "stp-16", "src": "savdo"}, {"n": 17, "title": "Yetkazib berish bir maromliligi (variatsiya va tekislik)", "cond": "<p>Ikki yetkazib beruvchidan haftalik go‘sht mahsulotlarining ulgurji yetkazib berilishi bo‘yicha ma’lumotlar (savdo tashkilotlari tomonidan chakana savdo do‘konlariga bir oylik yetkazib berish hajmi, tonna):<\/p><table><tr><th>Oyning haftasi<\/th><th>Oy boshidan beri jami: 1-yetkazib beruvchi<\/th><th>Oy boshidan beri jami: 2-yetkazib beruvchi<\/th><\/tr><tr><td>1<\/td><td>13<\/td><td>20<\/td><\/tr><tr><td>2<\/td><td>26<\/td><td>41<\/td><\/tr><tr><td>3<\/td><td>39<\/td><td>63<\/td><\/tr><tr><td>4<\/td><td>52<\/td><td>86<\/td><\/tr><\/table><p>Har bir yetkazib beruvchi uchun aniqlang: 1) har bir hafta uchun jamlanma (o‘sib boruvchi) yakunsiz yetkazib berish hajmi; 2) o‘rtacha haftalik yetkazib berish hajmi; 3) taklifning o‘zgaruvchanlik koeffitsienti va tekislik (bir maromlilik) koeffitsienti. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: jadvalda oy boshidan beri jamlanma (o‘sib boruvchi) yakun berilgan; 1-bandda har bir haftaning o‘zidagi hajm (jamlanmasiz) topiladi: x<sub>i<\/sub> = S<sub>i<\/sub> − S<sub>i−1<\/sub>.<\/i><\/p><h4>1-yetkazib beruvchi<\/h4><table><tr><th>Hafta<\/th><th>Jamlanma S<\/th><th>Haftalik x = S<sub>i<\/sub> − S<sub>i−1<\/sub><\/th><th>(x − x̄)²<\/th><\/tr><tr><td>1<\/td><td>13<\/td><td>13<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>26<\/td><td>26 − 13 = 13<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>39<\/td><td>39 − 26 = 13<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>52<\/td><td>52 − 39 = 13<\/td><td>0<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>52<\/th><th>0<\/th><\/tr><\/table><p>2) x̄ = Σx / n = 52 / 4 = <b>13 t<\/b><\/p><p>3) σ = √[Σ(x − x̄)² / n] = √(0 / 4) = 0 t; V = σ / x̄ · 100 = 0 / 13 · 100 = <b>0,0%<\/b>; tekislik koeffitsienti K<sub>tek<\/sub> = 100 − V = <b>100,0%<\/b><\/p><h4>2-yetkazib beruvchi<\/h4><table><tr><th>Hafta<\/th><th>Jamlanma S<\/th><th>Haftalik x = S<sub>i<\/sub> − S<sub>i−1<\/sub><\/th><th>(x − x̄)²<\/th><\/tr><tr><td>1<\/td><td>20<\/td><td>20<\/td><td>2,25<\/td><\/tr><tr><td>2<\/td><td>41<\/td><td>41 − 20 = 21<\/td><td>0,25<\/td><\/tr><tr><td>3<\/td><td>63<\/td><td>63 − 41 = 22<\/td><td>0,25<\/td><\/tr><tr><td>4<\/td><td>86<\/td><td>86 − 63 = 23<\/td><td>2,25<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>86<\/th><th>5<\/th><\/tr><\/table><p>2) x̄ = Σx / n = 86 / 4 = <b>21,50 t<\/b><\/p><p>3) σ = √[Σ(x − x̄)² / n] = √(5 / 4) = 1,12 t; V = σ / x̄ · 100 = 1,12 / 21,50 · 100 = <b>5,2%<\/b>; tekislik koeffitsienti K<sub>tek<\/sub> = 100 − V = <b>94,8%<\/b><\/p><p><b>Xulosa:<\/b> 1-yetkazib beruvchi haftasiga o‘rtacha 13 t (V = 0,0%, tekislik 100,0%), 2-yetkazib beruvchi 21,50 t (V = 5,2%, tekislik 94,8%) yetkazgan. 1-yetkazib beruvchi tovarni bir maromda (ritmik) yetkazib beradi; V qancha kichik bo‘lsa, yetkazib berish shuncha tekis.<\/p>", "ans": "Haftalik hajmlar: 1-yetk. 13, 13, 13, 13; 2-yetk. 20, 21, 22, 23 t. x̄: 13 va 21,50 t; V: 0,0% va 5,2%; tekislik: 100,0% va 94,8% — 1-yetkazib beruvchi bir maromliroq.", "t": "aylanma", "id": "stp-17", "src": "savdo"}, {"n": 18, "title": "Yetkazib berish bir maromliligi (variatsiya va tekislik)", "cond": "<p>Ikki yetkazib beruvchidan haftalik go‘sht mahsulotlarining ulgurji yetkazib berilishi bo‘yicha ma’lumotlar (savdo tashkilotlari tomonidan chakana savdo do‘konlariga bir oylik yetkazib berish hajmi, tonna):<\/p><table><tr><th>Oyning haftasi<\/th><th>Oy boshidan beri jami: 1-yetkazib beruvchi<\/th><th>Oy boshidan beri jami: 2-yetkazib beruvchi<\/th><\/tr><tr><td>1<\/td><td>14<\/td><td>21<\/td><\/tr><tr><td>2<\/td><td>27<\/td><td>34<\/td><\/tr><tr><td>3<\/td><td>33<\/td><td>50<\/td><\/tr><tr><td>4<\/td><td>48<\/td><td>63<\/td><\/tr><\/table><p>Har bir yetkazib beruvchi uchun aniqlang: 1) har bir hafta uchun jamlanma (o‘sib boruvchi) yakunsiz yetkazib berish hajmi; 2) o‘rtacha haftalik yetkazib berish hajmi; 3) taklifning o‘zgaruvchanlik koeffitsienti va tekislik (bir maromlilik) koeffitsienti. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: jadvalda oy boshidan beri jamlanma (o‘sib boruvchi) yakun berilgan; 1-bandda har bir haftaning o‘zidagi hajm (jamlanmasiz) topiladi: x<sub>i<\/sub> = S<sub>i<\/sub> − S<sub>i−1<\/sub>.<\/i><\/p><h4>1-yetkazib beruvchi<\/h4><table><tr><th>Hafta<\/th><th>Jamlanma S<\/th><th>Haftalik x = S<sub>i<\/sub> − S<sub>i−1<\/sub><\/th><th>(x − x̄)²<\/th><\/tr><tr><td>1<\/td><td>14<\/td><td>14<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>27<\/td><td>27 − 14 = 13<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>33<\/td><td>33 − 27 = 6<\/td><td>36<\/td><\/tr><tr><td>4<\/td><td>48<\/td><td>48 − 33 = 15<\/td><td>9<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>48<\/th><th>50<\/th><\/tr><\/table><p>2) x̄ = Σx / n = 48 / 4 = <b>12 t<\/b><\/p><p>3) σ = √[Σ(x − x̄)² / n] = √(50 / 4) = 3,54 t; V = σ / x̄ · 100 = 3,54 / 12 · 100 = <b>29,5%<\/b>; tekislik koeffitsienti K<sub>tek<\/sub> = 100 − V = <b>70,5%<\/b><\/p><h4>2-yetkazib beruvchi<\/h4><table><tr><th>Hafta<\/th><th>Jamlanma S<\/th><th>Haftalik x = S<sub>i<\/sub> − S<sub>i−1<\/sub><\/th><th>(x − x̄)²<\/th><\/tr><tr><td>1<\/td><td>21<\/td><td>21<\/td><td>27,56<\/td><\/tr><tr><td>2<\/td><td>34<\/td><td>34 − 21 = 13<\/td><td>7,56<\/td><\/tr><tr><td>3<\/td><td>50<\/td><td>50 − 34 = 16<\/td><td>0,06<\/td><\/tr><tr><td>4<\/td><td>63<\/td><td>63 − 50 = 13<\/td><td>7,56<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>63<\/th><th>42,75<\/th><\/tr><\/table><p>2) x̄ = Σx / n = 63 / 4 = <b>15,75 t<\/b><\/p><p>3) σ = √[Σ(x − x̄)² / n] = √(42,75 / 4) = 3,27 t; V = σ / x̄ · 100 = 3,27 / 15,75 · 100 = <b>20,8%<\/b>; tekislik koeffitsienti K<sub>tek<\/sub> = 100 − V = <b>79,2%<\/b><\/p><p><b>Xulosa:<\/b> 1-yetkazib beruvchi haftasiga o‘rtacha 12 t (V = 29,5%, tekislik 70,5%), 2-yetkazib beruvchi 15,75 t (V = 20,8%, tekislik 79,2%) yetkazgan. 2-yetkazib beruvchi tovarni bir maromda (ritmik) yetkazib beradi; V qancha kichik bo‘lsa, yetkazib berish shuncha tekis.<\/p>", "ans": "Haftalik hajmlar: 1-yetk. 14, 13, 6, 15; 2-yetk. 21, 13, 16, 13 t. x̄: 12 va 15,75 t; V: 29,5% va 20,8%; tekislik: 70,5% va 79,2% — 2-yetkazib beruvchi bir maromliroq.", "t": "aylanma", "id": "stp-18", "src": "savdo"}, {"n": 19, "title": "Chakana tovar aylanmasi: trend va prognoz", "cond": "<p>Viloyatda chakana tovar aylanmasi to‘g‘risida quyidagi ma’lumotlar keltirilgan:<\/p><table><tr><th>Yillar<\/th><th>Chakana tovar aylanmasi, mlrd so‘m<\/th><th>Yillar<\/th><th>Chakana tovar aylanmasi, mlrd so‘m<\/th><\/tr><tr><td>2019<\/td><td>9 310<\/td><td>2019<\/td><td>23 720<\/td><\/tr><tr><td>2020<\/td><td>10 180<\/td><td>2020<\/td><td>25 180<\/td><\/tr><tr><td>2021<\/td><td>11 360<\/td><td>2021<\/td><td>31 460<\/td><\/tr><tr><td>2022<\/td><td>12 840<\/td><td>2022<\/td><td>38 920<\/td><\/tr><tr><td>2023<\/td><td>14 950<\/td><td>2023<\/td><td>42 850<\/td><\/tr><tr><td>2024<\/td><td>17 860<\/td><td>2024<\/td><td>47 620<\/td><\/tr><tr><td>2025<\/td><td>20 450<\/td><td>2025<\/td><td>53 480<\/td><\/tr><\/table><p>Aniqlang: viloyatda chakana tovar aylanmasining umumiy ho (2024)<\/th><th>p<sub>1<\/sub> (2025)<\/th><th>Δp, so‘m<\/th><th>T, %<\/th><th>ΔT, %<\/th><\/tr><tr><td>Un<\/td><td>9 500<\/td><td>10 400<\/td><td>10 400 − 9 500 = +900<\/td><td>10 400 / 9 500 · 100 = 109,5<\/td><td>+9,5<\/td><\/tr><tr><td>Guruch<\/td><td>14 500<\/td><td>17 700<\/td><td>17 700 − 14 500 = +3 200<\/td><td>17 700 / 14 500 · 100 = 122,1<\/td><td>+22,1<\/td><\/tr><tr><td>Shakar<\/td><td>11 200<\/td><td>14 000<\/td><td>14 000 − 11 200 = +2 800<\/td><td>14 000 / 11 200 · 100 = 125,0<\/td><td>+25,0<\/td><\/tr><tr><td>O‘simlik yog‘i<\/td><td>20 500<\/td><td>25 300<\/td><td>25 300 − 20 500 = +4 800<\/td><td>25 300 / 20 500 · 100 = 123,4<\/td><td>+23,4<\/td><\/tr><\/table><p><b>3)<\/b> Eng yuqori nisbiy o‘sish – <b>Shakar<\/b>: 125,0% (narx 25,0% ga oshgan). Mutlaq miqdorda eng ko‘p qimmatlagan mahsulot – O‘simlik yog‘i (+4 800 so‘m).<\/p><p><b>Xulosa:<\/b> 2025-yilda barcha mahsulotlar qimmatlashgan. Eng sekin o‘sish un narxida (9,5%), eng tez o‘sish shakarda (25,0%). Guruch (22,1%) va o‘simlik yog‘i (23,4%) narxlari ham sezilarli oshgan.<\/p>", "ans": "Narxlar: un +900 so‘m (109,5%), guruch +3 200 (122,1%), shakar +2 800 (125,0%), yog‘ +4 800 (123,4%). Eng yuqori nisbiy o‘sish – shakar (25,0%), eng katta mutlaq o‘sish – o‘simlik yog‘i.", "t": "narx", "id": "stp-26", "src": "savdo"}, {"n": 27, "title": "Laspeyres umumiy narx indeksi", "cond": "<p>Quyidagi mahsulotlar bo‘yicha ma’lumotlar berilgan:<\/p><table><tr><th>Mahsulot<\/th><th>Bazis davr narxi, so‘m<\/th><th>Hisobot davri narxi, so‘m<\/th><th>Sotilgan miqdor, kg<\/th><\/tr><tr><td>Go‘sht<\/td><td>120 000<\/td><td>139 000<\/td><td>125<\/td><\/tr><tr><td>Sut<\/td><td>13 000<\/td><td>15 000<\/td><td>350<\/td><\/tr><tr><td>Shakar<\/td><td>11 200<\/td><td>13 500<\/td><td>270<\/td><\/tr><\/table><p>Aniqlang: 1. Laspeyres usuli bo‘yicha umumiy narx indeksini hisoblang. 2. Narxlarning umumiy o‘zgarish darajasini aniqlang. 3. Olingan natijalarga iqtisodiy baho bering.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh:
