<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistika imtihon tayyorlovi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: daftar varag‘i — yopishqoq bo‘lim tugmalari, bitta o‘qish ustuni; kartaning chap chizig‘i manbani bildiradi */
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #17202c;
  --muted: #5a6577;
  --line: #d9dfe7;
  --accent: #1f57b8;
  --accent-2: #0d7f7a;
  --accent-soft: #e5edfa;
  --mark: #fff3c4;
  --ok: #1b7a4b;
  --warn: #9a5800;
  --bad: #b42318;
  --font-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --ink: #e5eaf1; --muted: #9aa5b5; --line: #283345;
    --accent: #79a6ff; --accent-2: #4fc7bf; --accent-soft: #1b2a44; --mark: #3b3416;
    --ok: #4cc58c; --warn: #f2a43c; --bad: #ff7b6b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --ink: #e5eaf1; --muted: #9aa5b5; --line: #283345;
  --accent: #79a6ff; --accent-2: #4fc7bf; --accent-soft: #1b2a44; --mark: #3b3416;
  --ok: #4cc58c; --warn: #f2a43c; --bad: #ff7b6b; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 20px 0 10px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.75rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 24px 0 6px; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 12px; font-size: .9375rem; }
.progress { display: flex; align-items: center; gap: 12px; font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs a { padding: 10px 12px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-bottom: 48px; }
.view[hidden] { display: none; }
.banner { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: .9375rem; margin: 14px 0 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 16px 0 12px; }
input[type="search"], select { font: inherit; font-size: .9375rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
input[type="search"] { flex: 1 1 220px; min-width: 0; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--muted); cursor: pointer; }
.btn { font: inherit; font-size: .9375rem; font-weight: 500; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.good[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: .875rem; color: var(--muted); margin: 0 0 10px; }
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card.src-stat { border-left-color: var(--accent-2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: .8125rem; color: var(--muted); margin-bottom: 6px; }
.meta .num { font-weight: 600; color: var(--ink); }
.chip { padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); }
.chip.s-ok { color: var(--ok); border-color: currentColor; }
.chip.s-fixed, .chip.s-rewritten { color: var(--warn); border-color: currentColor; }
.chip.s-unverifiable { color: var(--bad); border-color: currentColor; }
.chip.s-pending { color: var(--muted); }
.q { font-weight: 600; margin: 0 0 4px; }
.k { font-size: .875rem; color: var(--muted); margin: 0 0 6px; }
.cond { margin: 4px 0 0; }
.cond p, .ans p { margin: 0 0 8px; }
.ans { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
.ans ul, .ans ol { margin: 0 0 8px; padding-left: 22px; }
.ans b, .ans strong { background: var(--mark); padding: 0 2px; border-radius: 2px; }
.ans .xulosa { border-left: 3px solid var(--ok); padding-left: 10px; margin-top: 8px; }
.pending { color: var(--muted); font-style: italic; }
.note { font-size: .875rem; color: var(--warn); margin: 8px 0 0; }
table { border-collapse: collapse; font-size: .875rem; display: block; overflow-x: auto; max-width: 100%; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--accent-soft); font-weight: 600; }
pre.raw { font-family: var(--font-mono); font-size: .8125rem; line-height: 1.45; overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 6px; margin: 6px 0 0; }
.foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.reveal { display: none; }
.hide-ans .ans { display: none; }
.hide-ans .reveal { display: inline-block; }
.hide-ans .card.shown .ans { display: block; }
.hide-ans .card.shown .reveal { display: none; }
/* formulas */
.fgroup { margin-bottom: 8px; }
.frow { display: grid; grid-template-columns: minmax(150px, 1fr) 2fr; gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.frow .fn { font-weight: 500; }
.frow .f { font-family: var(--font-mono); font-size: .9375rem; background: var(--mark); padding: 2px 6px; border-radius: 4px; justify-self: start; overflow-wrap: anywhere; }
.frow .fnote { grid-column: 2; font-size: .875rem; color: var(--muted); }
/* ticket */
.ticket-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
.timer { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.timer.done { color: var(--bad); }
.slot { font-size: .8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; }
.score { font-weight: 600; }
/* flashcards */
.flash { min-height: 240px; }
.fc-pos { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.kbd { font-family: var(--font-mono); font-size: .75rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
/* report */
details.rep { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.rep summary { cursor: pointer; }
details.rep .card { border: 0; padding: 10px 0 0; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
.stats .chip { padding: 2px 10px; font-size: .875rem; }
@media (max-width: 560px) {
  .frow { grid-template-columns: 1fr; }
  .frow .fnote { grid-column: 1; }
  h1 { font-size: 1.45rem; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
@media print {
  nav.tabs, .controls, .foot, .banner, .progress { display: none !important; }
  .hide-ans .ans { display: block !important; }
  .card { break-inside: avoid; }
  body { background: #fff; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Statistika imtihon tayyorlovi</h1>
    <p class="sub" id="sub"></p>
    <div class="progress"><span id="prog-text"></span><div class="bar" aria-hidden="true"><i id="prog-bar"></i></div></div>
    <div class="banner" id="banner" hidden></div>
  </div>
</header>
<nav class="tabs" aria-label="Bo‘limlar">
  <div class="wrap">
    <a href="#mashq" data-view="mashq">Bilet mashqi</a>
    <a href="#savollar" data-view="savollar">Nazariy savollar</a>
    <a href="#masalalar" data-view="masalalar">Masalalar</a>
    <a href="#formulalar" data-view="formulalar">Formulalar</a>
    <a href="#kartochkalar" data-view="kartochkalar">Kartochkalar</a>
    <a href="#tekshiruv" data-view="tekshiruv">Tekshiruv natijasi</a>
  </div>
</nav>
<main class="wrap">

<section class="view" id="view-mashq">
  <div class="controls">
    <select id="tk-src" aria-label="Manba">
      <option value="all">Ikkala fan</option>
      <option value="savdo">Savdo statistikasi</option>
      <option value="stat">Statistika</option>
    </select>
    <select id="tk-time" aria-label="Vaqt">
      <option value="0">Vaqtsiz</option>
      <option value="40">40 daqiqa</option>
      <option value="60">60 daqiqa</option>
      <option value="80" selected>80 daqiqa</option>
      <option value="90">90 daqiqa</option>
    </select>
    <button class="btn primary" id="tk-new" type="button">Yangi bilet</button>
    <label class="chk"><input type="checkbox" id="tk-unk" checked> Avval bilmaganlarim</label>
  </div>
  <div class="ticket-head">
    <div>
      <div class="slot">Taxminiy format</div>
      <div>2 ta nazariy savol va 2 ta masala</div>
    </div>
    <div class="timer" id="tk-timer" aria-live="polite">—</div>
    <button class="btn" id="tk-start" type="button">Vaqtni boshlash</button>
  </div>
  <div class="list hide-ans" id="tk-list"></div>
  <p class="score" id="tk-score"></p>
</section>

<section class="view" id="view-savollar" hidden>
  <div class="controls">
    <input type="search" id="sv-q" placeholder="Qidirish: aylanma, zaxira, Laspeyres…" aria-label="Savollar bo‘yicha qidirish">
    <select id="sv-src" aria-label="Manba">
      <option value="all">Ikkala fan</option>
      <option value="savdo">Savdo statistikasi</option>
      <option value="stat">Statistika</option>
    </select>
    <select id="sv-topic" aria-label="Mavzu"></select>
    <label class="chk"><input type="checkbox" id="sv-hide"> Javoblarni yashirish</label>
    <label class="chk"><input type="checkbox" id="sv-unk"> Faqat bilmaganlarim</label>
  </div>
  <p class="count" id="sv-count"></p>
  <div class="list" id="sv-list"></div>
</section>

<section class="view" id="view-masalalar" hidden>
  <div class="controls">
    <input type="search" id="ms-q" placeholder="Qidirish: zaxira, indeks, regressiya…" aria-label="Masalalar bo‘yicha qidirish">
    <select id="ms-src" aria-label="Manba">
      <option value="all">Ikkala fan</option>
      <option value="savdo">Savdo statistikasi</option>
      <option value="stat">Statistika</option>
    </select>
    <select id="ms-topic" aria-label="Mavzu"></select>
    <label class="chk"><input type="checkbox" id="ms-hide"> Yechimlarni yashirish</label>
    <label class="chk"><input type="checkbox" id="ms-unk"> Faqat bilmaganlarim</label>
  </div>
  <p class="count" id="ms-count"></p>
  <div class="list" id="ms-list"></div>
</section>

<section class="view" id="view-formulalar" hidden>
  <div class="controls">
    <input type="search" id="fm-q" placeholder="Formulani qidirish: aylanish, Paashe, moda…" aria-label="Formulalarni qidirish">
  </div>
  <div id="fm-list"></div>
</section>

<section class="view" id="view-kartochkalar" hidden>
  <div class="controls">
    <select id="fc-src" aria-label="Manba">
      <option value="all">Ikkala fan</option>
      <option value="savdo">Savdo statistikasi</option>
      <option value="stat">Statistika</option>
    </select>
    <select id="fc-topic" aria-label="Mavzu"></select>
    <label class="chk"><input type="checkbox" id="fc-unk" checked> Faqat bilmaganlarim</label>
    <button class="btn" id="fc-shuffle" type="button">Aralashtirish</button>
  </div>
  <p class="fc-pos" id="fc-pos"></p>
  <div class="hide-ans" id="fc-box"></div>
  <p class="count"><span class="kbd">Probel</span> javobni ochish · <span class="kbd">1</span> bildim · <span class="kbd">2</span> yana takrorlayman</p>
</section>

<section class="view" id="view-tekshiruv" hidden>
  <div id="rep"></div>
</section>

</main>
<script>
const DATA = {"theory": [{"n": 1, "q": "Savdo statistikasining predmeti nimadan iborat?", "k": "savdo sohasi, ommaviy hodisalar, miqdoriy jihat, qonuniyatlar, iqtisodiy statistika tarmog‘i.", "a": "Savdo statistikasi — <b>iqtisodiy statistika tarmog‘i<\/b> bo‘lib, uning predmeti <b>savdo sohasi<\/b>dagi <b>ommaviy hodisalar<\/b> va jarayonlarning <b>miqdoriy jihati<\/b>ni ularning sifat mazmuni bilan uzviy bog‘liq holda o‘rganishdir. U tovar aylanmasi, tovar zaxiralari, narxlar, savdo xodimlari, moddiy-texnika bazasi, muomala xarajatlari va savdo samaradorligining hajmi, tarkibi va dinamikasini o‘rganadi. Muayyan joy va vaqt sharoitida bu hodisalarning rivojlanish <b>qonuniyatlari<\/b>ni aniqlaydi. Yakka savdo bitimi emas, ko‘p sonli bitimlar majmui o‘rganiladi, chunki qonuniyat faqat ommaviy kuzatishda namoyon bo‘ladi.", "t": "predmet", "id": "sv-1", "src": "savdo"}, {"n": 2, "q": "\"Savdo statistikasi\" tushunchasini izohlang va uning iqtisodiy statistika tizimidagi o‘rnini tushuntiring.", "k": "savdo jarayonlari, statistik kuzatish, iqtisodiy statistika tarmog‘i, bozor iqtisodiyoti, tahlil.", "a": "<b>Savdo statistikasi<\/b> — <b>savdo jarayonlari<\/b> (tovarlarni sotib olish, saqlash va sotish) haqidagi ma’lumotlarni <b>statistik kuzatish<\/b> orqali yig‘ish, guruhlash, umumlashtirish va <b>tahlil<\/b> qilish bilan shug‘ullanuvchi fan. U <b>iqtisodiy statistika tarmog‘i<\/b> hisoblanadi: umumiy statistika nazariyasi metodlaridan (o‘rtachalar, indekslar, dinamika qatorlari, korrelyatsiya) foydalanadi va makroiqtisodiy statistika bilan tovar aylanmasi, narx va iste’mol ko‘rsatkichlari orqali bog‘lanadi. <b>Bozor iqtisodiyoti<\/b> sharoitida u talab va taklif, narxlar, raqobat va aholi iste’molini baholash uchun zarur axborotni beradi. Shu sababli savdo statistikasi korxonalar va davlat boshqaruv qarorlari uchun asos bo‘ladi.", "t": "predmet", "id": "sv-2", "src": "savdo"}, {"n": 3, "q": "Savdo statistikasining predmeti va obyekti o‘rtasidagi farqni tushuntiring. Har biriga misollar keltiring.", "k": "predmet – qonuniyatlar, obyekt – savdo korxonalari, chakana savdo, ulgurji savdo, bozor.", "a": "<b>Predmet<\/b> — savdo hodisalarining miqdoriy tomoni va rivojlanish <b>qonuniyatlari<\/b>, ya’ni nimani o‘rganamiz: masalan, tovar aylanmasining hajmi, tarkibi va o‘sish sur’ati, zaxiralarning aylanish tezligi. <b>Obyekt<\/b> — o‘rganiladigan real to‘plam, ya’ni nima kuzatiladi: <b>savdo korxonalari<\/b>, do‘konlar, omborlar, <b>chakana savdo<\/b> va <b>ulgurji savdo<\/b> tarmog‘i, dehqon <b>bozor<\/b>lari. Misol 1: shahar do‘konlari (obyekt) bo‘yicha oziq-ovqat sotuvining yillik o‘sish qonuniyati (predmet). Misol 2: ulgurji baza (obyekt) zaxiralari aylanish tezligining o‘zgarishi (predmet). Qisqasi: obyekt — to‘plam, predmet — shu to‘plamdagi miqdoriy qonuniyatlar.", "t": "predmet", "id": "sv-3", "src": "savdo"}, {"n": 4, "q": "Savdo statistikasining asosiy vazifalarini sanab bering va ularning iqtisodiy boshqaruvdagi ahamiyatini izohlang.", "k": "hisobga olish, tahlil, prognoz, boshqaruv qarorlari, nazorat.", "a": "Asosiy vazifalar: tovar aylanmasi, zaxiralar, narxlar, xodimlar va xarajatlarni to‘liq va ishonchli <b>hisobga olish<\/b>; ularning hajmi, tarkibi, dinamikasi va omillarini <b>tahlil<\/b> qilish; aholi talabi va tovar aylanmasini <b>prognoz<\/b> qilish; rejalar, me’yorlar va qonunchilik bajarilishini <b>nazorat<\/b> qilish. Iqtisodiy boshqaruvdagi ahamiyati: hisob va tahlil natijalari korxona va davlat organlariga asosli <b>boshqaruv qarorlari<\/b> (assortiment, narx siyosati, zaxira hajmi, yangi savdo obyektlari ochish) qabul qilish imkonini beradi. Prognoz resurslarni oldindan rejalashtirishga, nazorat esa kamchiliklarni o‘z vaqtida aniqlashga yordam beradi.", "t": "predmet", "id": "sv-4", "src": "savdo"}, {"n": 5, "q": "Savdo statistikasi metodining mohiyati nimadan iborat? Statistik tadqiqotning asosiy bosqichlarini izohlang.", "k": "kuzatish, guruhlash, tahlil, xulosa, uch bosqich.", "a": "Savdo statistikasi metodi — ommaviy savdo hodisalarini o‘rganishda qo‘llaniladigan statistik usullar majmui. Statistik tadqiqot <b>uch bosqich<\/b>dan iborat: 1) statistik <b>kuzatish<\/b> — savdo korxonalari bo‘yicha birlamchi ma’lumotlarni dastur asosida yig‘ish; 2) jamlash va <b>guruhlash<\/b> — ma’lumotlarni tartiblash, bir jinsli guruhlarga ajratish, jadvallar tuzish; 3) <b>tahlil<\/b> — umumlashtiruvchi ko‘rsatkichlar (nisbiy va o‘rtacha miqdorlar, indekslar, dinamika va korrelyatsiya ko‘rsatkichlari) hisoblash va qonuniyatlarni aniqlash. Tahlil yakunida <b>xulosa<\/b> va takliflar ishlab chiqiladi. Har bir bosqich oldingisiga tayanadi: kuzatishdagi xato keyingi barcha natijalarni buzadi.", "t": "predmet", "id": "sv-5", "src": "savdo"}, {"n": 6, "q": "Statistik kuzatish metodining mohiyati, shakllari va savdo statistikasidagi qo‘llanilish sohalarini tushuntiring.", "k": "birlamchi ma’lumot, hisobot, maxsus kuzatish, anketa, savdo korxonalari.", "a": "Statistik kuzatish — oldindan ishlab chiqilgan dastur asosida ommaviy hodisalar haqida <b>birlamchi ma’lumot<\/b>larni rejali va ilmiy tashkil etilgan holda yig‘ish. Asosiy shakllari: statistik <b>hisobot<\/b> (korxonalar belgilangan muddat va shaklda topshiradi), <b>maxsus kuzatish<\/b> (ro‘yxatga olish, bir martalik tekshirish, inventarizatsiya) va registrlar. Turlari: yoppasiga va tanlab, uzluksiz va davriy kuzatish. Savdo statistikasida <b>savdo korxonalari<\/b>ning tovar aylanmasi, zaxiralari, xodimlari va xarajatlari hisobotlar orqali, aholi talabi va xaridor fikri esa <b>anketa<\/b> so‘rovlari orqali o‘rganiladi; bozor narxlari ro‘yxatga olish (registratsiya) yo‘li bilan kuzatiladi.", "t": "predmet", "id": "sv-6", "src": "savdo"}, {"n": 7, "q": "Savdo statistikasida birlamchi statistik ma’lumotlarning asosiy manbalarini sanab bering. Ularga qo‘yiladigan asosiy talablarni izohlang.", "k": "hisobotlar, kassa ma’lumotlari, inventarizatsiya, anketalar, to‘liqlik, ishonchlilik.", "a": "Asosiy manbalar: savdo korxonalarining statistik va buxgalteriya <b>hisobotlari<\/b>; <b>kassa ma’lumotlari<\/b> (onlayn nazorat-kassa texnikasi, cheklar, elektron to‘lovlar); <b>inventarizatsiya<\/b> natijalari (zaxiralarning haqiqiy qoldig‘i); <b>anketalar<\/b> va xaridorlar so‘rovi; bojxona deklaratsiyalari va narxlarni ro‘yxatga olish. Talablar: <b>to‘liqlik<\/b> — barcha birliklar va dasturdagi barcha belgilar qamrab olinadi; <b>ishonchlilik<\/b> — ma’lumot haqiqatga mos va xatosiz; o‘z vaqtidalik; taqqoslanuvchanlik — yagona metodologiya, o‘lchov birligi va davr. Bu talablar bajarilmasa, tahlil va prognoz xulosalari noto‘g‘ri bo‘ladi.", "t": "predmet", "id": "sv-7", "src": "savdo"}, {"n": 8, "q": "Nisbiy miqdorlar metodining mohiyatini tushuntiring. Savdo statistikasida qo‘llaniladigan asosiy nisbiy ko‘rsatkichlarni sanang.", "k": "taqqoslash, foiz, koeffitsient, dinamika, tuzilma, intensivlik.", "a": "Nisbiy miqdor — ikki statistik ko‘rsatkichni <b>taqqoslash<\/b> natijasi bo‘lib, biri ikkinchisiga bo‘linadi va <b>koeffitsient<\/b>, <b>foiz<\/b> yoki promilleda ifodalanadi. Savdoda qo‘llaniladigan turlari: <b>dinamika<\/b> (joriy / bazis davr tovar aylanmasi); reja topshirig‘i va reja bajarilishi (<b>haqiqiy / reja × 100%<\/b>); <b>tuzilma<\/b> (oziq-ovqat tovarlarining umumiy aylanmadagi ulushi); koordinatsiya (nooziq-ovqat / oziq-ovqat aylanmasi); <b>intensivlik<\/b> (aholi jon boshiga tovar aylanmasi, 1 m² savdo maydoniga aylanma, 10 ming aholiga do‘konlar soni); taqqoslash (ikki hudud ko‘rsatkichlari nisbati). Ular mutlaq miqdorlarni solishtirish mumkin bo‘lgan shaklga keltiradi.", "t": "predmet", "id": "sv-8", "src": "savdo"}, {"n": 9, "q": "Savdo statistikasida o‘rtacha miqdorlarning ahamiyatini tushuntiring. Qanday turdagi o‘rtachalar qo‘llaniladi?", "k": "umumlashtirish, o‘rtacha arifmetik, o‘rtacha garmonik, o‘rtacha xronologik.", "a": "O‘rtacha miqdor bir jinsli to‘plamdagi belgining tipik darajasini ko‘rsatadi va individual farqlarni <b>umumlashtirish<\/b> orqali umumiy qonuniyatni ochadi: o‘rtacha narx, bir do‘konning o‘rtacha aylanmasi, o‘rtacha zaxira, o‘rtacha ish haqi. <b>O‘rtacha arifmetik<\/b> (x̄ = Σxf / Σf) — vaznlar (chastota, miqdor) ma’lum bo‘lganda. <b>O‘rtacha garmonik<\/b> (x̄ = ΣW / Σ(W/x)) — faqat umumiy hajm W (masalan, tovar aylanmasi) va narx berilib, miqdor noma’lum bo‘lganda. <b>O‘rtacha xronologik<\/b> — moment qatori (masalan, sanalar bo‘yicha zaxiralar) uchun o‘rtacha darajani topishda. Shuningdek moda va mediana tuzilmaviy o‘rtachalar sifatida ishlatiladi.", "t": "predmet", "id": "sv-9", "src": "savdo"}, {"n": 10, "q": "Indeks metodining savdo statistikasidagi ahamiyatini tushuntiring.", "k": "dinamika, taqqoslash, narx indeksi, fizik hajm indeksi, tovar aylanmasi indeksi.", "a": "Indeks — murakkab hodisaning vaqt yoki makon bo‘yicha nisbiy o‘zgarishini ko‘rsatuvchi ko‘rsatkich. Savdoda turli tovarlarni natural birlikda qo‘shib bo‘lmaydi; indeks metodi ularni narx yoki miqdor orqali umumlashtirib, <b>dinamika<\/b>ni o‘rganish va hududlarni <b>taqqoslash<\/b> imkonini beradi. Asosiy indekslar: <b>tovar aylanmasi indeksi<\/b> Ipq = Σp₁q₁ / Σp₀q₀; <b>narx indeksi<\/b> Ip = Σp₁q₁ / Σp₀q₁ (Paashe); <b>fizik hajm indeksi<\/b> Iq = Σp₀q₁ / Σp₀q₀ (Laspeyres). Ular o‘zaro bog‘langan: <b>Ipq = Ip × Iq<\/b>, bu tovar aylanmasi o‘zgarishini narx va hajm omillariga ajratishga imkon beradi.", "t": "predmet", "id": "sv-10", "src": "savdo"}, {"n": 11, "q": "Tovar aylanmasi indeksining iqtisodiy mazmunini izohlang. Unda narx va sotilgan tovarlarning fizik hajmi qanday aks etadi?", "k": "qiymat indeksi, narx, fizik hajm, umumiy o‘zgarish, bog‘liqlik.", "a": "Tovar aylanmasi indeksi — <b>qiymat indeksi<\/b> bo‘lib, joriy narxlardagi tovar aylanmasining <b>umumiy o‘zgarish<\/b>ini ko‘rsatadi: <b>Ipq = Σp₁q₁ / Σp₀q₀<\/b>. Uning o‘zgarishi ikki omil — <b>narx<\/b> (p) va sotilgan tovarlarning <b>fizik hajm<\/b>i (q) o‘zgarishi natijasidir. <b>Bog‘liqlik<\/b>: Ipq = Ip × Iq, bu yerda Ip = Σp₁q₁ / Σp₀q₁, Iq = Σp₀q₁ / Σp₀q₀. Mutlaq o‘zgarish ham ajratiladi: Δpq = (Σp₁q₁ − Σp₀q₁) + (Σp₀q₁ − Σp₀q₀), birinchi qism narx, ikkinchisi hajm hisobiga. Masalan, aylanma 1,2 marta, narxlar 1,1 marta oshsa, fizik hajm 1,2 / 1,1 ≈ 1,091 marta (9,1% ga) oshgan.", "t": "aylanma", "id": "sv-11", "src": "savdo"}, {"n": 12, "q": "Dinamika qatorlari metodi nima? Savdo statistikasi ko‘rsatkichlari dinamikasini o‘rganishda qanday ko‘rsatkichlar hisoblanadi?", "k": "vaqt qatori, absolyut o‘sish, o‘sish sur’ati, o‘sish tempiri, trend.", "a": "Dinamika qatori (<b>vaqt qatori<\/b>) — ko‘rsatkichning vaqt bo‘yicha ketma-ket joylashgan qiymatlari; dinamika qatorlari metodi savdo hodisalarining vaqt bo‘yicha o‘zgarishini o‘rganadi. Hisoblanadigan ko‘rsatkichlar (bazisli va zanjirsimon): <b>absolyut o‘sish<\/b> Δ = yᵢ − yᵢ₋₁ (yoki yᵢ − y₀); <b>o‘sish sur’ati<\/b> T = yᵢ / yᵢ₋₁ × 100%; <b>o‘sish tempi<\/b> (qo‘shimcha o‘sish sur’ati) = T − 100%; 1% qo‘shimcha o‘sishning mutlaq qiymati = 0,01 · yᵢ₋₁; o‘rtacha daraja va o‘rtacha o‘sish sur’ati (geometrik o‘rtacha). Asosiy tendensiya — <b>trend<\/b> — sirpanuvchi o‘rtacha yoki analitik tekislash (ŷ = a + bt) bilan aniqlanadi va prognozda ishlatiladi.", "t": "predmet", "id": "sv-12", "src": "savdo"}, {"n": 13, "q": "Korrelatsion tahlil va regressiya tahlilining savdo statistikasidagi vazifalarini tushuntiring. Ularning farqi nimada?", "k": "bog‘liqlik, ta’sir, korrelyatsiya – zichlik, regressiya – tenglama.", "a": "Savdo ko‘rsatkichlari o‘zaro <b>bog‘liqlik<\/b>da: tovar aylanmasi aholi daromadi, narx, reklama, savdo maydoniga bog‘liq. <b>Korrelyatsiya<\/b> tahlili bog‘lanishning <b>zichlik<\/b>i va yo‘nalishini o‘lchaydi: chiziqli korrelyatsiya koeffitsienti r (−1 ≤ r ≤ 1), korrelyatsion nisbat η, determinatsiya koeffitsienti r². <b>Regressiya<\/b> tahlili bog‘lanishning analitik shakli — <b>tenglama<\/b>sini topadi, masalan <b>ŷ = a + bx<\/b>; b omil bir birlikka o‘zgarganda natija o‘rtacha qancha o‘zgarishini, ya’ni omil <b>ta’sir<\/b>ini ko‘rsatadi. Farqi: korrelyatsiya “bog‘lanish qanchalik kuchli?”, regressiya “qanday shaklda va qancha ta’sir qiladi?” degan savolga javob beradi; regressiya prognoz qilishga ham imkon beradi.", "t": "predmet", "id": "sv-13", "src": "savdo"}, {"n": 14, "q": "Chakana savdoning iqtisodiy mazmuni va uni statistik o‘rganishning asosiy xususiyatlarini tushuntiring.", "k": "aholiga sotish, yakuniy iste’mol, kassa tushumi, chakana tovar aylanmasi.", "a": "Chakana savdo — tovarlarni <b>aholiga sotish<\/b>, ya’ni shaxsiy <b>yakuniy iste’mol<\/b> uchun naqd yoki naqdsiz pulga sotish; bu tovar harakatining oxirgi bo‘g‘ini bo‘lib, tovar muomala sohasidan chiqib iste’molga o‘tadi. <b>Chakana tovar aylanmasi<\/b> do‘konlar, bozorlar, umumiy ovqatlanish va onlayn savdo orqali aholiga sotilgan tovarlar qiymatini o‘z ichiga oladi. Statistik o‘rganish xususiyatlari: asosiy manba — <b>kassa tushumi<\/b> va hisobotlar; chakana narxlarda hisoblanadi; tovar tarkibi (oziq-ovqat, nooziq-ovqat), mulkchilik shakllari va hududlar bo‘yicha guruhlanadi; aholi jon boshiga hisoblanadi va mavsumiylik hisobga olinadi. U aholi turmush darajasini baholashda muhim ko‘rsatkich.", "t": "aylanma", "id": "sv-14", "src": "savdo"}, {"n": 15, "q": "Ulgurji savdoning iqtisodiy mazmuni va uni statistik o‘rganishning asosiy yo‘nalishlarini tushuntiring.", "k": "korxonalararo savdo, yirik partiya, vositachilik, ulgurji tovar aylanmasi.", "a": "Ulgurji savdo — tovarlarni <b>yirik partiya<\/b>larda qayta sotish yoki ishlab chiqarishda ishlatish uchun sotish, ya’ni <b>korxonalararo savdo<\/b>; tovar bu bosqichda iste’molga emas, muomalaning keyingi bo‘g‘iniga o‘tadi. Ulgurji korxonalar ishlab chiqaruvchi va chakana savdo o‘rtasida <b>vositachilik<\/b> qiladi: tovarni yig‘adi, saqlaydi, saralaydi va yetkazib beradi. <b>Ulgurji tovar aylanmasi<\/b>ni o‘rganish yo‘nalishlari: hajm va tarkib (xaridorlar, tovar guruhlari bo‘yicha); dinamika va sotishning bir tekisligi (ritmikligi); omborxona va tranzit aylanma; yalpi va sof aylanma, bo‘g‘inlilik koeffitsienti; yetkazib berish shartnomalari bajarilishini nazorat qilish.", "t": "aylanma", "id": "sv-15", "src": "savdo"}, {"n": 16, "q": "Chakana va ulgurji tovar aylanmasining farqli jihatlarini statistik nuqtayi nazardan taqqoslang.", "k": "iste’molchi, korxona, yakuniy mahsulot, oraliq mahsulot, hajm, maqsad.", "a": "Farqlar: 1) xaridor — chakanada yakuniy <b>iste’molchi<\/b> (aholi), ulgurjida <b>korxona<\/b> (savdo yoki ishlab chiqarish tashkiloti); 2) <b>maqsad<\/b> — chakanada shaxsiy iste’mol, ulgurjida qayta sotish yoki qayta ishlash; 3) mahsulot mazmuni — chakanada tovar <b>yakuniy mahsulot<\/b> sifatida muomaladan chiqadi, ulgurjida <b>oraliq mahsulot<\/b> sifatida muomalada qoladi; 4) <b>hajm<\/b> — ulgurjida yirik partiyalar, chakanada kichik miqdorlar; 5) narx — chakana va ulgurji narxlar. Statistik jihatdan chakana aylanma aholi iste’molini, ulgurji aylanma tovar harakatining bo‘g‘inliligini aks ettiradi; ularni oddiy qo‘shish takroriy hisobga olib keladi.", "t": "aylanma", "id": "sv-16", "src": "savdo"}, {"n": 17, "q": "Tovar zaxiralarining savdo jarayonidagi ahamiyatini tushuntiring. Zaxiraning haddan tashqari ko‘payishi va yetishmasligi qanday oqibatlarga olib kelishi mumkin?", "k": "uzluksizlik, xarajat, aylanma, tanqislik, ortiqcha zaxira, muzlash.", "a": "Tovar zaxiralari savdo jarayonining <b>uzluksizlik<\/b>ini ta’minlaydi: ishlab chiqarish va iste’mol vaqt va joy bo‘yicha mos kelmagani uchun xaridor talabini doimiy qondirish uchun zaxira zarur. Zaxira haddan tashqari ko‘paysa (<b>ortiqcha zaxira<\/b>), aylanma mablag‘lar <b>muzlash<\/b>iga, saqlash <b>xarajat<\/b>lari oshishiga, tovar sifati buzilishi va eskirishiga, zaxiralar <b>aylanma<\/b>sining sekinlashishiga olib keladi. Zaxira yetishmasa, <b>tanqislik<\/b> yuzaga keladi: savdoda uzilishlar, tovar aylanmasi va foydaning kamayishi, xaridorlarning yo‘qotilishi. Shuning uchun zaxiralar me’yoriy darajada ushlab turiladi va statistik nazorat qilinadi.", "t": "zaxira", "id": "sv-17", "src": "savdo"}, {"n": 18, "q": "Tovarlarning aylanish koeffitsiyenti nimani ifodalaydi? Uning oshishi yoki kamayishi qanday iqtisodiy mazmunga ega?", "k": "aylanish soni, tezlik, oshishi – tez aylanish, kamayishi – sekin aylanish.", "a": "Aylanish koeffitsienti tovar zaxirasining davr mobaynida necha marta sotilib yangilanganini, ya’ni <b>aylanish soni<\/b>ni ko‘rsatadi: <b>K = T / Z̄<\/b>, bu yerda T — davr tovar aylanmasi, Z̄ — o‘rtacha tovar zaxirasi; o‘lchov birligi — marta. U aylanish <b>tezlik<\/b>ining ko‘rsatkichi. Koeffitsient <b>oshishi — tez aylanish<\/b>: bir xil zaxira bilan ko‘proq tovar sotiladi, mablag‘lar bo‘shaydi, xarajat kamayadi, foyda oshadi. <b>Kamayishi — sekin aylanish<\/b>: zaxira to‘planib qolgan, mablag‘ muzlagan, samaradorlik pasaygan. Masalan, T = 1200, Z̄ = 200 mln so‘m bo‘lsa, K = 6 marta.", "t": "zaxira", "id": "sv-18", "src": "savdo"}, {"n": 19, "q": "Tovar zaxirasining bir aylanish davomiyligi qanday aniqlanadi va uning iqtisodiy mazmuni nimadan iborat?", "k": "kunlar soni, zaxira / kunlik aylanma, aylanish vaqti, tezlik.", "a": "Bir aylanish davomiyligi (<b>aylanish vaqti<\/b>) o‘rtacha zaxira necha kunda sotilishini ko‘rsatadi: <b>D = Z̄ / t = Z̄ · Dk / T<\/b>, ya’ni o‘rtacha <b>zaxira / kunlik aylanma<\/b>; bu yerda t = T / Dk — bir kunlik tovar aylanmasi, Dk — davrdagi <b>kunlar soni<\/b> (yil 360, chorak 90, oy 30). O‘lchov birligi — kun. Aylanish koeffitsienti bilan teskari bog‘langan: D = Dk / K. Kunlar soni kamaysa, aylanish <b>tezlik<\/b>i oshgan bo‘ladi. Iqtisodiy mazmuni: mavjud zaxira necha kunlik savdoni ta’minlashini va mablag‘lar tovarda qancha vaqt band bo‘lishini ko‘rsatadi.", "t": "zaxira", "id": "sv-19", "src": "savdo"}, {"n": 20, "q": "Narxlarning o‘zgarishi bilan sotilgan tovarlarning fizik hajmi o‘zgarishini statistik jihatdan qanday ajratib o‘rganish mumkin?", "k": "indeks usuli, narx indeksi, fizik hajm indeksi, deflyator.", "a": "Joriy narxlardagi tovar aylanmasining o‘zgarishi ikki omilga bog‘liq, ular <b>indeks usuli<\/b> bilan ajratiladi. <b>Narx indeksi<\/b> Ip = Σp₁q₁ / Σp₀q₁ narxlarning, <b>fizik hajm indeksi<\/b> Iq = Σp₀q₁ / Σp₀q₀ esa sotilgan tovarlar miqdorining o‘zgarishini o‘lchaydi; <b>Ipq = Ip × Iq<\/b>. Mutlaq o‘zgarish: narx hisobiga Σp₁q₁ − Σp₀q₁, hajm hisobiga Σp₀q₁ − Σp₀q₀. Agar faqat joriy narxlardagi aylanma va narx indeksi ma’lum bo‘lsa, aylanma narx indeksiga (<b>deflyator<\/b>) bo‘linadi: taqqoslama narxlardagi aylanma = Σp₁q₁ / Ip, so‘ng Iq = Ipq / Ip. Shu tarzda real (fizik) o‘sish inflyatsiya ta’siridan tozalanadi.", "t": "narx", "id": "sv-20", "src": "savdo"}, {"n": 21, "q": "Tovar aylanmasi tushunchasini izohlang va uning iqtisodiy ahamiyatini yoritib bering.", "k": "tovar sotish, pul tushumi, savdo hajmi, bozor talabi.", "a": "Tovar aylanmasi — tovarlarni pulga ayirboshlash jarayoni va uning pul ifodasidagi natijasi, ya’ni ma’lum davrda <b>tovar sotish<\/b>dan olingan <b>pul tushumi<\/b> (sotish narxlarida). U korxona, tarmoq yoki hududning <b>savdo hajmi<\/b>ni ifodalovchi asosiy ko‘rsatkich. Iqtisodiy ahamiyati: tovar aylanmasi orqali ishlab chiqarilgan mahsulot qiymati realizatsiya qilinadi; u aholining samarali <b>bozor talabi<\/b> va iste’mol darajasini aks ettiradi; korxonaning daromadi, foydasi, muomala xarajatlari, xodimlar soni va zaxiralari shu ko‘rsatkichga nisbatan rejalashtiriladi va baholanadi. Makro darajada u aholi turmush darajasi va iqtisodiy o‘sishni tahlil qilishda ishlatiladi.", "t": "aylanma", "id": "sv-21", "src": "savdo"}, {"n": 22, "q": "Tovar aylanmasining asosiy turlarini tavsiflang va ularni iqtisodiy mazmuniga ko‘ra tasniflang.", "k": "chakana, ulgurji, umumiy ovqatlanish, tashqi savdo.", "a": "Iqtisodiy mazmuniga ko‘ra tovar aylanmasi turlari: 1) <b>chakana<\/b> tovar aylanmasi — tovarlarni aholiga shaxsiy iste’mol uchun sotish; 2) <b>ulgurji<\/b> tovar aylanmasi — tovarlarni korxonalarga qayta sotish yoki ishlab chiqarish uchun yirik partiyalarda sotish; 3) <b>umumiy ovqatlanish<\/b> tovar aylanmasi — o‘z mahsuloti (taomlar) va sotib olingan tovarlarni iste’mol joyida sotish; 4) <b>tashqi savdo<\/b> aylanmasi — eksport va import yig‘indisi. Bundan tashqari aylanma yalpi va sof, omborxona va tranzit, mulkchilik shakllari, hududlar va tovar guruhlari (oziq-ovqat, nooziq-ovqat) bo‘yicha tasniflanadi.", "t": "aylanma", "id": "sv-22", "src": "savdo"}, {"n": 23, "q": "Chakana va ulgurji tovar aylanmasining mazmuni, shakllanishi hamda asosiy farqlarini tushuntiring.", "k": "aholi, korxona, yakuniy sotish, oraliq sotish.", "a": "Chakana tovar aylanmasi tovarlarni <b>aholi<\/b>ga sotishdan shakllanadi: do‘konlar, bozorlar, umumiy ovqatlanish va onlayn savdo tushumi yig‘indisi; bu <b>yakuniy sotish<\/b> — tovar muomaladan chiqib iste’molga o‘tadi. Ulgurji tovar aylanmasi tovarlarni <b>korxona<\/b>larga (chakana savdo, ishlab chiqarish, boshqa ulgurji tashkilotlar) sotishdan shakllanadi; bu <b>oraliq sotish<\/b> — tovar muomalada qoladi. Shakllanish manbai: ulgurjida omborxona va tranzit yetkazib berish, chakanada kassa tushumi. Asosiy farqlar: xaridor (aholi yoki korxona), maqsad (iste’mol yoki qayta sotish), partiya hajmi va narx turi (chakana yoki ulgurji narx).", "t": "aylanma", "id": "sv-23", "src": "savdo"}, {"n": 24, "q": "Tovar aylanmasini statistik o‘rganishning asosiy vazifalarini bayon qiling.", "k": "hajm, tarkib, dinamika, prognoz, omil tahlili.", "a": "Tovar aylanmasini statistik o‘rganish vazifalari: aylanmaning umumiy <b>hajm<\/b>ini joriy va taqqoslama narxlarda aniqlash; <b>tarkib<\/b>ini tovar guruhlari, savdo turlari, mulkchilik shakllari va hududlar bo‘yicha o‘rganish; <b>dinamika<\/b>sini (o‘sish sur’atlari, mavsumiylik, trend) tahlil qilish; reja va shartnomalar bajarilishini nazorat qilish; <b>omil tahlili<\/b> — narx, fizik hajm, xodimlar soni, mehnat unumdorligi, savdo maydoni ta’sirini indeks va korrelyatsiya usullari bilan baholash; aholining tovarlar bilan ta’minlanganligini aniqlash; kelajak uchun <b>prognoz<\/b> tuzish. Bu natijalar savdo siyosati va boshqaruv qarorlari uchun asos bo‘ladi.", "t": "aylanma", "id": "sv-24", "src": "savdo"}, {"n": 25, "q": "Tovar aylanmasi ko‘rsatkichlari tizimini tavsiflang. Absolyut, nisbiy va o‘rtacha ko‘rsatkichlarning o‘zaro farqini tushuntiring.", "k": "summa, foiz, o‘rtacha, hajm, daraja, tezlik.", "a": "Tovar aylanmasi ko‘rsatkichlari tizimi uch guruhdan iborat. Absolyut ko‘rsatkichlar aylanma <b>hajm<\/b>ini pul <b>summa<\/b>si yoki natural birliklarda ifodalaydi (yillik chakana aylanma, mlrd so‘m). Nisbiy ko‘rsatkichlar taqqoslash natijasi bo‘lib, <b>foiz<\/b> yoki koeffitsientda beriladi: o‘sish sur’ati, reja bajarilishi, tovar guruhlarining ulushi, aylanish <b>tezlik<\/b>i. <b>O‘rtacha<\/b> ko‘rsatkichlar tipik <b>daraja<\/b>ni ko‘rsatadi: bir do‘konga, bir xodimga, aholi jon boshiga o‘rtacha aylanma, o‘rtacha kunlik aylanma. Farqi: absolyut — “qancha?”, nisbiy — “necha marta / necha foiz?”, o‘rtacha — “bir birlikka qancha?” savoliga javob beradi.", "t": "aylanma", "id": "sv-25", "src": "savdo"}, {"n": 26, "q": "Chakana tovar aylanmasi statistikasining asosiy yo‘nalishlarini va uni shakllantiruvchi omillarni tushuntiring.", "k": "aholi daromadi, narx, talab, savdo tarmog‘i, mavsumiylik.", "a": "Asosiy yo‘nalishlar: chakana aylanma hajmi va tarkibini (tovar guruhlari, savdo shakllari, hududlar) aniqlash; dinamika va <b>mavsumiylik<\/b>ni (mavsumiylik indekslari) o‘rganish; aholi jon boshiga aylanmani hisoblash; aholining tovarlar bilan ta’minlanganligi va <b>talab<\/b> qondirilishini baholash; omillar tahlili. Shakllantiruvchi omillar: <b>aholi daromadi<\/b> (xarid qobiliyati); tovarlar <b>narx<\/b>i va inflyatsiya; aholi soni va tarkibi; <b>savdo tarmog‘i<\/b>ning rivojlanganligi (do‘konlar soni, savdo maydoni, onlayn savdo); tovar taklifi va assortiment; iste’mol odatlari. Omillar ta’siri korrelyatsion-regression tahlil va indekslar bilan miqdoriy baholanadi.", "t": "aylanma", "id": "sv-26", "src": "savdo"}, {"n": 27, "q": "Ulgurji tovar aylanmasi statistikasida qanday ko‘rsatkichlar o‘rganiladi? Ulgurji savdoning tovarlar harakatidagi o‘rnini izohlang.", "k": "ulgurji hajm, tarkib, vositachi, tovar harakati.", "a": "O‘rganiladigan ko‘rsatkichlar: <b>ulgurji hajm<\/b> (joriy va taqqoslama narxlarda); uning <b>tarkib<\/b>i — xaridorlar (chakana savdo, sanoat, eksport), tovar guruhlari va aylanma shakllari (omborxona va tranzit) bo‘yicha; dinamika va bir tekis sotish (ritmiklik) ko‘rsatkichlari; yalpi va sof aylanma, bo‘g‘inlilik koeffitsienti; yetkazib berish shartnomalari bajarilishi. Ulgurji savdo <b>tovar harakati<\/b>da ishlab chiqaruvchi bilan chakana savdo o‘rtasidagi <b>vositachi<\/b> bo‘g‘in: tovarni yirik partiyalarda xarid qiladi, saqlaydi, assortimentni shakllantiradi va chakana tarmoqqa taqsimlaydi. Bu ishlab chiqaruvchining sotish xarajatlarini kamaytiradi va chakana savdo ta’minotini barqaror qiladi.", "t": "aylanma", "id": "sv-27", "src": "savdo"}, {"n": 28, "q": "Tovar aylanmasining tarkibi va tarkibiy tuzilmasini statistik jihatdan qanday baholash mumkin?", "k": "guruhlash, ulush, tuzilma, assortiment, foiz.", "a": "Tarkib statistik <b>guruhlash<\/b> orqali o‘rganiladi: tovar guruhlari (oziq-ovqat, nooziq-ovqat), <b>assortiment<\/b> (alohida tovar turlari), savdo turlari, mulkchilik shakllari va hududlar bo‘yicha. So‘ng har bir guruhning umumiy aylanmadagi <b>ulush<\/b>i — tuzilma nisbiy miqdori hisoblanadi: <b>d = Tᵢ / ΣT × 100%<\/b> (<b>foiz<\/b>da). Bir necha davr <b>tuzilma<\/b>sini solishtirib tarkibiy siljishlar aniqlanadi: ulushlarning foiz punktlardagi o‘zgarishi va tarkibiy siljishlarning o‘rtacha (chiziqli yoki kvadratik) koeffitsienti. Masalan, nooziq-ovqat tovarlari ulushi 45% dan 52% ga oshsa (+7 foiz punkti), bu aholi daromadi o‘sganini ko‘rsatishi mumkin.", "t": "aylanma", "id": "sv-28", "src": "savdo"}, {"n": 29, "q": "Tovar aylanmasi dinamikasini statistik o‘rganishda qanday ko‘rsatkichlardan foydalaniladi? Bazisli va zanjirsimon usullarning mazmunini tushuntiring.", "k": "absolyut o‘sish, sur’at, temp, bazisli, zanjirsimon.", "a": "Dinamikani o‘rganishda <b>absolyut o‘sish<\/b>, o‘sish <b>sur’at<\/b>i, qo‘shimcha o‘sish <b>temp<\/b>i, 1% qo‘shimcha o‘sishning mutlaq qiymati, o‘rtacha daraja, o‘rtacha absolyut o‘sish va o‘rtacha o‘sish sur’ati hisoblanadi. <b>Bazisli<\/b> usulda har bir daraja bitta o‘zgarmas bazis (odatda birinchi yil) bilan taqqoslanadi: Δ = yᵢ − y₀, T = yᵢ / y₀ × 100%. <b>Zanjirsimon<\/b> usulda har bir daraja oldingi daraja bilan taqqoslanadi: Δ = yᵢ − yᵢ₋₁, T = yᵢ / yᵢ₋₁ × 100%. Bog‘liqlik: zanjirsimon absolyut o‘sishlar yig‘indisi bazisli o‘sishga, zanjirsimon o‘sish koeffitsientlari ko‘paytmasi bazisli koeffitsientga teng. O‘rtacha o‘sish sur’ati: <b>T̄ = ⁿ⁻¹√(yₙ / y₁)<\/b>.", "t": "aylanma", "id": "sv-29", "src": "savdo"}, {"n": 30, "q": "Tovar aylanmasiga ta’sir etuvchi asosiy iqtisodiy va ijtimoiy omillarni tavsiflang hamda ularning ta’sir yo‘nalishlarini tushuntiring.", "k": "daromad, narx, aholi soni, moda, reklama, inflyatsiya.", "a": "Iqtisodiy omillar: aholining pul <b>daromad<\/b>i — oshsa, aylanma (ayniqsa nooziq-ovqat tovarlari) oshadi; tovarlar <b>narx<\/b>i — narx oshsa, fizik hajm odatda kamayadi, joriy narxdagi aylanma esa oshishi mumkin; <b>inflyatsiya<\/b> — nominal aylanmani sun’iy oshiradi, real xarid qobiliyatini pasaytiradi; tovar taklifi va savdo tarmog‘ining rivojlanganligi. Ijtimoiy-demografik omillar: <b>aholi soni<\/b> va tarkibi (yosh, shahar-qishloq) — aholi ko‘paysa aylanma oshadi; <b>moda<\/b> va iste’mol didi — talab tarkibini o‘zgartiradi; <b>reklama<\/b> — talabni rag‘batlantiradi va aylanmani oshiradi. Omillar ta’siri indeks va korrelyatsion-regression tahlil bilan miqdoriy o‘lchanadi.", "t": "aylanma", "id": "sv-30", "src": "savdo"}, {"n": 31, "q": "Tovar aylanmasi indekslarining mazmunini ochib bering. Umumiy tovar aylanmasi, narx va fizik hajm indekslarining o‘zaro bog‘liqligini tushuntiring.", "k": "umumiy indeks, narx, fizik hajm.", "a": "Tovar aylanmasi indekslari aylanmaning nisbiy o‘zgarishi va unga ta’sir etgan omillarni ko‘rsatadi. <b>Umumiy indeks<\/b> (qiymat indeksi): Ipq = Σp₁q₁ / Σp₀q₀ — joriy narxlardagi aylanmaning umumiy o‘zgarishi. <b>Narx<\/b> indeksi (Paashe): Ip = Σp₁q₁ / Σp₀q₁ — narxlar o‘zgarishi ta’siri. <b>Fizik hajm<\/b> indeksi (Laspeyres): Iq = Σp₀q₁ / Σp₀q₀ — sotilgan tovarlar miqdori o‘zgarishi ta’siri. O‘zaro bog‘liqlik: <b>Ipq = Ip × Iq<\/b>; mutlaq o‘sish ham shunday ajraladi: Σp₁q₁ − Σp₀q₀ = (Σp₁q₁ − Σp₀q₁) + (Σp₀q₁ − Σp₀q₀). Ikki indeks ma’lum bo‘lsa, uchinchisi topiladi: masalan, Iq = Ipq / Ip.", "t": "aylanma", "id": "sv-31", "src": "savdo"}, {"n": 32, "q": "Aholi jon boshiga tovar aylanmasi ko‘rsatkichi qanday mazmunni ifodalaydi va undan statistik tahlilda qanday foydalaniladi?", "k": "aholi soni, o‘rtacha iste’mol, taqqoslash, hududlar.", "a": "<b>Aholi jon boshiga tovar aylanmasi = chakana tovar aylanmasi / o‘rtacha yillik aholi soni<\/b>. Bu intensivlik nisbiy miqdori bo‘lib, bir kishiga to‘g‘ri keladigan <b>o‘rtacha iste’mol<\/b> (xarid) hajmini ifodalaydi. Mutlaq aylanma <b>aholi soni<\/b> ta’sirida farq qiladi, jon boshiga ko‘rsatkich esa bu ta’sirni yo‘qotib, turli <b>hududlar<\/b>, mamlakatlar va davrlarni <b>taqqoslash<\/b> imkonini beradi. Tahlilda u aholi turmush darajasi va tovarlar bilan ta’minlanganligini baholash, hududlar reytingi, dinamika va prognoz uchun ishlatiladi. Real o‘zgarishni aniqlash uchun ko‘rsatkich taqqoslama narxlarda (narx indeksiga bo‘lib) hisoblanadi.", "t": "aylanma", "id": "sv-32", "src": "savdo"}, {"n": 33, "q": "Bir xodimga va bir birlik savdo maydoniga to‘g‘ri keladigan tovar aylanmasi ko‘rsatkichlarining iqtisodiy mazmunini tushuntiring.", "k": "mehnat unumdorligi, savdo maydoni, samaradorlik, yuklama.", "a": "Bir xodimga to‘g‘ri keladigan tovar aylanmasi = tovar aylanmasi / xodimlarning o‘rtacha ro‘yxatdagi soni; bu savdodagi <b>mehnat unumdorligi<\/b>ning asosiy ko‘rsatkichi bo‘lib, bir xodimga tushadigan ish <b>yuklama<\/b>sini ham ko‘rsatadi. Bir birlik (1 m²) <b>savdo maydoni<\/b>ga to‘g‘ri keladigan tovar aylanmasi = tovar aylanmasi / o‘rtacha savdo maydoni; u savdo maydonlaridan foydalanish <b>samaradorlik<\/b>ini ifodalaydi. Ikkala ko‘rsatkich oshsa, mehnat va moddiy-texnika resurslaridan samaraliroq foydalanilgan bo‘ladi. Ular omil tahlilida ishlatiladi: T = xodimlar soni × mehnat unumdorligi, demak aylanma o‘zgarishi xodimlar soni va unumdorlik ta’siriga ajratiladi.", "t": "aylanma", "id": "sv-33", "src": "savdo"}, {"n": 34, "q": "Tovar aylanmasini prognozlashning statistik usullarini tavsiflang. Trend, dinamik qatorlar va korrelyatsion-regression yondashuvlarning o‘rnini tushuntiring.", "k": "trend, ekstrapolyatsiya, korrelyatsiya, regressiya, prognoz.", "a": "Tovar aylanmasini <b>prognoz<\/b>lashda asosan dinamika qatorlari va korrelyatsion-regression usullar qo‘llaniladi. Dinamik qatorlar usulida o‘tgan yillar ma’lumotlari bo‘yicha <b>trend<\/b> tenglamasi (ŷ = a + bt) topiladi va kelgusi davrlarga davom ettiriladi — bu <b>ekstrapolyatsiya<\/b>; o‘rtacha absolyut o‘sish yoki o‘rtacha o‘sish sur’ati bo‘yicha ham prognoz qilinadi, mavsumiylik indekslari bilan oylik prognoz aniqlanadi. Korrelyatsion-regression yondashuvda avval <b>korrelyatsiya<\/b> bilan bog‘lanish zichligi tekshiriladi, so‘ng <b>regressiya<\/b> tenglamasi (ŷ = a + b₁x₁ + b₂x₂; x — daromad, narx) tuziladi va omillarning kutilayotgan qiymatlari qo‘yiladi. Ekstrapolyatsiya shart-sharoit barqaror bo‘lgan qisqa muddat uchun ishonchli.", "t": "aylanma", "id": "sv-34", "src": "savdo"}, {"n": 35, "q": "Tovar moddiy zaxiralari qanday mezonlar bo‘yicha tasniflanadi?", "k": "maqsad, joylashuv, normativ, mavsumiy, joriy, sug‘urta.", "a": "Tovar moddiy zaxiralari quyidagi mezonlar bo‘yicha tasniflanadi: 1) <b>maqsad<\/b> (vazifa) bo‘yicha — <b>joriy<\/b> zaxira (kundalik savdoni ta’minlash), <b>mavsumiy<\/b> zaxira (mavsumiy ishlab chiqarish yoki talab uchun), <b>sug‘urta<\/b> (kafolat) zaxirasi (yetkazib berishdagi uzilishlarga qarshi), maqsadli zaxiralar; 2) <b>joylashuv<\/b> bo‘yicha — ishlab chiqaruvchidagi, ulgurji va chakana savdodagi, yo‘ldagi (tranzit) zaxiralar; 3) <b>normativ<\/b>ga munosabati bo‘yicha — me’yoriy, me’yordan ortiq va me’yordan kam zaxiralar; 4) tovar guruhlari bo‘yicha; 5) ifodalanishi bo‘yicha — natural, pul ifodasida va kunlik savdo hisobida. Bu tasnif zaxiralarni boshqarish va nazorat qilishga yordam beradi.", "t": "zaxira", "id": "sv-35", "src": "savdo"}, {"n": 36, "q": "Tovar moddiy zaxiralari ma’lumotlari mavjud bo‘lgan davr bo‘yicha o‘rtacha tovar moddiy zaxiralarini hisoblash uchun o‘rtacha ko‘rsatkichlarning qanday shakllaridan foydalaniladi: a) davr boshi va oxiri; b) ular orasida teng vaqt oralig‘i bo‘lgan sanalar; c) ular orasida teng bo‘lmagan vaqt oralig‘i bo‘lgan sanalar?", "k": "o‘rtacha arifmetik, xronologik, vaznli xronologik.", "a": "Zaxira — moment (sana) ko‘rsatkichi, shuning uchun o‘rtacha shakli ma’lumot turiga qarab tanlanadi: a) faqat davr boshi va oxiri ma’lum bo‘lsa — oddiy <b>o‘rtacha arifmetik<\/b>: Z̄ = (Z₁ + Z₂) / 2; b) teng vaqt oralig‘idagi bir necha sana ma’lum bo‘lsa — <b>xronologik<\/b> o‘rtacha: <b>Z̄ = (½Z₁ + Z₂ + … + Zₙ₋₁ + ½Zₙ) / (n − 1)<\/b>; c) oraliqlar teng bo‘lmasa — <b>vaznli xronologik<\/b> o‘rtacha: Z̄ = Σ(Z̄ᵢ · tᵢ) / Σtᵢ, bu yerda Z̄ᵢ — qo‘shni ikki sana zaxiralarining o‘rtachasi, tᵢ — oraliq davomiyligi (kun). Masalan, 1-yanvar 100, 1-aprel 120, 1-iyul 140 bo‘lsa: Z̄ = (50 + 120 + 70) / 2 = 120.", "t": "zaxira", "id": "sv-36", "src": "savdo"}, {"n": 37, "q": "Tovarlarning aylanish tezligi va vaqtini hisoblash uchun formulalarni keltiring. Ularning o‘lchov birliklari nima va ularning iqtisodiy ahamiyati nimada?", "k": "aylanish koeffitsienti, kun, marta, tezlik, vaqt.", "a": "Aylanish <b>tezlik<\/b>i <b>aylanish koeffitsienti<\/b> bilan o‘lchanadi: <b>K = T / Z̄<\/b> (o‘lchov birligi — <b>marta<\/b>); u o‘rtacha zaxira davr mobaynida necha marta sotilib yangilanganini ko‘rsatadi. Aylanish <b>vaqt<\/b>i (davomiyligi): <b>D = Z̄ · Dk / T = Z̄ / t<\/b> (o‘lchov birligi — <b>kun<\/b>), bu yerda T — tovar aylanmasi, Z̄ — o‘rtacha zaxira, Dk — davrdagi kunlar soni, t — bir kunlik aylanma. Ular teskari bog‘langan: K = Dk / D, D = Dk / K. Iqtisodiy ahamiyati: K ning oshishi va D ning qisqarishi mablag‘larning tez aylanishi, saqlash xarajatlarining kamayishi va savdo samaradorligi oshishini bildiradi.", "t": "zaxira", "id": "sv-37", "src": "savdo"}, {"n": 38, "q": "Tovar-moddiy zaxiralar aylanmasini tezlashtirish yoki sekinlashtirish savdo natijalariga qanday ta’sir qiladi? Ushbu ta’sirni miqdoriy jihatdan aniqlash uchun formulalarni taqdim eting.", "k": "bo‘shatilgan mablag‘, qo‘shimcha mablag‘, tezlashtirish, sekinlashish.", "a": "Aylanmani <b>tezlashtirish<\/b> bir xil tovar aylanmasini kamroq zaxira bilan ta’minlashga imkon beradi: aylanma mablag‘lar bo‘shaydi, saqlash xarajatlari kamayadi, foyda oshadi. <b>Sekinlashish<\/b> esa zaxira to‘planishi, mablag‘larning muzlashi va qo‘shimcha xarajatlarga olib keladi. Miqdoriy ta’sir: <b>ΔZ = (D₁ − D₀) · t₁<\/b>, bu yerda D₁, D₀ — joriy va bazis davrda bir aylanish davomiyligi (kun), t₁ = T₁ / Dk — joriy davr bir kunlik tovar aylanmasi. ΔZ < 0 bo‘lsa — aylanmadan <b>bo‘shatilgan mablag‘<\/b>, ΔZ > 0 bo‘lsa — aylanishga jalb qilingan <b>qo‘shimcha mablag‘<\/b>. Masalan, D 40 kundan 36 kunga qisqarsa va t₁ = 5 mln so‘m bo‘lsa, (36 − 40) · 5 = −20, ya’ni 20 mln so‘m bo‘shaydi.", "t": "zaxira", "id": "sv-38", "src": "savdo"}, {"n": 39, "q": "Agar o‘rtacha tovar moddiy zaxiralari ko‘payib, aylanma mablag‘lar yanada sezilarli darajada oshsa, tovarlar aylanmasi tezligiga nima bo‘ladi? Ushbu dinamika o‘rtasidagi bog‘liqlik formulasini keltiring.", "k": "zaxira o‘sishi, aylanma sekinlashadi, formula, nisbat.", "a": "Aylanish tezligi tovar aylanmasi va o‘rtacha zaxira <b>nisbat<\/b>iga bog‘liq: K = T / Z̄, shuning uchun dinamikada <b>formula<\/b>: <b>I_K = I_T / I_Z<\/b> va <b>I_D = I_Z / I_T<\/b> (I — tegishli indekslar). Agar <b>zaxira o‘sishi<\/b> va unga bog‘langan aylanma mablag‘lar o‘sishi tovar aylanmasi o‘sishidan tezroq bo‘lsa (I_Z > I_T), aylanish koeffitsienti kamayadi, bir aylanish davomiyligi uzayadi — <b>aylanma sekinlashadi<\/b>. Bu mablag‘larning tovarda muzlab qolganini, ortiqcha yoki sotilmaydigan zaxira to‘planganini bildiradi. Aksincha, tovar aylanmasi zaxiradan tezroq o‘ssa (I_T > I_Z), aylanish tezlashadi. Masalan, zaxira 20%, aylanma 8% oshsa: I_K = 1,08 / 1,20 = 0,9, ya’ni tezlik 10% ga pasaygan.", "t": "zaxira", "id": "sv-39", "src": "savdo"}, {"n": 40, "q": "Statistik tadqiqotning uch bosqichini sanab bering va izohlang.", "k": "kuzatish, guruhlash, tahlil.", "a": "Statistik tadqiqot uch bosqichdan iborat: 1) statistik <b>kuzatish<\/b> — oldindan tuzilgan dastur asosida to‘plam birliklari (masalan, do‘konlar) haqida birlamchi ma’lumotlarni rejali yig‘ish; 2) jamlash va <b>guruhlash<\/b> — ma’lumotlarni tekshirish, muhim belgilar bo‘yicha bir jinsli guruhlarga ajratish, jami ko‘rsatkichlarni hisoblash va jadvallarda ifodalash; 3) <b>tahlil<\/b> — umumlashtiruvchi ko‘rsatkichlar (nisbiy va o‘rtacha miqdorlar, variatsiya, indekslar, dinamika, korrelyatsiya) hisoblash, qonuniyatlar va omillar ta’sirini aniqlash, xulosa va prognoz berish. Bosqichlar ketma-ket va o‘zaro bog‘liq: birinchi bosqichdagi xato keyingilariga o‘tadi.", "t": "predmet", "id": "sv-40", "src": "savdo"}, {"n": 41, "q": "Savdo statistikasida qo‘llaniladigan asosiy statistik metodlarni sanab bering.", "k": "kuzatish, guruhlash, indeks, dinamika, korrelyatsiya, balans.", "a": "Asosiy metodlar: ommaviy statistik <b>kuzatish<\/b> (hisobotlar, inventarizatsiya, so‘rovlar); <b>guruhlash<\/b> metodi (tovar guruhlari, korxonalar hajmi, hududlar bo‘yicha); umumlashtiruvchi ko‘rsatkichlar — nisbiy va o‘rtacha miqdorlar, variatsiya ko‘rsatkichlari; <b>indeks<\/b> metodi (narx, fizik hajm, tovar aylanmasi indekslari); <b>dinamika<\/b> qatorlari metodi (o‘sish sur’atlari, trend, mavsumiylik, prognoz); <b>korrelyatsiya<\/b> va regressiya tahlili (omillar bog‘lanishini o‘lchash); <b>balans<\/b> metodi (tovar resurslari balansi: Z₀ + Kirim = Sotuv + Boshqa chiqim + Z₁); tanlama kuzatish va grafik usul. Ular birgalikda qo‘llanilib, savdo jarayonlarini har tomonlama tavsiflaydi.", "t": "predmet", "id": "sv-41", "src": "savdo"}, {"n": 42, "q": "Dinamika qatorlari metodining savdo statistikasidagi ahamiyati nimada?", "k": "vaqt bo‘yicha o‘zgarish, tendensiya, prognoz.", "a": "Dinamika qatorlari metodi savdo ko‘rsatkichlarining (tovar aylanmasi, zaxiralar, narxlar, xodimlar soni) <b>vaqt bo‘yicha o‘zgarish<\/b>ini o‘rganadi. U absolyut o‘sish, o‘sish va qo‘shimcha o‘sish sur’atlari, o‘rtacha o‘sish sur’ati orqali o‘zgarish tezligi va jadalligini o‘lchaydi. Sirpanuvchi o‘rtacha va analitik tekislash (ŷ = a + bt) yordamida rivojlanishning asosiy <b>tendensiya<\/b>si (trend) aniqlanadi, mavsumiylik indekslari bilan savdoning oylar bo‘yicha tebranishi o‘rganiladi. Topilgan trend va mavsumiylik asosida tovar aylanmasi va talabning <b>prognoz<\/b>i tuziladi. Shu sababli bu metod savdoni rejalashtirish va zaxiralarni boshqarishda muhim.", "t": "predmet", "id": "sv-42", "src": "savdo"}, {"n": 43, "q": "Indeks metodining mohiyatini tushuntiring.", "k": "nisbiy o‘zgarish, taqqoslash, umumiy va individual indeks.", "a": "Indeks — murakkab hodisa darajasining vaqt, makon yoki reja bo‘yicha <b>nisbiy o‘zgarish<\/b>ini ko‘rsatuvchi ko‘rsatkich; u joriy (hisobot) darajani bazis daraja bilan <b>taqqoslash<\/b> natijasi. <b>Individual indeks<\/b> bitta tovar bo‘yicha hisoblanadi: ip = p₁ / p₀, iq = q₁ / q₀. <b>Umumiy indeks<\/b> to‘g‘ridan-to‘g‘ri qo‘shib bo‘lmaydigan turli tovarlar to‘plami bo‘yicha hisoblanadi, buning uchun vazn (birlashtiruvchi omil) kiritiladi: Ip = Σp₁q₁ / Σp₀q₁, Iq = Σp₀q₁ / Σp₀q₀. Umumiy indekslar agregat, o‘rtacha arifmetik va o‘rtacha garmonik shaklda, bazisli va zanjirsimon tarzda hisoblanadi. Indeks metodi o‘zgarishni omillarga ajratishga imkon beradi: Ipq = Ip × Iq.", "t": "predmet", "id": "sv-43", "src": "savdo"}, {"n": 44, "q": "Balans metodi qanday hollarda qo‘llaniladi?", "k": "kirim-chiqim, zaxira, tovar harakati, tenglik.", "a": "Balans metodi o‘zaro bog‘liq ko‘rsatkichlar o‘rtasidagi <b>tenglik<\/b>ni tekshirish va noma’lum ko‘rsatkichni topish uchun qo‘llaniladi. Savdoda u asosan <b>tovar harakati<\/b>ni tavsiflashda — tovar resurslari va ulardan foydalanish balansini tuzishda ishlatiladi: <b>Z₀ + Kirim = Sotuv + Boshqa chiqim + Z₁<\/b>, ya’ni davr boshidagi <b>zaxira<\/b> va tovar kirimi yig‘indisi sotuv, boshqa chiqim (tabiiy kamayish, qaytarish) va davr oxiridagi zaxira yig‘indisiga teng. Bu <b>kirim-chiqim<\/b> tenglamasidan tovar aylanmasi yoki zaxirani hisoblash, inventarizatsiya natijalarini tekshirish mumkin. Balans metodi savdo obyektlari soni harakati, xodimlar harakati va ish vaqti balanslarini tuzishda ham qo‘llaniladi.", "t": "predmet", "id": "sv-44", "src": "savdo"}, {"n": 45, "q": "Savdo statistikasining axborot bazasi qanday manbalardan shakllanadi?", "k": "hisobot, kassa, inventarizatsiya, so‘rov, bojxona.", "a": "Axborot bazasi quyidagi manbalardan shakllanadi: korxonalarning davlat statistika <b>hisobot<\/b>lari (Statistika agentligiga topshiriladi) va buxgalteriya hisobotlari; <b>kassa<\/b> ma’lumotlari — onlayn nazorat-kassa texnikasi va elektron to‘lov tizimlari orqali yig‘iladigan tushumlar; <b>inventarizatsiya<\/b> natijalari — zaxiralarning haqiqiy qoldig‘i; tanlama <b>so‘rov<\/b>lar — uy xo‘jaliklari, xaridorlar va kichik korxonalar so‘rovi, narxlarni ro‘yxatga olish; <b>bojxona<\/b> deklaratsiyalari — eksport va import ma’lumotlari; soliq va ma’muriy registrlar (korxonalar reestri). Manbalar o‘zaro solishtirilib, ma’lumotlarning to‘liqligi va ishonchliligi ta’minlanadi.", "t": "predmet", "id": "sv-45", "src": "savdo"}, {"n": 46, "q": "Big Data va raqamli texnologiyalar savdo statistikasiga qanday ta’sir ko‘rsatmoqda?", "k": "katta hajm, tezkorlik, avtomatlashtirish, onlayn savdo.", "a": "Big Data — kassa cheklari, elektron to‘lovlar, <b>onlayn savdo<\/b> platformalari, sodiqlik kartalari va internetdagi narxlar haqidagi <b>katta hajm<\/b>dagi ma’lumotlar; ular an’anaviy hisobotlarni to‘ldiradi. Afzalliklari: <b>tezkorlik<\/b> — ma’lumotlar real vaqtda olinadi, ko‘rsatkichlar tezroq e’lon qilinadi; ma’lumotlarni yig‘ish va qayta ishlashni <b>avtomatlashtirish<\/b> — korxonalarning hisobot yuki va xatolar kamayadi; batafsil tahlil — har bir tovar, hudud va xaridor guruhi bo‘yicha talab va narxlarni kuzatish, aniqroq prognoz. Muammolari: ma’lumotlar maxfiyligi va xavfsizligi, sifati va reprezentativligini ta’minlash, yangi metodologiya va mutaxassislar zarurligi.", "t": "predmet", "id": "sv-46", "src": "savdo"}, {"n": 47, "q": "Savdo statistikasining davlat boshqaruvidagi ahamiyatini tushuntiring.", "k": "qaror, nazorat, prognoz, siyosat, bozor.", "a": "Savdo statistikasi davlat organlariga ichki <b>bozor<\/b> holati — tovar aylanmasi, narxlar, zaxiralar, aholining tovarlar bilan ta’minlanganligi haqida ishonchli axborot beradi. Shu asosda savdo, narx, soliq va tashqi savdo <b>siyosat<\/b>i ishlab chiqiladi, boshqaruv <b>qaror<\/b>lari (tanqis tovarlar importini rag‘batlantirish, bojlarni o‘zgartirish, savdo infratuzilmasini rivojlantirish) qabul qilinadi. Statistika narxlar barqarorligi, raqobat va iste’molchilar huquqlariga rioya qilinishi <b>nazorat<\/b>ini ta’minlaydi. Uning ma’lumotlari tovar aylanmasi, iste’mol va inflyatsiya <b>prognoz<\/b>ini tuzish, davlat dasturlarini rejalashtirish va ularning bajarilishini baholashda ishlatiladi.", "t": "predmet", "id": "sv-47", "src": "savdo"}, {"n": 48, "q": "Tovar aylanmasi tushunchasini izohlang.", "k": "sotish, pul tushumi, savdo hajmi.", "a": "Tovar aylanmasi — tovarlarni pulga ayirboshlash jarayoni, ya’ni tovarlarning ishlab chiqarishdan iste’molga harakatlanishi davomida ularni <b>sotish<\/b>. Statistik ko‘rsatkich sifatida u ma’lum davrda (oy, chorak, yil) korxona, tarmoq yoki hudud tomonidan sotilgan tovarlarning pul ifodasidagi qiymati, ya’ni sotishdan olingan <b>pul tushumi<\/b>. Tovar aylanmasi <b>savdo hajmi<\/b>ni tavsiflovchi asosiy ko‘rsatkich bo‘lib, joriy va taqqoslama narxlarda hisoblanadi. U chakana, ulgurji va umumiy ovqatlanish aylanmasiga, shuningdek yalpi va sof aylanmaga bo‘linadi.", "t": "aylanma", "id": "sv-48", "src": "savdo"}, {"n": 49, "q": "Tovar harakati bo‘g‘inliligi nima?", "k": "ishlab chiqaruvchi, ulgurji, chakana, iste’molchi.", "a": "Tovar harakati bo‘g‘inliligi (zvenoliligi) — tovar <b>ishlab chiqaruvchi<\/b>dan yakuniy <b>iste’molchi<\/b>gacha yetib borguncha necha marta sotilishi, ya’ni nechta savdo bo‘g‘inidan o‘tishi. Masalan, ishlab chiqaruvchi → <b>ulgurji<\/b> baza → <b>chakana<\/b> do‘kon → iste’molchi zanjirida tovar ikki marta (ulgurji va chakana) sotiladi. Tovar har bir bo‘g‘inda sotilganda yalpi aylanmaga qayta kiradi, shuning uchun bo‘g‘inlilik yalpi va sof aylanma farqini keltirib chiqaradi. U bo‘g‘inlilik (zvenolik) koeffitsienti bilan o‘lchanadi: <b>K = yalpi tovar aylanmasi / sof tovar aylanmasi<\/b>. Bo‘g‘inlar ko‘p bo‘lsa, muomala xarajatlari oshadi va tovar qimmatlashadi.", "t": "aylanma", "id": "sv-49", "src": "savdo"}, {"n": 50, "q": "Yalpi va sof tovar aylanmasi tushunchalarini izohlang.", "k": "yalpi – barcha sotuv, sof – takroriy hisobsiz.", "a": "<b>Yalpi tovar aylanmasi<\/b> — tovar harakatining barcha bo‘g‘inlarida (ulgurji va chakana) amalga oshirilgan <b>barcha sotuv<\/b>lar yig‘indisi; unda bir tovar har bir bo‘g‘inda sotilgani uchun takroran hisobga olinadi. <b>Sof tovar aylanmasi<\/b> — savdo tizimidan tashqariga, ya’ni aholiga, ishlab chiqarish ehtiyojlari uchun korxonalarga va eksportga sotilgan tovarlar qiymati; u <b>takroriy hisobsiz<\/b> aniqlanadi: sof aylanma = yalpi aylanma − savdo tizimi ichida qayta sotish uchun sotilgan tovarlar. Ularning nisbati tovar harakati bo‘g‘inliligini ko‘rsatadi: <b>K = yalpi / sof tovar aylanmasi<\/b>. Masalan, yalpi 300, sof 200 mln so‘m bo‘lsa, K = 1,5.", "t": "aylanma", "id": "sv-50", "src": "savdo"}, {"n": 51, "q": "Tovar aylanmasi statistikasining asosiy vazifalari nimalardan iborat?", "k": "hajm, tarkib, dinamika, omil, prognoz.", "a": "Tovar aylanmasi statistikasining asosiy vazifalari: 1) aylanmaning <b>hajm<\/b>ini joriy va taqqoslama narxlarda aniqlash; 2) uning <b>tarkib<\/b>ini tovar guruhlari, savdo turlari, mulkchilik shakllari va hududlar bo‘yicha o‘rganish; 3) <b>dinamika<\/b>sini — o‘sish sur’atlari, trend va mavsumiylikni tahlil qilish; 4) reja va shartnomalar bajarilishini nazorat qilish; 5) narx, fizik hajm, xodimlar soni, mehnat unumdorligi, savdo maydoni kabi <b>omil<\/b>lar ta’sirini indeks va korrelyatsiya usullari bilan baholash; 6) aholining tovarlar bilan ta’minlanganligi va talab qondirilishini baholash; 7) kelajak uchun <b>prognoz<\/b> tuzish.", "t": "aylanma", "id": "sv-51", "src": "savdo"}, {"n": 52, "q": "Chakana tovar aylanmasi tarkibiga nimalar kiradi?", "k": "oziq-ovqat, nooziq-ovqat, xizmatlar, umumiy ovqatlanish.", "a": "Chakana tovar aylanmasi tarkibiga aholiga shaxsiy iste’mol uchun sotilgan barcha tovarlar qiymati kiradi. Tovar tarkibiga ko‘ra ikki yirik guruh ajratiladi: <b>oziq-ovqat<\/b> mahsulotlari (non, go‘sht, sut, meva-sabzavot, ichimliklar) va <b>nooziq-ovqat<\/b> tovarlari (kiyim-kechak, poyabzal, maishiy texnika, dori-darmon, yoqilg‘i va h.k.). Savdo kanallari bo‘yicha: do‘konlar va savdo tarmoqlari, dehqon bozorlari, onlayn savdo hamda <b>umumiy ovqatlanish<\/b> korxonalari aylanmasi. Aholiga ko‘rsatiladigan pullik <b>xizmatlar<\/b> (transport, aloqa, kommunal va maishiy xizmatlar) tovar emas, shuning uchun ular chakana tovar aylanmasidan alohida — pullik xizmatlar hajmi sifatida hisobga olinadi.", "t": "aylanma", "id": "sv-52", "src": "savdo"}, {"n": 53, "q": "O‘zbekiston qonunchiligida chakana savdo qanday ta’riflangan?", "k": "aholiga sotish, yakuniy iste’mol, qonun, chakana.", "a": "O‘zbekiston <b>qonun<\/b>chiligida (savdo faoliyatini tartibga soluvchi qonun hujjatlari va Fuqarolik kodeksidagi chakana oldi-sotdi qoidalarida) <b>chakana<\/b> savdo — tovarlarni <b>aholiga sotish<\/b>, ya’ni xaridorga shaxsiy, oilaviy, uy-ro‘zg‘or yoki tadbirkorlik bilan bog‘liq bo‘lmagan boshqa maqsadlarda <b>yakuniy iste’mol<\/b> uchun sotish bo‘yicha faoliyat sifatida ta’riflanadi. Chakana savdo statsionar do‘konlar, savdo majmualari, bozorlar, ko‘chma va elektron (onlayn) savdo shakllarida amalga oshiriladi. Ulgurji savdodan farqi — xaridor tovarni qayta sotish yoki ishlab chiqarish uchun emas, iste’mol uchun oladi. Statistikada chakana tovar aylanmasi aynan shu ta’rif asosida hisoblanadi.", "t": "aylanma", "id": "sv-53", "src": "savdo"}, {"n": 54, "q": "Aholi jon boshiga tovar aylanmasi qanday hisoblanadi?", "k": "tovar aylanmasi, aholi soni.", "a": "Aholi jon boshiga tovar aylanmasi davr (yil) uchun chakana <b>tovar aylanmasi<\/b>ni shu davrdagi o‘rtacha <b>aholi soni<\/b>ga bo‘lish orqali hisoblanadi: <b>T jon boshiga = T / S̄<\/b>. O‘rtacha yillik aholi soni yil boshi va oxiridagi aholi sonining o‘rtachasi (S̄ = (S₁ + S₂) / 2) yoki bir necha sana bo‘yicha xronologik o‘rtacha sifatida topiladi. Masalan, viloyatda chakana aylanma 12 000 mlrd so‘m, o‘rtacha aholi soni 3 mln kishi bo‘lsa, jon boshiga 4 mln so‘m to‘g‘ri keladi. Real dinamikani aniqlash uchun ko‘rsatkich narx indeksiga bo‘linib, taqqoslama narxlarda hisoblanadi.", "t": "aylanma", "id": "sv-54", "src": "savdo"}, {"n": 55, "q": "Savdo tarmog‘ining bo‘g‘inliligi qanday ko‘rsatkich bilan baholanadi?", "k": "bo‘g‘inlar soni, koeffitsient, ulgurji-chakana nisbati.", "a": "Savdo tarmog‘ining (tovar harakatining) bo‘g‘inliligi bo‘g‘inlilik (zvenolik) <b>koeffitsient<\/b>i bilan baholanadi: <b>K = yalpi tovar aylanmasi / sof tovar aylanmasi<\/b>. U tovar yakuniy iste’molchiga yetib borguncha o‘rtacha necha marta sotilganini, ya’ni o‘rtacha <b>bo‘g‘inlar soni<\/b>ni ko‘rsatadi; K = 1 bo‘lsa, tovar bevosita iste’molchiga sotilgan. Amalda u <b>ulgurji-chakana nisbati<\/b> orqali ham taxminan baholanadi: chakana aylanma sof aylanma deb olinsa, K ≈ (ulgurji + chakana aylanma) / chakana aylanma. Masalan, ulgurji 180, chakana 240 mln so‘m bo‘lsa, K = 420 / 240 = 1,75. Koeffitsient kamayishi tovar harakati soddalashgani va muomala xarajatlari tejalganini bildiradi.", "t": "aylanma", "id": "sv-55", "src": "savdo"}, {"n": 56, "q": "Tovar aylanmasi dinamikasini o‘rganishda qanday ko‘rsatkichlar qo‘llaniladi?", "k": "absolyut o‘sish, sur’at, temp, indeks.", "a": "Tovar aylanmasi dinamikasini o‘rganishda qo‘llaniladigan ko‘rsatkichlar: <b>absolyut o‘sish<\/b> (Δ = y₁ − y₀) — aylanma necha so‘mga o‘zgargani; o‘sish <b>sur’at<\/b>i (T = y₁ / y₀ × 100%) — necha foiz yoki marta o‘zgargani; qo‘shimcha o‘sish <b>temp<\/b>i (T − 100%) — necha foizga oshgani yoki kamaygani; 1% o‘sishning mutlaq qiymati (0,01 · y₀). Ular bazisli va zanjirsimon usulda hisoblanadi, shuningdek o‘rtacha absolyut o‘sish va o‘rtacha o‘sish sur’ati topiladi. Joriy narxlardagi o‘sishdan real o‘sishni ajratish uchun <b>indeks<\/b>lar ishlatiladi: tovar aylanmasi, narx va fizik hajm indekslari (Ipq = Ip × Iq).", "t": "aylanma", "id": "sv-56", "src": "savdo"}, {"n": 57, "q": "Tovar aylanmasini prognozlashda qanday usullardan foydalaniladi?", "k": "trend, ekstrapolyatsiya, korrelyatsiya, regressiya.", "a": "Prognozlash usullari: 1) <b>trend<\/b> usuli — dinamika qatorini analitik tekislab (ŷ = a + bt) tenglamaga kelgusi davr t qiymatini qo‘yish; 2) <b>ekstrapolyatsiya<\/b> — o‘rtacha absolyut o‘sish (yₙ₊ₗ = yₙ + Δ̄ · l) yoki o‘rtacha o‘sish sur’ati (yₙ₊ₗ = yₙ · T̄ˡ) asosida qatorni davom ettirish; 3) <b>korrelyatsiya<\/b> va <b>regressiya<\/b> usuli — aylanmani omillar (aholi daromadi, narx, aholi soni) bilan bog‘lovchi tenglama (ŷ = a + bx) tuzib, omillarning kutilayotgan qiymatlari bo‘yicha hisoblash; 4) mavsumiylik indekslari yordamida oylik yoki choraklik prognoz; 5) ekspert baholash. Prognoz nuqtaviy qiymat yoki ishonch oralig‘i ko‘rinishida beriladi.", "t": "aylanma", "id": "sv-57", "src": "savdo"}, {"n": 58, "q": "Tovar zaxiralari tushunchasini izohlang.", "k": "sotish uchun saqlanadigan tovar, ombor, zaxira.", "a": "Tovar <b>zaxira<\/b>lari — savdo korxonalarida, <b>ombor<\/b>larda va yo‘lda (tranzitda) turgan, kelgusida <b>sotish uchun saqlanadigan tovar<\/b>lar majmui. Ular tovar ishlab chiqarilishi va iste’moli o‘rtasidagi vaqt va joy bo‘yicha nomuvofiqlik tufayli zarur bo‘lib, savdoning uzluksizligini ta’minlaydi. Zaxiralar ma’lum sanaga (moment ko‘rsatkichi sifatida) natural birliklarda, pul ifodasida (chakana yoki xarid narxlarida) va kunlik savdo hisobida (necha kunlik savdoga yetishi) ifodalanadi. Ularning hajmi inventarizatsiya va buxgalteriya hisobi asosida aniqlanadi.", "t": "zaxira", "id": "sv-58", "src": "savdo"}, {"n": 59, "q": "Tovar zaxiralarining turlarini sanab bering.", "k": "joriy, mavsumiy, sug‘urta, normativ, ortiqcha.", "a": "Tovar zaxiralarining asosiy turlari: <b>joriy<\/b> zaxira — yetkazib berishlar oralig‘ida kundalik savdoni ta’minlaydi; <b>mavsumiy<\/b> zaxira — mavsumiy ishlab chiqariladigan (meva-sabzavot) yoki mavsumiy talabdagi tovarlar uchun oldindan to‘planadi; <b>sug‘urta<\/b> (kafolat) zaxirasi — yetkazib berishdagi uzilishlar yoki talab keskin oshganda savdoni ta’minlaydi; maqsadli zaxiralar (masalan, davlat zaxiralari). Me’yorga munosabati bo‘yicha: <b>normativ<\/b> (me’yoriy) zaxira — savdo uchun iqtisodiy asoslangan miqdor; <b>ortiqcha<\/b> zaxira — me’yordan ortiq, sekin sotiladigan va mablag‘ni muzlatuvchi tovarlar. Joylashuviga ko‘ra ishlab chiqaruvchi, ulgurji, chakana va yo‘ldagi zaxiralar farqlanadi.", "t": "zaxira", "id": "sv-59", "src": "savdo"}, {"n": 60, "q": "O‘rtacha tovar zaxirasi qanday hisoblanadi?", "k": "xronologik o‘rtacha, arifmetik o‘rtacha.", "a": "O‘rtacha tovar zaxirasi ma’lumotlarning berilishiga qarab hisoblanadi. Faqat davr boshi va oxiridagi zaxira ma’lum bo‘lsa — oddiy <b>arifmetik o‘rtacha<\/b>: Z̄ = (Z₁ + Z₂) / 2. Teng vaqt oralig‘idagi bir necha sana (masalan, har oy boshi) ma’lum bo‘lsa — <b>xronologik o‘rtacha<\/b>: <b>Z̄ = (½Z₁ + Z₂ + … + Zₙ₋₁ + ½Zₙ) / (n − 1)<\/b>. Oraliqlar teng bo‘lmasa — vaznli xronologik o‘rtacha: Z̄ = Σ(Z̄ᵢ · tᵢ) / Σtᵢ. Oraliq davrlar (oylar) uchun o‘rtacha zaxiralar berilsa, ularning oddiy arifmetik o‘rtachasi olinadi. Masalan, 1-yanvar 80, 1-fevral 90, 1-mart 100 bo‘lsa: Z̄ = (40 + 90 + 50) / 2 = 90.", "t": "zaxira", "id": "sv-60", "src": "savdo"}, {"n": 61, "q": "Tovar aylanish tezligi va vaqti o‘rtasidagi bog‘liqlikni tushuntiring.", "k": "tezlik, vaqt, teskari bog‘liqlik", "a": "Tovar aylanish <b>tezlik<\/b>i zaxiraning davr davomida necha marta aylanganini ko‘rsatadi: <b>K = T / Z̄<\/b>, bu yerda T – davr tovar aylanmasi, Z̄ – o‘rtacha tovar zaxirasi. Aylanish <b>vaqt<\/b>i (davomiyligi) bir aylanish necha kun davom etishini bildiradi: <b>t = Z̄ : (T / D) = D / K<\/b>, D – davrdagi kunlar soni (yil – 360, chorak – 90, oy – 30). Demak, ular o‘rtasida <b>teskari bog‘liqlik<\/b> mavjud: <b>K · t = D<\/b>. Aylanish tezligi oshsa, bir aylanish vaqti qisqaradi va aksincha. Masalan, yil davomida zaxira 12 marta aylansa, bir aylanish 360 / 12 = 30 kun davom etadi.", "t": "zaxira", "id": "sv-61", "src": "savdo"}, {"n": 62, "q": "Tovar zaxiralarining aylanish koeffitsienti nima?", "k": "aylanish soni, tezlik, marta", "a": "Tovar zaxiralarining <b>aylanish koeffitsienti<\/b> – davr mobaynida o‘rtacha tovar zaxirasi necha <b>marta<\/b> sotilib, yangilanganini ko‘rsatuvchi <b>aylanish soni<\/b>. U <b>K = T / Z̄<\/b> formula bilan aniqlanadi (T – davrdagi tovar aylanmasi, Z̄ – o‘rtacha tovar zaxirasi). Koeffitsient aylanish <b>tezlik<\/b>ining asosiy ko‘rsatkichi: u qancha katta bo‘lsa, tovarlar shuncha tez sotiladi. Masalan, yillik tovar aylanmasi 1 200 mln so‘m, o‘rtacha zaxira 100 mln so‘m bo‘lsa, K = 12 marta. Tovar aylanmasi va zaxira bir xil narxlarda baholangan bo‘lishi kerak.", "t": "zaxira", "id": "sv-62", "src": "savdo"}, {"n": 63, "q": "Tovar zaxiralarining me’yoriy darajasi nima?", "k": "normativ, kun, minimal, optimal", "a": "Tovar zaxiralarining <b>me’yoriy darajasi<\/b> (<b>normativ<\/b>) – savdoning uzluksizligini ta’minlash uchun zarur bo‘lgan rejali zaxira miqdori. U odatda necha <b>kun<\/b>lik savdoga yetishi bilan ifodalanadi, summada esa <b>Z me’yor = (T / D) · N kun<\/b> formula bilan topiladi, bu yerda T / D – bir kunlik tovar aylanmasi. Me’yor ishchi zaxira, sug‘urta (kafolat) zaxirasi va tovarni sotuvga tayyorlash vaqtini hisobga olib belgilanadi. <b>Minimal<\/b> zaxira – tanqislikning oldini oluvchi quyi chegara, <b>optimal<\/b> zaxira esa talabni eng kam xarajat bilan qondiradigan daraja. Haqiqiy zaxira me’yor bilan taqqoslanib, ortiqcha yoki yetishmovchilik aniqlanadi.", "t": "zaxira", "id": "sv-63", "src": "savdo"}, {"n": 64, "q": "Zaxiralarning yetarli emasligi qanday oqibatlarga olib keladi?", "k": "tanqislik, talab qondirilmasligi, savdo pasayishi", "a": "Tovar zaxiralari me’yordan kam bo‘lsa, savdoda uzilishlar va tovar <b>tanqisligi<\/b> yuzaga keladi. Natijada xaridorlar <b>talabi qondirilmasligi<\/b>, ularning raqobatchilarga o‘tib ketishi va assortimentning torayishi kuzatiladi. Bu bevosita tovar aylanmasining kamayishi – <b>savdo pasayishi<\/b>ga, demak, yalpi daromad va foydaning qisqarishiga olib keladi. Shoshilinch yetkazib berish transport xarajatlarini oshiradi va narxlar ko‘tarilishiga sabab bo‘lishi mumkin. Statistik jihatdan yetishmovchilik haqiqiy zaxirani me’yoriy zaxira bilan taqqoslash (Z haqiqiy &lt; Z me’yor) va zaxira necha kunlik savdoni ta’minlashi orqali baholanadi.", "t": "zaxira", "id": "sv-64", "src": "savdo"}, {"n": 65, "q": "Ortiqcha zaxiralar qanday muammolarni keltirib chiqaradi?", "k": "mablag‘ning muzlashi, xarajat, saqlash, yo‘qotish", "a": "Zaxiralar me’yordan ortiq bo‘lsa, aylanma <b>mablag‘ning muzlashi<\/b> yuz beradi: pul tovarga bog‘lanib qoladi va boshqa maqsadlarga ishlatilmaydi. Ortiqcha tovarni <b>saqlash<\/b> uchun ombor, ijara, energiya va sug‘urta <b>xarajat<\/b>lari oshadi, kredit hisobiga olingan bo‘lsa, foiz to‘lovlari ko‘payadi. Uzoq saqlanish natijasida tovarlar eskiradi, buziladi, yaroqlilik muddati o‘tadi – tabiiy kamayish va <b>yo‘qotish<\/b>lar ko‘payadi. Oxir-oqibat tovarlarni chegirma bilan sotishga majbur bo‘linadi va rentabellik pasayadi. Bu holat aylanish koeffitsientining kamayishi va bir aylanish davomiyligining uzayishida namoyon bo‘ladi.", "t": "zaxira", "id": "sv-65", "src": "savdo"}, {"n": 66, "q": "Tovar aylanuvchanligini tezlashtirishning iqtisodiy ahamiyati nimada?", "k": "mablag‘ bo‘shashi, xarajat kamayishi, foyda oshishi", "a": "Tovar aylanuvchanligi tezlashsa, bir xil tovar aylanmasini kamroq zaxira bilan amalga oshirish mumkin bo‘ladi va aylanma <b>mablag‘ bo‘shashi<\/b> ro‘y beradi. Bo‘shagan (yoki qo‘shimcha jalb qilingan) mablag‘ summasi: <b>ΔZ = (t1 − t0) · T1 / D<\/b>, bu yerda t1, t0 – hisobot va bazis davrdagi bir aylanish davomiyligi (kun), T1 / D – hisobot davridagi bir kunlik tovar aylanmasi; natija manfiy bo‘lsa, mablag‘ bo‘shagan. Saqlash, ijara, kredit foizlari va tabiiy yo‘qotishlar qisqarib, <b>xarajat kamayishi<\/b>ga erishiladi. Bir xil mablag‘ bilan ko‘proq sotish va xarajatlarni tejash <b>foyda oshishi<\/b>ga va rentabellikning ko‘tarilishiga olib keladi.", "t": "zaxira", "id": "sv-66", "src": "savdo"}, {"n": 67, "q": "Tovar zaxiralari statistikasining asosiy vazifalari nimalardan iborat?", "k": "hajm, tarkib, aylanish, ta’minlanganlik, prognoz", "a": "Tovar zaxiralari statistikasining asosiy vazifalari: zaxiralarning sana bo‘yicha va davr uchun o‘rtacha <b>hajm<\/b>ini aniqlash; ularning tovar guruhlari va joylashuvi (do‘kon, ombor, yo‘ldagi tovar) bo‘yicha <b>tarkib<\/b>ini o‘rganish. Zaxiralar <b>aylanish<\/b>ini – aylanish koeffitsienti va bir aylanish davomiyligini hisoblash. Savdoning zaxiralar bilan <b>ta’minlanganlik<\/b> darajasini (zaxira necha kunlik savdoga yetishini) baholash va haqiqiy zaxirani me’yor bilan taqqoslash. Shuningdek, zaxiralar dinamikasi va unga ta’sir etuvchi omillarni tahlil qilish hamda kelgusi davr uchun zaxiraga bo‘lgan ehtiyojni <b>prognoz<\/b> qilish.", "t": "zaxira", "id": "sv-67", "src": "savdo"}, {"n": 68, "q": "Narxlar statistikasining predmeti nimadan iborat?", "k": "narxlar, o‘zgarish, indeks, inflyatsiya", "a": "Narxlar statistikasining predmeti – tovar va xizmatlar <b>narxlar<\/b>ining darajasi, tarkibi hamda vaqt va hudud bo‘yicha <b>o‘zgarish<\/b>ini miqdoriy jihatdan o‘rganish. U chakana, ulgurji, ishlab chiqaruvchi va eksport-import narxlarini kuzatadi, o‘rtacha narxlar va narx tafovutlarini hisoblaydi. Narx dinamikasi narx <b>indeks<\/b>lari (individual, Laspeyres, Paashe, Fisher, iste’mol narxlari indeksi) yordamida tavsiflanadi. Shu asosda <b>inflyatsiya<\/b> darajasi, aholining real daromadlari va pulning xarid qobiliyati baholanadi. Narxlar statistikasi ma’lumotlari pul-kredit siyosati va makroiqtisodiy tahlil uchun asos bo‘ladi.", "t": "narx", "id": "sv-68", "src": "savdo"}, {"n": 69, "q": "O‘rtacha narx qanday hisoblanadi?", "k": "vaznli o‘rtacha, arifmetik, garmonik", "a": "Bir tovarning turli joylar yoki davrlar bo‘yicha o‘rtacha narxi sotilgan miqdor bilan vaznlangan <b>vaznli o‘rtacha<\/b> sifatida hisoblanadi. Narxlar (p) va sotilgan miqdorlar (q) ma’lum bo‘lsa, vaznli <b>arifmetik<\/b> o‘rtacha qo‘llaniladi: <b>p̄ = Σpq / Σq<\/b>. Narxlar va sotuv summalari (M = pq) ma’lum bo‘lib, miqdorlar noma’lum bo‘lsa, vaznli <b>garmonik<\/b> o‘rtacha qo‘llaniladi: <b>p̄ = ΣM / Σ(M / p)<\/b>. Ikkala holatda ham o‘rtacha narx – jami sotuv summasining jami sotilgan miqdorga nisbati. Oddiy arifmetik o‘rtacha faqat sotuv hajmlari teng bo‘lganda to‘g‘ri natija beradi.", "t": "narx", "id": "sv-69", "src": "savdo"}, {"n": 70, "q": "Individual va umumiy narx indekslari o‘rtasidagi farqni tushuntiring.", "k": "bitta tovar, tovarlar guruhi, individual, umumiy", "a": "<b>Individual<\/b> narx indeksi <b>bitta tovar<\/b> narxining o‘zgarishini ko‘rsatadi: <b>ip = p1 / p0<\/b>, bu yerda p1 va p0 – joriy va bazis davr narxlari. <b>Umumiy<\/b> (agregat) narx indeksi bevosita qo‘shib bo‘lmaydigan turli xil <b>tovarlar guruhi<\/b> narxlarining o‘rtacha o‘zgarishini tavsiflaydi: <b>Ip = Σp1q1 / Σp0q1<\/b> (Paashe) yoki Σp1q0 / Σp0q0 (Laspeyres). Umumiy indeksda sotilgan miqdorlar (q) vazn vazifasini bajaradi va turli tovarlarni solishtirish imkonini beradi. Individual indekslar har bir tovar bo‘yicha, umumiy indeks esa butun guruh bo‘yicha xulosa beradi.", "t": "narx", "id": "sv-70", "src": "savdo"}, {"n": 71, "q": "Laspeyres va Paashe indekslari o‘rtasidagi farqni izohlang.", "k": "bazis savat, joriy savat, vazn", "a": "Ikkala indeks ham agregat narx indeksi, farqi <b>vazn<\/b> sifatida qaysi davr miqdorlari olinishida. <b>Laspeyres<\/b> indeksi <b>bazis savat<\/b> (bazis davr miqdorlari q0) bo‘yicha hisoblanadi: <b>Ip(L) = Σp1q0 / Σp0q0<\/b>; u bazis davr tovarlar to‘plami narxi qanchaga o‘zgarganini ko‘rsatadi. <b>Paashe<\/b> indeksi <b>joriy savat<\/b> (joriy davr miqdorlari q1) bo‘yicha hisoblanadi: <b>Ip(P) = Σp1q1 / Σp0q1<\/b>; u joriy davrda sotilgan tovarlar narxi o‘zgarishini va narx hisobiga xaridorlarning ortiqcha sarfi yoki tejamini (Σp1q1 − Σp0q1) ko‘rsatadi. Laspeyres iste’mol tarkibi o‘zgarishini hisobga olmagani uchun odatda narx o‘sishini biroz oshirib, Paashe esa kamaytirib ko‘rsatadi.", "t": "narx", "id": "sv-71", "src": "savdo"}, {"n": 72, "q": "Fisher indeksi nima va u nima uchun ishlatiladi?", "k": "geometrik o‘rtacha, ideal indeks, Laspeyres va Paashe", "a": "<b>Fisher indeksi<\/b> – <b>Laspeyres va Paashe<\/b> indekslarining <b>geometrik o‘rtacha<\/b>si: <b>Ip(F) = √(Ip(L) · Ip(P)) = √[(Σp1q0 / Σp0q0) · (Σp1q1 / Σp0q1)]<\/b>. U bazis va joriy davr vaznlarini bir vaqtda hisobga oladi, shuning uchun Laspeyres indeksining yuqoriga va Paashe indeksining pastga siljishini muvozanatlaydi. Fisher indeksi vaqt bo‘yicha qaytuvchanlik va omillar bo‘yicha qaytuvchanlik testlarini qanoatlantirgani uchun <b>ideal indeks<\/b> deb ataladi. U tovarlar tarkibi sezilarli o‘zgargan davrlarni taqqoslashda va xalqaro taqqoslashlarda ishlatiladi.", "t": "narx", "id": "sv-72", "src": "savdo"}, {"n": 73, "q": "Iste’mol narxlari indeksi (CPI) nimani o‘lchaydi?", "k": "iste’mol savati, narx o‘zgarishi, inflyatsiya", "a": "<b>Iste’mol narxlari indeksi (CPI)<\/b> aholi iste’mol qiladigan tovar va xizmatlar to‘plami – <b>iste’mol savati<\/b> qiymatining vaqt bo‘yicha <b>narx o‘zgarishi<\/b>ni o‘lchaydi. U odatda Laspeyres formulasi bo‘yicha qat’iy savat asosida hisoblanadi: <b>CPI = Σp1q0 / Σp0q0 · 100<\/b>, bu yerda q0 – bazis davr iste’mol tarkibi. Savatga oziq-ovqat, nooziq-ovqat tovarlari va pullik xizmatlar kiritiladi, vaznlar uy xo‘jaliklari xarajatlari tarkibi asosida belgilanadi. CPI <b>inflyatsiya<\/b>ning asosiy o‘lchovi bo‘lib, real daromadlarni hisoblash, pensiya va ish haqini indeksatsiya qilishda qo‘llaniladi.", "t": "narx", "id": "sv-73", "src": "savdo"}, {"n": 74, "q": "Inflyatsiya darajasi qanday hisoblanadi?", "k": "CPI o‘zgarishi, foiz, narx o‘sishi", "a": "<b>Inflyatsiya darajasi<\/b> – ma’lum davrda umumiy <b>narx o‘sishi<\/b>ning nisbiy o‘lchovi bo‘lib, <b>CPI o‘zgarishi<\/b> orqali <b>foiz<\/b>da ifodalanadi: <b>π = (CPI1 / CPI0 − 1) · 100%<\/b>. Agar CPI oldingi davrga nisbatan foizda berilgan bo‘lsa, π = CPI − 100; masalan, CPI = 108,5% bo‘lsa, inflyatsiya 8,5% ga teng. Bir necha oylik zanjirsimon indekslar ko‘paytirilib davr uchun umumiy indeks topiladi: I = i1 · i2 · … · in. Inflyatsiya darajasi asosida pulning xarid qobiliyati indeksi (1 / CPI) va real daromadlar o‘zgarishi hisoblanadi.", "t": "narx", "id": "sv-74", "src": "savdo"}, {"n": 75, "q": "Narxlar statistikasida qanday axborot manbalari qo‘llaniladi?", "k": "ro‘yxatlar, kuzatish, hisobot, onlayn narxlar", "a": "Narxlar statistikasining asosiy axborot manbalari: savdo korxonalari va bozorlarda narxlarni muntazam (tanlanma) ro‘yxatga olish – narxlarni <b>kuzatish<\/b>; korxonalarning statistik <b>hisobot<\/b>lari (sotuv, ulgurji va ishlab chiqaruvchi narxlari). Kuzatish uchun vakil tovar va xizmatlar <b>ro‘yxatlar<\/b>i hamda narxlari qayd etiladigan savdo obyektlari ro‘yxati tuziladi. Bundan tashqari, b
