><td>1<\/td><td>3200<\/td><td>4<\/td><td>2900<\/td><td>4<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>2800<\/td><td>2<\/td><td>2700<\/td><td>2<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>4100<\/td><td>7<\/td><td>3300<\/td><td>6<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>3600<\/td><td>5<\/td><td>3400<\/td><td>7<\/td><td>-2<\/td><td>4<\/td><\/tr><tr><td>5<\/td><td>2500<\/td><td>1<\/td><td>2300<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>6<\/td><td>3900<\/td><td>6<\/td><td>3100<\/td><td>5<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>7<\/td><td>3000<\/td><td>3<\/td><td>2800<\/td><td>3<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>8<\/td><td>4500<\/td><td>8<\/td><td>3800<\/td><td>8<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>Jami<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>0<\/td><td>6<\/td><\/tr><\/table><p><b>b)<\/b> ρ = 1 − 6Σd²/(n(n² − 1)) = 1 − 6·6/(8·63) = 1 − 36/504 = <b>0,929<\/b>.<\/p><p><b>c)<\/b> t = ρ·√((n − 2)/(1 − ρ²)) = 0,929·√(6/(1 − 0,862)) = <b>6,13<\/b>. t = 6,13 &gt; tkr = 2,447 (p ≈ 0,0009) → bog‘lanish statistik ahamiyatli.<\/p>", "ans": "ρ ≈ 0,93: aholi jon boshiga daromad va iste’mol xarajati o‘rtasida juda kuchli to‘g‘ri bog‘lanish bor; t = 6,13 &gt; 2,447, bog‘lanish ahamiyatli.", "t": "boglanish", "status": "rewritten", "note": "Original was a generic regression placeholder, not a Spearman solution; correct ρ = 0,929, t = 6,13 > 2,447.", "id": "sm-34", "src": "stat"}, {"n": 35, "part": 2, "title": "Juft chiziqli regressiya va korrelyatsiya", "cond": "<p>8 ta korxonada reklama xarajatlari (x, mln so‘m) va sotuv hajmi (y, mln so‘m):<\/p><table><tr><th>Korxona<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><\/tr><tr><td>x<\/td><td>5<\/td><td>6<\/td><td>8<\/td><td>9<\/td><td>11<\/td><td>12<\/td><td>14<\/td><td>15<\/td><\/tr><tr><td>y<\/td><td>41<\/td><td>46<\/td><td>50<\/td><td>56<\/td><td>61<\/td><td>68<\/td><td>73<\/td><td>80<\/td><\/tr><\/table><p>a) Chiziqli regressiya tenglamasi ŷ = a + bx parametrlarini toping; b ning ma’nosini izohlang. b) Pirson korrelyatsiya koeffitsienti r va R² ni hisoblang.<\/p><p>c) x = 10 uchun sotuvni bashorat qiling; x = 30 uchun bashorat nima uchun ishonchsiz?<\/p>", "sol": "<table><tr><th>№<\/th><th>x<\/th><th>y<\/th><th>x²<\/th><th>xy<\/th><th>y²<\/th><\/tr><tr><td>1<\/td><td>5<\/td><td>41<\/td><td>25<\/td><td>205<\/td><td>1681<\/td><\/tr><tr><td>2<\/td><td>6<\/td><td>46<\/td><td>36<\/td><td>276<\/td><td>2116<\/td><\/tr><tr><td>3<\/td><td>8<\/td><td>50<\/td><td>64<\/td><td>400<\/td><td>2500<\/td><\/tr><tr><td>4<\/td><td>9<\/td><td>56<\/td><td>81<\/td><td>504<\/td><td>3136<\/td><\/tr><tr><td>5<\/td><td>11<\/td><td>61<\/td><td>121<\/td><td>671<\/td><td>3721<\/td><\/tr><tr><td>6<\/td><td>12<\/td><td>68<\/td><td>144<\/td><td>816<\/td><td>4624<\/td><\/tr><tr><td>7<\/td><td>14<\/td><td>73<\/td><td>196<\/td><td>1022<\/td><td>5329<\/td><\/tr><tr><td>8<\/td><td>15<\/td><td>80<\/td><td>225<\/td><td>1200<\/td><td>6400<\/td><\/tr><tr><td>Σ<\/td><td>80<\/td><td>475<\/td><td>892<\/td><td>5094<\/td><td>29507<\/td><\/tr><\/table><p><b>a)<\/b> x̄ = 80/8 = 10,00; ȳ = 475/8 = 59,375.<\/p><p>b = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²) = (8·5094 − 80·475)/(8·892 − 80²) = 2752/736 = <b>3,739<\/b><\/p><p>a = ȳ − b·x̄ = 59,375 − 3,739·10 = <b>21,98<\/b> → <b>ŷ = 21,98 + 3,739x<\/b><\/p><p>b ning ma’nosi: reklama xarajati 1 mln so‘mga oshsa, sotuv hajmi o‘rtacha 3,74 mln so‘mga oshadi.<\/p><p><b>b)<\/b> r = Sxy/√(Sxx·Syy) = 344,0/√(92,0·1 303,875) = <b>0,9932<\/b>; R² = r² = <b>0,9865<\/b> (sotuv variatsiyasining 98,6% i reklama bilan tushuntiriladi).<\/p><p><b>c)<\/b> x = 10: ŷ = 21,98 + 3,739·10 = <b>59,38 mln so‘m<\/b>. x = 30 uchun ŷ = 134,16 chiqadi, lekin bu ishonchsiz: x = 30 kuzatilgan oraliqdan (5–15) ancha tashqarida — ekstrapolyatsiya; bu oraliqdan tashqarida bog‘lanish chiziqli bo‘lib qolishiga kafolat yo‘q (to‘yinish effekti).<\/p>", "ans": "ŷ = 21,98 + 3,739x; r = 0,993, R² = 0,986 — juda kuchli to‘g‘ri bog‘lanish. x = 10 da sotuv ≈ 59,4 mln so‘m; x = 30 uchun prognoz ekstrapolyatsiya bo‘lgani uchun ishonchsiz.", "t": "boglanish", "status": "rewritten", "note": "Original was a generic placeholder; correct b = 3,739, a = 21,98, r = 0,993, R² = 0,986, ŷ(10) = 59,38.", "id": "sm-35", "src": "stat"}, {"n": 36, "part": 2, "title": "Regressiya koeffitsientining ahamiyatliligi", "cond": "<p>Reklama xarajatlari va sotuv hajmi bo‘yicha n = 20 ta kuzatuv asosida regressiya tenglamasi tuzildi: ŷ = 120 + 2,5x; b ning standart xatosi SX(b) = 0,8; R² = 0,64.<\/p><p>a) r ni (b musbat ekanini hisobga olib) toping.<\/p><p>b) H₀: β = 0 ni tekshiring (α = 0,05; t₀,₀₂₅;₁₈ = 2,101): t va p-qiymatni hisoblang.<\/p><p>c) β uchun 95% ishonch intervalini toping va iqtisodiy izoh bering.<\/p>", "sol": "<p><b>a)<\/b> Juft regressiyada R² = r², b &gt; 0 bo‘lgani uchun r musbat: r = √0,64 = <b>0,8<\/b>.<\/p><p><b>b)<\/b> H₀: β = 0, H₁: β ≠ 0. t = b/SX(b) = 2,5/0,8 = <b>3,125<\/b>; df = n − 2 = 18. t = 3,125 &gt; 2,101, p ≈ 0,0059 &lt; 0,05 → <b>H₀ rad etiladi<\/b>, reklama sotuvga ahamiyatli ta’sir qiladi.<\/p><p><b>c)<\/b> β uchun 95% ishonch oralig‘i: b ± t·SX(b) = 2,5 ± 2,101·0,8 = 2,5 ± 1,68 → <b>[0,82; 4,18]<\/b>. Izoh: reklama xarajati 1 birlikka oshsa, sotuv 95% ishonch bilan 0,82 dan 4,18 birlikkacha oshadi; oraliq 0 ni o‘z ichiga olmaydi — bu b) dagi xulosaga mos.<\/p>", "ans": "r = 0,8; t = 3,125 &gt; 2,101 (p ≈ 0,006) — β ahamiyatli; 95% ishonch oralig‘i [0,82; 4,18].", "t": "boglanish", "status": "rewritten", "note": "Original was a generic placeholder; correct r = 0,8, t = 3,125 (p ≈ 0,006), 95% CI for β = [0,82; 4,18].", "id": "sm-36", "src": "stat"}, {"n": 37, "part": 2, "title": "Ko‘p omilli regressiya: koeffitsientlar va t-test", "cond": "<p>n = 100 nafar xodim bo‘yicha oylik ish haqi (y, ming so‘m) regressiyasi natijalari:<\/p><table><tr><th>O‘zgaruvchi<\/th><th>Koeffitsient<\/th><th>Standart xato<\/th><\/tr><tr><td>Doimiy<\/td><td>2 100<\/td><td>500<\/td><\/tr><tr><td>Ish staji (yil)<\/td><td>180<\/td><td>40<\/td><\/tr><tr><td>Ta’lim (yil)<\/td><td>350<\/td><td>95<\/td><\/tr><tr><td>Erkak (1) / ayol (0)<\/td><td>600<\/td><td>310<\/td><\/tr><\/table><p>a) Har bir koeffitsientni izohlang.<\/p><p>b) t-statistika va p-qiymatlarni hisoblang (df = 96; α = 0,05; kritik t ≈ 1,985).<\/p><p>c) 10 yil staji va 16 yil ta’limga ega erkak xodimning bashorat qilinadigan ish haqini toping.<\/p>", "sol": "<p><b>a)<\/b> Doimiy had 2 100 — staji va ta’limi 0 bo‘lgan ayol xodimning nazariy ish haqi (amaliy ma’nosi cheklangan). Staj: boshqa omillar o‘zgarmaganda har qo‘shimcha yil ish haqini o‘rtacha <b>180 ming so‘m<\/b>ga oshiradi. Ta’lim: har qo‘shimcha yil — <b>+350 ming so‘m<\/b>. Jins: boshqa sharoitlar teng bo‘lsa, erkak xodim ayolga nisbatan o‘rtacha <b>600 ming so‘m<\/b> ko‘p oladi.<\/p><p><b>b)<\/b> t = koeffitsient / standart xato; df = 96, tkr ≈ 1,985:<\/p><table><tr><th>O‘zgaruvchi<\/th><th>Koeff.<\/th><th>SX<\/th><th>t<\/th><th>p-qiymat<\/th><th>Ahamiyatli (α = 0,05)?<\/th><\/tr><tr><td>Doimiy<\/td><td>2 100<\/td><td>500<\/td><td>4,20<\/td><td>&lt; 0,001<\/td><td>ha<\/td><\/tr><tr><td>Ish staji<\/td><td>180<\/td><td>40<\/td><td>4,50<\/td><td>&lt; 0,001<\/td><td>ha<\/td><\/tr><tr><td>Ta’lim<\/td><td>350<\/td><td>95<\/td><td>3,68<\/td><td>&lt; 0,001<\/td><td>ha<\/td><\/tr><tr><td>Erkak (dummy)<\/td><td>600<\/td><td>310<\/td><td>1,94<\/td><td>0,056<\/td><td>yo‘q<\/td><\/tr><\/table><p>Doimiy, staj va ta’lim ahamiyatli; jins koeffitsienti (t = 1,94 &lt; 1,985, p ≈ 0,056) 5% darajada <b>ahamiyatli emas<\/b> (10% darajada ahamiyatli).<\/p><p><b>c)<\/b> ŷ = 2 100 + 180·10 + 350·16 + 600·1 = 2 100 + 1 800 + 5 600 + 600 = <b>10 100 ming so‘m<\/b>.<\/p>", "ans": "Staj (t = 4,5) va ta’lim (t = 3,68) ish haqiga ahamiyatli ta’sir qiladi, jins farqi (t = 1,94) 5% darajada ahamiyatli emas. 10 yil staj va 16 yil ta’limli erkak uchun bashorat — 10 100 ming so‘m.", "t": "boglanish", "status": "rewritten", "note": "Original was a generic placeholder; correct t = 4,20/4,50/3,68/1,94 (gender not significant at 5%), prediction 10 100 ming so‘m.", "id": "sm-37", "src": "stat"}, {"n": 38, "part": 3, "title": "Moslashtirilgan R² va F-test", "cond": "<p>n = 40 ta kuzatuv, k = 3 ta omilli modelning determinatsiya koeffitsienti R² = 0,74. a) Moslashtirilgan R² ni hisoblang.<\/p><p>b) Modelning umumiy ahamiyatliligi uchun F-statistikani toping va qaror qabul qiling (kritik F₀,₀₅; 3; 36 ≈ 2,87).<\/p><p>c) Model faqat 1 ta omil qo‘shsa-yu R² deyarli o‘zgarmasa, Adj. R² qanday o‘zgaradi? Nima uchun?<\/p>", "sol": "<p><b>a)<\/b> R̄² = 1 − (1 − R²)·(n − 1)/(n − k − 1) = 1 − 0,26·39/36 = <b>0,7183<\/b>.<\/p><p><b>b)<\/b> F = (R²/k)/((1 − R²)/(n − k − 1)) = (0,74/3)/(0,26/36) = 0,2467/0,00722 = <b>34,15<\/b>. F = 34,15 &gt; Fkr = 2,87 (p &lt; 0,001) → H₀ (barcha βⱼ = 0) rad etiladi, model umuman ahamiyatli.<\/p><p><b>c)<\/b> Yangi omil qo‘shilsa-yu R² o‘zgarmasa, R̄² <b>kamayadi<\/b>: masalan, k = 4 da R̄² = 1 − 0,26·39/35 = 0,7103 &lt; 0,7183. Sababi: moslashtirilgan R² erkinlik darajasi (n − k − 1) kamayishi uchun “jarima” beradi; foydasiz omil faqat modelni murakkablashtiradi.<\/p>", "ans": "R̄² = 0,718; F = 34,15 &gt; 2,87 — model ahamiyatli. Foydasiz omil qo‘shilsa R̄² pasayadi.", "t": "boglanish", "status": "ok", "note": "Correct (Adj.R² = 0,7183, F = 34,15); condition text had been merged into example 37 and is restored here.", "id": "sm-38", "src": "stat"}, {"n": 39, "part": 2, "title": "Dummy o‘zgaruvchili regressiya", "cond": "<p>Do‘konlar oylik tushumi (y, mln so‘m) modeli: ŷ = 50 + 4x + 12·D₁ + 7·D₂, bu yerda x — xodimlar soni; D₁ = 1 (Toshkent), D₂ = 1 (Samarqand); bazaviy toifa — Namangan (D₁ = D₂ = 0). a) Koeffitsientlarni izohlang.<\/p><p>b) x = 10 xodimli do‘kon uchun uchala shahar bo‘yicha bashoratni hisoblang.<\/p><p>c) Nima uchun uchta shahar uchun uchta dummy kiritilmaydi (dummy tuzog‘i)?<\/p>", "sol": "<p><b>a)<\/b> 50 — bazaviy toifa (Namangan) do‘konining x = 0 dagi nazariy tushumi; 4 — boshqa sharoitlar teng bo‘lsa, har qo‘shimcha xodim tushumni o‘rtacha 4 mln so‘mga oshiradi; 12 — Toshkent do‘koni bir xil xodim sonida Namangandagidan o‘rtacha 12 mln so‘m ko‘p tushum oladi; 7 — Samarqand do‘koni Namangandan 7 mln so‘m ko‘p.<\/p><p><b>b)<\/b> x = 10: Namangan ŷ = 50 + 4·10 = <b>90<\/b>; Samarqand ŷ = 90 + 7 = <b>97<\/b>; Toshkent ŷ = 90 + 12 = <b>102<\/b> mln so‘m.<\/p><p><b>c)<\/b> Uchta dummy (D₁ + D₂ + D₃ = 1) doimiy had bilan birga kiritilsa, ular yig‘indisi doimiy hadga teng bo‘lib, mukammal multikollinearlik yuzaga keladi va parametrlarni baholab bo‘lmaydi (“dummy tuzog‘i”). Shu sababli m ta toifa uchun m − 1 ta dummy kiritiladi.<\/p>", "ans": "x = 10 da tushum: Namangan 90, Samarqand 97, Toshkent 102 mln so‘m; m ta toifa uchun m − 1 ta dummy kiritiladi.", "t": "boglanish", "status": "ok", "note": "", "id": "sm-39", "src": "stat"}, {"n": 40, "part": 2, "title": "Darbin–Uotson testi", "cond": "<p>Ikki omilli (k = 2) model bo‘yicha 8 ta kuzatuvda haqiqiy (y) va modeldan hisoblangan (ŷ) qiymatlar:<\/p><table><tr><th>№<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><\/tr><tr><td>y<\/td><td>20<\/td><td>24<\/td><td>27<\/td><td>31<\/td><td>33<\/td><td>38<\/td><td>41<\/td><td>46<\/td><\/tr><tr><td>ŷ<\/td><td>21,0<\/td><td>23,2<\/td><td>28,1<\/td><td>30,0<\/td><td>34,5<\/td><td>37,1<\/td><td>42,3<\/td><td>44,8<\/td><\/tr><\/table><p>a) Qoldiqlar eᵢ = yᵢ − ŷᵢ va kvadratinini hisoblang.<\/p><p>b) Darbin–Uotson statistikasi d = Σ(eₜ − eₜ₋₁)²/Σeₜ² ni hisoblang va avtokorrelyatsiya haqida xulosa chiqaring.<\/p>", "sol": "<p><b>a)<\/b> eᵢ = yᵢ − ŷᵢ:<\/p><table><tr><th>t<\/th><th>y<\/th><th>ŷ<\/th><th>e<\/th><th>e²<\/th><th>eₜ − eₜ₋₁<\/th><th>(eₜ − eₜ₋₁)²<\/th><\/tr><tr><td>1<\/td><td>20<\/td><td>21,0<\/td><td>-1,0<\/td><td>1,00<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2<\/td><td>24<\/td><td>23,2<\/td><td>0,8<\/td><td>0,64<\/td><td>1,8<\/td><td>3,24<\/td><\/tr><tr><td>3<\/td><td>27<\/td><td>28,1<\/td><td>-1,1<\/td><td>1,21<\/td><td>-1,9<\/td><td>3,61<\/td><\/tr><tr><td>4<\/td><td>31<\/td><td>30,0<\/td><td>1,0<\/td><td>1,00<\/td><td>2,1<\/td><td>4,41<\/td><\/tr><tr><td>5<\/td><td>33<\/td><td>34,5<\/td><td>-1,5<\/td><td>2,25<\/td><td>-2,5<\/td><td>6,25<\/td><\/tr><tr><td>6<\/td><td>38<\/td><td>37,1<\/td><td>0,9<\/td><td>0,81<\/td><td>2,4<\/td><td>5,76<\/td><\/tr><tr><td>7<\/td><td>41<\/td><td>42,3<\/td><td>-1,3<\/td><td>1,69<\/td><td>-2,2<\/td><td>4,84<\/td><\/tr><tr><td>8<\/td><td>46<\/td><td>44,8<\/td><td>1,2<\/td><td>1,44<\/td><td>2,5<\/td><td>6,25<\/td><\/tr><tr><td>Σ<\/td><td><\/td><td><\/td><td><\/td><td>10,04<\/td><td><\/td><td>34,36<\/td><\/tr><\/table><p><b>b)<\/b> d = Σ(eₜ − eₜ₋₁)²/Σeₜ² = 34,36/10,04 = <b>3,42<\/b>.<\/p><p>d ≈ 2 — avtokorrelyatsiya yo‘q; d → 0 — musbat; d → 4 — manfiy avtokorrelyatsiya. d = 3,42 4 ga yaqin va qoldiqlar ishorasi har safar almashadi (−, +, −, +, …) → <b>manfiy avtokorrelyatsiya belgisi<\/b> bor.<\/p><p><i>Izoh: n = 8, k = 2 uchun (α = 0,05) dL ≈ 0,56, dU ≈ 1,78; 4 − dU ≈ 2,22, 4 − dL ≈ 3,44. d = 3,42 qiymati 4 − dL ga juda yaqin, rasmiy jihatdan noaniqlik zonasining yuqori chegarasida — kuzatuvlar soni kam bo‘lgani uchun xulosa ehtiyotkorlik bilan qilinadi.<\/i><\/p>", "ans": "d = 3,42 (2 dan ancha katta, 4 ga yaqin): qoldiqlarda manfiy avtokorrelyatsiya belgilari bor, ammo n = 8 da rasmiy test chegaraviy natija beradi.", "t": "boglanish", "status": "rewritten", "note": "Original was a generic regression placeholder; correct DW d = 3,42 (negative autocorrelation; formally borderline for n = 8).", "id": "sm-40", "src": "stat"}, {"n": 41, "part": 2, "title": "Dinamika qatori ko‘rsatkichlari: bug‘doy", "cond": "<p>Viloyatda yetishtirilgan bug‘doy hajmi (ming tonna):<\/p><table><tr><th>Yil<\/th><th>2019<\/th><th>2020<\/th><th>2021<\/th><th>2022<\/th><th>2023<\/th><\/tr><tr><td>Hajm<\/td><td>540<\/td><td>550<\/td><td>570<\/td><td>560<\/td><td>600<\/td><\/tr><\/table><p>a) Bazisli va zanjirsimon mutlaq o‘sish, o‘sish sur’ati va qo‘shimcha o‘sish sur’atini hisoblang. b) O‘rtacha darajani, o‘rtacha mutlaq o‘sishni va o‘rtacha yillik o‘sish sur’atini toping. Xulosalar yozing.<\/p>", "sol": "<p><b>a)<\/b> Zanjirsimon: Δ = yᵢ − yᵢ₋₁, T = yᵢ/yᵢ₋₁·100; bazisli: Δ = yᵢ − y₀, T = yᵢ/y₀·100; qo‘shimcha o‘sish sur’ati Tq = T − 100; 1% o‘sishning mutlaq qiymati A = yᵢ₋₁/100.<\/p><table><tr><th>Yil<\/th><th>y, ming t<\/th><th>Δ zanj.<\/th><th>Δ baz.<\/th><th>T zanj., %<\/th><th>T baz., %<\/th><th>Tq zanj., %<\/th><th>Tq baz., %<\/th><th>A, ming t<\/th><\/tr><tr><td>2019<\/td><td>540<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>100,0<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2020<\/td><td>550<\/td><td>10<\/td><td>10<\/td><td>101,9<\/td><td>101,9<\/td><td>1,9<\/td><td>1,9<\/td><td>5,4<\/td><\/tr><tr><td>2021<\/td><td>570<\/td><td>20<\/td><td>30<\/td><td>103,6<\/td><td>105,6<\/td><td>3,6<\/td><td>5,6<\/td><td>5,5<\/td><\/tr><tr><td>2022<\/td><td>560<\/td><td>-10<\/td><td>20<\/td><td>98,2<\/td><td>103,7<\/td><td>-1,8<\/td><td>3,7<\/td><td>5,7<\/td><\/tr><tr><td>2023<\/td><td>600<\/td><td>40<\/td><td>60<\/td><td>107,1<\/td><td>111,1<\/td><td>7,1<\/td><td>11,1<\/td><td>5,6<\/td><\/tr><\/table><p><b>b)<\/b> O‘rtacha daraja (intervalli qator): ȳ = Σy/n = 2 820/5 = <b>564 ming t<\/b>.<\/p><p>O‘rtacha mutlaq o‘sish: Δ̄ = (yₙ − y₁)/(n − 1) = (600 − 540)/4 = <b>15 ming t/yil<\/b>.<\/p><p>O‘rtacha yillik o‘sish sur’ati: T̄ = ⁿ⁻¹√(yₙ/y₁) = ⁴√(600/540) = 1,0267 → <b>102,67%<\/b>; o‘rtacha qo‘shimcha o‘sish 2,67%.<\/p>", "ans": "2019–2023 yillarda bug‘doy hajmi 60 ming t ga (11,1%) oshdi; faqat 2022 yilda 10 ming t kamaygan. O‘rtacha daraja 564 ming t, yiliga o‘rtacha +15 ming t yoki +2,67%.", "t": "dinamika", "status": "rewritten", "note": "Original was a generic placeholder; correct mean level 564, average absolute growth 15, average growth rate 102,67%.", "id": "sm-41", "src": "stat"}, {"n": 42, "part": 3, "title": "Chiziqli trend (shartli vaqt usuli)", "cond": "<p>O‘zbekistonda 2020-yil narxlarida yaratilgan qo‘shilgan qiymat hajmi (trln so‘m):<\/p><table><tr><th>Yil<\/th><th>2016<\/th><th>2017<\/th><th>2018<\/th><th>2019<\/th><th>2020<\/th><th>2021<\/th><th>2022<\/th><th>2023<\/th><\/tr><tr><td>Hajm<\/td><td>444,4<\/td><td>471,1<\/td><td>491,3<\/td><td>517,4<\/td><td>547,4<\/td><td>557,8<\/td><td>599,8<\/td><td>637,0<\/td><\/tr><\/table><p>a) Chiziqli trend tenglamasini ŷ = a + bt shartli vaqt (t = −7, −5, …, +7) usulida toping. b) Trend parametrlarini izohlang va 2024- hamda 2025-yillar uchun prognoz qiling. c) Prognozning cheklovlarini ko‘rsating.<\/p>", "sol": "<p>Juft sonli (8 ta) daraja uchun shartli vaqt t = −7, −5, −3, −1, 1, 3, 5, 7 (Σt = 0). Bunda EKK tenglamalari soddalashadi: a = Σy/n, b = Σty/Σt².<\/p><table><tr><th>Yil<\/th><th>y<\/th><th>t<\/th><th>t²<\/th><th>t·y<\/th><th>ŷ<\/th><\/tr><tr><td>2016<\/td><td>444,4<\/td><td>-7<\/td><td>49<\/td><td>-3 110,8<\/td><td>440,7<\/td><\/tr><tr><td>2017<\/td><td>471,1<\/td><td>-5<\/td><td>25<\/td><td>-2 355,5<\/td><td>467,2<\/td><\/tr><tr><td>2018<\/td><td>491,3<\/td><td>-3<\/td><td>9<\/td><td>-1 473,9<\/td><td>493,6<\/td><\/tr><tr><td>2019<\/td><td>517,4<\/td><td>-1<\/td><td>1<\/td><td>-517,4<\/td><td>520,1<\/td><\/tr><tr><td>2020<\/td><td>547,4<\/td><td>1<\/td><td>1<\/td><td>547,4<\/td><td>546,5<\/td><\/tr><tr><td>2021<\/td><td>557,8<\/td><td>3<\/td><td>9<\/td><td>1 673,4<\/td><td>572,9<\/td><\/tr><tr><td>2022<\/td><td>599,8<\/td><td>5<\/td><td>25<\/td><td>2 999,0<\/td><td>599,4<\/td><\/tr><tr><td>2023<\/td><td>637,0<\/td><td>7<\/td><td>49<\/td><td>4 459,0<\/td><td>625,8<\/td><\/tr><tr><td>Σ<\/td><td>4 266,2<\/td><td>0<\/td><td>168<\/td><td>2 221,2<\/td><td>4 266,2<\/td><\/tr><\/table><p><b>a)<\/b> a = 4 266,2/8 = <b>533,275<\/b>; b = 2 221,2/168 = <b>13,22<\/b> → <b>ŷ = 533,275 + 13,22t<\/b>.<\/p><p><b>b)<\/b> a — qatorning o‘rtacha (t = 0, ya’ni 2019–2020 yillar o‘rtasidagi) trend darajasi; b — t ning bir birligiga (yarim yilga) o‘sish, shuning uchun yillik o‘rtacha o‘sish 2b = <b>26,44 trln so‘m<\/b>.<\/p><p>Prognoz: 2024 yil (t = 9): ŷ = 533,275 + 13,22·9 = <b>652,3 trln so‘m<\/b>; 2025 yil (t = 11): ŷ = 533,275 + 13,22·11 = <b>678,7 trln so‘m<\/b>.<\/p><p><b>c)<\/b> Cheklovlar: prognoz o‘tmishdagi chiziqli trend kelajakda saqlanadi degan farazga asoslanadi; iqtisodiy inqirozlar, siyosat, narxlar o‘zgarishi kabi qatordan tashqari omillarni hisobga olmaydi; qator qisqa (8 yil), ekstrapolyatsiya muddati uzaygan sari xato oshadi; so‘nggi yillarda o‘sish tezlashgani (2022–2023) chiziqli model haqiqiy qiymatni past baholashi mumkinligini ko‘rsatadi.<\/p>", "ans": "Trend: ŷ = 533,275 + 13,22t; qo‘shilgan qiymat yiliga o‘rtacha 26,4 trln so‘mga o‘sgan. Prognoz: 2024 — 652,3, 2025 — 678,7 trln so‘m.", "t": "dinamika", "status": "fixed", "note": "Method was right but no numbers were computed; correct ŷ = 533,275 + 13,22t, forecasts 652,3 (2024) and 678,7 (2025); data table came from the source’s example 41 block.", "id": "sm-42", "src": "stat"}, {"n": 43, "part": 2, "title": "Mavsumiylik indekslari", "cond": "<p>Do‘konning chorakli savdosi (mln so‘m) bo‘yicha uch yillik ma’lumotlar:<\/p><table><tr><th>Yil<\/th><th>I chorak<\/th><th>II chorak<\/th><th>III chorak<\/th><th>IV chorak<\/th><\/tr><tr><td>1<\/td><td>120<\/td><td>90<\/td><td>80<\/td><td>140<\/td><\/tr><tr><td>2<\/td><td>130<\/td><td>98<\/td><td>88<\/td><td>152<\/td><\/tr><tr><td>3<\/td><td>141<\/td><td>106<\/td><td>95<\/td><td>164<\/td><\/tr><\/table><p>a) Har bir chorak uchun o‘rtacha savdoni va umumiy o‘rtachani toping.<\/p><p>b) Mavsumiylik indekslarini (Sᵢ = chorak o‘rtachasi / umumiy o‘rtacha × 100%) hisoblang va ularning yig‘indisini tekshiring.<\/p><p>c) Qaysi chorakda savdo eng yuqori va eng past? Mavsumiylik amplitudasini izohlang.<\/p>", "sol": "<table><tr><th>Yil<\/th><th>I<\/th><th>II<\/th><th>III<\/th><th>IV<\/th><\/tr><tr><td>1<\/td><td>120<\/td><td>90<\/td><td>80<\/td><td>140<\/td><\/tr><tr><td>2<\/td><td>130<\/td><td>98<\/td><td>88<\/td><td>152<\/td><\/tr><tr><td>3<\/td><td>141<\/td><td>106<\/td><td>95<\/td><td>164<\/td><\/tr><tr><td>Chorak o‘rtachasi<\/td><td>130,33<\/td><td>98,00<\/td><td>87,67<\/td><td>152,00<\/td><\/tr><tr><td>Sᵢ, %<\/td><td>111,4<\/td><td>83,8<\/td><td>74,9<\/td><td>129,9<\/td><\/tr><\/table><p><b>a)<\/b> Chorak o‘rtachalari: I — 130,33; II — 98,00; III — 87,67; IV — 152,00 mln so‘m. Umumiy o‘rtacha: ȳ = 1 404/12 = <b>117<\/b> mln so‘m.<\/p><p><b>b)<\/b> Sᵢ = chorak o‘rtachasi / umumiy o‘rtacha·100%: I — 111,4%, II — 83,8%, III — 74,9%, IV — 129,9%. Tekshiruv: ΣSᵢ = 400,0% (4 chorak uchun 400% bo‘lishi kerak) ✓.<\/p><p><b>c)<\/b> Eng yuqori savdo — IV chorakda (o‘rtachadan 29,9% yuqori), eng past — III chorakda (o‘rtachadan 25,1% past). Mavsumiylik amplitudasi: 129,9 − 74,9 = <b>55,0 foiz punkt<\/b> — mavsumiy tebranish kuchli.<\/p><p><i>Izoh: qatorda o‘sish trendi bor; oddiy o‘rtachalar usuli taxminiy natija beradi, aniqroq tahlil uchun trend chiqarilgandan keyin indekslar hisoblanadi.<\/i><\/p>", "ans": "Mavsumiylik indekslari: I — 111,4%, II — 83,8%, III — 74,9%, IV — 129,9%. Savdo IV chorakda eng yuqori, III chorakda eng past; amplituda 55,0 f.p.", "t": "dinamika", "status": "rewritten", "note": "Original was a generic placeholder; correct overall mean 117, seasonal indices 111,4 / 83,8 / 74,9 / 129,9%.", "id": "sm-43", "src": "stat"}, {"n": 44, "part": 3, "title": "Agregat narx, hajm va qiymat indekslari", "cond": "<p>Uch xil oziq-ovqat mahsuloti bo‘yicha sotuv ma’lumotlari:<\/p><table><tr><th>Mahsulot<\/th><th>q₀ (bazis), t<\/th><th>q₁ (hisobot), t<\/th><th>p₀, mln so‘m/t<\/th><th>p₁, mln so‘m/t<\/th><\/tr><tr><td>Un<\/td><td>500<\/td><td>520<\/td><td>4,0<\/td><td>4,6<\/td><\/tr><tr><td>Shakar<\/td><td>200<\/td><td>180<\/td><td>9,0<\/td><td>10,2<\/td><\/tr><tr><td>Yog‘<\/td><td>100<\/td><td>130<\/td><td>14,0<\/td><td>15,4<\/td><\/tr><\/table><p>a) Narxning indekslarini hisoblang.<\/p><p>b) Fizik hajmning indekslarini toping.<\/p><p>c) Qiymat indeksini hisoblang va Ipq = Ip(Paashe) × Iq(Laspeyres) bog‘lanishini tekshiring. d) Tovar aylanmasining mutlaq o‘zgarishini narx va hajm omillari bo‘yicha ajrating. Xulosalar yozing.<\/p>", "sol": "<table><tr><th>Mahsulot<\/th><th>p₀q₀<\/th><th>p₁q₁<\/th><th>p₀q₁<\/th><th>p₁q₀<\/th><th>ip = p₁/p₀<\/th><th>iq = q₁/q₀<\/th><\/tr><tr><td>Un<\/td><td>2 000<\/td><td>2 392<\/td><td>2 080<\/td><td>2 300<\/td><td>1,150<\/td><td>1,04<\/td><\/tr><tr><td>Shakar<\/td><td>1 800<\/td><td>1 836<\/td><td>1 620<\/td><td>2 040<\/td><td>1,133<\/td><td>0,90<\/td><\/tr><tr><td>Yog‘<\/td><td>1 400<\/td><td>2 002<\/td><td>1 820<\/td><td>1 540<\/td><td>1,100<\/td><td>1,30<\/td><\/tr><tr><td>Σ<\/td><td>5 200<\/td><td>6 230<\/td><td>5 520<\/td><td>5 880<\/td><td><\/td><td><\/td><\/tr><\/table><p><b>a)<\/b> Individual narx indekslari: un 1,150; shakar 1,133; yog‘ 1,100. Umumiy narx indeksi — Paashe: Ip = Σp₁q₁/Σp₀q₁ = 6 230/5 520 = <b>1,1286<\/b> (+12,9%); Laspeyres: Ip = Σp₁q₀/Σp₀q₀ = 5 880/5 200 = 1,1308; Fisher: √(L·P) = 1,1297.<\/p><p><b>b)<\/b> Individual hajm indekslari: un 1,04; shakar 0,90; yog‘ 1,30. Umumiy fizik hajm indeksi — Laspeyres: Iq = Σp₀q₁/Σp₀q₀ = 5 520/5 200 = <b>1,0615<\/b> (+6,2%); Paashe: Σp₁q₁/Σp₁q₀ = 1,0595.<\/p><p><b>c)<\/b> Qiymat (tovar aylanmasi) indeksi: Ipq = Σp₁q₁/Σp₀q₀ = 6 230/5 200 = <b>1,1981<\/b>. Tekshiruv: Ip(Paashe)·Iq(Laspeyres) = 1,1286·1,0615 = 1,1981 ✓.<\/p><p><b>d)<\/b> Mutlaq o‘zgarish: Σp₁q₁ − Σp₀q₀ = 6 230 − 5 200 = <b>1 030<\/b> mln so‘m; narx hisobiga Σp₁q₁ − Σp₀q₁ = <b>710<\/b>; hajm hisobiga Σp₀q₁ − Σp₀q₀ = <b>320<\/b>; 710 + 320 = 1 030 ✓.<\/p>", "ans": "Tovar aylanmasi 19,8% ga (1 030 mln so‘m) oshdi: narxlar o‘rtacha 12,9% (+710 mln), fizik hajm 6,2% (+320 mln) o‘sgan. Shakar sotuvi 10% kamaygan, yog‘ — 30% oshgan.", "t": "indeks", "status": "fixed", "note": "Formulas were right but no numbers; correct Ip(Paasche) = 1,1286, Iq(Laspeyres) = 1,0615, Ipq = 1,1981, Δ = 1030 = 710 (price) + 320 (volume); data table came from the source’s example 43 block.", "id": "sm-44", "src": "stat"}, {"n": 45, "part": 2, "title": "O‘rtacha arifmetik va garmonik indekslar", "cond": "<p>Do‘konda uch tovar guruhi bo‘yicha: bazis davri tovar aylanmasi p₀q₀ (mln so‘m) hamda hajm va narx individual indekslari:<\/p><table><tr><th>Tovar guruhi<\/th><th>p₀q₀<\/th><th>iq<\/th><th>ip<\/th><\/tr><tr><td>A<\/td><td>400<\/td><td>1,10<\/td><td>1,15<\/td><\/tr><tr><td>B<\/td><td>300<\/td><td>0,95<\/td><td>1,10<\/td><\/tr><tr><td>C<\/td><td>300<\/td><td>1,20<\/td><td>1,20<\/td><\/tr><\/table><p>a) Hisobot davri tovar aylanmasi p₁q₁ = p₀q₀·iq·ip ni har guruh uchun toping.<\/p><p>b) Fizik hajmning o‘rtacha arifmetik indeksi Iq = Σ(iq·p₀q₀)/Σp₀q₀ ni hisoblang.<\/p><p>c) Narxning o‘rtacha garmonik indeksi Ip = Σp₁q₁/Σ(p₁q₁/ip) ni hisoblang.<\/p><p>d) Qiymat indeksini toping va Ipq = Iq·Ip bog‘lanishini tekshiring.<\/p>", "sol": "<table><tr><th>Guruh<\/th><th>p₀q₀<\/th><th>iq<\/th><th>ip<\/th><th>p₁q₁ = p₀q₀·iq·ip<\/th><th>iq·p₀q₀<\/th><th>p₁q₁/ip<\/th><\/tr><tr><td>A<\/td><td>400<\/td><td>1,10<\/td><td>1,15<\/td><td>506,0<\/td><td>440<\/td><td>440<\/td><\/tr><tr><td>B<\/td><td>300<\/td><td>0,95<\/td><td>1,10<\/td><td>313,5<\/td><td>285<\/td><td>285<\/td><\/tr><tr><td>C<\/td><td>300<\/td><td>1,20<\/td><td>1,20<\/td><td>432,0<\/td><td>360<\/td><td>360<\/td><\/tr><tr><td>Σ<\/td><td>1000<\/td><td><\/td><td><\/td><td>1 251,5<\/td><td>1 085<\/td><td>1 085<\/td><\/tr><\/table><p><b>a)<\/b> p₁q₁: A = 400·1,10·1,15 = 506,0; B = 300·0,95·1,10 = 313,5; C = 300·1,20·1,20 = 432,0; jami 1 251,5 mln so‘m.<\/p><p><b>b)<\/b> Iq = Σiq·p₀q₀/Σp₀q₀ = 1 085/1 000 = <b>1,085<\/b> (fizik hajm +8,5%).<\/p><p><b>c)<\/b> Ip = Σp₁q₁/Σ(p₁q₁/ip) = 1 251,5/1 085 = <b>1,1535<\/b> (narxlar +15,3%).<\/p><p><b>d)<\/b> Ipq = Σp₁q₁/Σp₀q₀ = 1 251,5/1 000 = <b>1,2515<\/b>. Tekshiruv: Iq·Ip = 1,085·1,1535 = 1,2515 ✓.<\/p><p>Mutlaq o‘zgarish: jami 251,5 mln so‘m, shu jumladan narx hisobiga 166,5, hajm hisobiga 85,0 mln so‘m.<\/p>", "ans": "Tovar aylanmasi 25,15% ga oshdi: narxlar 15,3%, fizik hajm 8,5% ga o‘sgan; o‘sishning asosiy qismi (166,5 mln so‘mdan 251,5 mln) narx hisobiga.", "t": "indeks", "status": "rewritten", "note": "Original was a generic placeholder; correct Iq = 1,085, Ip = 1,1535, Ipq = 1,2515.", "id": "sm-45", "src": "stat"}, {"n": 46, "part": 2, "title": "Yalpi hosil o‘zgarishini omillarga ajratish", "cond": "<p>O‘zbekiston Respublikasida bug‘doyning yalpi hosili va hosildorligi to‘g‘risida quyidagi ma’lumotlar mavjud.<\/p><p>Hisoblang:<\/p><table><tr><th>Ko‘rsatkichlar<\/th><th>2022 y.<\/th><th>2023 y.<\/th><\/tr><tr><td>Yalpi hosil, ming tonna<\/td><td>6934,9<\/td><td>6079,2<\/td><\/tr><tr><td>Hosildorlik, s/ga<\/td><td>47,9<\/td><td>42,2<\/td><\/tr><\/table><p>1. Ekin maydoni, hosildorlik va yalpi hosil hajmini mutlaq hamda nisbiy o‘zgarishini; 2. Yalpi hosil hajmini o‘zgarishiga ta’sir etgan omillar (ekin maydoni va hosildorlik) ning hissasini. Xulosalar yozing.<\/p>", "sol": "<p><b>1.<\/b> Ekin maydoni = yalpi hosil / hosildorlik (1 t = 10 s):<\/p><p>S₂₀₂₂ = 69 349 ming s / 47,9 = 1 447,8 ming ga; S₂₀₂₃ = 60 792 ming s / 42,2 = 1 440,6 ming ga.<\/p><table><tr><th>Ko‘rsatkich<\/th><th>2022<\/th><th>2023<\/th><th>Mutlaq o‘zgarish<\/th><th>Indeks, %<\/th><th>O‘zgarish, %<\/th><\/tr><tr><td>Ekin maydoni, ming ga<\/td><td>1 447,8<\/td><td>1 440,6<\/td><td>-7,2<\/td><td>99,5<\/td><td>-0,5<\/td><\/tr><tr><td>Hosildorlik, s/ga<\/td><td>47,9<\/td><td>42,2<\/td><td>-5,7<\/td><td>88,1<\/td><td>-11,9<\/td><\/tr><tr><td>Yalpi hosil, ming t<\/td><td>6 934,9<\/td><td>6 079,2<\/td><td>-855,7<\/td><td>87,7<\/td><td>-12,3<\/td><\/tr><\/table><p><b>2.<\/b> Yalpi hosil Y = S·h. Omillar ta’siri (zanjirli almashtirish):<\/p><p>— ekin maydoni hisobiga: (S₁ − S₀)·h₀ = (-7,22)·47,9/10 = <b>-34,6 ming t<\/b>;<\/p><p>— hosildorlik hisobiga: (h₁ − h₀)·S₁ = (−5,7)·1 440,57/10 = <b>-821,1 ming t<\/b>;<\/p><p>Jami: -34,6 + (-821,1) = -855,7 ming t ✓. Indekslar bilan: Iʏ = Is·Ih = 0,9950·0,8810 = 0,8766 ✓.<\/p>", "ans": "2023 yilda bug‘doy yalpi hosili 855,7 ming t (12,3%) kamaydi. Kamayishning 96% i (821,1 ming t) hosildorlik pasayishi, 4% i (34,6 ming t) ekin maydoni qisqarishi hisobiga.", "t": "indeks", "status": "rewritten", "note": "Original was an unrelated price-index placeholder; correct area 1447,8 → 1440,6 ming ga, ΔY = −855,7 = −34,6 (area) − 821,1 (yield) ming t.", "id": "sm-46", "src": "stat"}, {"n": 47, "part": 2, "title": "Guruhlangan qatorda o‘rtacha", "cond": "<p>Shahar aholisining turar-joy maydoni bilan ta’minlanganligi to‘g‘risida quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Oilaning bir a’zosiga to‘g‘ri keladigan umumiy yashash <br>maydoni (m2)<\/th><th>10 <br>gacha<\/th><th>10-12<\/th><th>12-14<\/th><th>14-16<\/th><th>16-18<\/th><th>18-20<\/th><th>20 dan <br>ko‘p<\/th><\/tr><tr><td>Oilalar salmog‘i (%)<\/td><td>11<\/td><td>18<\/td><td>25<\/td><td>16<\/td><td>15<\/td><td>9<\/td><td>6<\/td><\/tr><\/table><p>Oilaning har bir a’zosiga to‘g‘ri keladigan o‘rtacha yashash maydonini aniqlang. Xulosalar yozing.<\/p>", "sol": "<p>Ochiq intervallar qo‘shni interval kengligi (2 m²) bilan yopiladi: “10 gacha” → 8–10, “20 dan ko‘p” → 20–22. Har interval uchun markaz x olinadi; vazn — oilalar salmog‘i f (%).<\/p><table><tr><th>Interval, m²<\/th><th>x (markaz)<\/th><th>f, %<\/th><th>x·f<\/th><\/tr><tr><td>10 gacha (8–10)<\/td><td>9<\/td><td>11<\/td><td>99<\/td><\/tr><tr><td>10–12<\/td><td>11<\/td><td>18<\/td><td>198<\/td><\/tr><tr><td>12–14<\/td><td>13<\/td><td>25<\/td><td>325<\/td><\/tr><tr><td>14–16<\/td><td>15<\/td><td>16<\/td><td>240<\/td><\/tr><tr><td>16–18<\/td><td>17<\/td><td>15<\/td><td>255<\/td><\/tr><tr><td>18–20<\/td><td>19<\/td><td>9<\/td><td>171<\/td><\/tr><tr><td>20 dan ko‘p (20–22)<\/td><td>21<\/td><td>6<\/td><td>126<\/td><\/tr><tr><td>Σ<\/td><td><\/td><td>100<\/td><td>1414<\/td><\/tr><\/table><p>O‘rtacha arifmetik tortilgan: x̄ = Σxf/Σf = 1414/100 = <b>14,14 m²<\/b>.<\/p>", "ans": "Oilaning bir a’zosiga o‘rtacha 14,14 m² yashash maydoni to‘g‘ri keladi; oilalarning eng katta qismi (25%) 12–14 m² guruhida.", "t": "ortacha", "status": "rewritten", "note": "Original was a generic placeholder; correct mean 14,14 m². Removed a stray sentence from another problem (regional income, no data) from the condition.", "id": "sm-47", "src": "stat"}, {"n": 48, "part": 2, "title": "Moda va mediana (intervalli qator)", "cond": "<p>Do‘konga qabul qilingan tovarlar partiyasining namligi to‘g‘risidagi ma’lumotlar asosida moda va medianani aniqlang. Xulosalar yozing.<\/p><table><tr><th>Namlik darajasi, %<\/th><th>14 gacha<\/th><th>14–16<\/th><th>16–18<\/th><th>18–20<\/th><th>20 va yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Namunalar soni<\/td><td>20<\/td><td>30<\/td><td>25<\/td><td>15<\/td><td>10<\/td><td>100<\/td><\/tr><\/table>", "sol": "<p>Ochiq intervallar: “14 gacha” → 12–14, “20 va yuqori” → 20–22 (kenglik i = 2).<\/p><table><tr><th>Namlik, %<\/th><th>12–14<\/th><th>14–16<\/th><th>16–18<\/th><th>18–20<\/th><th>20–22<\/th><\/tr><tr><td>f<\/td><td>20<\/td><td>30<\/td><td>25<\/td><td>15<\/td><td>10<\/td><\/tr><tr><td>Jamlangan chastota S<\/td><td>20<\/td><td>50<\/td><td>75<\/td><td>90<\/td><td>100<\/td><\/tr><\/table><p><b>Moda.<\/b> Modal interval — eng katta chastotali 14–16 (f = 30).<\/p><p>Mo = x₀ + i·(f_Mo − f_Mo−1)/((f_Mo − f_Mo−1) + (f_Mo − f_Mo+1)) = 14 + 2·(30 − 20)/((30 − 20) + (30 − 25)) = 14 + 20/15 = <b>15,33%<\/b>.<\/p><p><b>Mediana.<\/b> Σf/2 = 50; jamlangan chastota 50 ga 14–16 intervalida yetadi.<\/p><p>Me = x₀ + i·(Σf/2 − S_Me−1)/f_Me = 14 + 2·(50 − 20)/30 = <b>16,0%<\/b>.<\/p>", "ans": "Eng ko‘p uchraydigan namlik darajasi ≈ 15,33%; namunalarning yarmi namligi 16% dan oshmaydi, yarmi 16% dan yuqori. Mo &lt; Me — taqsimot biroz o‘ngga (musbat) og‘gan.", "t": "ortacha", "status": "rewritten", "note": "Original was a generic placeholder; correct Mo = 15,33%, Me = 16,0%. Fixed typo “qabul yozingan” → “qabul qilingan”.", "id": "sm-48", "src": "stat"}, {"n": 49, "part": 2, "title": "Variatsiya ko‘rsatkichlari: yo‘lga sarflangan vaqt", "cond": "<p>Institut talabalarining yo‘lga sarflagan vaqtini kuzatish natijasi quyidagi ma’lumotlar bilan ifodalanadi:<\/p><table><tr><th>Yo‘lga sarflangan vaqt bo‘yicha <br>guruhlar, soat<\/th><th>Jamiga nisbatan talabalar soni, %<\/th><\/tr><tr><td>0,5 gacha <br>0,5-1,0 <br>1,0-1,5 <br>1,5-2,0 <br>2,0 va undan ko‘p<\/td><td>12 <br>18 <br>32 <br>29 <br>9<\/td><\/tr><tr><td>Jami<\/td><td>100<\/td><\/tr><\/table><p>Talabalarning yo‘lga sarflagan vaqtining variatsiya ko‘rsatkichlarini hisoblang. Xulosalar yozing.<\/p>", "sol": "<p>Ochiq intervallar 0,5 soat kenglik bilan yopiladi: 0–0,5 va 2,0–2,5; x — interval markazi, f — talabalar salmog‘i (%).<\/p><table><tr><th>Interval, soat<\/th><th>x<\/th><th>f, %<\/th><th>x·f<\/th><th>|x − x̄|·f<\/th><th>(x − x̄)²·f<\/th><\/tr><tr><td>0,5 gacha (0–0,5)<\/td><td>0,25<\/td><td>12<\/td><td>3,00<\/td><td>12,30<\/td><td>12,61<\/td><\/tr><tr><td>0,5–1,0<\/td><td>0,75<\/td><td>18<\/td><td>13,50<\/td><td>9,45<\/td><td>4,96<\/td><\/tr><tr><td>1,0–1,5<\/td><td>1,25<\/td><td>32<\/td><td>40,00<\/td><td>0,80<\/td><td>0,02<\/td><\/tr><tr><td>1,5–2,0<\/td><td>1,75<\/td><td>29<\/td><td>50,75<\/td><td>13,78<\/td><td>6,54<\/td><\/tr><tr><td>2,0 va ko‘p (2,0–2,5)<\/td><td>2,25<\/td><td>9<\/td><td>20,25<\/td><td>8,78<\/td><td>8,56<\/td><\/tr><tr><td>Σ<\/td><td><\/td><td>100<\/td><td>127,50<\/td><td>45,10<\/td><td>32,69<\/td><\/tr><\/table><p>O‘rtacha: x̄ = Σxf/Σf = 127,50/100 = <b>1,275 soat<\/b>.<\/p><p>Variatsiya kengligi: R = x_max − x_min = 2,5 − 0 = <b>2,5 soat<\/b> (interval chegaralari bo‘yicha).<\/p><p>O‘rtacha chiziqli tafovut: d̄ = Σ|x − x̄|f/Σf = <b>0,451 soat<\/b>.<\/p><p>Dispersiya: σ² = Σ(x − x̄)²f/Σf = <b>0,3269<\/b>; o‘rtacha kvadratik tafovut σ = √σ² = <b>0,572 soat<\/b>.<\/p><p>Variatsiya koeffitsienti: V = σ/x̄·100 = 0,572/1,275·100 = <b>44,8%<\/b>; chiziqli variatsiya koeffitsienti d̄/x̄·100 = 35,4%.<\/p>", "ans": "Talabalar yo‘lga o‘rtacha 1,27 soat sarflaydi, σ = 0,57 soat. V = 44,8% &gt; 33% — to‘plam bir jinsli emas, yo‘lga sarflangan vaqt talabalar orasida kuchli farq qiladi.", "t": "ortacha", "status": "rewritten", "note": "Original was a generic placeholder; correct x̄ = 1,275 h, σ = 0,572, V = 44,8%.", "id": "sm-49", "src": "stat"}, {"n": 50, "part": 2, "title": "Dispersiyalarni qo‘shish qoidasi va korrelyatsion nisbat", "cond": "<p>Brigadadagi ishchilar to‘g‘risida quyidagi ma’lumotlar mavjud:<\/p><table><tr><th>Tarif razryadi<\/th><th>Ishchilar soni<\/th><th>Bir ishchining kunlik ishlab chiqargan detallari, dona<\/th><\/tr><tr><td>3<\/td><td>2<\/td><td>100, 120<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>120, 120, 140, 160<\/td><\/tr><tr><td>5<\/td><td>5<\/td><td>140, 160, 170, 180, 200<\/td><\/tr><\/table><p>Aniqlang: a) har bir razryad guruhi bo‘yicha guruh ichidagi dispersiyani; b) uchta guruh bo‘yicha guruhlar ichidagi dispersiyalarning o‘rtachasini; c) guruhlararo dispersiyani; d) brigada bo‘yicha umumiy dispersiyani; e) empirik korrelyatsion nisbatni. Xulosalar yozing.<\/p>", "sol": "<table><tr><th>Razryad<\/th><th>nᵢ<\/th><th>Detallar, dona<\/th><th>x̄ᵢ<\/th><th>σᵢ²<\/th><\/tr><tr><td>3<\/td><td>2<\/td><td>100, 120<\/td><td>110<\/td><td>100<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>120, 120, 140, 160<\/td><td>135<\/td><td>275<\/td><\/tr><tr><td>5<\/td><td>5<\/td><td>140, 160, 170, 180, 200<\/td><td>170<\/td><td>400<\/td><\/tr><\/table><p><b>a)<\/b> Guruh ichidagi dispersiya σᵢ² = Σ(x − x̄ᵢ)²/nᵢ: 3-razryad: ((−10)² + 10²)/2 = <b>100<\/b>; 4-razryad: (15² + 15² + 5² + 25²)/4 = 1 100/4 = <b>275<\/b>; 5-razryad: (30² + 10² + 0 + 10² + 30²)/5 = 2 000/5 = <b>400<\/b>.<\/p><p><b>b)<\/b> σ̄² = Σσᵢ²nᵢ/Σnᵢ = (100·2 + 275·4 + 400·5)/11 = 3 300/11 = <b>300<\/b>.<\/p><p><b>c)<\/b> Umumiy o‘rtacha x̄ = 1 610/11 = 146,36 dona. Guruhlararo dispersiya δ² = Σ(x̄ᵢ − x̄)²nᵢ/Σnᵢ = ((-36,36)²·2 + (-11,36)²·4 + 23,64²·5)/11 = <b>541,32<\/b>.<\/p><p><b>d)<\/b> Umumiy dispersiya (qo‘shish qoidasi): σ² = σ̄² + δ² = 300 + 541,32 = <b>841,32<\/b> (bevosita hisob ham Σ(x − x̄)²/N = 841,32 beradi ✓).<\/p><p><b>e)<\/b> Empirik determinatsiya koeffitsienti η² = δ²/σ² = 541,32/841,32 = 0,643; empirik korrelyatsion nisbat η = √η² = <b>0,802<\/b>.<\/p>", "ans": "Detallar soni variatsiyasining 64,3% i tarif razryadi bilan tushuntiriladi; η = 0,80 — razryad va mehnat unumdorligi o‘rtasida kuchli bog‘lanish bor.", "t": "ortacha", "status": "rewritten", "note": "Original was a generic placeholder; correct σ̄² = 300, δ² = 541,32, σ² = 841,32, η = 0,802.", "id": "sm-50", "src": "stat"}, {"n": 51, "part": 2, "title": "Tanlanma o‘rtacha va ishonch oralig‘i: ishsizlar yoshi", "cond": "<p>Ishsizlarning yosh tarkibini o‘rganish maqsadida 10% mexanik usulda tanlama kuzatuv o‘tkazilgan va natijalari quyida keltirilgan:<\/p><table><tr><th>Yosh guruhlari, yil<\/th><th>20 <br>gacha<\/th><th>20-25<\/th><th>25-30<\/th><th>30-35<\/th><th>35-40<\/th><th>40-45<\/th><th>45-50<\/th><th>50-55<\/th><th>55 va undan katta<\/th><\/tr><tr><td>Umumiy sonidagi salmog‘i, %<\/td><td>8,1<\/td><td>18,0<\/td><td>12,7<\/td><td>13,4<\/td><td>15,4<\/td><td>12,8<\/td><td>9,7<\/td><td>4,1<\/td><td>5,8<\/td><\/tr><\/table><p>Hisoblang:<\/p><p>1. Tanlama to‘plam bo‘yicha ishsizlarning o‘rtacha yoshini va barcha variatsiya ko‘rsatkichlarini;<\/p><p>2. Bosh to‘plamda ishsizlarning o‘rtacha yoshi ishonch intervalini (P = 0,997 bo‘lganida). Xulosalar yozing.<\/p>", "sol": "<p>Ochiq intervallar 5 yil kenglik bilan yopiladi (15–20 va 55–60); x — interval markazi, f — salmoq (%).<\/p><table><tr><th>Yosh, yil<\/th><th>x<\/th><th>f, %<\/th><th>x·f<\/th><th>|x − x̄|·f<\/th><th>(x − x̄)²·f<\/th><\/tr><tr><td>20 gacha (15–20)<\/td><td>17,5<\/td><td>8,1<\/td><td>141,75<\/td><td>138,71<\/td><td>2 375,45<\/td><\/tr><tr><td>20–25<\/td><td>22,5<\/td><td>18,0<\/td><td>405,00<\/td><td>218,25<\/td><td>2 646,28<\/td><\/tr><tr><td>25–30<\/td><td>27,5<\/td><td>12,7<\/td><td>349,25<\/td><td>90,49<\/td><td>644,72<\/td><\/tr><tr><td>30–35<\/td><td>32,5<\/td><td>13,4<\/td><td>435,50<\/td><td>28,48<\/td><td>60,51<\/td><\/tr><tr><td>35–40<\/td><td>37,5<\/td><td>15,4<\/td><td>577,50<\/td><td>44,27<\/td><td>127,29<\/td><\/tr><tr><td>40–45<\/td><td>42,5<\/td><td>12,8<\/td><td>544,00<\/td><td>100,80<\/td><td>793,80<\/td><\/tr><tr><td>45–50<\/td><td>47,5<\/td><td>9,7<\/td><td>460,75<\/td><td>124,89<\/td><td>1 607,93<\/td><\/tr><tr><td>50–55<\/td><td>52,5<\/td><td>4,1<\/td><td>215,25<\/td><td>73,29<\/td><td>1 310,01<\/td><\/tr><tr><td>55 va katta (55–60)<\/td><td>57,5<\/td><td>5,8<\/td><td>333,50<\/td><td>132,67<\/td><td>3 034,94<\/td><\/tr><tr><td>Σ<\/td><td><\/td><td>100<\/td><td>3 462,50<\/td><td>951,85<\/td><td>12 600,94<\/td><\/tr><\/table><p><b>1.<\/b> O‘rtacha yosh: x̄ = Σxf/Σf = 3 462,50/100 = <b>34,62 yil<\/b>.<\/p><p>R = 60 − 15 = <b>45 yil<\/b>; d̄ = Σ|x − x̄|f/Σf = <b>9,52 yil<\/b>; σ² = Σ(x − x̄)²f/Σf = <b>126,01<\/b>; σ = <b>11,23 yil<\/b>; V = σ/x̄·100 = <b>32,4%<\/b>.<\/p><p><b>2.<\/b> Mexanik (notakroriy) tanlash, n/N = 0,1; P = 0,997 → t = 3.<\/p><p>O‘rtacha xato μ = √(σ²/n·(1 − n/N)) = √(126,01·0,9/n); chegaraviy xato Δ = t·μ = 3·√(126,01·0,9/n) = <b>31,95/√n<\/b>.<\/p><p><i>Izoh: masalada tanlanma hajmi n berilmagan (faqat foizlar). Masalan, n = 1 000 kishi bo‘lsa: μ = 0,337, Δ = 1,01 yil → 33,61 ≤ x̄ ≤ 35,64 yil.<\/i><\/p>", "ans": "Ishsizlarning o‘rtacha yoshi 34,6 yil, σ = 11,2 yil, V = 32,4% (yosh tarkibi o‘rtacha darajada bir jinsli emas). 0,997 ehtimol bilan bosh to‘plam o‘rtachasi x̄ ± 31,95/√n oralig‘ida (n = 1 000 bo‘lsa 33,6–35,6 yil).", "t": "tanlanma", "status": "rewritten", "note": "Original was a generic placeholder; correct x̄ = 34,63, σ = 11,23, V = 32,4%; the sample size n is not given, so the CI is shown as x̄ ± 31,95/√n (n = 1000 example).", "id": "sm-51", "src": "stat"}, {"n": 52, "part": 2, "title": "Tanlanma ulush chegaralari (tipik tanlash)", "cond": "<p>Ishlab chiqarilgan mahsulotlarning sifatini o‘rganish maqsadida ularning 10 foizi tekshirilganda, 1- sexda tekshirilgan 300 ta buyumning 4 % yaroqsiz, 2-sexda 300 ta tekshirilgan buyumning 3 % yaroqsiz ekanligi aniqlangan. 0,997 ehtimol bilan korxonada ishlab chiqarilgan barcha mahsulotlar bo‘yicha yaroqsiz mahsulotlar salmog‘ining chegaralarini aniqlang. Xulosalar yozing.<\/p>", "sol": "<p>Tanlash sexlar bo‘yicha (tipik, proporsional, notakroriy) o‘tkazilgan; n/N = 0,1; P = 0,997 → t = 3.<\/p><p>Tanlanma ulushi: w = (0,04·300 + 0,03·300)/600 = 21/600 = <b>0,035<\/b> (3,5%).<\/p><p>Guruhlar ichidagi dispersiyalar o‘rtachasi: σ̄² = Σwᵢ(1 − wᵢ)nᵢ/Σnᵢ = (0,04·0,96·300 + 0,03·0,97·300)/600 = <b>0,03375<\/b>.<\/p><p>O‘rtacha xato: μ = √(σ̄²/n·(1 − n/N)) = √(0,03375/600·0,9) = <b>0,00712<\/b>.<\/p><p>Chegaraviy xato: Δ = t·μ = 3·0,00712 = <b>0,0213<\/b> (2,13%).<\/p><p>Chegaralar: w ± Δ = 0,035 ± 0,0213 → <b>1,37% ≤ p ≤ 5,63%<\/b>.<\/p><p><i>Izoh: oddiy (tipik bo‘lmagan) formula √(w(1 − w)/n·0,9) bilan ham deyarli bir xil natija chiqadi: 1,36%–5,64%.<\/i><\/p>", "ans": "0,997 ehtimol bilan korxonadagi yaroqsiz mahsulotlar ulushi 1,4% dan 5,6% gacha (tanlanmada 3,5%).", "t": "tanlanma", "status": "rewritten", "note": "Original was a generic placeholder; correct w = 3,5%, Δ = 2,13%, interval 1,37%–5,63%.", "id": "sm-52", "src": "stat"}, {"n": 53, "part": 2, "title": "Dinamika jadvalidagi yetishmayotgan ko‘rsatkichlar", "cond": "<p>Dinamika qatorlari ko‘rsatkichlarining o‘zaro bog‘liqligidan foydalanib jadvalda yetishmayotgan ko‘rsatkichlarni aniqlab uni to‘ldiring. Xulosalar yozing.<\/p><table><tr><th>Yillar<\/th><th>Samarqand viloyatida yetishtirilgan kartoshka, ming tonna<\/th><th>Bazisli mutlaq o‘sish, ming tonna<\/th><th>Bazisli o‘sish sur’ati, %<\/th><th>Bazisli qo‘shimcha o‘sish sur’ati, %<\/th><\/tr><tr><td>2017<\/td><td>590,7<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2018<\/td><td><\/td><td>−11,1<\/td><td><\/td><td><\/td><\/tr><tr><td>2019<\/td><td><\/td><td><\/td><td>105,4<\/td><td><\/td><\/tr><tr><td>2020<\/td><td><\/td><td><\/td><td><\/td><td>6,0<\/td><\/tr><tr><td>2021<\/td><td><\/td><td><\/td><td>113,5<\/td><td><\/td><\/tr><tr><td>2022<\/td><td><\/td><td>102,2<\/td><td><\/td><td><\/td><\/tr><\/table>", "sol": "<p>Bog‘liqliklar (bazis — 2017 y., y₀ = 590,7): yᵢ = y₀ + Δᵢ; yᵢ = y₀·Tᵢ/100; Tᵢ = Tqᵢ + 100; Δᵢ = yᵢ − y₀; Tqᵢ = Tᵢ − 100.<\/p><p>2018: y = 590,7 − 11,1 = 579,6; T = 579,6/590,7·100 = 98,12%; Tq = -1,88%.<\/p><p>2019: y = 590,7·1,054 = 622,6; Δ = 31,9; Tq = 5,4%.<\/p><p>2020: T = 6,0 + 100 = 106,0%; y = 590,7·1,06 = 626,1; Δ = 35,4.<\/p><p>2021: y = 590,7·1,135 = 670,4; Δ = 79,7; Tq = 13,5%.<\/p><p>2022: y = 590,7 + 102,2 = 692,9; T = 117,3%; Tq = 17,3%.<\/p><table><tr><th>Yil<\/th><th>Kartoshka, ming t<\/th><th>Bazisli Δ, ming t<\/th><th>Bazisli T, %<\/th><th>Bazisli Tq, %<\/th><\/tr><tr><td>2017<\/td><td>590,7<\/td><td>—<\/td><td>100,0<\/td><td>—<\/td><\/tr><tr><td>2018<\/td><td>579,6<\/td><td>-11,1<\/td><td>98,1<\/td><td>-1,9<\/td><\/tr><tr><td>2019<\/td><td>622,6<\/td><td>31,9<\/td><td>105,4<\/td><td>5,4<\/td><\/tr><tr><td>2020<\/td><td>626,1<\/td><td>35,4<\/td><td>106,0<\/td><td>6,0<\/td><\/tr><tr><td>2021<\/td><td>670,4<\/td><td>79,7<\/td><td>113,5<\/td><td>13,5<\/td><\/tr><tr><td>2022<\/td><td>692,9<\/td><td>102,2<\/td><td>117,3<\/td><td>17,3<\/td><\/tr><\/table>", "ans": "Kartoshka yetishtirish 2018 yilda 2017 ga nisbatan 1,9% kamaygan, keyin barqaror o‘sib, 2022 yilda 692,9 ming t ga yetgan (2017 ga nisbatan +102,2 ming t, +17,3%).", "t": "dinamika", "status": "rewritten", "note": "Original was a generic placeholder; filled values 579,6 / 622,6 / 626,1 / 670,4 / 692,9 ming t; unit “ming dona” corrected to “ming tonna”.", "id": "sm-53", "src": "stat"}, {"n": 54, "part": 2, "title": "Dinamika ko‘rsatkichlari va sirg‘anchiq o‘rtacha", "cond": "<p>O‘zbekiston Respublikasida kartoshka yalpi hosili to‘g‘risida quyidagilar berilgan (ming tonna):<\/p><table><tr><th>Yillar<\/th><th>2014<\/th><th>2015<\/th><th>2016<\/th><th>2017<\/th><th>2018<\/th><th>2019<\/th><th>2020<\/th><th>2021<\/th><th>2022<\/th><\/tr><tr><td>Etishtirilgan <br>kartoshka<\/td><td>2399,2<\/td><td>2586,8<\/td><td>2789,5<\/td><td>2793,7<\/td><td>2911,9<\/td><td>3089,7<\/td><td>3143,8<\/td><td>3285,6<\/td><td>3443,2<\/td><\/tr><\/table><p>Aniqlang: Kartoshka yetishtirishning umumiy holatini o‘rganish uchun:<\/p><p>1) dinamika qatorining tahlil qilish ko‘rsatkichlarini;<\/p><p>2) sirg‘anchiqlik o‘rtachani (uch yillik bo‘yicha) hisoblang;<\/p><p>3) ma’lumotlarni grafik shaklida tasvirlang va tegishli xulosalar yozing.<\/p>", "sol": "<p><b>1)<\/b> Zanjirsimon va bazisli (bazis — 2014 y.) ko‘rsatkichlar; A — 1% o‘sishning mutlaq qiymati (yᵢ₋₁/100); oxirgi ustun — 3 yillik sirg‘anchiq o‘rtacha.<\/p><table><tr><th>Yil<\/th><th>y, ming t<\/th><th>Δ zanj.<\/th><th>Δ baz.<\/th><th>T zanj., %<\/th><th>T baz., %<\/th><th>Tq zanj., %<\/th><th>Tq baz., %<\/th><th>A<\/th><th>Sirg‘. o‘rt. (3 y.)<\/th><\/tr><tr><td>2014<\/td><td>2 399,2<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>100,0<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2015<\/td><td>2 586,8<\/td><td>187,6<\/td><td>187,6<\/td><td>107,8<\/td><td>107,8<\/td><td>7,8<\/td><td>7,8<\/td><td>23,99<\/td><td>2 591,8<\/td><\/tr><tr><td>2016<\/td><td>2 789,5<\/td><td>202,7<\/td><td>390,3<\/td><td>107,8<\/td><td>116,3<\/td><td>7,8<\/td><td>16,3<\/td><td>25,87<\/td><td>2 723,3<\/td><\/tr><tr><td>2017<\/td><td>2 793,7<\/td><td>4,2<\/td><td>394,5<\/td><td>100,2<\/td><td>116,4<\/td><td>0,2<\/td><td>16,4<\/td><td>27,89<\/td><td>2 831,7<\/td><\/tr><tr><td>2018<\/td><td>2 911,9<\/td><td>118,2<\/td><td>512,7<\/td><td>104,2<\/td><td>121,4<\/td><td>4,2<\/td><td>21,4<\/td><td>27,94<\/td><td>2 931,8<\/td><\/tr><tr><td>2019<\/td><td>3 089,7<\/td><td>177,8<\/td><td>690,5<\/td><td>106,1<\/td><td>128,8<\/td><td>6,1<\/td><td>28,8<\/td><td>29,12<\/td><td>3 048,5<\/td><\/tr><tr><td>2020<\/td><td>3 143,8<\/td><td>54,1<\/td><td>744,6<\/td><td>101,8<\/td><td>131,0<\/td><td>1,8<\/td><td>31,0<\/td><td>30,90<\/td><td>3 173,0<\/td><\/tr><tr><td>2021<\/td><td>3 285,6<\/td><td>141,8<\/td><td>886,4<\/td><td>104,5<\/td><td>136,9<\/td><td>4,5<\/td><td>36,9<\/td><td>31,44<\/td><td>3 290,9<\/td><\/tr><tr><td>2022<\/td><td>3 443,2<\/td><td>157,6<\/td><td>1 044,0<\/td><td>104,8<\/td><td>143,5<\/td><td>4,8<\/td><td>43,5<\/td><td>32,86<\/td><td>—<\/td><\/tr><\/table><p>O‘rtacha daraja: ȳ = Σy/n = 26 443,4/9 = <b>2 938,2 ming t<\/b>.<\/p><p>O‘rtacha mutlaq o‘sish: Δ̄ = (3 443,2 − 2 399,2)/8 = <b>130,5 ming t/yil<\/b>.<\/p><p>O‘rtacha o‘sish sur’ati: T̄ = ⁸√(3 443,2/2 399,2) = 1,0462 → <b>104,62%<\/b>; o‘rtacha qo‘shimcha o‘sish 4,62%.<\/p><p><b>2)<\/b> Sirg‘anchiq o‘rtacha: ȳ₂₀₁₅ = (2 399,2 + 2 586,8 + 2 789,5)/3 = 2 591,8 va hokazo — jadvalning oxirgi ustuni. U tasodifiy tebranishlarni tekislab, o‘sish trendini aniq ko‘rsatadi.<\/p><p><b>3)<\/b> Grafik: gorizontal o‘qda yillar, vertikalda ming tonna; haqiqiy darajalar va sirg‘anchiq o‘rtacha chiziqli diagramma ko‘rinishida chiziladi — ikkala chiziq ham barqaror yuqoriga yo‘nalgan.<\/p>", "ans": "2014–2022 yillarda kartoshka yetishtirish 1 044 ming t ga (43,5%) oshgan; har yili o‘sgan, o‘rtacha yillik o‘sish 130,5 ming t yoki 4,62%. Eng sekin o‘sish 2017 (+0,15%), eng tez — 2015–2016 yillarda (+7,8%).", "t": "dinamika", "status": "rewritten", "note": "Original was a generic placeholder; correct average growth 130,5 ming t/yil, average growth rate 104,62%, 3-year moving averages computed.", "id": "sm-54", "src": "stat"}, {"n": 55, "part": 2, "title": "Normal taqsimot ehtimoli", "cond": "<p>Aytaylik, x — µ = 15 va σ = 3 boʻlgan normal taqsimlangan tasodifiy oʻzgaruvchi boʻlsin. Quyidagilarni toping: P(11 ≤ x ≤ 16), xulosa yozing. Topshiriq formula va chizmalar asosida ishlanishi tavsiya qilinadi.<\/p>", "sol": "<p>Standartlash: z = (x − μ)/σ. z₁ = (11 − 15)/3 = -1,33; z₂ = (16 − 15)/3 = 0,33.<\/p><p>P(11 ≤ x ≤ 16) = Φ(0,33) − Φ(-1,33) = 0,6306 − 0,0912 = <b>0,5393<\/b> (53,93%).<\/p><p>Chizma: normal egri chiziq, μ = 15 markazda; 11 va 16 orasidagi yuza bo‘yaladi.<\/p>", "ans": "x qiymatining 11 va 16 oralig‘iga tushish ehtimoli ≈ 0,5393, ya’ni taxminan 53,9%.", "t": "taqsimot", "status": "ok", "note": "", "id": "sm-55", "src": "stat"}, {"n": 56, "part": 2, "title": "Normal taqsimot ehtimoli", "cond": "<p>Aytaylik, x — µ = 20 va σ = 2 boʻlgan normal taqsimlangan tasodifiy oʻzgaruvchi boʻlsin. Quyidagilarni toping: P(17 ≤ x ≤ 21), xulosa yozing. Topshiriq formula va chizmalar asosida ishlanishi tavsiya qilinadi.<\/p>", "sol": "<p>Standartlash: z = (x − μ)/σ. z₁ = (17 − 20)/2 = -1,50; z₂ = (21 − 20)/2 = 0,50.<\/p><p>P(17 ≤ x ≤ 21) = Φ(0,50) − Φ(-1,50) = 0,6915 − 0,0668 = <b>0,6247<\/b> (62,47%).<\/p><p>Chizma: normal egri chiziq, μ = 20 markazda; 17 va 21 orasidagi yuza bo‘yaladi.<\/p>", "ans": "x qiymatining 17 va 21 oralig‘iga tushish ehtimoli ≈ 0,6247, ya’ni taxminan 62,5%.", "t": "taqsimot", "status": "ok", "note": "", "id": "sm-56", "src": "stat"}, {"n": 57, "part": 2, "title": "Normal taqsimot ehtimoli", "cond": "<p>Aytaylik, x — µ = 27 va σ = 4 boʻlgan normal taqsimlangan tasodifiy oʻzgaruvchi boʻlsin. Quyidagilarni toping: P(x ≤ 20), xulosa yozing. Topshiriq formula va chizmalar asosida ishlanishi tavsiya qilinadi.<\/p>", "sol": "<p>z = (20 − 27)/4 = −1,75.<\/p><p>P(x ≤ 20) = Φ(−1,75) = 1 − Φ(1,75) = 1 − 0,9599 = <b>0,0401<\/b> (4,01%).<\/p><p>Chizma: normal egri chiziq, μ = 27 markazda; 20 dan chapdagi “dum” yuzasi bo‘yaladi.<\/p>", "ans": "x ning 20 dan oshmasligi ehtimoli ≈ 0,0401 (≈4%) — bu kam uchraydigan hodisa (o‘rtachadan 1,75σ past).", "t": "taqsimot", "status": "ok", "note": "", "id": "sm-57", "src": "stat"}], "formulas": [{"id": "nisbiy", "title": "Nisbiy miqdorlar", "items": [{"name": "Dinamika nisbiy miqdori", "f": "i = y₁ / y₀ · 100%", "note": "Joriy davr darajasini bazis davr bilan taqqoslaydi."}, {"name": "Reja topshirig‘i", "f": "i_rt = y_reja / y₀ · 100%", "note": "Reja bazis davrdan qancha yuqori belgilangan."}, {"name": "Reja bajarilishi", "f": "i_rb = y₁ / y_reja · 100%", "note": "Haqiqiy natija rejaga nisbatan."}, {"name": "Uchala ko‘rsatkich bog‘liqligi", "f": "i_dinamika = i_rt · i_rb", "note": "Koeffitsient ko‘rinishida ko‘paytiriladi (1,05 · 1,02 = 1,071)."}, {"name": "Tuzilma", "f": "d = qism / jami · 100%", "note": "Qismlar ulushlarining yig‘indisi 100%."}, {"name": "Koordinatsiya", "f": "K = A qism / B qism", "note": "Bir butunning qismlarini o‘zaro taqqoslaydi (masalan, eksport / import)."}, {"name": "Intensivlik", "f": "I = hodisa / muhit", "note": "Masalan, aholi jon boshiga tovar aylanmasi, 1 m² ga savdo."}, {"name": "Taqqoslash", "f": "I = A obyekt / B obyekt", "note": "Bir vaqtdagi ikki obyekt yoki hudud."}]}, {"id": "ortacha", "title": "O‘rtacha miqdorlar", "items": [{"name": "Oddiy arifmetik", "f": "x̄ = Σx / n", "note": ""}, {"name": "Tortilgan arifmetik", "f": "x̄ = Σx·f / Σf", "note": "Interval qatorda x — interval o‘rtasi. Ochiq intervallar qo‘shni interval kengligi bilan yopiladi."}, {"name": "Tortilgan garmonik", "f": "x̄ = ΣW / Σ(W / x),  W = x·f", "note": "Vazn (f) emas, umumiy hajm (W) ma’lum bo‘lsa: masalan, tovar aylanmasi va narx berilganda o‘rtacha narx."}, {"name": "Geometrik", "f": "x̄ = ⁿ√(x₁ · x₂ · … · xₙ)", "note": "O‘rtacha o‘sish koeffitsienti uchun."}, {"name": "Xronologik (teng oraliqli moment qatori)", "f": "ȳ = (y₁/2 + y₂ + … + yₙ₋₁ + yₙ/2) / (n − 1)", "note": "O‘rtacha tovar zaxirasi, o‘rtacha xodimlar soni (sanalardagi qiymatlar)."}, {"name": "Xronologik (notekis oraliq)", "f": "ȳ = Σ(ȳᵢ · tᵢ) / Σtᵢ,  ȳᵢ = (yᵢ + yᵢ₊₁) / 2", "note": "tᵢ — sanalar orasidagi kunlar soni."}, {"name": "Kvadratik", "f": "x̄ = √(Σx² / n)", "note": ""}]}, {"id": "moda", "title": "Moda va mediana (interval qator)", "items": [{"name": "Moda", "f": "Mo = x₀ + h · (f_Mo − f_Mo−1) / [(f_Mo − f_Mo−1) + (f_Mo − f_Mo+1)]", "note": "x₀ — modal interval quyi chegarasi (eng katta chastotali), h — interval kengligi."}, {"name": "Mediana", "f": "Me = x₀ + h · (Σf/2 − S_Me−1) / f_Me", "note": "Median interval — jamlangan chastota birinchi marta Σf/2 dan oshgan interval; S_Me−1 — undan oldingi jamlangan chastota."}, {"name": "Asimmetriya belgisi", "f": "x̄ > Me > Mo → o‘ng tomonlama;  x̄ < Me < Mo → chap tomonlama", "note": "x̄ ≈ Me ≈ Mo bo‘lsa taqsimot simmetrik."}]}, {"id": "variatsiya", "title": "Variatsiya ko‘rsatkichlari", "items": [{"name": "Variatsion kenglik", "f": "R = x_max − x_min", "note": ""}, {"name": "O‘rtacha chiziqli tafovut", "f": "d̄ = Σ|x − x̄|·f / Σf", "note": ""}, {"name": "Dispersiya", "f": "σ² = Σ(x − x̄)²·f / Σf  yoki  σ² = (x²)‾ − (x̄)²", "note": "Tanlanma dispersiyasi: s² = Σ(x − x̄)² / (n − 1)."}, {"name": "O‘rtacha kvadratik tafovut", "f": "σ = √σ²", "note": ""}, {"name": "Variatsiya koeffitsienti", "f": "V = σ / x̄ · 100%", "note": "V ≤ 33% bo‘lsa to‘plam bir jinsli, o‘rtacha tipik."}, {"name": "Dispersiyalarni qo‘shish qoidasi", "f": "σ²_umumiy = σ̄²_ichki + δ²_guruhlararo", "note": ""}, {"name": "Guruhlar ichidagi dispersiyalar o‘rtachasi", "f": "σ̄² = Σσᵢ²·nᵢ / Σnᵢ", "note": ""}, {"name": "Guruhlararo dispersiya", "f": "δ² = Σ(x̄ᵢ − x̄)²·nᵢ / Σnᵢ", "note": ""}, {"name": "Determinatsiya koeffitsienti va empirik korrelyatsion nisbat", "f": "η² = δ² / σ²,   η = √η²", "note": "η² — natija variatsiyasining guruhlash belgisi hisobiga to‘g‘ri keladigan ulushi."}]}, {"id": "dinamika", "title": "Dinamika qatorlari", "items": [{"name": "Mutlaq o‘sish", "f": "zanjir: Δ = yᵢ − yᵢ₋₁;   bazis: Δ = yᵢ − y₀", "note": "Zanjir mutlaq o‘sishlar yig‘indisi = oxirgi bazis mutlaq o‘sish."}, {"name": "O‘sish sur’ati", "f": "zanjir: T = yᵢ / yᵢ₋₁ · 100%;   bazis: T = yᵢ / y₀ · 100%", "note": "Zanjir koeffitsientlar ko‘paytmasi = bazis koeffitsient; qo‘shni bazis koeffitsientlar nisbati = zanjir koeffitsient."}, {"name": "Qo‘shimcha o‘sish sur’ati", "f": "Tq = T − 100%", "note": ""}, {"name": "1% qo‘shimcha o‘sishning mutlaq qiymati", "f": "A = Δ_zanjir / Tq_zanjir = 0,01 · yᵢ₋₁", "note": ""}, {"name": "O‘rtacha daraja", "f": "interval qator: ȳ = Σy / n;   moment qator: xronologik o‘rtacha", "note": ""}, {"name": "O‘rtacha mutlaq o‘sish", "f": "Δ̄ = (yₙ − y₁) / (n − 1)", "note": ""}, {"name": "O‘rtacha o‘sish koeffitsienti", "f": "K̄ = ⁿ⁻¹√(yₙ / y₁)", "note": "O‘rtacha o‘sish sur’ati = K̄ · 100%, o‘rtacha qo‘shimcha o‘sish = K̄·100 − 100."}, {"name": "Analitik tekislash (chiziqli trend)", "f": "ŷ = a + b·t;  Σt = 0 bo‘lsa: a = Σ function metaRow(it) {
  return `<div class="meta"><span class="num">${esc(label(it))}</span><span>${esc(SRC[it.src])}</span>` +
    (it.t && TOPICS[it.t] ? `<span class="chip">${esc(TOPICS[it.t])}</span>` : "") + statusChip(it) + `</div>`;
}
function bodyHtml(it) {
  if (it.kind === "theory") {
    return `<p class="q">${esc(it.q)}</p>` +
      (it.k ? `<p class="k">Tayanch iboralar: ${esc(it.k)}</p>` : "") +
      `<div class="ans">${it.a || '<p class="pending">Javob hali tayyorlanmoqda. Tayanch iboralar asosida o‘zingiz javob tuzib ko‘ring.</p>'}</div>`;
  }
  const cond = it.cond ? `<div class="cond">${it.cond}</div>` : `<pre class="raw">${esc(it.cond_raw || "")}</pre>`;
  const sol = it.sol
    ? it.sol + (it.ans ? `<p class="xulosa"><b>Xulosa:</b> ${it.ans}</p>` : "")
    : '<p class="pending">Yechim hali tayyorlanmoqda. «Formulalar» bo‘limidan kerakli formulani topib, o‘zingiz yechib ko‘ring.</p>';
  return (it.title ? `<p class="q">${esc(it.title)}</p>` : "") + cond + `<div class="ans">${sol}</div>`;
}
function card(it, extraFoot) {
  const revealTxt = it.kind === "theory" ? "Javobni ko‘rsatish" : "Yechimni ko‘rsatish";
  return `<article class="card src-${it.src}" id="${it.id}">${metaRow(it)}${bodyHtml(it)}` +
    `<div class="foot"><button class="btn reveal" type="button" data-reveal>${revealTxt}</button>${extraFoot || knownBtn(it)}</div></article>`;
}

/* progress */
function updateProgress() {
  const total = THEORY.length + TASKS.length;
  const k = [...known].filter((id) => BYID[id]).length;
  $("#prog-text").textContent = `Bilaman: ${k} / ${total}`;
  $("#prog-bar").style.width = (total ? (100 * k / total) : 0) + "%";
}

/* topic selects */
function fillTopics(sel, items) {
  const used = [...new Set(items.map((x) => x.t).filter((t) => TOPICS[t]))];
  used.sort((a, b) => TOPICS[a].localeCompare(TOPICS[b]));
  sel.innerHTML = `<option value="all">Barcha mavzular</option>` + used.map((t) => `<option value="${t}">${esc(TOPICS[t])}</option>`).join("");
}

/* lists */
function renderList(prefix, items) {
  const q = norm($(`#${prefix}-q`).value).trim();
  const src = $(`#${prefix}-src`).value;
  const topic = $(`#${prefix}-topic`).value;
  const unk = $(`#${prefix}-unk`).checked;
  const words = q ? q.split(" ") : [];
  const shown = items.filter((x) =>
    (src === "all" || x.src === src) && (topic === "all" || x.t === topic) &&
    (!unk || !known.has(x.id)) && words.every((w) => x._s.includes(w)));
  const box = $(`#${prefix}-list`);
  box.classList.toggle("hide-ans", $(`#${prefix}-hide`).checked);
  box.innerHTML = shown.map((x) => card(x)).join("") || `<p class="pending">Hech narsa topilmadi. Qidiruv so‘zini yoki filtrni o‘zgartiring.</p>`;
  $(`#${prefix}-count`).textContent = `${shown.length} ta ${items === THEORY ? "savol" : "masala"}`;
}
function renderTheory() { renderList("sv", THEORY); }
function renderTasks() { renderList("ms", TASKS); }

/* formulas */
function renderFormulas() {
  const words = norm($("#fm-q").value).trim().split(" ").filter(Boolean);
  const html = DATA.formulas.map((g) => {
    const rows = g.items.filter((f) => {
      const s = norm(g.title + " " + f.name + " " + f.f + " " + f.note);
      return words.every((w) => s.includes(w));
    });
    if (!rows.length) return "";
    return `<section class="fgroup"><h2>${esc(g.title)}</h2>` + rows.map((f) =>
      `<div class="frow"><div class="fn">${esc(f.name)}</div><div class="f">${esc(f.f)}</div>` +
      (f.note ? `<div class="fnote">${esc(f.note)}</div>` : "") + `</div>`).join("") + `</section>`;
  }).join("");
  $("#fm-list").innerHTML = html || `<p class="pending">Formula topilmadi.</p>`;
}

/* ticket */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(pool, n, preferUnknown, hasContent) {
  let p = shuffle(pool);
  p.sort((a, b) => (hasContent(b) - hasContent(a)) || (preferUnknown ? (known.has(a.id) - known.has(b.id)) : 0));
  return p.slice(0, n);
}
let ticket = [];
const verdict = {};
function newTicket() {
  const src = $("#tk-src").value;
  const unk = $("#tk-unk").checked;
  const th = pick(THEORY.filter((x) => src === "all" || x.src === src), 2, unk, (x) => (x.a ? 1 : 0));
  const ts = pick(TASKS.filter((x) => src === "all" || x.src === src), 2, unk, (x) => (x.sol ? 1 : 0));
  ticket = th.concat(ts);
  Object.keys(verdict).forEach((k) => delete verdict[k]);
  renderTicket();
  resetTimer();
}
function renderTicket() {
  $("#tk-list").innerHTML = ticket.map((it, i) => {
    const slot = i < 2 ? `${i + 1}. Nazariy savol` : `${i + 1}. Masala`;
    const v = verdict[it.id];
    const foot = `<button class="btn good" type="button" data-verdict="yes" data-id="${it.id}" aria-pressed="${v === "yes"}">Bildim</button>` +
      `<button class="btn no" type="button" data-verdict="no" data-id="${it.id}" aria-pressed="${v === "no"}">Bilmadim</button>`;
    return `<div><p class="slot">${slot}</p>${card(it, foot)}</div>`;
  }).join("");
  const done = Object.keys(verdict).length;
  const yes = Object.values(verdict).filter((v) => v === "yes").length;
  $("#tk-score").textContent = done ? `Natija: ${yes} / ${ticket.length} bildim` + (done < ticket.length ? ` (${ticket.length - done} tasi baholanmagan)` : "") : "";
}
let timerId = null, remaining = 0;
function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }
function resetTimer() {
  clearInterval(timerId); timerId = null;
  const min = +$("#tk-time").value;
  remaining = min * 60;
  const t = $("#tk-timer");
  t.classList.remove("done");
  t.textContent = min ? fmt(remaining) : "—";
  $("#tk-start").textContent = "Vaqtni boshlash";
  $("#tk-start").disabled = !min;
}
function toggleTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; $("#tk-start").textContent = "Davom ettirish"; return; }
  if (remaining <= 0) return;
  $("#tk-start").textContent = "To‘xtatish";
  timerId = setInterval(() => {
    remaining -= 1;
    $("#tk-timer").textContent = fmt(Math.max(remaining, 0));
    if (remaining <= 0) {
      clearInterval(timerId); timerId = null;
      $("#tk-timer").textContent = "Vaqt tugadi";
      $("#tk-timer").classList.add("done");
      $("#tk-start").textContent = "Vaqtni boshlash";
      $("#tk-start").disabled = true;
    }
  }, 1000);
}

/* flashcards */
let deck = [], pos = 0;
function buildDeck() {
  const src = $("#fc-src").value, topic = $("#fc-topic").value, unk = $("#fc-unk").checked;
  deck = shuffle(THEORY.filter((x) => (src === "all" || x.src === src) && (topic === "all" || x.t === topic) && (!unk || !known.has(x.id))));
  pos = 0;
  renderCard();
}
function renderCard() {
  const box = $("#fc-box");
  if (!deck.length) {
    box.innerHTML = `<div class="card flash"><p class="q">Bu to‘plamdagi barcha savollarni bilasiz.</p><p class="k">Boshqa mavzuni tanlang yoki «Faqat bilmaganlarim» belgisini olib tashlang.</p></div>`;
    $("#fc-pos").textContent = "";
    return;
  }
  if (pos >= deck.length) {
    box.innerHTML = `<div class="card flash"><p class="q">To‘plam tugadi.</p><p class="k">«Aralashtirish» tugmasi bilan qaytadan boshlang: bilmagan savollaringiz qoladi.</p></div>`;
    $("#fc-pos").textContent = `${deck.length} / ${deck.length}`;
    return;
  }
  const it = deck[pos];
  const foot = `<button class="btn good" type="button" data-fc="yes">Bildim</button><button class="btn" type="button" data-fc="no">Yana takrorlayman</button>`;
  box.innerHTML = card(it, foot).replace('class="card ', 'class="card flash ');
  $("#fc-pos").textContent = `${pos + 1} / ${deck.length}`;
}
function fcAnswer(yes) {
  const it = deck[pos];
  if (!it) return;
  if (yes) known.add(it.id); else known.delete(it.id);
  saveKnown();
  pos += 1;
  renderCard();
}

/* report */
function renderReport() {
  const items = THEORY.concat(TASKS).filter((x) => x.src === "stat");
  const counts = {};
  items.forEach((x) => { counts[x.status || "pending"] = (counts[x.status || "pending"] || 0) + 1; });
  const pending = counts.pending || 0;
  const changed = items.filter((x) => x.status && x.status !== "ok" && x.status !== "pending");
  let html = `<h2>Birinchi fayl javoblarini tekshirish</h2>` +
    `<p>«Statistika» faylidagi har bir nazariy javob darslik ta’riflari bilan solishtirildi, har bir misol esa qaytadan yechildi (hisob-kitoblar dastur yordamida takrorlandi).` +
    (pending ? ` Hozircha ${items.length - pending} / ${items.length} ta element tekshirildi, qolganlari tekshirilmoqda.` : "") + `</p>` +
    `<div class="stats">` + Object.keys(STATUS).filter((s) => counts[s]).map((s) => `<span class="chip s-${s}">${esc(STATUS[s])}: ${counts[s]}</span>`).join("") + `</div>`;
  if (changed.length) {
    html += `<h2>O‘zgartirilgan javoblar</h2><div class="list">` + changed.map((x) =>
      `<details class="rep"><summary><b>${esc(label(x))}</b> · <span class="chip s-${x.status}">${esc(STATUS[x.status])}</span>` +
      (x.note ? ` <span class="k">${esc(x.note)}</span>` : "") + `</summary>${card(x)}</details>`).join("") + `</div>`;
  } else if (!pending) {
    html += `<p>Barcha javoblar to‘g‘ri chiqdi.</p>`;
  }
  $("#rep").innerHTML = html;
}

/* routing */
function show(view) {
  if (!VIEWS.includes(view)) view = "mashq";
  VIEWS.forEach((v) => { $(`#view-${v}`).hidden = v !== view; });
  document.querySelectorAll("nav.tabs a").forEach((a) => {
    if (a.dataset.view === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

/* events */
document.addEventListener("click", (e) => {
  const kb = e.target.closest("[data-known]");
  if (kb) {
    const id = kb.dataset.known;
    if (known.has(id)) known.delete(id); else known.add(id);
    saveKnown();
    document.querySelectorAll(`[data-known="${id}"]`).forEach((b) => {
      b.setAttribute("aria-pressed", known.has(id)); b.textContent = known.has(id) ? "Bilaman ✓" : "Bilaman";
    });
    return;
  }
  const rv = e.target.closest("[data-reveal]");
  if (rv) { rv.closest(".card").classList.add("shown"); return; }
  const vd = e.target.closest("[data-verdict]");
  if (vd) {
    const id = vd.dataset.id, yes = vd.dataset.verdict === "yes";
    verdict[id] = yes ? "yes" : "no";
    if (yes) known.add(id); else known.delete(id);
    saveKnown();
    renderTicket();
    const c = document.getElementById(id); if (c) c.classList.add("shown");
    return;
  }
  const fc = e.target.closest("[data-fc]");
  if (fc) { fcAnswer(fc.dataset.fc === "yes"); }
});
document.addEventListener("keydown", (e) => {
  if ($("#view-kartochkalar").hidden) return;
  if (["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(e.target.tagName) && e.key === " ") return;
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); const c = $("#fc-box .card"); if (c) c.classList.add("shown"); }
  else if (e.key === "1") fcAnswer(true);
  else if (e.key === "2") fcAnswer(false);
});
["sv-q", "sv-src", "sv-topic", "sv-hide", "sv-unk"].forEach((id) => $("#" + id).addEventListener(id.endsWith("-q") ? "input" : "change", renderTheory));
["ms-q", "ms-src", "ms-topic", "ms-hide", "ms-unk"].forEach((id) => $("#" + id).addEventListener(id.endsWith("-q") ? "input" : "change", renderTasks));
$("#fm-q").addEventListener("input", renderFormulas);
["fc-src", "fc-topic", "fc-unk"].forEach((id) => $("#" + id).addEventListener("change", buildDeck));
$("#fc-shuffle").addEventListener("click", buildDeck);
$("#tk-new").addEventListener("click", newTicket);
$("#tk-src").addEventListener("change", newTicket);
$("#tk-time").addEventListener("change", resetTimer);
$("#tk-start").addEventListener("click", toggleTimer);

/* init */
(function init() {
  const m = DATA.meta;
  $("#sub").textContent = `Savdo statistikasi: ${m.savdoTheory} ta savol, ${m.savdoTasks} ta topshiriq · Statistika: ${m.statTheory} ta savol, ${m.statTasks} ta misol`;
  const parts = [];
  if (m.savdoTheoryDone < m.savdoTheory) parts.push(`Savdo statistikasi savollarining ${m.savdoTheoryDone} / ${m.savdoTheory} tasiga javob tayyor`);
  if (m.savdoTasksDone < m.savdoTasks) parts.push(`${m.savdoTasksDone} / ${m.savdoTasks} topshiriq yechilgan`);
  if (m.statChecked < m.statTotal) parts.push(`birinchi fayldan ${m.statChecked} / ${m.statTotal} ta javob tekshirilgan`);
  if (parts.length) {
    const b = $("#banner");
    b.textContent = "Birinchi versiya. Hozircha: " + parts.join(", ") + ". Qolganlari tayyorlanmoqda, sahifa yangilanadi.";
    b.hidden = false;
  }
  fillTopics($("#sv-topic"), THEORY);
  fillTopics($("#ms-topic"), TASKS);
  fillTopics($("#fc-topic"), THEORY);
  updateProgress();
  renderTheory(); renderTasks(); renderFormulas(); renderReport();
  buildDeck(); newTicket();
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
