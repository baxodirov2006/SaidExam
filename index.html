jadvalda miqdor bitta ustunda berilgan; Laspeyres formulasi talabiga ko‘ra u bazis davr miqdori (q<sub>0<\/sub>) deb olindi.<\/i><\/p><p><b>1) Laspeyres narx indeksi:<\/b> I<sub>p<\/sub><sup>L<\/sup> = Σp<sub>1<\/sub>q<sub>0<\/sub> / Σp<sub>0<\/sub>q<sub>0<\/sub>.<\/p><table><tr><th>Mahsulot<\/th><th>p<sub>0<\/sub>q<sub>0<\/sub>, so‘m<\/th><th>p<sub>1<\/sub>q<sub>0<\/sub>, so‘m<\/th><\/tr><tr><td>Go‘sht<\/td><td>120 000·125 = 15 000 000<\/td><td>139 000·125 = 17 375 000<\/td><\/tr><tr><td>Sut<\/td><td>13 000·350 = 4 550 000<\/td><td>15 000·350 = 5 250 000<\/td><\/tr><tr><td>Shakar<\/td><td>11 200·270 = 3 024 000<\/td><td>13 500·270 = 3 645 000<\/td><\/tr><tr><th>Jami<\/th><th>22 574 000<\/th><th>26 270 000<\/th><\/tr><\/table><p>I<sub>p<\/sub><sup>L<\/sup> = 26 270 000 / 22 574 000 = <b>1,164<\/b> (116,4%).<\/p><p><b>2)<\/b> Narxlarning umumiy o‘zgarishi: (1,164 − 1)·100 = <b>+16,4%<\/b>. Bazis davr savatini sotib olish uchun qo‘shimcha xarajat: Σp<sub>1<\/sub>q<sub>0<\/sub> − Σp<sub>0<\/sub>q<sub>0<\/sub> = 26 270 000 − 22 574 000 = 3 696 000 so‘m.<\/p><p><b>3) Iqtisodiy baho:<\/b> individual indekslar: go‘sht 1,158, sut 1,154, shakar 1,205. Umumiy indeksga eng katta ta’sirni sotuvdagi ulushi eng katta bo‘lgan go‘sht ko‘rsatgan. Iste’molchi bazis davrdagi xarid hajmini saqlab qolishi uchun 16,4% ko‘p pul sarflashi kerak.<\/p>", "ans": "Laspeyres narx indeksi I<sub>p<\/sub> = 1,164 (116,4%): narxlar o‘rtacha 16,4% ga oshgan, bazis savat narxi 3 696 000 so‘mga qimmatlashgan.", "t": "narx", "id": "stp-27", "src": "savdo"}, {"n": 28, "title": "Umumiy narx va fizik hajm indeksi (o‘rtacha arifmetik indeks), omillar ta’siri", "cond": "<p>Paxta gazlamalari sotilishi to‘g‘risida quyidagi ma’lumotlar berilgan. Hisobot davrida paxta gazlamalari bo‘yicha umumiy tovar aylanmasi o‘tgan davrga nisbatan 22 foizga oshgan.<\/p><table><tr><th>Paxta gazlama turi<\/th><th>O‘tgan davr tovar aylanmasi, ming so‘m<\/th><th>Individual fizik hajm indeksi<\/th><\/tr><tr><td>A<\/td><td>9 550<\/td><td>1,05<\/td><\/tr><tr><td>B<\/td><td>12 750<\/td><td>0,98<\/td><\/tr><tr><td>V<\/td><td>13 450<\/td><td>1,11<\/td><\/tr><tr><td>G<\/td><td>10 150<\/td><td>0,97<\/td><\/tr><\/table><p>Aniqlang: 1. Paxta gazlamalari bo‘yicha umumiy narx indeksini hisoblang. 2. Paxta gazlamalari bo‘yicha umumiy fizik hajm indeksini hisoblang. 3. Hisoblangan indekslar asosida tovar aylanmasi o‘zgarishiga narx omili va fizik hajm omilining ta’sirini izohlang.<\/p>", "cond_raw": "", "sol": "<p>Berilgan: Σp<sub>0<\/sub>q<sub>0<\/sub> va individual fizik hajm indekslari i<sub>q<\/sub> = q<sub>1<\/sub>/q<sub>0<\/sub>; tovar aylanmasi indeksi I<sub>pq<\/sub> = 1,22.<\/p><p><b>2) Umumiy fizik hajm indeksi<\/b> (o‘rtacha arifmetik shaklda): I<sub>q<\/sub> = Σi<sub>q<\/sub>·p<sub>0<\/sub>q<sub>0<\/sub> / Σp<sub>0<\/sub>q<sub>0<\/sub>.<\/p><table><tr><th>Tur<\/th><th>p<sub>0<\/sub>q<sub>0<\/sub><\/th><th>i<sub>q<\/sub><\/th><th>i<sub>q<\/sub>·p<sub>0<\/sub>q<sub>0<\/sub> = p<sub>0<\/sub>q<sub>1<\/sub><\/th><\/tr><tr><td>A<\/td><td>9 550<\/td><td>1,05<\/td><td>10 027,5<\/td><\/tr><tr><td>B<\/td><td>12 750<\/td><td>0,98<\/td><td>12 495,0<\/td><\/tr><tr><td>V<\/td><td>13 450<\/td><td>1,11<\/td><td>14 929,5<\/td><\/tr><tr><td>G<\/td><td>10 150<\/td><td>0,97<\/td><td>9 845,5<\/td><\/tr><tr><th>Jami<\/th><th>45 900<\/th><th><\/th><th>47 297,5<\/th><\/tr><\/table><p>I<sub>q<\/sub> = 47 297,5 / 45 900 = <b>1,030<\/b> (103,0%).<\/p><p><b>1) Umumiy narx indeksi<\/b> indekslar bog‘liqligidan: I<sub>pq<\/sub> = I<sub>p<\/sub> · I<sub>q<\/sub> ⇒ I<sub>p<\/sub> = I<sub>pq<\/sub> / I<sub>q<\/sub> = 1,22 / 1,030 = <b>1,184<\/b> (118,4%).<\/p><p><b>3) Omillar ta’siri<\/b> (ming so‘m): hisobot davri tovar aylanmasi Σp<sub>1<\/sub>q<sub>1<\/sub> = 1,22 · 45 900 = 55 998,0. Umumiy o‘zgarish: 55 998,0 − 45 900 = +10 098,0; narx omili hisobiga: Σp<sub>1<\/sub>q<sub>1<\/sub> − Σp<sub>0<\/sub>q<sub>1<\/sub> = 55 998,0 − 47 297,5 = +8 700,5; fizik hajm omili hisobiga: Σp<sub>0<\/sub>q<sub>1<\/sub> − Σp<sub>0<\/sub>q<sub>0<\/sub> = 47 297,5 − 45 900 = +1 397,5. Tekshiruv: 8 700,5 + 1 397,5 = 10 098,0.<\/p><p><b>Xulosa:<\/b> tovar aylanmasi 22% ga oshgan; shundan narxlar 18,4% ga, sotilgan gazlamalarning fizik hajmi esa 3,0% ga oshgan. O‘sishning asosiy qismi (8 700,5 ming so‘m, ya’ni 86,2%) narx omili hisobiga.<\/p>", "ans": "I<sub>q<\/sub> = 1,030 (+3,0%), I<sub>p<\/sub> = 1,184 (+18,4%). Tovar aylanmasi +10 098,0 ming so‘m: narx omili +8 700,5, fizik hajm omili +1 397,5 ming so‘m.", "t": "narx", "id": "stp-28", "src": "savdo"}, {"n": 29, "title": "Narx indekslari: yetishmayotgan ko‘rsatkichlarni topish", "cond": "<p>Jadvaldagi mavjud ma’lumotlar bo‘yicha A nomli tovarning o‘rtacha ulgurji narxi to‘g‘risida yetishmayotgan ko‘rsatkichlarni aniqlang:<\/p><table><tr><th>Yillar<\/th><th>1 donasining narxi, so‘m<\/th><th>Zanjirsimon indeks, %<\/th><th>Bazisli indeks, %<\/th><\/tr><tr><td>2023<\/td><td>?<\/td><td>–<\/td><td>100<\/td><\/tr><tr><td>2024<\/td><td>56 120<\/td><td>?<\/td><td>?<\/td><\/tr><tr><td>2025<\/td><td>?<\/td><td>81,4<\/td><td>98,4<\/td><\/tr><\/table>", "cond_raw": "", "sol": "<p><b>Bog‘liqlik:<\/b> bazisli indeks = zanjirsimon indekslar ko‘paytmasi; ketma-ket ikki bazisli indeksning nisbati zanjirsimon indeksga teng: i<sub>2025/2024<\/sub> = I<sub>2025/2023<\/sub> / I<sub>2024/2023<\/sub>.<\/p><p>1) 2024-yil bazisli indeksi: I<sub>2024/2023<\/sub> = 98,4 / 0,814 = <b>120,9%<\/b>.<\/p><p>2) 2024-yil zanjirsimon indeksi (oldingi yil = bazis yil 2023): i<sub>2024/2023<\/sub> = <b>120,9%<\/b>.<\/p><p>3) 2023-yil narxi: p<sub>2023<\/sub> = p<sub>2024<\/sub> / I<sub>2024/2023<\/sub> = 56 120 / 1,2088 = <b>46 424,47 so‘m<\/b>.<\/p><p>4) 2025-yil narxi: p<sub>2025<\/sub> = p<sub>2024<\/sub> · i<sub>2025/2024<\/sub> = 56 120 · 0,814 = <b>45 681,68 so‘m<\/b>. Tekshiruv: 46 424,47 · 0,984 = 45 681,68 so‘m.<\/p><table><tr><th>Yillar<\/th><th>Narx, so‘m<\/th><th>Zanjirsimon, %<\/th><th>Bazisli, %<\/th><\/tr><tr><td>2023<\/td><td>46 424,47<\/td><td>–<\/td><td>100,0<\/td><\/tr><tr><td>2024<\/td><td>56 120,00<\/td><td>120,9<\/td><td>120,9<\/td><\/tr><tr><td>2025<\/td><td>45 681,68<\/td><td>81,4<\/td><td>98,4<\/td><\/tr><\/table><p><b>Xulosa:<\/b> 2024-yilda narx 2023-yilga nisbatan 20,9% ga oshgan, 2025-yilda esa 2024-yilga nisbatan 18,6% ga pasaygan; natijada 2025-yil narxi 2023-yilga nisbatan 1,6% past.<\/p>", "ans": "p<sub>2023<\/sub> ≈ 46 424,47 so‘m, p<sub>2025<\/sub> ≈ 45 681,68 so‘m; 2024-yil uchun zanjirsimon va bazisli indeks 120,9%. Narx 2024-yilda 20,9% oshib, 2025-yilda 18,6% tushgan.", "t": "narx", "id": "stp-29", "src": "savdo"}, {"n": 30, "title": "Dispersiyalarni qo‘shish qoidasi, η² va empirik korrelyatsion nisbat", "cond": "<p>Savdo korxonalarida tovarlarning sotish narxi va sotilgan mahsulot miqdori o‘rtasidagi o‘zaro bog‘lanishni o‘rganish uchun quyidagicha guruhlash amalga oshirilgan:<\/p><table><tr><th>Guruhlar<\/th><th>O‘rtacha sotish narxi bo‘yicha guruhlar, ming so‘m<\/th><th>Savdo korxonalari soni<\/th><th>Bir kunda amalga oshirilgan tovar aylanmasi, mln so‘m<\/th><\/tr><tr><td>I<\/td><td>350 gacha<\/td><td>5<\/td><td>20; 20; 33; 33; 33<\/td><\/tr><tr><td>II<\/td><td>350–500<\/td><td>15<\/td><td>20; 20; 35; 35; 35; 35; 44; 44; 44; 44; 50; 50; 50; 50; 50<\/td><\/tr><\/table><p>Aniqlang: 1. Har bir guruh va ikkala guruh bo‘yicha bir kunlik o‘rtacha tovar aylanmasini; 2. Guruhlar ichidagi dispersiyani (σ<sub>i<\/sub>²); 3. Guruhlar ichidagi dispersiyalarning o‘rtachasini (σ̄<sub>i<\/sub>²); 4. Guruhlararo dispersiyani (δ²); 5. Umumiy dispersiyani (σ²); 6. Determinatsiya koeffitsientini (η²); 7. Haqiqiy (empirik) korrelyatsion nisbatni (η). Xulosa yozing: narx guruhlari va bir kunlik tovar aylanmasi o‘rtasidagi bog‘liqlikni statistik baholang.<\/p>", "cond_raw": "", "sol": "<p><b>1) O‘rtachalar:<\/b> x̄<sub>I<\/sub> = Σx / n = 139 / 5 = <b>27,80<\/b> mln so‘m; x̄<sub>II<\/sub> = 606 / 15 = <b>40,40<\/b> mln so‘m; umumiy x̄ = (139 + 606) / 20 = 745 / 20 = <b>37,25<\/b> mln so‘m.<\/p><p><b>2) Guruhlar ichidagi dispersiyalar:<\/b> σ<sub>i<\/sub>² = Σ(x − x̄<sub>i<\/sub>)²f / Σf.<\/p><table><tr><th>x (I guruh)<\/th><th>f<\/th><th>x·f<\/th><th>(x − 27,80)²·f<\/th><\/tr><tr><td>20<\/td><td>2<\/td><td>40<\/td><td>121,68<\/td><\/tr><tr><td>33<\/td><td>3<\/td><td>99<\/td><td>81,12<\/td><\/tr><tr><th>Σ<\/th><th>5<\/th><th>139<\/th><th>202,80<\/th><\/tr><\/table><table><tr><th>x (II guruh)<\/th><th>f<\/th><th>x·f<\/th><th>(x − 40,40)²·f<\/th><\/tr><tr><td>20<\/td><td>2<\/td><td>40<\/td><td>832,32<\/td><\/tr><tr><td>35<\/td><td>4<\/td><td>140<\/td><td>116,64<\/td><\/tr><tr><td>44<\/td><td>4<\/td><td>176<\/td><td>51,84<\/td><\/tr><tr><td>50<\/td><td>5<\/td><td>250<\/td><td>460,80<\/td><\/tr><tr><th>Σ<\/th><th>15<\/th><th>606<\/th><th>1 461,60<\/th><\/tr><\/table><p>σ<sub>I<\/sub>² = 202,80 / 5 = <b>40,56<\/b>; σ<sub>II<\/sub>² = 1 461,60 / 15 = <b>97,44<\/b>.<\/p><p><b>3) Guruhlar ichidagi dispersiyalarning o‘rtachasi:<\/b> σ̄<sub>i<\/sub>² = Σσ<sub>i<\/sub>²n<sub>i<\/sub> / Σn<sub>i<\/sub> = (40,56·5 + 97,44·15) / 20 = <b>83,22<\/b>.<\/p><p><b>4) Guruhlararo dispersiya:<\/b> δ² = Σ(x̄<sub>i<\/sub> − x̄)²n<sub>i<\/sub> / Σn<sub>i<\/sub> = ((27,80 − 37,25)²·5 + (40,40 − 37,25)²·15) / 20 = <b>29,77<\/b>.<\/p><p><b>5) Umumiy dispersiya<\/b> (dispersiyalarni qo‘shish qoidasi): σ² = σ̄<sub>i<\/sub>² + δ² = 83,22 + 29,77 = <b>112,99<\/b>. Tekshiruv: barcha 20 qiymat bo‘yicha to‘g‘ridan-to‘g‘ri σ² = Σx²/n − x̄² = 1 500,55 − 37,25² = 112,99.<\/p><p><b>6) Determinatsiya koeffitsienti:<\/b> η² = δ² / σ² = 29,77 / 112,99 = <b>0,263<\/b> (26,3%).<\/p><p><b>7) Empirik korrelyatsion nisbat:<\/b> η = √η² = √0,263 = <b>0,513<\/b>.<\/p><p><b>Xulosa:<\/b> yuqori narx guruhidagi (II) korxonalarning bir kunlik tovar aylanmasi I guruhdan 12,60 mln so‘m ko‘p. Tovar aylanmasi umumiy variatsiyasining 26,3% i narx guruhlari bo‘yicha farqlar bilan izohlanadi; Chaddok shkalasi bo‘yicha η = 0,513 (0,5–0,7 oralig‘ida) – bog‘lanish <b>sezilarli<\/b> (o‘rtacha kuchli): yuqori narxli guruhda tovar aylanmasi ham yuqori. Variatsiyaning asosiy qismi (73,7%) boshqa omillarga bog‘liq.<\/p>", "ans": "x̄<sub>I<\/sub> = 27,80, x̄<sub>II<\/sub> = 40,40, x̄ = 37,25 mln so‘m; σ<sub>I<\/sub>² = 40,56, σ<sub>II<\/sub>² = 97,44, σ̄<sub>i<\/sub>² = 83,22, δ² = 29,77, σ² = 112,99; η² = 0,263, η = 0,513: narx guruhi tovar aylanmasi variatsiyasining 26,3% ini izohlaydi; Chaddok shkalasi bo‘yicha bog‘lanish sezilarli (o‘rtacha kuchli).", "t": "umumiy", "id": "stp-30", "src": "savdo"}, {"n": 31, "title": "Dinamika nisbiy miqdorlari: bazis va zanjirsimon usul", "cond": "<p>Viloyatda yetishtirilgan bug‘doy hosili haqida quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Yillar<\/th><th>2021<\/th><th>2022<\/th><th>2023<\/th><th>2024<\/th><th>2025<\/th><\/tr><tr><td>Yetishtirilgan bug‘doy, ming tonna<\/td><td>540<\/td><td>550<\/td><td>570<\/td><td>560<\/td><td>600<\/td><\/tr><\/table><p>Dinamika nisbiy miqdorini bazis va zanjirsimon usullarda hisoblang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>Formulalar:<\/b> bazis usulida (bazis – 2021-yil) i<sub>b<\/sub> = y<sub>i<\/sub> / y<sub>0<\/sub> · 100%; zanjirsimon usulda i<sub>z<\/sub> = y<sub>i<\/sub> / y<sub>i−1<\/sub> · 100%.<\/p><table><tr><th>Yil<\/th><th>y, ming t<\/th><th>Bazisli, % (y<sub>i<\/sub>/540·100)<\/th><th>Zanjirsimon, %<\/th><\/tr><tr><td>2021<\/td><td>540<\/td><td>100,0<\/td><td>–<\/td><\/tr><tr><td>2022<\/td><td>550<\/td><td>101,9<\/td><td>550 / 540 · 100 = 101,9<\/td><\/tr><tr><td>2023<\/td><td>570<\/td><td>105,6<\/td><td>570 / 550 · 100 = 103,6<\/td><\/tr><tr><td>2024<\/td><td>560<\/td><td>103,7<\/td><td>560 / 570 · 100 = 98,2<\/td><\/tr><tr><td>2025<\/td><td>600<\/td><td>111,1<\/td><td>600 / 560 · 100 = 107,1<\/td><\/tr><\/table><p>Tekshiruv: zanjirsimon koeffitsientlar ko‘paytmasi oxirgi bazisli koeffitsientga teng: 1,019 · 1,036 · 0,982 · 1,071 = 1,111.<\/p><p>O‘rtacha yillik o‘sish sur’ati: T̄ = (600 / 540)<sup>1/4<\/sup> · 100 = 102,7%.<\/p><p><b>Xulosa:<\/b> 2025-yilda bug‘doy hosili 2021-yilga nisbatan 111,1% ni tashkil etdi, ya’ni 11,1% ga oshdi. Eng yuqori zanjirsimon o‘sish 2025-yilda (107,1%), eng past ko‘rsatkich 2024-yilda (98,2%). O‘rtacha yillik o‘sish 2,7%.<\/p>", "ans": "2025/2021 bazisli indeks 111,1% (+11,1%); zanjirsimon indekslar 101,9, 103,6, 98,2, 107,1%; o‘rtacha yillik o‘sish sur’ati 102,7%.", "t": "umumiy", "id": "stp-31", "src": "savdo"}, {"n": 32, "title": "Qo‘shilgan qiymat dinamikasi: bazis va zanjirsimon nisbiy miqdorlar", "cond": "<p>O‘zbekistonning tarmoq va sohalarida yaratilgan qo‘shilgan qiymat (QQ) hajmi dinamikasi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Ko‘rsatkich<\/th><th>2018<\/th><th>2019<\/th><th>2020<\/th><th>2021<\/th><th>2022<\/th><th>2023<\/th><th>2024<\/th><th>2025<\/th><\/tr><tr><td>Qo‘shilgan qiymat hajmi, 2020-yil narxlarida, trln so‘m<\/td><td>444,4<\/td><td>471,1<\/td><td>491,3<\/td><td>517,4<\/td><td>547,4<\/td><td>557,8<\/td><td>599,8<\/td><td>637,0<\/td><\/tr><\/table><p>Dinamika nisbiy miqdorlarini ikki (bazis va zanjirsimon) usulda hisoblang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>Formulalar:<\/b> bazis usulida (bazis – 2018-yil) i<sub>b<\/sub> = y<sub>i<\/sub> / y<sub>0<\/sub> · 100%; zanjirsimon usulda i<sub>z<\/sub> = y<sub>i<\/sub> / y<sub>i−1<\/sub> · 100%.<\/p><table><tr><th>Yil<\/th><th>y, trln so‘m<\/th><th>Bazisli, % (y<sub>i<\/sub>/444,4·100)<\/th><th>Zanjirsimon, %<\/th><\/tr><tr><td>2018<\/td><td>444,4<\/td><td>100,0<\/td><td>–<\/td><\/tr><tr><td>2019<\/td><td>471,1<\/td><td>106,0<\/td><td>471,1 / 444,4 · 100 = 106,0<\/td><\/tr><tr><td>2020<\/td><td>491,3<\/td><td>110,6<\/td><td>491,3 / 471,1 · 100 = 104,3<\/td><\/tr><tr><td>2021<\/td><td>517,4<\/td><td>116,4<\/td><td>517,4 / 491,3 · 100 = 105,3<\/td><\/tr><tr><td>2022<\/td><td>547,4<\/td><td>123,2<\/td><td>547,4 / 517,4 · 100 = 105,8<\/td><\/tr><tr><td>2023<\/td><td>557,8<\/td><td>125,5<\/td><td>557,8 / 547,4 · 100 = 101,9<\/td><\/tr><tr><td>2024<\/td><td>599,8<\/td><td>135,0<\/td><td>599,8 / 557,8 · 100 = 107,5<\/td><\/tr><tr><td>2025<\/td><td>637,0<\/td><td>143,3<\/td><td>637,0 / 599,8 · 100 = 106,2<\/td><\/tr><\/table><p>Tekshiruv: zanjirsimon koeffitsientlar ko‘paytmasi oxirgi bazisli koeffitsientga teng: 1,060 · 1,043 · 1,053 · 1,058 · 1,019 · 1,075 · 1,062 = 1,433.<\/p><p>O‘rtacha yillik o‘sish sur’ati: T̄ = (637,0 / 444,4)<sup>1/7<\/sup> · 100 = 105,3%.<\/p><p><b>Xulosa:<\/b> 2025-yilda qo‘shilgan qiymat hajmi (2020-yil narxlarida) 2018-yilga nisbatan 143,3% ni tashkil etdi, ya’ni 43,3% ga oshdi. Eng yuqori zanjirsimon o‘sish 2024-yilda (107,5%), eng past ko‘rsatkich 2023-yilda (101,9%). O‘rtacha yillik o‘sish 5,3%.<\/p>", "ans": "2025/2018 bazisli indeks 143,3% (+43,3%); zanjirsimon indekslar 106,0, 104,3, 105,3, 105,8, 101,9, 107,5, 106,2%; o‘rtacha yillik o‘sish sur’ati 105,3%.", "t": "umumiy", "id": "stp-32", "src": "savdo"}, {"n": 33, "title": "O‘zgaruvchan va doimiy tarkibli narx indekslari, tuzilmaviy siljishlar indeksi", "cond": "<p>Shahar bozorlarida 2025-yilning may va iyun oylarida sotilgan kartoshka to‘g‘risida quyidagi ma’lumotlar mavjud:<\/p><table><tr><th>Bozorlar<\/th><th>May: 1 kg narxi, ming so‘m<\/th><th>May: sotilgan, sentner<\/th><th>Iyun: 1 kg narxi, ming so‘m<\/th><th>Iyun: sotilgan, sentner<\/th><\/tr><tr><td>1<\/td><td>4,5<\/td><td>2187<\/td><td>4,0<\/td><td>219<\/td><\/tr><tr><td>2<\/td><td>4,3<\/td><td>320<\/td><td>3,5<\/td><td>300<\/td><\/tr><tr><td>3<\/td><td>4,0<\/td><td>245<\/td><td>3,2<\/td><td>374<\/td><\/tr><\/table><p>Hisoblang: a) narxning o‘zgaruvchan tarkibli indeksini; b) narxning doimiy tarkibli indeksini; s) tuzilmaviy siljishlar indeksini. Xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p>May – bazis davr (p<sub>0<\/sub>, q<sub>0<\/sub>), iyun – joriy davr (p<sub>1<\/sub>, q<sub>1<\/sub>).<\/p><table><tr><th>Bozor<\/th><th>p<sub>0<\/sub>q<sub>0<\/sub><\/th><th>p<sub>1<\/sub>q<sub>1<\/sub><\/th><th>p<sub>0<\/sub>q<sub>1<\/sub><\/th><\/tr><tr><td>1<\/td><td>9 841,5<\/td><td>876,0<\/td><td>985,5<\/td><\/tr><tr><td>2<\/td><td>1 376,0<\/td><td>1 050,0<\/td><td>1 290,0<\/td><\/tr><tr><td>3<\/td><td>980,0<\/td><td>1 196,8<\/td><td>1 496,0<\/td><\/tr><tr><th>Jami<\/th><th>12 197,5<\/th><th>3 122,8<\/th><th>3 771,5<\/th><\/tr><\/table><p>Σq<sub>0<\/sub> = 2752; Σq<sub>1<\/sub> = 893. O‘rtacha narxlar: p̄<sub>0<\/sub> = Σp<sub>0<\/sub>q<sub>0<\/sub>/Σq<sub>0<\/sub> = 12 197,5 / 2752 = 4,432; p̄<sub>1<\/sub> = Σp<sub>1<\/sub>q<sub>1<\/sub>/Σq<sub>1<\/sub> = 3 122,8 / 893 = 3,497; shartli p̄<sub>shartli<\/sub> = Σp<sub>0<\/sub>q<sub>1<\/sub>/Σq<sub>1<\/sub> = 3 771,5 / 893 = 4,223 ming so‘m.<\/p><p><b>a) O‘zgaruvchan tarkibli indeks:<\/b> I<sub>o‘zg<\/sub> = p̄<sub>1<\/sub> / p̄<sub>0<\/sub> = 3,497 / 4,432 = <b>0,789<\/b> (78,9%).<\/p><p><b>b) Doimiy tarkibli indeks:<\/b> I<sub>doim<\/sub> = Σp<sub>1<\/sub>q<sub>1<\/sub> / Σp<sub>0<\/sub>q<sub>1<\/sub> = 3 122,8 / 3 771,5 = <b>0,828<\/b> (82,8%).<\/p><p><b>s) Tuzilmaviy siljishlar indeksi:<\/b> I<sub>tuz<\/sub> = p̄<sub>shartli<\/sub> / p̄<sub>0<\/sub> = 4,223 / 4,432 = <b>0,953<\/b> (95,3%). Tekshiruv: I<sub>doim<\/sub> · I<sub>tuz<\/sub> = 0,828 · 0,953 = 0,789 = I<sub>o‘zg<\/sub>.<\/p><p><i>Izoh: may oyida 1-bozorda sotilgan hajm manbada «2187» deb berilgan (boshqa qiymatlardan keskin farq qiladi, ehtimol «218» bo‘lishi kerak). Yuqorida bosilgan qiymat bilan hisoblandi. Agar q<sub>0<\/sub> = 218 bo‘lsa: p̄<sub>0<\/sub> = 4,262, I<sub>o‘zg<\/sub> = 0,821, I<sub>doim<\/sub> = 0,828 (o‘zgarmaydi), I<sub>tuz<\/sub> = 0,991.<\/i><\/p><p><b>Xulosa:<\/b> har bir bozorda kartoshka narxi iyunda pasaygan; doimiy tarkibda narxlar o‘rtacha 17,2% ga tushgan. Sotuv tuzilmasi arzonroq bozorlar (2- va 3-bozor) tomon siljigani o‘rtacha narxni yana 4,7% ga kamaytirgan, natijada o‘rtacha narx jami 21,1% ga pasaygan.<\/p>", "ans": "I<sub>o‘zg<\/sub> = 0,789 (78,9%), I<sub>doim<\/sub> = 0,828 (82,8%), I<sub>tuz<\/sub> = 0,953 (95,3%). O‘rtacha narx 21,1% ga tushgan: narxlarning o‘zi 17,2% ga, tuzilma siljishi hisobiga 4,7% ga (q<sub>0<\/sub>=218 bo‘lsa: 0,821; 0,828; 0,991).", "t": "narx", "id": "stp-33", "src": "savdo"}, {"n": 34, "title": "Interval qatorda o‘rtacha daromad (tortilgan arifmetik o‘rtacha)", "cond": "<p>Viloyatda o‘rtacha aholi jon boshiga to‘g‘ri keladigan pul daromadlari bo‘yicha aholining taqsimlanishi quyidagicha bo‘lgan:<\/p><table><tr><th>O‘rtacha aholi jon boshiga oylik pul daromadlari, ming so‘m<\/th><th>Jamiga nisbatan aholi soni, %<\/th><\/tr><tr><td>1200 gacha<\/td><td>30,2<\/td><\/tr><tr><td>1200–1400<\/td><td>24,4<\/td><\/tr><tr><td>1400–1600<\/td><td>16,7<\/td><\/tr><tr><td>1600–1800<\/td><td>10,5<\/td><\/tr><tr><td>1800–2000<\/td><td>6,5<\/td><\/tr><tr><td>2000–2400<\/td><td>6,7<\/td><\/tr><tr><td>2400–2800<\/td><td>2,7<\/td><\/tr><tr><td>2800 va yuqori<\/td><td>2,3<\/td><\/tr><tr><th>Jami<\/th><th>100,0<\/th><\/tr><\/table><p>Viloyatda aholi jon boshiga to‘g‘ri keladigan pul daromadlarining o‘rtacha oylik miqdorini aniqlang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar qo‘shni interval kengligi bo‘yicha yopildi: «1200 gacha» → 1000–1200 (kenglik 200), «2800 va yuqori» → 2800–3200 (kenglik 400).<\/i><\/p><p>Interval qatorda o‘rtacha tortilgan arifmetik o‘rtacha bilan topiladi, x – interval o‘rtasi, f – salmoq (%): x̄ = Σx·f / Σf.<\/p><table><tr><th>Interval<\/th><th>x (o‘rtasi)<\/th><th>f, %<\/th><th>x·f<\/th><\/tr><tr><td>1200 gacha<\/td><td>1100<\/td><td>30,2<\/td><td>33 220<\/td><\/tr><tr><td>1200–1400<\/td><td>1300<\/td><td>24,4<\/td><td>31 720<\/td><\/tr><tr><td>1400–1600<\/td><td>1500<\/td><td>16,7<\/td><td>25 050<\/td><\/tr><tr><td>1600–1800<\/td><td>1700<\/td><td>10,5<\/td><td>17 850<\/td><\/tr><tr><td>1800–2000<\/td><td>1900<\/td><td>6,5<\/td><td>12 350<\/td><\/tr><tr><td>2000–2400<\/td><td>2200<\/td><td>6,7<\/td><td>14 740<\/td><\/tr><tr><td>2400–2800<\/td><td>2600<\/td><td>2,7<\/td><td>7 020<\/td><\/tr><tr><td>2800 va yuqori<\/td><td>3000<\/td><td>2,3<\/td><td>6 900<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>100,0<\/th><th>148 850<\/th><\/tr><\/table><p>x̄ = 148 850 / 100 = <b>1 488,50 ming so‘m<\/b>.<\/p><p><b>Xulosa:<\/b> viloyatda aholi jon boshiga o‘rtacha oylik pul daromadi ≈ 1 488,50 ming so‘m. Aholining 54,6% i 1400 ming so‘mdan kam daromadga ega (mediana ≈ 1 362,30 ming so‘m &lt; o‘rtacha), ya’ni taqsimot o‘ng tomonga asimmetrik: yuqori daromadli kichik guruh o‘rtachani ko‘taradi.<\/p>", "ans": "Aholi jon boshiga o‘rtacha oylik pul daromadi x̄ ≈ 1 488,50 ming so‘m; aholining yarmidan ko‘pi undan kam oladi (mediana ≈ 1 362,30), taqsimot o‘ngga og‘gan.", "t": "umumiy", "id": "stp-34", "src": "savdo"}, {"n": 35, "title": "Interval qatorda o‘rtacha, moda va mediana (ish vaqti sarfi)", "cond": "<p>Bitta detalga ishlov berish bo‘yicha ish vaqti sarfi quyidagicha taqsimlangan:<\/p><table><tr><th>Bitta detalga ishlov berishga vaqt sarfi, minut<\/th><th>4–5<\/th><th>5–6<\/th><th>6–7<\/th><th>7–8<\/th><th>8–9<\/th><th>9–10<\/th><th>10–11<\/th><\/tr><tr><td>Ishchilar soni, kishi<\/td><td>8<\/td><td>18<\/td><td>23<\/td><td>30<\/td><td>12<\/td><td>6<\/td><td>3<\/td><\/tr><\/table><p>Hisoblang: a) bitta detalga ishlov berish uchun sarflangan o‘rtacha ish vaqtini; b) moda va medianani. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>a) O‘rtacha:<\/b> x̄ = Σx·f / Σf, x – interval o‘rtasi.<\/p><table><tr><th>Interval<\/th><th>x<\/th><th>f<\/th><th>x·f<\/th><th>S (jaml.)<\/th><\/tr><tr><td>4–5<\/td><td>4,5<\/td><td>8<\/td><td>36,0<\/td><td>8<\/td><\/tr><tr><td>5–6<\/td><td>5,5<\/td><td>18<\/td><td>99,0<\/td><td>26<\/td><\/tr><tr><td>6–7<\/td><td>6,5<\/td><td>23<\/td><td>149,5<\/td><td>49<\/td><\/tr><tr><td>7–8<\/td><td>7,5<\/td><td>30<\/td><td>225,0<\/td><td>79<\/td><\/tr><tr><td>8–9<\/td><td>8,5<\/td><td>12<\/td><td>102,0<\/td><td>91<\/td><\/tr><tr><td>9–10<\/td><td>9,5<\/td><td>6<\/td><td>57,0<\/td><td>97<\/td><\/tr><tr><td>10–11<\/td><td>10,5<\/td><td>3<\/td><td>31,5<\/td><td>100<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>100<\/th><th>700,0<\/th><th><\/th><\/tr><\/table><p>x̄ = 700,0 / 100 = <b>7,00 minut<\/b>.<\/p><p><b>b)<\/b> Moda: modal interval – eng katta chastotali (30) interval 7–8. Mo = x<sub>0<\/sub> + h·(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / ((f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)) = 7 + 1·(30 − 23) / ((30 − 23) + (30 − 12)) = <b>7,28 minut<\/b>.<\/p><p>Mediana: Σf/2 = 50; jamlangan chastotalar 8, 26, 49, 79, 91, 97, 100 → median interval 7–8. Me = x<sub>0<\/sub> + h·(Σf/2 − S<sub>Me−1<\/sub>) / f<sub>Me<\/sub> = 7 + 1·(50 − 49) / 30 = <b>7,03 minut<\/b>.<\/p><p><b>Xulosa:<\/b> bitta detalga o‘rtacha 7,00 minut sarflanadi; eng ko‘p ishchilar ≈ 7,28 minut sarflaydi (moda), ishchilarning yarmi 7,03 minutdan kam vaqt sarflaydi. x̄ &lt; Me &lt; Mo – taqsimot biroz chapga (manfiy) asimmetrik, lekin uchala ko‘rsatkich bir-biriga yaqin.<\/p>", "ans": "x̄ = 7,00 min, Mo = 7,28 min, Me = 7,03 min; ko‘rsatkichlar yaqin, taqsimot deyarli simmetrik (ozgina chapga og‘gan).", "t": "umumiy", "id": "stp-35", "src": "savdo"}, {"n": 36, "title": "Interval qatorda moda va mediana (tovar namligi)", "cond": "<p>Do‘konga qabul qilingan tovarlar partiyasining namligi to‘g‘risidagi ma’lumotlar asosida moda va medianani aniqlang. Xulosalar yozing.<\/p><table><tr><th>Namlik darajasi, %<\/th><th>14 gacha<\/th><th>14–16<\/th><th>16–18<\/th><th>18–20<\/th><th>20 va yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Namunalar soni<\/td><td>20<\/td><td>30<\/td><td>25<\/td><td>15<\/td><td>10<\/td><td>100<\/td><\/tr><\/table>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar qo‘shni interval kengligi (2%) bo‘yicha yopildi: 12–14 va 20–22.<\/i><\/p><table><tr><th>Namlik, %<\/th><th>f<\/th><th>S (jaml.)<\/th><\/tr><tr><td>12–14<\/td><td>20<\/td><td>20<\/td><\/tr><tr><td>14–16<\/td><td>30<\/td><td>50<\/td><\/tr><tr><td>16–18<\/td><td>25<\/td><td>75<\/td><\/tr><tr><td>18–20<\/td><td>15<\/td><td>90<\/td><\/tr><tr><td>20–22<\/td><td>10<\/td><td>100<\/td><\/tr><\/table><p><b>Moda.<\/b> Moda: modal interval – eng katta chastotali (30) interval 14–16. Mo = x<sub>0<\/sub> + h·(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / ((f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)) = 14 + 2·(30 − 20) / ((30 − 20) + (30 − 25)) = <b>15,33 %<\/b>.<\/p><p><b>Mediana.<\/b> Mediana: Σf/2 = 50; jamlangan chastotalar 20, 50, 75, 90, 100 → median interval 14–16. Me = x<sub>0<\/sub> + h·(Σf/2 − S<sub>Me−1<\/sub>) / f<sub>Me<\/sub> = 14 + 2·(50 − 20) / 30 = <b>16,00 %<\/b>.<\/p><p><i>Ma’lumot uchun:<\/i> o‘rtacha namlik x̄ = 16,30%.<\/p><p><b>Xulosa:<\/b> eng ko‘p uchraydigan namlik darajasi ≈ 15,33%, namunalarning yarmi 16,00% dan past namlikka ega. Mo &lt; Me &lt; x̄ – taqsimot o‘ng tomonga asimmetrik (yuqori namlikdagi namunalar o‘rtachani oshiradi).<\/p>", "ans": "Mo = 15,33%, Me = 16,00% (o‘rtacha ≈ 16,30%); Mo &lt; Me &lt; x̄ – o‘ng tomonlama asimmetriya.", "t": "umumiy", "id": "stp-36", "src": "savdo"}, {"n": 37, "title": "O‘rtacha tannarx va tuzilmaviy siljish ta’siri", "cond": "<p>Savdo tashkilotiga tovar yetkazib beruvchi korxonada ishlab chiqariladigan «A» nomli mahsulotning miqdori va tannarxi to‘g‘risida quyidagi ma’lumotlar mavjud:<\/p><table><tr><th>Korxonalar<\/th><th>I chorak: bir donasining tannarxi, ming so‘m<\/th><th>I chorak: ishlab chiqarilgan, ming dona<\/th><th>II chorak: bir donasining tannarxi, ming so‘m<\/th><th>II chorak: ishlab chiqarilgan, ming dona<\/th><\/tr><tr><td>1<\/td><td>70<\/td><td>6<\/td><td>65<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>110<\/td><td>4<\/td><td>108<\/td><td>6<\/td><\/tr><\/table><p>Har bir chorak uchun mahsulotning o‘rtacha tannarxini aniqlang. O‘rtacha tannarxning ikkinchi chorakda birinchi chorakka qaraganda yuqori bo‘lganligi sababini tushuntiring. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p>O‘rtacha tannarx – tortilgan arifmetik o‘rtacha (vazn – ishlab chiqarilgan miqdor): z̄ = Σz·q / Σq.<\/p><p>I chorak: z̄<sub>1<\/sub> = (70·6 + 110·4) / (6 + 4) = 860 / 10 = <b>86,00 ming so‘m<\/b>.<\/p><p>II chorak: z̄<sub>2<\/sub> = (65·4 + 108·6) / (4 + 6) = 908 / 10 = <b>90,80 ming so‘m<\/b>.<\/p><p><b>Sababi:<\/b> har ikkala korxonada tannarx pasaygan (70 → 65 va 110 → 108), ammo ishlab chiqarish tuzilmasi o‘zgargan: tannarxi yuqori 2-korxonaning ulushi 40% dan 60% ga oshgan. Indekslar bilan: o‘zgaruvchan tarkibli I = 90,80 / 86,00 = 1,056; doimiy tarkibli I = Σz<sub>2<\/sub>q<sub>2<\/sub> / Σz<sub>1<\/sub>q<sub>2<\/sub> = 908 / 940 = 0,966; tuzilmaviy siljish indeksi I = 94,00 / 86,00 = 1,093 (tekshiruv: 0,966·1,093 = 1,056).<\/p><p><b>Xulosa:<\/b> o‘rtacha tannarx 86,00 dan 90,80 ming so‘mga (5,6% ga) oshgan. Tannarxning o‘zi 3,4% ga pasaygan, lekin qimmat korxona ulushining ortishi (tuzilmaviy siljish) o‘rtachani 9,3% ga oshirgan.<\/p>", "ans": "z̄<sub>I<\/sub> = 86,00 ming so‘m, z̄<sub>II<\/sub> = 90,80 ming so‘m (+5,6%). Sabab – tuzilmaviy siljish: qimmat 2-korxona ulushi 40% → 60%; bir xil tuzilmada tannarx 3,4% ga kamaygan.", "t": "xarajat", "id": "stp-37", "src": "savdo"}, {"n": 38, "title": "Tovar aylanmasi, narx (garmonik) va fizik hajm indekslari", "cond": "<p>Oziq-ovqat do‘koni bo‘yicha quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Mahsulot turlari<\/th><th>Kunlik tovar aylanmasi, mln so‘m: bazis davr<\/th><th>Kunlik tovar aylanmasi, mln so‘m: joriy davr<\/th><th>Joriy davrda bazis davrga nisbatan narx o‘zgarishi, %<\/th><\/tr><tr><td>Go‘sht<\/td><td>20,8<\/td><td>22,6<\/td><td>+5,0<\/td><\/tr><tr><td>Kolbasa<\/td><td>99,2<\/td><td>107,4<\/td><td>+1,4<\/td><\/tr><\/table><p>Aniqlang: 1. Tovar aylanmasi hajmi umumiy indeksini. 2. Bahoning umumiy indeksini. 3. Umumiy fizik hajm indeksini. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>1) Tovar aylanmasi indeksi:<\/b> I<sub>pq<\/sub> = Σp<sub>1<\/sub>q<sub>1<\/sub> / Σp<sub>0<\/sub>q<sub>0<\/sub> = (22,6 + 107,4) / (20,8 + 99,2) = 130,0 / 120,0 = <b>1,083<\/b> (108,3%).<\/p><p><b>2) Narx indeksi<\/b> (o‘rtacha garmonik shakl, i<sub>p<\/sub> = 1 + o‘zgarish/100): I<sub>p<\/sub> = Σp<sub>1<\/sub>q<sub>1<\/sub> / Σ(p<sub>1<\/sub>q<sub>1<\/sub> / i<sub>p<\/sub>).<\/p><table><tr><th>Mahsulot<\/th><th>p<sub>1<\/sub>q<sub>1<\/sub><\/th><th>i<sub>p<\/sub><\/th><th>p<sub>1<\/sub>q<sub>1<\/sub>/i<sub>p<\/sub> = p<sub>0<\/sub>q<sub>1<\/sub><\/th><\/tr><tr><td>Go‘sht<\/td><td>22,6<\/td><td>1,050<\/td><td>21,52<\/td><\/tr><tr><td>Kolbasa<\/td><td>107,4<\/td><td>1,014<\/td><td>105,92<\/td><\/tr><tr><th>Jami<\/th><th>130,0<\/th><th><\/th><th>127,44<\/th><\/tr><\/table><p>I<sub>p<\/sub> = 130,0 / 127,44 = <b>1,020<\/b> (102,0%).<\/p><p><b>3) Fizik hajm indeksi:<\/b> I<sub>q<\/sub> = I<sub>pq<\/sub> / I<sub>p<\/sub> = 1,083 / 1,020 = <b>1,062<\/b> (106,2%) (yoki Σp<sub>0<\/sub>q<sub>1<\/sub>/Σp<sub>0<\/sub>q<sub>0<\/sub> = 127,44 / 120,0 = 1,062).<\/p><p>Mutlaq o‘zgarish: jami +10,00 mln so‘m; narx hisobiga +2,56, fizik hajm hisobiga +7,44 mln so‘m.<\/p><p><b>Xulosa:<\/b> kunlik tovar aylanmasi 8,3% ga oshgan: narxlar o‘rtacha 2,0% ga, sotilgan tovarlarning fizik hajmi 6,2% ga ko‘paygan. O‘sishning asosiy qismi fizik hajm hisobiga.<\/p>", "ans": "I<sub>pq<\/sub> = 1,083 (+8,3%), I<sub>p<\/sub> = 1,020 (+2,0%), I<sub>q<\/sub> = 1,062 (+6,2%): tovar aylanmasi asosan sotuv hajmi o‘sishi hisobiga oshgan.", "t": "narx", "id": "stp-38", "src": "savdo"}, {"n": 39, "title": "O‘rtacha oylik ish haqi (arifmetik va boshlang‘ich nisbat)", "cond": "<p>2025-yil aprel oyida savdo birlashmasidagi 3 ta korxona bo‘yicha quyidagi ma’lumotlar keltirilgan:<\/p><table><tr><th>Korxonalar<\/th><th>Xodimlari soni, kishi (1)<\/th><th>Oylik ish haqi fondi, ming so‘m (2)<\/th><th>O‘rtacha oylik ish haqi, ming so‘m (3)<\/th><\/tr><tr><td>1<\/td><td>270<\/td><td>1 566 000<\/td><td>5 800<\/td><\/tr><tr><td>2<\/td><td>121<\/td><td>750 200<\/td><td>6 200<\/td><\/tr><tr><td>3<\/td><td>229<\/td><td>1 465 600<\/td><td>6 400<\/td><\/tr><tr><th>Jami<\/th><th>620<\/th><th>3 106 800<\/th><th>?<\/th><\/tr><\/table><p>O‘rtacha oylik ish haqini aniqlang: a) 1 va 2 ustunlardagi ma’lumotlar bo‘yicha; b) 1 va 3 ustunlardagi ma’lumotlar bo‘yicha. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: jadvaldagi «Jami» ish haqi fondi (3 106 800) ustun yig‘indisiga mos emas: 1 566 000 + 750 200 + 1 465 600 = 3 781 800 ming so‘m. 3 106 800 / 620 = 5 010,97 ming so‘m bo‘lib, u har bir korxonadagi o‘rtachadan (eng kami 5 800) past chiqadi – bu mumkin emas, demak «Jami» qatorida xato bor. Hisobda haqiqiy yig‘indi olindi.<\/i><\/p><p><b>a) 1 va 2 ustun bo‘yicha<\/b> (oddiy nisbat – boshlang‘ich formula): x̄ = ΣF / ΣT = 3 781 800 / 620 = <b>6 099,68 ming so‘m<\/b>.<\/p><p><b>b) 1 va 3 ustun bo‘yicha<\/b> (tortilgan arifmetik o‘rtacha, vazn – xodimlar soni): x̄ = Σx·T / ΣT = (5 800·270 + 6 200·121 + 6 400·229) / 620 = 3 781 800 / 620 = <b>6 099,68 ming so‘m<\/b>.<\/p><p><i>Qo‘shimcha:<\/i> agar 2 va 3 ustun berilsa, o‘rtacha garmonik tortilgan formula qo‘llanadi: x̄ = ΣF / Σ(F/x) = 3 781 800 / (270 + 121 + 229) = 6 099,68 ming so‘m.<\/p><p><b>Xulosa:<\/b> birlashma bo‘yicha o‘rtacha oylik ish haqi 6 099,68 ming so‘m; ikki usul bir xil natija beradi, chunki ish haqi fondi = xodimlar soni × o‘rtacha ish haqi. Eng yuqori ish haqi 3-korxonada (6 400), eng past 1-korxonada (5 800).<\/p>", "ans": "O‘rtacha oylik ish haqi a) va b) usullarda bir xil: 6 099,68 ming so‘m (to‘g‘ri jami fond 3 781 800 ming so‘m; jadvaldagi 3 106 800 – xato).", "t": "mehnat", "id": "stp-39", "src": "savdo"}, {"n": 40, "title": "O‘rtacha ishlangan kunlar va o‘rtacha kunlik mehnat unumdorligi", "cond": "<p>Hisobot davri uchun uchta savdo korxonasi bo‘yicha quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Korxonalar<\/th><th>Ishchilar soni, kishi<\/th><th>Ishlangan kishi-kunlari o‘rtacha soni<\/th><th>O‘rtacha kunlik mehnat unumdorligi, ming so‘m<\/th><\/tr><tr><td>1<\/td><td>500<\/td><td>60<\/td><td>2 500<\/td><\/tr><tr><td>2<\/td><td>1 000<\/td><td>64<\/td><td>3 000<\/td><\/tr><tr><td>3<\/td><td>900<\/td><td>62<\/td><td>2 800<\/td><\/tr><\/table><p>Uchta savdo korxonasi bo‘yicha aniqlansin: 1. Ishlangan kishi-kunlari o‘rtacha soni; 2. O‘rtacha kunlik mehnat unumdorligi. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p>Bir ishchi ishlagan kunlar (D) – ishchilar soni (N) bo‘yicha tortiladi; kunlik unumdorlik (W) – ishlangan jami kishi-kunlar (N·D) bo‘yicha tortiladi.<\/p><table><tr><th>Korxona<\/th><th>N<\/th><th>D<\/th><th>N·D (kishi-kun)<\/th><th>W<\/th><th>N·D·W (ming so‘m)<\/th><\/tr><tr><td>1<\/td><td>500<\/td><td>60<\/td><td>30 000<\/td><td>2 500<\/td><td>75 000 000<\/td><\/tr><tr><td>2<\/td><td>1 000<\/td><td>64<\/td><td>64 000<\/td><td>3 000<\/td><td>192 000 000<\/td><\/tr><tr><td>3<\/td><td>900<\/td><td>62<\/td><td>55 800<\/td><td>2 800<\/td><td>156 240 000<\/td><\/tr><tr><th>Jami<\/th><th>2 400<\/th><th><\/th><th>149 800<\/th><th><\/th><th>423 240 000<\/th><\/tr><\/table><p><b>1)<\/b> D̄ = Σ(N·D) / ΣN = 149 800 / 2 400 = <b>62,42 kun<\/b>.<\/p><p><b>2)<\/b> W̄ = Σ(N·D·W) / Σ(N·D) = 423 240 000 / 149 800 = <b>2 825,37 ming so‘m<\/b> bir kishi-kunga.<\/p><p><b>Xulosa:<\/b> bir ishchi o‘rtacha 62,42 kishi-kun ishlagan; bir kishi-kunga o‘rtacha 2 825,37 ming so‘mlik tovar aylanmasi to‘g‘ri keladi. Eng yuqori unumdorlik 2-korxonada (3 000), eng past 1-korxonada (2 500).<\/p>", "ans": "Ishlangan kishi-kunlari o‘rtacha soni 62,42 kun; o‘rtacha kunlik mehnat unumdorligi 2 825,37 ming so‘m (jami 423 240 000 ming so‘m / 149 800 kishi-kun).", "t": "mehnat", "id": "stp-40", "src": "savdo"}, {"n": 41, "title": "O‘rtacha reja bajarilishi foizi (garmonik va arifmetik o‘rtacha)", "cond": "<p>Firmalarning bo‘limlari bo‘yicha buyurtmaning bajarilishi to‘g‘risida ma’lumotlar keltirilgan:<\/p><table><tr><th>Bo‘limlar<\/th><th>I chorak: amalda bajarilishi, mln so‘m<\/th><th>I chorak: rejani bajarilishi, %<\/th><th>II chorak: reja, mln so‘m<\/th><th>II chorak: rejani bajarilishi, %<\/th><\/tr><tr><td>1<\/td><td>670<\/td><td>98,0<\/td><td>720<\/td><td>105,4<\/td><\/tr><tr><td>2<\/td><td>730<\/td><td>105,3<\/td><td>780<\/td><td>105,7<\/td><\/tr><tr><td>3<\/td><td>520<\/td><td>103,7<\/td><td>550<\/td><td>101,5<\/td><\/tr><tr><td>4<\/td><td>375<\/td><td>110,5<\/td><td>350<\/td><td>98,5<\/td><\/tr><\/table><p>Har bir chorak bo‘yicha o‘rtacha reja bajarilishi foizini aniqlang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p>O‘rtacha reja bajarilishi = Σhaqiqiy / Σreja · 100%. I chorakda reja noma’lum (haqiqiy hajm berilgan) → <b>o‘rtacha garmonik tortilgan<\/b>; II chorakda reja berilgan → <b>o‘rtacha arifmetik tortilgan<\/b>.<\/p><table><tr><th>Bo‘lim<\/th><th>I: haqiqiy<\/th><th>I: %<\/th><th>I: reja = haqiqiy/%·100<\/th><th>II: reja<\/th><th>II: %<\/th><th>II: haqiqiy = reja·%/100<\/th><\/tr><tr><td>1<\/td><td>670<\/td><td>98,0<\/td><td>683,67<\/td><td>720<\/td><td>105,4<\/td><td>758,88<\/td><\/tr><tr><td>2<\/td><td>730<\/td><td>105,3<\/td><td>693,26<\/td><td>780<\/td><td>105,7<\/td><td>824,46<\/td><\/tr><tr><td>3<\/td><td>520<\/td><td>103,7<\/td><td>501,45<\/td><td>550<\/td><td>101,5<\/td><td>558,25<\/td><\/tr><tr><td>4<\/td><td>375<\/td><td>110,5<\/td><td>339,37<\/td><td>350<\/td><td>98,5<\/td><td>344,75<\/td><\/tr><tr><th>Jami<\/th><th>2295<\/th><th><\/th><th>2 217,74<\/th><th>2400<\/th><th><\/th><th>2 486,34<\/th><\/tr><\/table><p><b>I chorak:<\/b> x̄ = Σw / Σ(w/x) = 2295 / 2 217,74 · 100 = <b>103,5%<\/b>.<\/p><p><b>II chorak:<\/b> x̄ = Σx·f / Σf = 2 486,34 / 2400 · 100 = <b>103,6%<\/b>.<\/p><p><b>Xulosa:<\/b> I chorakda buyurtma rejasi o‘rtacha 103,5% ga (1-bo‘lim rejani bajarmagan – 98%), II chorakda 103,6% ga bajarilgan (4-bo‘lim bajarmagan – 98,5%). Reja bajarilishi II chorakda oshgan (+0,1 foiz punkt).<\/p>", "ans": "O‘rtacha reja bajarilishi: I chorak 103,5% (garmonik o‘rtacha), II chorak 103,6% (arifmetik o‘rtacha); ikkala chorakda ham reja ortig‘i bilan bajarilgan.", "t": "umumiy", "id": "stp-41", "src": "savdo"}, {"n": 42, "title": "O‘rtacha reja bajarilishi: arifmetik, garmonik va boshlang‘ich nisbat; oliy nav ulushi", "cond": "<p>Savdo birlashmasidagi sexlarning ikkinchi chorakdagi faoliyati to‘g‘risida quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Sexlar<\/th><th>Mahsulot qadoqlash rejasi, mln so‘m (1)<\/th><th>Haqiqatda qadoqlangan mahsulot, mln so‘m (2)<\/th><th>Reja bajarilishi, % (3)<\/th><th>Oliy navli mahsulot, % (4)<\/th><\/tr><tr><td>I<\/td><td>400<\/td><td>400<\/td><td>100,0<\/td><td>65,1<\/td><\/tr><tr><td>II<\/td><td>405<\/td><td>408<\/td><td>100,7<\/td><td>64,2<\/td><\/tr><tr><td>III<\/td><td>410<\/td><td>405<\/td><td>98,8<\/td><td>58,5<\/td><\/tr><tr><td>IV<\/td><td>420<\/td><td>434<\/td><td>103,3<\/td><td>70,3<\/td><\/tr><\/table><p>Aniqlang: 1. Birlashmadagi barcha sexlar bo‘yicha o‘rtacha reja bajarilishi foizini: a) 1 va 2 ustundagi ma’lumotlar bo‘yicha; b) 1 va 3 ustundagi ma’lumotlar bo‘yicha; v) 2 va 3 ustundagi ma’lumotlar bo‘yicha. 2. Oliy navli mahsulotning o‘rtacha foizini. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>1a) 1 va 2 ustun<\/b> (boshlang‘ich nisbat): x̄ = Σhaqiqiy / Σreja · 100 = 1647 / 1635 · 100 = <b>100,7%<\/b>.<\/p><p><b>1b) 1 va 3 ustun<\/b> (arifmetik tortilgan, vazn – reja): x̄ = Σreja·% / Σreja = (400·100,0 + 405·100,7 + 410·98,8 + 420·103,3) / 1635 = 164 677,5 / 1635 = <b>100,7%<\/b>.<\/p><p><b>1v) 2 va 3 ustun<\/b> (garmonik tortilgan, vazn – haqiqiy hajm): x̄ = Σhaqiqiy / Σ(haqiqiy/%·100) = 1647 / (400,00 + 405,16 + 409,92 + 420,14) · 100 = 1647 / 1 635,22 · 100 = <b>100,7%<\/b>.<\/p><p><b>2) Oliy navli mahsulotning o‘rtacha foizi<\/b> (vazn – haqiqatda qadoqlangan mahsulot): x̄ = Σ(2)·(4) / Σ(2) = (400·65,1 + 408·64,2 + 405·58,5 + 434·70,3) / 1647 = 106 436,3 / 1647 = <b>64,6%<\/b>.<\/p><p><b>Xulosa:<\/b> uchala usul bir xil natija beradi (≈100,7%): birlashma qadoqlash rejasini 0,7% ortig‘i bilan bajargan; faqat III sex rejani bajarmagan (98,8%). Qadoqlangan mahsulotning o‘rtacha 64,6% i oliy navli; eng yuqori ulush IV sexda (70,3%), eng past III sexda (58,5%).<\/p>", "ans": "O‘rtacha reja bajarilishi a), b), v) usullarda ≈ 100,7% (a: 100,7, b: 100,7, v: 100,7); oliy navli mahsulotning o‘rtacha ulushi 64,6%.", "t": "umumiy", "id": "stp-42", "src": "savdo"}, {"n": 43, "title": "Interval qatorda o‘rtacha, moda, mediana va taqsimot xarakteri", "cond": "<p>Savdo firmalarining oylik tovar aylanmasi hajmi bo‘yicha taqsimlanishi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Tovar aylanmasi, mln so‘m<\/th><th>450 gacha<\/th><th>450–500<\/th><th>500–550<\/th><th>550–600<\/th><th>600–650<\/th><th>650 va yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Firmalar soni<\/td><td>20<\/td><td>26<\/td><td>20<\/td><td>14<\/td><td>10<\/td><td>10<\/td><td>100<\/td><\/tr><\/table><p>Aniqlang: 1) bir firmaga to‘g‘ri keladigan o‘rtacha oylik tovar aylanmasi hajmini; 2) oylik tovar aylanmasi bo‘yicha moda va medianani; 3) muayyan taqsimotning xarakteri to‘g‘risida xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar qo‘shni interval kengligi (50) bo‘yicha yopildi: 400–450 va 650–700.<\/i><\/p><table><tr><th>Interval<\/th><th>x<\/th><th>f<\/th><th>x·f<\/th><th>(x − x̄)²·f<\/th><th>S<\/th><\/tr><tr><td>400–450<\/td><td>425<\/td><td>20<\/td><td>8 500<\/td><td>196 020,00<\/td><td>20<\/td><\/tr><tr><td>450–500<\/td><td>475<\/td><td>26<\/td><td>12 350<\/td><td>62 426,00<\/td><td>46<\/td><\/tr><tr><td>500–550<\/td><td>525<\/td><td>20<\/td><td>10 500<\/td><td>20,00<\/td><td>66<\/td><\/tr><tr><td>550–600<\/td><td>575<\/td><td>14<\/td><td>8 050<\/td><td>36 414,00<\/td><td>80<\/td><\/tr><tr><td>600–650<\/td><td>625<\/td><td>10<\/td><td>6 250<\/td><td>102 010,00<\/td><td>90<\/td><\/tr><tr><td>650–700<\/td><td>675<\/td><td>10<\/td><td>6 750<\/td><td>228 010,00<\/td><td>100<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>100<\/th><th>52 400<\/th><th>624 900,00<\/th><th><\/th><\/tr><\/table><p><b>1)<\/b> x̄ = Σx·f / Σf = 52 400 / 100 = <b>524,00 mln so‘m<\/b>.<\/p><p><b>2)<\/b> Moda: modal interval – eng katta chastotali (26) interval 450–500. Mo = x<sub>0<\/sub> + h·(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / ((f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)) = 450 + 50·(26 − 20) / ((26 − 20) + (26 − 20)) = <b>475,00 mln so‘m<\/b>.<\/p><p>Mediana: Σf/2 = 50; jamlangan chastotalar 20, 46, 66, 80, 90, 100 → median interval 500–550. Me = x<sub>0<\/sub> + h·(Σf/2 − S<sub>Me−1<\/sub>) / f<sub>Me<\/sub> = 500 + 50·(50 − 46) / 20 = <b>510,00 mln so‘m<\/b>.<\/p><p><b>3) Taqsimot xarakteri:<\/b> σ = √(Σ(x − x̄)²f / Σf) = √(624 900,00 / 100) = 79,05 mln so‘m; Pirson asimmetriya koeffitsienti A<sub>s<\/sub> = (x̄ − Mo) / σ = (524,00 − 475,00) / 79,05 = 0,620. Mo &lt; Me &lt; x̄ va A<sub>s<\/sub> &gt; 0 – <b>o‘ng tomonlama (musbat) asimmetriya<\/b>.<\/p><p><b>Xulosa:<\/b> bir firmaning o‘rtacha oylik tovar aylanmasi 524,00 mln so‘m; eng ko‘p uchraydigan qiymat 475,00 mln so‘m, firmalarning yarmi 510,00 mln so‘mdan kam aylanmaga ega. Yirik firmalar o‘rtachani yuqoriga tortadi.<\/p>", "ans": "x̄ = 524,00 mln so‘m, Mo = 475,00, Me = 510,00 mln so‘m; Mo &lt; Me &lt; x̄ (A<sub>s<\/sub> = 0,620) – taqsimot o‘ngga og‘gan (musbat asimmetriya).", "t": "umumiy", "id": "stp-43", "src": "savdo"}, {"n": 44, "title": "100 so‘mlik mahsulotga o‘rtacha xarajat (o‘rtacha garmonik)", "cond": "<p>Korxona sexlarining oylik ishlab chiqarish faoliyati to‘g‘risida quyidagi ma’lumotlar mavjud:<\/p><table><tr><th>Korxona sexlari<\/th><th>Ishlab chiqarish umumiy xarajatlari, ming so‘m<\/th><th>100 so‘mlik ishlab chiqarilgan mahsulotga xarajatlar, so‘m<\/th><\/tr><tr><td>1<\/td><td>232 340<\/td><td>75<\/td><\/tr><tr><td>2<\/td><td>821 590<\/td><td>71<\/td><\/tr><tr><td>3<\/td><td>442 060<\/td><td>73<\/td><\/tr><tr><td>4<\/td><td>352 530<\/td><td>78<\/td><\/tr><\/table><p>Korxona bo‘yicha 100 so‘mlik ishlab chiqarilgan mahsulotga to‘g‘ri kelgan o‘rtacha xarajatni aniqlang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p>100 so‘mlik mahsulotga xarajat x = xarajat / mahsulot · 100. Xarajatlar (surat) berilgan, mahsulot hajmi (maxraj) noma’lum → <b>o‘rtacha garmonik tortilgan<\/b>: x̄ = Σw / Σ(w/x).<\/p><table><tr><th>Sex<\/th><th>w – xarajat, ming so‘m<\/th><th>x, so‘m<\/th><th>Mahsulot = w/x·100, ming so‘m<\/th><\/tr><tr><td>1<\/td><td>232 340<\/td><td>75<\/td><td>309 786,67<\/td><\/tr><tr><td>2<\/td><td>821 590<\/td><td>71<\/td><td>1 157 169,01<\/td><\/tr><tr><td>3<\/td><td>442 060<\/td><td>73<\/td><td>605 561,64<\/td><\/tr><tr><td>4<\/td><td>352 530<\/td><td>78<\/td><td>451 961,54<\/td><\/tr><tr><th>Jami<\/th><th>1 848 520<\/th><th><\/th><th>2 524 478,86<\/th><\/tr><\/table><p>x̄ = 1 848 520 / 2 524 478,86 · 100 = <b>73,22 so‘m<\/b> (100 so‘mlik mahsulotga).<\/p><p><b>Xulosa:<\/b> korxona bo‘yicha har 100 so‘mlik mahsulotga o‘rtacha 73,22 so‘m xarajat to‘g‘ri keladi (oddiy o‘rtacha 74,25 bo‘lardi – noto‘g‘ri, chunki sexlar hajmi har xil). Eng tejamkor – 2-sex (71 so‘m), eng xarajatli – 4-sex (78 so‘m), ya’ni xarajatlar mahsulot qiymatining ≈ 73,2% ini tashkil etadi.<\/p>", "ans": "O‘rtacha garmonik tortilgan: 100 so‘mlik mahsulotga o‘rtacha xarajat 73,22 so‘m (jami xarajat 1 848 520, jami mahsulot 2 524 478,86 ming so‘m).", "t": "xarajat", "id": "stp-44", "src": "savdo"}, {"n": 45, "title": "Interval qatorda o‘rtacha, moda, σ va variatsiya koeffitsienti", "cond": "<p>Savdo firmalarining oylik tovar aylanmasi bo‘yicha taqsimlanishi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Tovar aylanmasi, mlrd so‘m<\/th><th>5 gacha<\/th><th>5–10<\/th><th>10–15<\/th><th>15–20<\/th><th>20–25<\/th><th>25 va undan yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Firmalar soni<\/td><td>20<\/td><td>26<\/td><td>20<\/td><td>14<\/td><td>10<\/td><td>10<\/td><td>100<\/td><\/tr><\/table><p>Aniqlang: a) o‘rtachani; b) modani; s) o‘rtacha kvadratik tafovutni; d) variatsiya koeffitsientini. Tovar aylanmasi taqsimlanishining xarakteri (tabiati) to‘g‘risida xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar qo‘shni interval kengligi (5) bo‘yicha yopildi: 0–5 va 25–30.<\/i><\/p><table><tr><th>Interval<\/th><th>x<\/th><th>f<\/th><th>x·f<\/th><th>(x − x̄)²·f<\/th><th>S<\/th><\/tr><tr><td>0–5<\/td><td>2,5<\/td><td>20<\/td><td>50,0<\/td><td>1 960,20<\/td><td>20<\/td><\/tr><tr><td>5–10<\/td><td>7,5<\/td><td>26<\/td><td>195,0<\/td><td>624,26<\/td><td>46<\/td><\/tr><tr><td>10–15<\/td><td>12,5<\/td><td>20<\/td><td>250,0<\/td><td>0,20<\/td><td>66<\/td><\/tr><tr><td>15–20<\/td><td>17,5<\/td><td>14<\/td><td>245,0<\/td><td>364,14<\/td><td>80<\/td><\/tr><tr><td>20–25<\/td><td>22,5<\/td><td>10<\/td><td>225,0<\/td><td>1 020,10<\/td><td>90<\/td><\/tr><tr><td>25–30<\/td><td>27,5<\/td><td>10<\/td><td>275,0<\/td><td>2 280,10<\/td><td>100<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>100<\/th><th>1 240,0<\/th><th>6 249,00<\/th><th><\/th><\/tr><\/table><p><b>a)<\/b> x̄ = Σx·f / Σf = 1 240,0 / 100 = <b>12,40 mlrd so‘m<\/b>.<\/p><p><b>b)<\/b> Moda: modal interval – eng katta chastotali (26) interval 5–10. Mo = x<sub>0<\/sub> + h·(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / ((f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)) = 5 + 5·(26 − 20) / ((26 − 20) + (26 − 20)) = <b>7,50 mlrd so‘m<\/b>.<\/p><p><b>s)<\/b> σ = √(Σ(x − x̄)²f / Σf) = √(6 249,00 / 100) = √62,49 = <b>7,91 mlrd so‘m<\/b>.<\/p><p><b>d)<\/b> V = σ / x̄ · 100% = 7,91 / 12,40 · 100 = <b>63,8%<\/b>.<\/p><p><b>Xulosa:<\/b> o‘rtacha oylik tovar aylanmasi 12,40 mlrd so‘m, eng ko‘p uchraydigan qiymat 7,50 mlrd so‘m. x̄ &gt; Mo (A<sub>s<\/sub> = (12,40 − 7,50) / 7,91 = 0,620) – taqsimot o‘ng tomonga asimmetrik. V = 63,8% &gt; 33% – to‘plam bir jinsli emas, firmalar aylanma hajmi bo‘yicha keskin farq qiladi; o‘rtacha unchalik tipik emas.<\/p>", "ans": "x̄ = 12,40 mlrd so‘m, Mo = 7,50, σ = 7,91 mlrd so‘m, V = 63,8%; taqsimot o‘ngga og‘gan, to‘plam bir jinsli emas (V &gt; 33%).", "t": "umumiy", "id": "stp-45", "src": "savdo"}, {"n": 46, "title": "Interval qatorda umumiy dispersiya (salmoqlar bo‘yicha)", "cond": "<p>Yuridik statusga ega savdo korxonalari aktivlarining miqdori bo‘yicha taqsimlanishi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Aktivlar miqdori, mlrd so‘m<\/th><th>200 gacha<\/th><th>200–300<\/th><th>300–400<\/th><th>400–500<\/th><th>500–600<\/th><th>600 va yuqori<\/th><th>Jami<\/th><\/tr><tr><td>Jamiga nisbatan savdo korxonalari salmog‘i, %<\/td><td>8<\/td><td>25<\/td><td>52<\/td><td>7<\/td><td>5<\/td><td>3<\/td><td>100<\/td><\/tr><\/table><p>Umumiy dispersiyani aniqlang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><i>Izoh: ochiq intervallar qo‘shni interval kengligi (100) bo‘yicha yopildi: 100–200 va 600–700. Vazn sifatida salmoqlar (%) olinadi.<\/i><\/p><table><tr><th>Interval<\/th><th>x<\/th><th>f<\/th><th>x·f<\/th><th>(x − x̄)²·f<\/th><th>S<\/th><\/tr><tr><td>100–200<\/td><td>150<\/td><td>8<\/td><td>1 200<\/td><td>273 800,00<\/td><td>8<\/td><\/tr><tr><td>200–300<\/td><td>250<\/td><td>25<\/td><td>6 250<\/td><td>180 625,00<\/td><td>33<\/td><\/tr><tr><td>300–400<\/td><td>350<\/td><td>52<\/td><td>18 200<\/td><td>11 700,00<\/td><td>85<\/td><\/tr><tr><td>400–500<\/td><td>450<\/td><td>7<\/td><td>3 150<\/td><td>92 575,00<\/td><td>92<\/td><\/tr><tr><td>500–600<\/td><td>550<\/td><td>5<\/td><td>2 750<\/td><td>231 125,00<\/td><td>97<\/td><\/tr><tr><td>600–700<\/td><td>650<\/td><td>3<\/td><td>1 950<\/td><td>297 675,00<\/td><td>100<\/td><\/tr><tr><th>Jami<\/th><th><\/th><th>100<\/th><th>33 500<\/th><th>1 087 500,00<\/th><th><\/th><\/tr><\/table><p>O‘rtacha: x̄ = Σx·f / Σf = 33 500 / 100 = 335,00 mlrd so‘m.<\/p><p><b>Umumiy dispersiya:<\/b> σ² = Σ(x − x̄)²f / Σf = 1 087 500,00 / 100 = <b>10 875,00<\/b>. Tekshiruv: σ² = Σx²f/Σf − x̄² =123 100,00 − 335,00² = 10 875,00.<\/p><p>σ = √10 875,00 = 104,28 mlrd so‘m; V = 104,28 / 335,00 · 100 = 31,1%.<\/p><p><b>Xulosa:<\/b> korxonalar aktivlarining o‘rtacha miqdori 335,00 mlrd so‘m, umumiy dispersiya 10 875,00, o‘rtacha kvadratik tafovut 104,28 mlrd so‘m. V = 31,1% &lt; 33% – to‘plam nisbatan bir jinsli; korxonalarning yarmidan ko‘pi (52%) 300–400 mlrd so‘m oralig‘ida.<\/p>", "ans": "Umumiy dispersiya σ² = 10 875,00 (x̄ = 335,00 mlrd so‘m, σ = 104,28, V = 31,1%): to‘plam nisbatan bir jinsli.", "t": "umumiy", "id": "stp-46", "src": "savdo"}, {"n": 47, "title": "Xodimlar harakati koeffitsientlari", "cond": "<p>“Zarafshon Savdo” supermarketining 2025-yildagi mehnat resurslari bo‘yicha quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Ko‘rsatkichlar<\/th><th>Miqdori<\/th><\/tr><tr><td>Yil boshidagi xodimlar soni, kishi<\/td><td>120<\/td><\/tr><tr><td>Yil oxiridagi xodimlar soni, kishi<\/td><td>140<\/td><\/tr><tr><td>Yil davomida ishga qabul qilingan xodimlar, kishi<\/td><td>45<\/td><\/tr><tr><td>Yil davomida ishdan ketgan xodimlar, kishi<\/td><td>25<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Korxonadagi o‘rtacha xodimlar sonini.<\/li><li>Xodimlarni ishga qabul qilish koeffitsientini.<\/li><li>Xodimlarning ishdan ketish koeffitsientini.<\/li><li>Xodimlar umumiy aylanish koeffitsientini.<\/li><li>Xodimlar sonining mutlaq o‘zgarishini.<\/li><li>Olingan natijalar asosida korxonadagi xodimlar harakati haqida iqtisodiy xulosa chiqaring.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>1. O‘rtacha xodimlar soni:<\/b> T̄ = (T<sub>bosh<\/sub> + T<sub>oxir<\/sub>) / 2 = (120 + 140) / 2 = <b>130 kishi<\/b>.<\/p><p><b>2. Qabul qilish koeffitsienti:<\/b> K<sub>q<\/sub> = Q / T̄ · 100 = 45 / 130 · 100 = <b>34,6%<\/b>.<\/p><p><b>3. Ishdan ketish koeffitsienti:<\/b> K<sub>k<\/sub> = K / T̄ · 100 = 25 / 130 · 100 = <b>19,2%<\/b>.<\/p><p><b>4. Umumiy aylanish koeffitsienti:<\/b> K<sub>a<\/sub> = (Q + K) / T̄ · 100 = (45 + 25) / 130 · 100 = <b>53,8%<\/b> (yoki K<sub>q<\/sub> + K<sub>k<\/sub> = 34,6 + 19,2).<\/p><p><b>5. Mutlaq o‘zgarish:<\/b> ΔT = T<sub>oxir<\/sub> − T<sub>bosh<\/sub> = 140 − 120 = <b>+20 kishi<\/b>. Tekshiruv: Q − K = 45 − 25 = 20. Nisbiy o‘zgarish: 140 / 120 · 100 = 116,7%.<\/p><p>Qo‘shimcha: o‘rnini to‘ldirish koeffitsienti = Q / K = 45 / 25 = 1,80 (har bir ketgan xodim o‘rniga 1,8 kishi qabul qilingan).<\/p><p><b>6. Xulosa:<\/b> qabul (34,6%) ketishdan (19,2%) yuqori, shu sababli xodimlar soni 20 kishiga ko‘paygan. Ammo umumiy aylanish 53,8% — kadrlar harakati ancha jadal; ketish koeffitsienti ~19% bo‘lgani kadrlar barqarorligiga e’tibor berish kerakligini ko‘rsatadi.<\/p>", "ans": "O‘rtacha xodimlar soni 130 kishi; qabul koeffitsienti 34,6%, ketish 19,2%, umumiy aylanish 53,8%. Xodimlar soni 20 kishiga (16,7%) o‘sdi — kengayish bor, lekin kadrlar qo‘nimsizligi sezilarli.", "t": "mehnat", "id": "stp-47", "src": "savdo"}, {"n": 48, "title": "Mehnat unumdorligi dinamikasi", "cond": "<p>“Baraka Market” supermarketida ikki yil davomida quyidagi ko‘rsatkichlar qayd etilgan:<\/p><table><tr><th>Ko‘rsatkichlar<\/th><th>2024-yil<\/th><th>2025-yil<\/th><\/tr><tr><td>Tovar aylanmasi, mln so‘m<\/td><td>42 000<\/td><td>54 000<\/td><\/tr><tr><td>Yil boshidagi xodimlar soni, kishi<\/td><td>80<\/td><td>90<\/td><\/tr><tr><td>Yil oxiridagi xodimlar soni, kishi<\/td><td>90<\/td><td>110<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har ikki yilda o‘rtacha xodimlar sonini.<\/li><li>2024 va 2025-yillarda bir xodimga to‘g‘ri keladigan yillik tovar aylanmasini.<\/li><li>O‘rtacha xodimlar sonining mutlaq va nisbiy o‘zgarishini.<\/li><li>Tovar aylanmasining o‘sish sur’atini.<\/li><li>Mehnat unumdorligining o‘sish sur’ati va qo‘shimcha o‘sish sur’atini.<\/li><li>Tovar aylanmasi o‘sishi xodimlar sonining ko‘payishi bilan qanday bog‘liqligini tahlil qiling.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>1. O‘rtacha xodimlar soni:<\/b> T̄ = (T<sub>bosh<\/sub> + T<sub>oxir<\/sub>)/2. 2024: (80 + 90)/2 = <b>85 kishi<\/b>; 2025: (90 + 110)/2 = <b>100 kishi<\/b>.<\/p><p><b>2. Mehnat unumdorligi<\/b> W = TA / T̄. 2024: 42 000 / 85 = <b>494,12 mln so‘m<\/b>; 2025: 54 000 / 100 = <b>540,00 mln so‘m<\/b>.<\/p><p><b>3. Xodimlar soni o‘zgarishi:<\/b> ΔT̄ = 100 − 85 = <b>+15 kishi<\/b>; nisbiy: 100 / 85 · 100 = <b>117,6%<\/b> (+17,6%).<\/p><p><b>4. Tovar aylanmasi o‘sish sur’ati:<\/b> 54 000 / 42 000 · 100 = <b>128,6%<\/b> (mutlaq o‘sish +12 000 mln so‘m).<\/p><p><b>5. Mehnat unumdorligi:<\/b> o‘sish sur’ati = 540,00 / 494,12 · 100 = <b>109,3%<\/b>; qo‘shimcha o‘sish sur’ati = 109,3 − 100 = <b>9,3%<\/b>. Tekshiruv: I<sub>TA<\/sub> = I<sub>T<\/sub> · I<sub>W<\/sub> = 1,1765 · 1,0929 = 1,2857.<\/p><p><b>6. Omillar bo‘yicha tahlil:<\/b> ΔTA = 12 000 mln so‘m, shundan:<br>— xodimlar soni hisobiga: (T̄<sub>1<\/sub> − T̄<sub>0<\/sub>) · W<sub>0<\/sub> = 15 · 494,12 = <b>7 411,76 mln so‘m<\/b> (61,8%);<br>— unumdorlik hisobiga: (W<sub>1<\/sub> − W<sub>0<\/sub>) · T̄<sub>1<\/sub> = 45,88 · 100 = <b>4 588,24 mln so‘m<\/b> (38,2%).<\/p><p><b>Xulosa:<\/b> tovar aylanmasi 28,6% ga o‘sdi; o‘sishning qariyb 62% i xodimlar sonining ko‘payishi (ekstensiv omil), 38% i mehnat unumdorligining 9,3% ga oshishi (intensiv omil) hisobiga. Tovar aylanmasi xodimlar sonidan tezroq o‘sgani ijobiy.<\/p>", "ans": "O‘rtacha xodimlar 85 → 100 kishi (+17,6%), unumdorlik 494,12 → 540,00 mln so‘m (109,3%), tovar aylanmasi 128,6%. O‘sishning ~62% i ekstensiv, ~38% i intensiv omil hisobiga.", "t": "mehnat", "id": "stp-48", "src": "savdo"}, {"n": 49, "title": "Mehnatga haq to‘lash fondi va o‘rtacha ish haqi", "cond": "<p>“Savdo Plus” korxonasining 2024–2025-yillardagi mehnatga haq to‘lash ko‘rsatkichlari quyidagicha:<\/p><table><tr><th>Ko‘rsatkichlar<\/th><th>2024-yil<\/th><th>2025-yil<\/th><\/tr><tr><td>O‘rtacha xodimlar soni, kishi<\/td><td>100<\/td><td>120<\/td><\/tr><tr><td>Mehnatga haq to‘lash fondi, mln so‘m<\/td><td>6 000<\/td><td>8 280<\/td><\/tr><tr><td>Tovar aylanmasi, mln so‘m<\/td><td>50 000<\/td><td>66 000<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har ikki yilda bir xodimga to‘g‘ri keladigan yillik o‘rtacha ish haqini.<\/li><li>O‘rtacha ish haqining mutlaq o‘zgarishini.<\/li><li>O‘rtacha ish haqining o‘sish sur’atini.<\/li><li>Mehnatga haq to‘lash fondining o‘sish sur’atini.<\/li><li>Tovar aylanmasining o‘sish sur’atini.<\/li><li>O‘rtacha ish haqi va mehnat unumdorligi o‘sish sur’atlarini taqqoslang.<\/li><li>Ish haqi fondining o‘zgarishiga doir iqtisodiy xulosa chiqaring.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>1. O‘rtacha yillik ish haqi<\/b> X̄ = MHTF / T̄. 2024: 6 000 / 100 = <b>60,00 mln so‘m<\/b>; 2025: 8 280 / 120 = <b>69,00 mln so‘m<\/b>.<\/p><p><b>2. Mutlaq o‘zgarish:<\/b> ΔX̄ = 69,00 − 60,00 = <b>+9,00 mln so‘m<\/b>.<\/p><p><b>3. O‘rtacha ish haqi o‘sish sur’ati:<\/b> 69,00 / 60,00 · 100 = <b>115,0%<\/b>.<\/p><p><b>4. MHTF o‘sish sur’ati:<\/b> 8 280 / 6 000 · 100 = <b>138,0%<\/b>. Tekshiruv: I<sub>F<\/sub> = I<sub>T<\/sub> · I<sub>X̄<\/sub> = 1,20 · 1,15 = 1,380.<\/p><p><b>5. Tovar aylanmasi o‘sish sur’ati:<\/b> 66 000 / 50 000 · 100 = <b>132,0%<\/b>.<\/p><p><b>6. Taqqoslash:<\/b> mehnat unumdorligi W = TA / T̄: 2024 — 50 000/100 = 500,00; 2025 — 66 000/120 = 550,00 mln so‘m; I<sub>W<\/sub> = <b>110,0%<\/b>. Ilgarilash koeffitsienti K = I<sub>W<\/sub> / I<sub>X̄<\/sub> = 1,100 / 1,150 = <b>0,957<\/b> &lt; 1 — ish haqi unumdorlikdan tezroq o‘smoqda.<\/p><p><b>7. MHTF o‘zgarishi omillari:<\/b> ΔF = 8 280 − 6 000 = 2 280 mln so‘m; xodimlar soni hisobiga (120 − 100) · 60,00 = <b>1 200<\/b>; o‘rtacha ish haqi hisobiga (69,00 − 60,00) · 120 = <b>1 080<\/b> mln so‘m. Ish haqi fondining tovar aylanmasidagi darajasi: 12,0% → 12,55%.<\/p><p><b>Xulosa:<\/b> MHTF 38,0% ga o‘sdi, bu tovar aylanmasi o‘sishidan (32,0%) yuqori. O‘rtacha ish haqi 15,0% ga, unumdorlik esa faqat 10,0% ga oshgan; ish haqi xarajatlari darajasi oshgan — samaradorlik nuqtayi nazaridan noqulay holat.<\/p>", "ans": "O‘rtacha ish haqi 60 → 69 mln so‘m (115,0%), MHTF 138,0%, tovar aylanmasi 132,0%, unumdorlik 110,0%. Ish haqi unumdorlikdan tezroq o‘smoqda (K = 0,957), ish haqi darajasi 12,0% dan 12,55% ga oshdi.", "t": "mehnat", "id": "stp-49", "src": "savdo"}, {"n": 50, "title": "Mehnat unumdorligi va savdo maydoni samaradorligi", "cond": "<p>Shahardagi ikkita supermarket faoliyati bo‘yicha quyidagi ma’lumotlar mavjud:<\/p><table><tr><th>Ko‘rsatkichlar<\/th><th>A supermarket<\/th><th>B supermarket<\/th><\/tr><tr><td>Yillik tovar aylanmasi, mln so‘m<\/td><td>48 000<\/td><td>60 000<\/td><\/tr><tr><td>O‘rtacha xodimlar soni, kishi<\/td><td>80<\/td><td>120<\/td><\/tr><tr><td>Savdo maydoni, m²<\/td><td>2 400<\/td><td>3 000<\/td><\/tr><tr><td>Bir xodimning o‘rtacha yillik ish haqi, mln so‘m<\/td><td>60<\/td><td>66<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har bir supermarketda mehnat unumdorligini.<\/li><li>Bir xodimga to‘g‘ri keladigan o‘rtacha ish haqini taqqoslash asosida tegishli izoh bering.<\/li><li>1 m² savdo maydoniga to‘g‘ri keladigan yillik tovar aylanmasini.<\/li><li>Qaysi supermarketda mehnat unumdorligi yuqoriligini.<\/li><li>Qaysi supermarket savdo maydonidan samaraliroq foydalanayotganini.<\/li><li>Natijalarni umumlashtirib, har ikki supermarketning mehnat va savdo maydoni samaradorligi haqida xulosa chiqaring.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>1. Mehnat unumdorligi<\/b> W = TA / T̄: A — 48 000 / 80 = <b>600,00 mln so‘m<\/b>; B — 60 000 / 120 = <b>500,00 mln so‘m<\/b>.<\/p><p><b>2. Ish haqi:<\/b> B da ish haqi 6 mln so‘m (10,0%) yuqori, lekin unumdorlik 16,7% past. Ish haqining unumdorlikka nisbati: A — 60 / 600 · 100 = 10,0%; B — 66 / 500 · 100 = 13,2%. Ish haqi fondi: A — 60 · 80 = 4 800; B — 66 · 120 = 7 920 mln so‘m.<\/p><p><b>3. 1 m² ga tovar aylanmasi<\/b> = TA / S: A — 48 000 / 2 400 = <b>20,00 mln so‘m/m²<\/b>; B — 60 000 / 3 000 = <b>20,00 mln so‘m/m²<\/b>.<\/p><p><b>4.<\/b> Mehnat unumdorligi <b>A<\/b> da yuqori (600 &gt; 500; 20,0% ga).<\/p><p><b>5.<\/b> Savdo maydonidan foydalanish samaradorligi bir xil — ikkalasida ham 20 mln so‘m/m². (Bir xodimga maydon: A — 30 m², B — 25 m².)<\/p><p><b>6. Xulosa:<\/b> A supermarket mehnat resurslaridan samaraliroq foydalanadi: unumdorlik yuqori, ish haqi xarajatlari darajasi past (10,0% vs 13,2%). B da xodimlar soni ortiqcha va ish haqi unumdorlikka mos emas. Maydon samaradorligi teng.<\/p>", "ans": "Unumdorlik: A — 600, B — 500 mln so‘m/kishi (A yaxshiroq). 1 m² ga tovar aylanmasi ikkalasida 20 mln so‘m (teng). B da ish haqi yuqori, unumdorlik past — ish haqi darajasi 13,2% vs A 10,0%.", "t": "mehnat", "id": "stp-50", "src": "savdo"}, {"n": 51, "title": "Narx indeksini qiymat va hajm indeksidan topish", "cond": "<p>Ulgurji savdo aylanmasi hisobot davrida bazis davrga nisbatan joriy narxlarda 30,2% ga, taqqoslanadigan narxlarda esa 15,5% ga oshdi. Mahsulotlarning o‘rtacha narxlari qanday o‘zgargan?<\/p>", "cond_raw": "", "sol": "<p><b>Bog‘lanish:<\/b> I<sub>pq<\/sub> = I<sub>p<\/sub> · I<sub>q<\/sub> ⇒ I<sub>p<\/sub> = I<sub>pq<\/sub> / I<sub>q<\/sub>.<\/p><p>Joriy narxlarda o‘sish = qiymat indeksi: I<sub>pq<\/sub> = 1 + 0,302 = 1,302. Taqqoslanadigan narxlarda o‘sish = fizik hajm indeksi: I<sub>q<\/sub> = 1 + 0,155 = 1,155.<\/p><p>I<sub>p<\/sub> = 1,302 / 1,155 = <b>1,1273<\/b>, ya’ni <b>112,7%<\/b>.<\/p><p><b>Xulosa:<\/b> o‘rtacha narxlar 12,7% ga oshgan. Diqqat: 30,2 − 15,5 = 14,7% deb ayirish noto‘g‘ri — indekslar ko‘paytiriladi/bo‘linadi.<\/p>", "ans": "I<sub>p<\/sub> = 1,302 / 1,155 = 1,1273: narxlar o‘rtacha 12,7% ga oshgan.", "t": "narx", "id": "stp-51", "src": "savdo"}, {"n": 52, "title": "Fizik hajm indeksini qiymat va narx indeksidan topish", "cond": "<p>Tuman tashkilotlarining ulgurji savdo aylanmasi hisobot davrida bazis ko‘rsatkichga nisbatan joriy narxlarda 120% ga oshdi. Tuman tashkilotlari tomonidan ulgurji sotilgan tovarlarning umumiy narx indeksi 110% ni tashkil etdi. Ulgurji savdo aylanmasi taqqoslanadigan narxlarda qanday o‘zgargan?<\/p>", "cond_raw": "", "sol": "<p><b>Bog‘lanish:<\/b> I<sub>q<\/sub> = I<sub>pq<\/sub> / I<sub>p<\/sub>.<\/p><p>“120% ga oshdi” ⇒ I<sub>pq<\/sub> = 1 + 1,20 = 2,20; I<sub>p<\/sub> = 1,10.<\/p><p>I<sub>q<\/sub> = 2,20 / 1,10 = <b>2,00<\/b> = <b>200,0%<\/b> — taqqoslanadigan narxlarda aylanma 100,0% ga oshgan (2 barobar).<\/p><p><i>Izoh: agar shart “120% ni tashkil etdi” (I<sub>pq<\/sub> = 1,20) ma’nosida bo‘lsa: I<sub>q<\/sub> = 1,20 / 1,10 = 1,0909 = 109,1%, ya’ni +9,1%.<\/i><\/p><p><b>Xulosa:<\/b> qiymat o‘sishining asosiy qismi sotilgan tovarlar fizik hajmining oshishi hisobiga, narx omili esa 10% qo‘shgan.<\/p>", "ans": "I<sub>q<\/sub> = 2,20 / 1,10 = 2,0: taqqoslanadigan narxlarda ulgurji aylanma 100% ga (2 marta) oshgan. (Agar 120% daraja deb olinsa: +9,1%.)", "t": "narx", "id": "stp-52", "src": "savdo"}, {"n": 53, "title": "Yetkazib berish bir tekisligi (variatsiya koeffitsienti)", "cond": "<p>Hisobot choragida birinchi yetkazib beruvchining ta’minot o‘zgaruvchanlik koeffitsienti 5,6% ni tashkil etdi. Ikkinchi yetkazib beruvchining ta’minot bir xilligi koeffitsienti 95,4% ni tashkil etdi. Haqiqiy ta’minotning uchinchi yetkazib beruvchining o‘rtacha ta’minotidan standart og‘ishi 12 mln so‘mni, o‘rtacha ta’minot esa 150 mln so‘mni tashkil etdi. Qaysi yetkazib beruvchi hisobot choragida tovarlarni eng bir xil yetkazib berdi?<\/p>", "cond_raw": "", "sol": "<p><b>Formulalar:<\/b> o‘zgaruvchanlik (variatsiya) koeffitsienti V = σ / x̄ · 100; bir xillik (bir tekislik) koeffitsienti K<sub>bt<\/sub> = 100 − V.<\/p><p>1-yetkazib beruvchi: V<sub>1<\/sub> = <b>5,6%<\/b> ⇒ K<sub>bt<\/sub> = 94,4%.<\/p><p>2-yetkazib beruvchi: K<sub>bt<\/sub> = 95,4% ⇒ V<sub>2<\/sub> = 100 − 95,4 = <b>4,6%<\/b>.<\/p><p>3-yetkazib beruvchi: V<sub>3<\/sub> = 12 / 150 · 100 = <b>8,0%<\/b> ⇒ K<sub>bt<\/sub> = 92,0%.<\/p><p><table><tr><th>Yetkazib beruvchi<\/th><th>V, %<\/th><th>Bir xillik, %<\/th><\/tr><tr><td>1<\/td><td>5,6<\/td><td>94,4<\/td><\/tr><tr><td>2<\/td><td>4,6<\/td><td>95,4<\/td><\/tr><tr><td>3<\/td><td>8,0<\/td><td>92,0<\/td><\/tr><\/table><\/p><p><b>Xulosa:<\/b> eng kichik variatsiya (eng yuqori bir xillik) 2-yetkazib beruvchida — u tovarlarni eng bir tekis yetkazib bergan; eng notekis — 3-yetkazib beruvchi.<\/p>", "ans": "V: 1-chi — 5,6%, 2-chi — 4,6%, 3-chi — 8,0%. Eng bir tekis yetkazib bergan — 2-yetkazib beruvchi (bir xillik 95,4%).", "t": "aylanma", "id": "stp-53", "src": "savdo"}, {"n": 54, "title": "Variatsiya koeffitsienti nolga teng holat", "cond": "<p>Fevral oyida haftalik mahsulot yetkazib berishning o‘zgarish koeffitsienti nolga teng edi. Fevral oyida jami 92 tonna mahsulot yetkazib berilganligini hisobga olsak, oyning har haftasida aslida qancha mahsulot yetkazib berildi?<\/p>", "cond_raw": "", "sol": "<p>V = σ / x̄ · 100 = 0 ⇒ σ = 0 ⇒ barcha haftalik qiymatlar o‘rtachaga teng (tebranish yo‘q).<\/p><p>Fevral (28 kun) = 4 hafta. x̄ = Σx / n = 92 / 4 = <b>23 tonna<\/b>.<\/p><p><i>Izoh: fevral 4 to‘liq hafta deb olindi.<\/i><\/p><p><b>Xulosa:<\/b> har haftada aynan 23 tonnadan, mutlaqo bir tekis yetkazib berilgan (bir xillik koeffitsienti 100%).<\/p>", "ans": "V = 0 bo‘lsa σ = 0, ya’ni har hafta bir xil: 92 / 4 = 23 tonna.", "t": "aylanma", "id": "stp-54", "src": "savdo"}, {"n": 55, "title": "Dispersiyalarni qo‘shish qoidasi", "cond": "<p>Korxonalarning balans foydasi to‘g‘risida ikkita chorak bo‘yicha quyidagi ma’lumotlar mavjud:<\/p><table><tr><th>Chorak<\/th><th>Korxonalar soni<\/th><th>Balans foyda, mlrd so‘m<\/th><\/tr><tr><td>I<\/td><td>3<\/td><td>18,4; 38,8; 72,6<\/td><\/tr><tr><td>II<\/td><td>4<\/td><td>14,1; 16,3; 48,8; 27,9<\/td><\/tr><\/table><p>Aniqlang: a) korxonalar balans foydasining guruhlar dispersiyalari o‘rtachasini, guruhlararo va umumiy dispersiyalarini; b) determinatsiya koeffitsientini va empirik korrelyatsion nisbatni. Xulosa yozing.<\/p>", "cond_raw": "", "sol": "<p><b>Guruh o‘rtachalari va guruh ichidagi dispersiyalar<\/b> (σ²<sub>i<\/sub> = Σ(x − x̄<sub>i<\/sub>)² / n<sub>i<\/sub>):<\/p><table><tr><th>Chorak (n)<\/th><th>x<\/th><th>Σx<\/th><th>x̄<sub>i<\/sub><\/th><th>Σ(x − x̄<sub>i<\/sub>)²<\/th><th>σ²<sub>i<\/sub><\/th><\/tr><tr><td>I (3)<\/td><td>18,4; 38,8; 72,6<\/td><td>129,8<\/td><td>43,27<\/td><td>1 498,75<\/td><td>499,58<\/td><\/tr><tr><td>II (4)<\/td><td>14,1; 16,3; 48,8; 27,9<\/td><td>107,1<\/td><td>26,77<\/td><td>756,75<\/td><td>189,19<\/td><\/tr><\/table><p>Umumiy o‘rtacha: x̄ = Σx / n = 236,9 / 7 = <b>33,84<\/b> mlrd so‘m.<\/p><p><b>a)<\/b> Guruh ichidagi dispersiyalar o‘rtachasi: σ̄²<sub>i<\/sub> = Σσ²<sub>i<\/sub>n<sub>i<\/sub> / Σn<sub>i<\/sub> = (499,58 · 3 + 189,19 · 4) / 7 = <b>322,21<\/b>.<\/p><p>Guruhlararo dispersiya: δ² = Σ(x̄<sub>i<\/sub> − x̄)²n<sub>i<\/sub> / Σn<sub>i<\/sub> = ((43,27 − 33,84)² · 3 + (26,77 − 33,84)² · 4) / 7 = <b>66,61<\/b>.<\/p><p>Umumiy dispersiya: σ² = Σ(x − x̄)² / n = 2 721,74 / 7 = <b>388,82<\/b>. Tekshiruv (qo‘shish qoidasi): σ̄²<sub>i<\/sub> + δ² = 322,21 + 66,61 = 388,82 ✓.<\/p><p><b>b)<\/b> Determinatsiya koeffitsienti: η² = δ² / σ² = 66,61 / 388,82 = <b>0,171<\/b> (17,1%). Empirik korrelyatsion nisbat: η = √0,171 = <b>0,414<\/b>.<\/p><p><b>Xulosa:<\/b> balans foyda tebranishining atigi 17,1% i chorak (guruhlash belgisi) farqi bilan, qolgan 82,9% i korxonalar orasidagi boshqa omillar bilan izohlanadi; η = 0,41 — bog‘lanish kuchsiz.<\/p>", "ans": "σ̄²<sub>i<\/sub> = 322,21, δ² = 66,61, σ² = 388,82; η² = 0,171, η = 0,414. Chorak omili foyda variatsiyasining faqat 17,1% ini tushuntiradi — bog‘lanish kuchsiz.", "t": "umumiy", "id": "stp-55", "src": "savdo"}, {"n": 56, "title": "Muqobil belgi (salmoq) dispersiyalarini qo‘shish", "cond": "<p>Korxona tannarxi bo‘yicha eksport qilish uchun mo‘ljallangan mahsulotlar qiymatining taqsimlanishi quyidagi ma’lumotlar bilan tavsiflanadi:<\/p><table><tr><th>Sex<\/th><th>Jami ishlab chiqarilgan mahsulot qiymati, mlrd so‘m<\/th><th>Shu jumladan eksport qilinadigan mahsulot qiymati, mlrd so‘m<\/th><\/tr><tr><td>1<\/td><td>150<\/td><td>120<\/td><\/tr><tr><td>2<\/td><td>200<\/td><td>180<\/td><\/tr><tr><td>3<\/td><td>400<\/td><td>380<\/td><\/tr><tr><th>Jami<\/th><th>750<\/th><th>680<\/th><\/tr><\/table><p>Aniqlang: a) sexlar ichidagi salmoq dispersiyasini; b) sexlar ichidagi dispersiyalarning o‘rtachasini; c) guruhlararo dispersiyani; d) umumiy dispersiyani. Bajarilgan hisoblarni salmoq dispersiyasini qo‘shish qoidasi yordamida to‘g‘riligini tekshiring. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p>Muqobil belgi uchun: salmoq p = eksport / jami, dispersiya σ²<sub>p<\/sub> = p(1 − p).<\/p><table><tr><th>Sex<\/th><th>n<sub>i<\/sub><\/th><th>eksport<\/th><th>p<sub>i<\/sub><\/th><th>q<sub>i<\/sub> = 1 − p<sub>i<\/sub><\/th><th>σ²<sub>i<\/sub> = p<sub>i<\/sub>q<sub>i<\/sub><\/th><th>σ²<sub>i<\/sub>n<sub>i<\/sub><\/th><th>(p<sub>i<\/sub> − p̄)²n<sub>i<\/sub><\/th><\/tr><tr><td>1<\/td><td>150<\/td><td>120<\/td><td>0,8000<\/td><td>0,2000<\/td><td>0,1600<\/td><td>24,00<\/td><td>1,7067<\/td><\/tr><tr><td>2<\/td><td>200<\/td><td>180<\/td><td>0,9000<\/td><td>0,1000<\/td><td>0,0900<\/td><td>18,00<\/td><td>0,0089<\/td><\/tr><tr><td>3<\/td><td>400<\/td><td>380<\/td><td>0,9500<\/td><td>0,0500<\/td><td>0,0475<\/td><td>19,00<\/td><td>0,7511<\/td><\/tr><tr><th>Jami<\/th><th>750<\/th><th>680<\/th><th>0,9067<\/th><th><\/th><th><\/th><th>61,00<\/th><th>2,4667<\/th><\/tr><\/table><p><b>a)<\/b> Sexlar ichidagi salmoq dispersiyalari: σ²<sub>1<\/sub> = 0,8 · 0,2 = 0,1600; σ²<sub>2<\/sub> = 0,9 · 0,1 = 0,0900; σ²<sub>3<\/sub> = 0,95 · 0,05 = 0,0475.<\/p><p><b>b)<\/b> O‘rtacha guruh ichidagi dispersiya: σ̄²<sub>i<\/sub> = Σσ²<sub>i<\/sub>n<sub>i<\/sub> / Σn<sub>i<\/sub> = 61,00 / 750 = <b>0,0813<\/b>.<\/p><p><b>c)<\/b> Umumiy salmoq p̄ = 680 / 750 = 0,9067. Guruhlararo dispersiya: δ² = Σ(p<sub>i<\/sub> − p̄)²n<sub>i<\/sub> / Σn<sub>i<\/sub> = 2,4667 / 750 = <b>0,0033<\/b>.<\/p><p><b>d)<\/b> Umumiy dispersiya: σ² = p̄(1 − p̄) = 0,9067 · 0,0933 = <b>0,0846<\/b>.<\/p><p><b>Tekshiruv:<\/b> σ̄²<sub>i<\/sub> + δ² = 0,0813 + 0,0033 = 0,0846 = σ² ✓. η² = δ² / σ² = 0,039 (3,9%).<\/p><p><b>Xulosa:<\/b> eksport ulushi 1-sexda 80%, 2-sexda 90%, 3-sexda 95%; umumiy ulush 90,7%. Eksport salmog‘i variatsiyasining 3,9% i sexlar orasidagi farq bilan, asosiy qismi esa sexlar ichidagi farqlar bilan bog‘liq.<\/p>", "ans": "σ²: 1-sex 0,1600, 2-sex 0,0900, 3-sex 0,0475; σ̄²<sub>i<\/sub> = 0,0813, δ² = 0,0033, σ² = 0,0846 = σ̄²<sub>i<\/sub> + δ² ✓. Umumiy eksport ulushi 90,7%.", "t": "umumiy", "id": "stp-56", "src": "savdo"}, {"n": 57, "title": "Fizik hajm indeksi (o‘rtacha arifmetik shakl)", "cond": "<p>Savdo shahobchasi tovar aylanmasi haqida quyidagi ma’lumotlar berilgan:<\/p><table><tr><th>Tovarlar<\/th><th>Bazis davrida sotilgan tovarlar qiymati, mln so‘m<\/th><th>Joriy davrda sotilgan tovarlar miqdorining o‘zgarishi, %<\/th><\/tr><tr><td>Ip gazlama<\/td><td>98,5<\/td><td>+5<\/td><\/tr><tr><td>Jun gazlama<\/td><td>45,0<\/td><td>+15<\/td><\/tr><tr><td>Ipak gazlama<\/td><td>22,5<\/td><td>−4<\/td><\/tr><\/table><p>Tovarlar fizik hajmining alohida va umumiy indekslarini aniqlang. Xulosalar yozing.<\/p>", "cond_raw": "", "sol": "<p><b>Individual indekslar:<\/b> i<sub>q<\/sub> = 1 + o‘zgarish% / 100.<\/p><table><tr><th>Tovar<\/th><th>q<sub>0<\/sub>p<sub>0<\/sub><\/th><th>i<sub>q<\/sub><\/th><th>i<sub>q<\/sub>, %<\/th><th>i<sub>q<\/sub>·q<sub>0<\/sub>p<sub>0<\/sub><\/th><\/tr><tr><td>Ip gazlama<\/td><td>98,5<\/td><td>1,05<\/td><td>105,0%<\/td><td>103,425<\/td><\/tr><tr><td>Jun gazlama<\/td><td>45,0<\/td><td>1,15<\/td><td>115,0%<\/td><td>51,750<\/td><\/tr><tr><td>Ipak gazlama<\/td><td>22,5<\/td><td>0,96<\/td><td>96,0%<\/td><td>21,600<\/td><\/tr><tr><th>Jami<\/th><th>166,0<\/th><th><\/th><th><\/th><th>176,775<\/th><\/tr><\/table><p><b>Umumiy fizik hajm indeksi<\/b> (o‘rtacha arifmetik shakl, Laspeyres): I<sub>q<\/sub> = Σi<sub>q<\/sub>q<sub>0<\/sub>p<sub>0<\/sub> / Σq<sub>0<\/sub>p<sub>0<\/sub> = 176,775 / 166,0 = <b>1,0649<\/b> = <b>106,5%<\/b>.<\/p><p>Fizik hajm o‘zgarishi hisobiga tovar aylanmasi o‘zgarishi: Δ = 176,775 − 166,0 = <b>+10,78 mln so‘m<\/b>.<\/p><p><b>Xulosa:<\/b> jun gazlama sotuvi 15% ga, ip gazlama 5% ga o‘sdi, ipak gazlama 4% ga kamaydi; umuman sotilgan tovarlar fizik hajmi 6,5% ga oshgan va bu aylanmani 10,78 mln so‘mga ko‘paytirgan.<\/p>", "ans": "Individual indekslar: 105%, 115%, 96%. Umumiy I<sub>q<\/sub> = 176,775 / 166,0 = 106,5% (+10,78 mln so‘m).", "t": "narx", "id": "stp-57", "src": "savdo"}, {"n": 58, "title": "Tanlanma o‘rtacha uchun chegaraviy xato", "cond": "<p>Sutning narxini o‘rganish maqsadida tumandagi savdo korxonalarida 2 foizli tanlanma tekshirish quyidagi natijalarga olib kelgan:<\/p><table><tr><th>1 litr sutning bahosi, ming so‘m<\/th><th>Savdo korxonalari soni: shaharlarda<\/th><th>qishloqlarda<\/th><\/tr><tr><td>6 gacha<\/td><td>9<\/td><td>29<\/td><\/tr><tr><td>6–7<\/td><td>16<\/td><td>34<\/td><\/tr><tr><td>7–8<\/td><td>37<\/td><td>8<\/td><\/tr><tr><td>8 va yuqori<\/td><td>18<\/td><td>—<\/td><\/tr><\/table><p>0,997 ehtimol bilan butun tuman bo‘yicha 1 litr sut o‘rtacha bahosining chegarasini aniqlang.<\/p>", "cond_raw": "", "sol": "<p>Tuman bo‘yicha shahar va qishloq korxonalari birlashtiriladi; ochiq intervallar qo‘shni interval kengligi (1) bilan yopiladi: 5–6 va 8–9.<\/p><table><tr><th>Baho<\/th><th>shahar<\/th><th>qishloq<\/th><th>f<\/th><th>x (o‘rta)<\/th><th>xf<\/th><th>(x − x̄)²f<\/th><\/tr><tr><td>6 gacha<\/td><td>9<\/td><td>29<\/td><td>38<\/td><td>5,5<\/td><td>209,0<\/td><td>62,7239<\/td><\/tr><tr><td>6–7<\/td><td>16<\/td><td>34<\/td><td>50<\/td><td>6,5<\/td><td>325,0<\/td><td>4,0546<\/td><\/tr><tr><td>7–8<\/td><td>37<\/td><td>8<\/td><td>45<\/td><td>7,5<\/td><td>337,5<\/td><td>23,0200<\/td><\/tr><tr><td>8 va yuqori<\/td><td>18<\/td><td>0<\/td><td>18<\/td><td>8,5<\/td><td>153,0<\/td><td>52,9564<\/td><\/tr><tr><th>Jami<\/th><th>80<\/th><th>71<\/th><th>151<\/th><th><\/th><th>1 024,5<\/th><th>142,7550<\/th><\/tr><\/table><p>Tanlanma o‘rtacha: x̄ = Σxf / Σf = 1 024,5 / 151 = <b>6,785 ming so‘m<\/b>.<\/p><p>Dispersiya: σ² = Σ(x − x̄)²f / Σf = 142,7550 / 151 = <b>0,9454<\/b>.<\/p><p>O‘rtacha xato (notakroriy tanlash, n/N = 0,02): μ = √(σ²/n · (1 − n/N)) = √(0,9454 / 151 · 0,98) = <b>0,0783<\/b> ming so‘m.<\/p><p>P = 0,997 ⇒ t = 3. Chegaraviy xato: Δ = tμ = 3 · 0,0783 = <b>0,235<\/b> ming so‘m.<\/p><p>Chegaralar: x̄ ± Δ = 6,785 ± 0,235 ⇒ <b>6,55 ≤ x̃ ≤ 7,02<\/b> ming so‘m.<\/p><p><i>Izoh: ochiq intervallar 5–6 va 8–9 deb olindi.<\/i><\/p><p><b>Xulosa:<\/b> 99,7% ishonch bilan tuman bo‘yicha 1 litr sutning o‘rtacha bahosi 6,55–7,02 ming so‘m oralig‘ida.<\/p>", "ans": "n = 151, x̄ = 6,785 ming so‘m, σ² = 0,9454, μ = 0,0783, Δ = 3μ = 0,235. O‘rtacha baho 6,55–7,02 ming so‘m oralig‘ida (P = 0,997).", "t": "umumiy", "id": "stp-58", "src": "savdo"}, {"n": 59, "title": "Dinamika qatori: bazisli ko‘rsatkichlarni to‘ldirish", "cond": "<p>Dinamika qatorlari ko‘rsatkichlarining o‘zaro bog‘liqligidan foydalanib jadvalda yetishmayotgan ko‘rsatkichlarni aniqlab uni to‘ldiring. Xulosalar yozing.<\/p><table><tr><th>Yillar<\/th><th>Sotilgan kartoshka hajmi, ming tonna<\/th><th>Bazisli mutlaq o‘sish, ming tonna<\/th><th>Bazisli o‘sish sur’ati, %<\/th><th>Bazisli qo‘shimcha o‘sish sur’ati, %<\/th><\/tr><tr><td>2020<\/td><td>590,7<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2021<\/td><td><\/td><td>−11,1<\/td><td><\/td><td><\/td><\/tr><tr><td>2022<\/td><td><\/td><td><\/td><td>105,4<\/td><td><\/td><\/tr><tr><td>2023<\/td><td><\/td><td><\/td><td><\/td><td>6,0<\/td><\/tr><tr><td>2024<\/td><td><\/td><td><\/td><td>113,5<\/td><td><\/td><\/tr><tr><td>2025<\/td><td><\/td><td>102,2<\/td><td><\/td><td><\/td><\/tr><\/table>", "cond_raw": "", "sol": "<p>Bazis — 2020-yil (y<sub>0<\/sub> = 590,7). <b>Formulalar:<\/b> Δ<sub>b<\/sub> = y<sub>i<\/sub> − y<sub>0<\/sub>; T<sub>b<\/sub> = y<sub>i<\/sub> / y<sub>0<\/sub> · 100; K<sub>b<\/sub> = T<sub>b<\/sub> − 100 ⇒ y<sub>i<\/sub> = y<sub>0<\/sub> + Δ<sub>b<\/sub> = y<sub>0<\/sub> · T<sub>b<\/sub> / 100.<\/p><p>2021: y = 590,7 − 11,1 = 579,6; T = 579,6 / 590,7 · 100 = 98,1%.<\/p><p>2022: y = 590,7 · 1,054 = 622,6; Δ = 31,9.<\/p><p>2023: T = 100 + 6,0 = 106,0% ⇒ y = 590,7 · 1,06 = 626,1; Δ = 35,4.<\/p><p>2024: y = 590,7 · 1,135 = 670,4; Δ = 79,7.<\/p><p>2025: y = 590,7 + 102,2 = 692,9; T = 117,3%.<\/p><table><tr><th>Yil<\/th><th>Hajm, ming t<\/th><th>Δ<sub>b<\/sub>, ming t<\/th><th>T<sub>b<\/sub>, %<\/th><th>K<sub>b<\/sub>, %<\/th><\/tr><tr><td>2020<\/td><td><b>590,7<\/b><\/td><td>—<\/td><td>100,0<\/td><td>—<\/td><\/tr><tr><td>2021<\/td><td>579,6<\/td><td><b>−11,1<\/b><\/td><td>98,1<\/td><td>−1,9<\/td><\/tr><tr><td>2022<\/td><td>622,6<\/td><td>31,9<\/td><td><b>105,4<\/b><\/td><td>5,4<\/td><\/tr><tr><td>2023<\/td><td>626,1<\/td><td>35,4<\/td><td>106,0<\/td><td><b>6,0<\/b><\/td><\/tr><tr><td>2024<\/td><td>670,4<\/td><td>79,7<\/td><td><b>113,5<\/b><\/td><td>13,5<\/td><\/tr><tr><td>2025<\/td><td>692,9<\/td><td><b>102,2<\/b><\/td><td>117,3<\/td><td>17,3<\/td><\/tr><\/table><p>O‘rtacha yillik o‘sish sur’ati: T̄ = ⁵√(692,9 / 590,7) · 100 = 103,2%.<\/p><p><i>Izoh: manbada mutlaq o‘sish ustuni “ming dona” deb yozilgan; hajm ming tonnada bo‘lgani uchun ming tonna deb olindi. Qalin — berilgan qiymatlar.<\/i><\/p><p><b>Xulosa:<\/b> 2021-yilda sotuv bazisdan 1,9% ga kamaygan, keyingi yillarda barqaror o‘sib, 2025-yilda 2020-yilga nisbatan 17,3% ga oshgan (o‘rtacha yiliga +3,2%).<\/p>", "ans": "Hajmlar (ming t): 2021 — 579,6, 2022 — 622,6, 2023 — 626,1, 2024 — 670,4, 2025 — 692,9. 2025-yilda bazisga nisbatan 117,3%; o‘rtacha yillik o‘sish 103,2%.", "t": "umumiy", "id": "stp-59", "src": "savdo"}, {"n": 60, "title": "Dinamika qatori: zanjirli ko‘rsatkichlarni to‘ldirish", "cond": "<p>Dinamika qator analitik ko‘rsatkichlarining o‘zaro bog‘liqligidan foydalangan holda, qator darajalarini aniqlang, jadvalning bo‘sh kataklarini to‘ldiring. Xulosalar yozing.<\/p><table><tr><th>Yil<\/th><th>Qator darajasi, ming dona<\/th><th>Zanjirli mutlaq o‘zgarish, ming dona<\/th><th>O‘zgarish sur’ati, %<\/th><th>Qo‘shimcha o‘zgarish sur’ati, %<\/th><th>1% qo‘shimcha o‘sishning mutlaq mohiyati<\/th><\/tr><tr><td>2020<\/td><td>202,5<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>2021<\/td><td>–<\/td><td>16,8<\/td><td>–<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>2022<\/td><td>–<\/td><td>–<\/td><td>112,0<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>2023<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>8,2<\/td><td>–<\/td><\/tr><tr><td>2024<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>2025<\/td><td>–<\/td><td>15,4<\/td><td>–<\/td><td>–<\/td><td>2,80<\/td><\/tr><\/table>", "cond_raw": "", "sol": "<p><b>Formulalar (zanjirli):<\/b> Δ = y<sub>i<\/sub> − y<sub>i−1<\/sub>; T = y<sub>i<\/sub> / y<sub>i−1<\/sub> · 100; K = T − 100; A<sub>1%<\/sub> = Δ / K = y<sub>i−1<\/sub> / 100.<\/p><p>2021: y = 202,5 + 16,8 = 219,30.<\/p><p>2022: y = 219,30 · 1,12 = 245,62.<\/p><p>2023: T = 108,2% ⇒ y = 245,62 · 1,082 = 265,76.<\/p><p>2025-yilning A<sub>1%<\/sub> = y<sub>2024<\/sub> / 100 = 2,80 ⇒ <b>y<sub>2024<\/sub> = 280,0<\/b>; 2025: y = 280,0 + 15,4 = 295,40.<\/p><table><tr><th>Yil<\/th><th>y, ming dona<\/th><th>Δ, ming dona<\/th><th>T, %<\/th><th>K, %<\/th><th>A<sub>1%<\/sub><\/th><\/tr><tr><td>2020<\/td><td><b>202,5<\/b><\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2021<\/td><td>219,30<\/td><td><b>16,80<\/b><\/td><td>108,3<\/td><td>8,3<\/td><td>2,025<\/td><\/tr><tr><td>2022<\/td><td>245,62<\/td><td>26,32<\/td><td><b>112,0<\/b><\/td><td>12,0<\/td><td>2,193<\/td><\/tr><tr><td>2023<\/td><td>265,76<\/td><td>20,14<\/td><td>108,2<\/td><td><b>8,2<\/b><\/td><td>2,456<\/td><\/tr><tr><td>2024<\/td><td>280,00<\/td><td>14,24<\/td><td>105,4<\/td><td>5,4<\/td><td>2,658<\/td><\/tr><tr><td>2025<\/td><td>295,40<\/td><td><b>15,40<\/b><\/td><td>105,5<\/td><td>5,5<\/td><td><b>2,800<\/b><\/td><\/tr><\/table><p>O‘rtacha yillik o‘sish sur’ati: ⁵√(295,4 / 202,5) · 100 = 107,8%; o‘rtacha mutlaq o‘sish = (295,4 − 202,5) / 5 = 18,58 ming dona.<\/p><p><i>Izoh: qalin — shartda berilgan qiymatlar; 2024-yil darajasi 2025-yilning A<sub>1%<\/sub> qiymatidan topildi.<\/i><\/p><p><b>Xulosa:<\/b> qator 2020–2025-yillarda uzluksiz o‘sgan; eng yuqori sur’at 2022-yilda (112%), keyin o‘sish sekinlashgan (2024-yil 105,4%, 2025-yil 105,5%), ammo 1% o‘sishning mutlaq qiymati ortib bormoqda.<\/p>", "ans": "Darajalar (ming dona): 219,3; 245,6; 265,8; 280,0; 295,4. Kalit qadam: A<sub>1%<\/sub>(2025) = 2,80 ⇒ y<sub>2024<\/sub> = 280. O‘rtacha yillik o‘sish 107,8%.", "t": "umumiy", "id": "stp-60", "src": "savdo"}, {"n": 61, "title": "Xizmatlar eksporti dinamikasi", "cond": "<p>Quyidagi jadvalda mamlakatning 2023–2025-yillar bo‘yicha xizmatlar eksporti hajmi keltirilgan:<\/p><table><tr><th>Yil<\/th><th>Xizmatlar eksporti (mln $)<\/th><\/tr><tr><td>2023<\/td><td>4456,7<\/td><\/tr><tr><td>2024<\/td><td>5640,4<\/td><\/tr><tr><td>2025<\/td><td>7571,7<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har bir yil uchun zanjirli o‘sish sur’atlarini (%) hisoblang.<\/li><li>2023-yilni bazis yil deb olib, bazis indekslarini aniqlang.<\/li><li>2023–2025-yillar uchun o‘rtacha yillik o‘sish sur’atini hisoblang.<\/li><li>Olingan natijalar asosida xizmatlar eksporti dinamikasiga baho bering.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>1. Zanjirli o‘sish sur’ati<\/b> T<sub>z<\/sub> = y<sub>i<\/sub> / y<sub>i−1<\/sub> · 100: 2024 — 5640,4 / 4456,7 · 100 = <b>126,6%<\/b>; 2025 — 7571,7 / 5640,4 · 100 = <b>134,2%<\/b>.<\/p><p><b>2. Bazis indekslari<\/b> (2023 = 100%): 2024 — 126,6%; 2025 — 7571,7 / 4456,7 · 100 = <b>169,9%<\/b>. Tekshiruv: 1,2656 · 1,3424 = 1,6989.<\/p><table><tr><th>Yil<\/th><th>Eksport, mln $<\/th><th>Mutlaq o‘sish (zanjir)<\/th><th>T<sub>z<\/sub>, %<\/th><th>T<sub>b<\/sub>, %<\/th><\/tr><tr><td>2023<\/td><td>4 456,7<\/td><td>—<\/td><td>—<\/td><td>100,0<\/td><\/tr><tr><td>2024<\/td><td>5 640,4<\/td><td>+1 183,7<\/td><td>126,6<\/td><td>126,6<\/td><\/tr><tr><td>2025<\/td><td>7 571,7<\/td><td>+1 931,3<\/td><td>134,2<\/td><td>169,9<\/td><\/tr><\/table><p><b>3. O‘rtacha yillik o‘sish sur’ati:<\/b> T̄ = √(y<sub>2025<\/sub> / y<sub>2023<\/sub>) · 100 = √(1,6989) · 100 = <b>130,3%<\/b> (o‘rtacha qo‘shimcha o‘sish 30,3%).<\/p><p><b>4. Baho:<\/b> xizmatlar eksporti ikki yilda 69,9% ga oshgan; o‘sish tezlashmoqda (2024: +26,6%, 2025: +34,2%) — bu xizmatlar eksportining jadal rivojlanayotganini ko‘rsatadi.<\/p>", "ans": "Zanjirli sur’at: 2024 — 126,6%, 2025 — 134,2%; bazis indeksi 2025 — 169,9%; o‘rtacha yillik o‘sish 130,3%. Eksport tezlashib o‘smoqda.", "t": "tashqi", "id": "stp-61", "src": "savdo"}, {"n": 62, "title": "Xizmatlar eksporti tarkibi va diversifikatsiyasi", "cond": "<p>2025-yilda mamlakat xizmatlar eksportining tarkibi quyidagicha:<\/p><table><tr><th>Xizmat turi<\/th><th>Qiymat (mln $)<\/th><\/tr><tr><td>Transport<\/td><td>2 794,3<\/td><\/tr><tr><td>Safarlar (turizm)<\/td><td>3 519,0<\/td><\/tr><tr><td>Telekommunikatsiya va IT<
