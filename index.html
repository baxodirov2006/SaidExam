ojxona deklaratsiyalari (eksport-import narxlari) va uy xo‘jaliklari tanlanma tekshiruvlari ma’lumotlaridan foydalaniladi. Zamonaviy manbalarga internet-do‘konlardagi <b>onlayn narxlar<\/b>ni avtomatik yig‘ish (veb-skreyping) va kassa apparatlarining skaner ma’lumotlari kiradi.", "t": "narx", "id": "sv-75", "src": "savdo"}, {"n": 76, "q": "Narxlar elastikligi nima?", "k": "talab o‘zgarishi, narx o‘zgarishi, koeffitsient", "a": "<b>Narxlar elastikligi<\/b> (talabning narx bo‘yicha elastikligi) narx 1% ga o‘zgarganda talab necha foizga o‘zgarishini ko‘rsatadi. Elastiklik <b>koeffitsient<\/b>i <b>talab o‘zgarishi<\/b> nisbiy sur’atining <b>narx o‘zgarishi<\/b> nisbiy sur’atiga nisbati: <b>E = (Δq / q) : (Δp / p)<\/b>. Odatda E manfiy (narx oshsa, talab kamayadi), shuning uchun modul bo‘yicha baholanadi: |E| &gt; 1 – elastik talab, |E| &lt; 1 – noelastik talab, |E| = 1 – birlik elastiklik. Masalan, narx 10% oshganda talab 15% kamaysa, E = −1,5 (elastik talab). Ko‘rsatkich narx siyosatini belgilash va narx o‘zgarishining tovar aylanmasiga ta’sirini prognoz qilishda qo‘llaniladi.", "t": "narx", "id": "sv-76", "src": "savdo"}, {"n": 77, "q": "Narx indekslarining iqtisodiy ahamiyatini tushuntiring.", "k": "inflyatsiya, real daromad, siyosat, indeksatsiya", "a": "Narx indekslari <b>inflyatsiya<\/b> darajasini o‘lchash va narx barqarorligini nazorat qilishning asosiy vositasidir. Ular yordamida nominal ko‘rsatkichlar (tovar aylanmasi, ish haqi) narx omilidan tozalanadi: <b>real daromad indeksi = nominal daromad indeksi / CPI<\/b>. Narx indekslari davlatning pul-kredit va soliq <b>siyosat<\/b>ini ishlab chiqish, markaziy bank tomonidan foiz stavkalarini belgilashda asos bo‘ladi. Pensiya, nafaqa va ish haqi <b>indeksatsiya<\/b>si hamda shartnomalardagi narxlarni qayta ko‘rib chiqish ham narx indekslari asosida amalga oshiriladi. Savdoda ular tovar aylanmasi o‘zgarishini narx va fizik hajm omillariga ajratish imkonini beradi.", "t": "narx", "id": "sv-77", "src": "savdo"}, {"n": 78, "q": "Mehnat statistikasining asosiy vazifalari nimalardan iborat?", "k": "bandlik, ish haqi, unumdorlik, harakat", "a": "Savdoda mehnat statistikasining asosiy vazifalari: xodimlar soni, tarkibi va <b>bandlik<\/b> darajasini o‘rganish; ishchi kuchi <b>harakat<\/b>i (qabul qilish, bo‘shatish, qo‘nimsizlik) ko‘rsatkichlarini hisoblash. Ish vaqti fondlari va ulardan foydalanishni tahlil qilish; mehnat <b>unumdorlik<\/b>i darajasi, dinamikasi va unga ta’sir etuvchi omillarni aniqlash. Ish haqi fondi, o‘rtacha <b>ish haqi<\/b> va uning dinamikasini o‘rganish, ish haqi o‘sishi bilan unumdorlik o‘sishi nisbatini baholash. Bu ma’lumotlar mehnat resurslaridan samarali foydalanish va kadrlar siyosati uchun asos bo‘ladi.", "t": "mehnat", "id": "sv-78", "src": "savdo"}, {"n": 79, "q": "O‘rtacha xodimlar soni qanday hisoblanadi?", "k": "ro‘yxat soni, o‘rtacha xronologik", "a": "Xodimlarning <b>ro‘yxat soni<\/b> – ma’lum sanada korxonada ro‘yxatda turgan barcha xodimlar soni. Oy uchun o‘rtacha ro‘yxat soni har kungi (dam olish va bayram kunlarini ham qo‘shib) ro‘yxat sonlari yig‘indisini oyning kalendar kunlariga bo‘lish orqali topiladi: <b>ō = Σ(har kungi son) / D kal<\/b>. Ma’lumotlar faqat teng oraliqdagi sanalar (masalan, har oy boshi) bo‘yicha berilgan bo‘lsa, <b>o‘rtacha xronologik<\/b> formula qo‘llaniladi: <b>ō = (x1/2 + x2 + … + x(n−1) + xn/2) / (n − 1)<\/b>. Chorak yoki yil uchun o‘rtacha son oylik o‘rtachalarning arifmetik o‘rtachasi sifatida aniqlanadi.", "t": "mehnat", "id": "sv-79", "src": "savdo"}, {"n": 80, "q": "Xodimlar harakati koeffitsientlarini sanab bering.", "k": "qabul, bo‘shatish, qo‘nimsizlik, almashinuv", "a": "Xodimlar harakati koeffitsientlari o‘rtacha ro‘yxat soniga (ō) nisbatan foizda hisoblanadi. <b>Qabul<\/b> bo‘yicha aylanma koeffitsienti = qabul qilinganlar / ō · 100; <b>bo‘shatish<\/b> (chiqib ketish) bo‘yicha aylanma koeffitsienti = ishdan chiqqanlar / ō · 100; umumiy aylanma koeffitsienti = (qabul qilinganlar + chiqqanlar) / ō · 100. <b>Qo‘nimsizlik<\/b> koeffitsienti = o‘z xohishi bilan va intizom buzgani uchun bo‘shaganlar / ō · 100. Kadrlar <b>almashinuv<\/b>i (o‘rnini to‘ldirish) koeffitsienti = qabul qilinganlar / ishdan chiqqanlar. Doimiylik koeffitsienti = yil davomida to‘liq ishlaganlar / ō · 100.", "t": "mehnat", "id": "sv-80", "src": "savdo"}, {"n": 81, "q": "Kadrlar qo‘nimsizligi nima?", "k": "ishdan bo‘shatish, o‘z xohishi, koeffitsient", "a": "<b>Kadrlar qo‘nimsizligi<\/b> – xodimlarning salbiy, korxona rejalashtirmagan sabablar bilan <b>ishdan bo‘shatish<\/b>i: <b>o‘z xohishi<\/b> bilan ketishi hamda ishga kelmaslik va mehnat intizomini buzgani uchun bo‘shatilishi. Unga harbiy xizmatga chaqirilish, pensiyaga chiqish, o‘qishga ketish, shartnoma muddati tugashi kabi zaruriy sabablar kirmaydi. Qo‘nimsizlik <b>koeffitsient<\/b>i: <b>Kq = (o‘z xohishi bilan + intizom buzgani uchun bo‘shaganlar) / ō · 100%<\/b>. Yuqori qo‘nimsizlik malakali kadrlarning yo‘qotilishiga, yangi xodimlarni o‘qitish xarajatlarining oshishiga va mehnat unumdorligining pasayishiga olib keladi.", "t": "mehnat", "id": "sv-81", "src": "savdo"}, {"n": 82, "q": "Mehnat unumdorligi qanday hisoblanadi?", "k": "mahsulot, tovar aylanmasi, xodim", "a": "Savdoda <b>mehnat unumdorligi<\/b> bir <b>xodim<\/b>ga to‘g‘ri keladigan <b>tovar aylanmasi<\/b> bilan o‘lchanadi: <b>W = T / ō<\/b>, bu yerda T – davr tovar aylanmasi, ō – xodimlarning o‘rtacha ro‘yxat soni. Umumiy ovqatlanishda o‘z ishlab chiqarish <b>mahsulot<\/b>i hajmi bo‘yicha ham hisoblanadi. Teskari ko‘rsatkich – mehnat sig‘imi: t = ō / T, ya’ni bir birlik tovar aylanmasiga to‘g‘ri keladigan xodimlar soni. Narxlar o‘zgarishi ta’sirini chiqarib tashlash uchun dinamikada tovar aylanmasi taqqoslanadigan (o‘zgarmas) narxlarda olinadi. Unumdorlik bir ishlangan kishi-kun yoki kishi-soatga ham hisoblanishi mumkin.", "t": "mehnat", "id": "sv-82", "src": "savdo"}, {"n": 83, "q": "Ish haqi fondi nima?", "k": "to‘lovlar, ish haqi, fond", "a": "<b>Ish haqi fondi<\/b> – korxonaning ma’lum davrda xodimlarga bajarilgan ish va ishlangan vaqt uchun (hamda qonunchilikka ko‘ra haq to‘lanadigan ishlanmagan vaqt uchun) hisoblagan barcha <b>to‘lovlar<\/b> yig‘indisi. Unga tarif stavkalari va maoshlar bo‘yicha <b>ish haqi<\/b>, mukofotlar, ustamalar, qo‘shimcha to‘lovlar va ta’til haqi kiradi. Tarkibiga ko‘ra soatlik, kunlik va oylik (to‘liq) <b>fond<\/b>lar ajratiladi. Ish haqi fondi o‘rtacha ish haqini hisoblash, uning dinamikasini o‘rganish va mehnatga haq to‘lash xarajatlarining tovar aylanmasiga nisbatan darajasini (F / T · 100) aniqlash uchun asos bo‘ladi.", "t": "mehnat", "id": "sv-83", "src": "savdo"}, {"n": 84, "q": "O‘rtacha ish haqi qanday aniqlanadi?", "k": "xodimlar soni, fond", "a": "O‘rtacha ish haqi ish haqi <b>fond<\/b>ini <b>xodimlar soni<\/b>ga (o‘rtacha ro‘yxat soniga) bo‘lish orqali aniqlanadi: <b>x̄ = F / ō<\/b>. Oylik o‘rtacha ish haqi oylik fond va oylik o‘rtacha xodimlar soni bo‘yicha, yillik o‘rtacha esa yillik fond va yillik o‘rtacha son bo‘yicha hisoblanadi; yillik o‘rtachani 12 ga bo‘lib, o‘rtacha oylik topiladi. Bundan tashqari, o‘rtacha soatlik (soatlik fond / ishlangan kishi-soatlar) va o‘rtacha kunlik (kunlik fond / ishlangan kishi-kunlar) ish haqi ham hisoblanadi. Real ish haqi nominal o‘rtacha ish haqini iste’mol narxlari indeksiga bo‘lish orqali topiladi.", "t": "mehnat", "id": "sv-84", "src": "savdo"}, {"n": 85, "q": "Ish vaqti fondlari turlarini sanab bering.", "k": "kalendar, tabel, maksimal, haqiqiy", "a": "Ish vaqti fondlari kishi-kun yoki kishi-soatlarda o‘lchanadi. <b>Kalendar<\/b> fond – davrdagi barcha ishlangan va ishlanmagan kishi-kunlar yig‘indisi (kalendar kunlar soni × o‘rtacha xodimlar soni). <b>Tabel<\/b> fondi – kalendar fonddan bayram va dam olish kunlarini ayirish orqali topiladi. <b>Maksimal<\/b> mumkin bo‘lgan fond – tabel fondidan navbatdagi ta’tillarni ayirish natijasi; u ish vaqtidan foydalanishni baholash uchun asos hisoblanadi. <b>Haqiqiy<\/b> fond – xodimlar amalda ishlagan kishi-kunlar. Foydalanish koeffitsienti = haqiqiy ishlangan vaqt / maksimal mumkin bo‘lgan fond.", "t": "mehnat", "id": "sv-85", "src": "savdo"}, {"n": 86, "q": "Mehnat unumdorligiga ta’sir etuvchi omillarni sanang.", "k": "texnika, tashkilot, malaka, motivatsiya", "a": "Savdoda mehnat unumdorligiga ta’sir etuvchi asosiy omillar: moddiy-<b>texnika<\/b> omillari – zamonaviy savdo uskunalari, kassa va skaner tizimlari, avtomatlashtirish, o‘z-o‘ziga xizmat ko‘rsatish usullari. <b>Tashkilot<\/b> omillari – mehnat va boshqaruvni tashkil etish, ish vaqtidan to‘liq foydalanish, ixtisoslashuv, savdo jarayonlarini oqilona tashkil qilish. Ijtimoiy omillar – xodimlarning <b>malaka<\/b>si, tajribasi, ma’lumoti hamda ish haqi va mukofotlar orqali moddiy va ma’naviy <b>motivatsiya<\/b>. Bundan tashqari, tovar aylanmasi hajmi va tarkibi, narxlar darajasi, mavsumiylik kabi bozor omillari ham ta’sir qiladi. Omillar ta’siri indeks va korrelyatsion-regression usullar bilan o‘lchanadi.", "t": "mehnat", "id": "sv-86", "src": "savdo"}, {"n": 87, "q": "Intensiv va ekstensiv omillar o‘rtasidagi farqni tushuntiring.", "k": "intensiv – sifat, ekstensiv – miqdor", "a": "<b>Ekstensiv<\/b> omillar natijani resurslar <b>miqdor<\/b>ini oshirish hisobiga o‘zgartiradi: xodimlar sonini ko‘paytirish, ish vaqtini uzaytirish, savdo maydonini kengaytirish. <b>Intensiv<\/b> omillar esa resurslardan foydalanish <b>sifat<\/b>ini yaxshilash hisobiga ta’sir qiladi: mehnat unumdorligini oshirish, yangi texnologiyalarni joriy etish, mehnatni tashkil etishni takomillashtirish. Masalan, T = ō · W modelida xodimlar soni (ō) – ekstensiv, mehnat unumdorligi (W) – intensiv omil. Ularning ta’siri indeks usulida ajratiladi: <b>ΔT(ō) = (ō1 − ō0) · W0<\/b>, <b>ΔT(W) = (W1 − W0) · ō1<\/b>. Intensiv omillar ulushining oshishi rivojlanish sifatini ko‘rsatadi.", "t": "mehnat", "id": "sv-87", "src": "savdo"}, {"n": 88, "q": "Savdoning moddiy-texnika bazasi nima?", "k": "binolar, jihozlar, savdo maydoni, ombor", "a": "<b>Savdoning moddiy-texnika bazasi<\/b> – tovarlarni sotish, saqlash va xaridorlarga xizmat ko‘rsatish uchun foydalaniladigan moddiy vositalar majmui. Unga do‘kon, savdo markazlari va umumiy ovqatlanish korxonalari <b>binolar<\/b>i, <b>ombor<\/b> va sovutgichlar, savdo-texnologik <b>jihozlar<\/b> (javonlar, kassa apparatlari, sovutish uskunalari, tarozilar) va transport vositalari kiradi. Asosiy ko‘rsatkichlari: savdo obyektlari soni, <b>savdo maydoni<\/b> (kv.m), ombor maydoni va hajmi, asosiy fondlar qiymati, aholining savdo tarmog‘i bilan ta’minlanganligi. Statistika uning hajmi, tarkibi, holati va undan foydalanish samaradorligini (fond qaytimi, 1 kv.m ga tovar aylanmasi) o‘rganadi.", "t": "mtb", "id": "sv-88", "src": "savdo"}, {"n": 89, "q": "Savdo obyekti nima?", "k": "do‘kon, bozor, savdo joyi", "a": "<b>Savdo obyekti<\/b> – tovarlarni sotish va xaridorlarga xizmat ko‘rsatish uchun mo‘ljallangan, maxsus jihozlangan bino, inshoot yoki uning bir qismi. Statsionar savdo obyektlariga <b>do‘kon<\/b>, supermarket, savdo markazi va ixtisoslashgan do‘konlar kiradi. <b>Bozor<\/b> – ko‘plab sotuvchilar uchun <b>savdo joyi<\/b> (rasta, peshtaxta, kontayner) ajratilgan, yagona boshqaruvga ega savdo majmuasi. Nostatsionar obyektlarga kiosk, pavilyon va ko‘chma savdo nuqtalari kiradi. Statistikada savdo obyektlari soni, turlari, maydoni va mulkchilik shakli bo‘yicha hisobga olinadi.", "t": "mtb", "id": "sv-89", "src": "savdo"}, {"n": 90, "q": "Savdo obyektlari sonining harakati balansi qanday tuziladi?", "k": "boshi, qo‘shilgan, chiqqan, oxiri", "a": "Savdo obyektlari sonining harakati balansi davr <b>boshi<\/b>dagi obyektlar soni, davr davomida <b>qo‘shilgan<\/b> (yangi qurilgan, ochilgan, boshqa tarmoqdan o‘tkazilgan) va <b>chiqqan<\/b> (yopilgan, qayta ixtisoslashgan, buzilgan) obyektlar hamda davr <b>oxiri<\/b>dagi son o‘rtasidagi bog‘liqlikka asoslanadi: <b>S oxiri = S boshi + S qo‘shilgan − S chiqqan<\/b>. Balans asosida yangilanish koeffitsienti (qo‘shilganlar / davr oxiridagi son) va chiqib ketish koeffitsienti (chiqqanlar / davr boshidagi son) hisoblanadi. Balans obyektlar soni bilan bir qatorda ularning savdo maydoni bo‘yicha ham tuzilishi mumkin.", "t": "mtb", "id": "sv-90", "src": "savdo"}, {"n": 91, "q": "Chakana savdo obyektlarining asosiy turlarini sanang.", "k": "do‘kon, supermarket, bozor, kiosk", "a": "Chakana savdo obyektlari statsionar va nostatsionar turlarga bo‘linadi. Statsionar obyektlar: <b>do‘kon<\/b>lar (universal, ixtisoslashgan, oziq-ovqat va nooziq-ovqat), <b>supermarket<\/b> va gipermarketlar, minimarketlar, savdo markazlari, dorixonalar. <b>Bozor<\/b>lar – dehqon bozorlari, buyum bozorlari va savdo komplekslari. Nostatsionar (mayda chakana) tarmoq: <b>kiosk<\/b>, pavilyon, chodir, avtomagazin va savdo avtomatlari. Zamonaviy shakllarga internet-do‘konlar va onlayn savdo maydonchalari ham kiradi. Statistikada obyektlar savdo maydoni, ixtisoslashuvi va mulkchilik shakli bo‘yicha guruhlanadi.", "t": "mtb", "id": "sv-91", "src": "savdo"}, {"n": 92, "q": "Ulgurji savdo obyektlarining turlarini sanang.", "k": "ulgurji baza, ombor, distribyutor", "a": "Ulgurji savdo obyektlari tovarlarni yirik partiyalarda qabul qilish, saqlash, saralash va chakana savdo tarmog‘iga yetkazib berishga xizmat qiladi. Ularga universal va ixtisoslashgan <b>ulgurji baza<\/b>lar, tovar <b>ombor<\/b>lari, sovutgichli omborlar va logistika markazlari kiradi. Shuningdek, ulgurji savdoda <b>distribyutor<\/b>lar, dilerlar, ulgurji do‘konlar («cash &amp; carry»), ulgurji bozorlar va tovar birjalari faoliyat ko‘rsatadi. Statistikada ulgurji obyektlar soni, ombor maydoni (kv.m) va hajmi (kub m), sig‘imi hamda ulgurji tovar aylanmasi hisobga olinadi.", "t": "mtb", "id": "sv-92", "src": "savdo"}, {"n": 93, "q": "Umumiy ovqatlanish obyektlarining turlarini sanang.", "k": "restoran, oshxona, kafe, fast-food", "a": "Umumiy ovqatlanish obyektlari tayyor taomlarni ishlab chiqarish, sotish va iste’molini tashkil etish bilan shug‘ullanadi. Asosiy turlari: <b>restoran<\/b> (keng assortiment, yuqori xizmat darajasi), <b>kafe<\/b>, choyxona, bar, <b>oshxona<\/b>lar (ommaviy hamda korxona va o‘quv yurtlari qoshidagi), <b>fast-food<\/b> (tez ovqatlanish) shoxobchalari, bufet va kulinariya do‘konlari. Ular ochiq (umumfoydalanishdagi) va yopiq (muayyan kontingentga xizmat qiluvchi) tarmoqqa bo‘linadi. Statistikada obyektlar soni, o‘rinlar soni, maydoni va umumiy ovqatlanish tovar aylanmasi hisobga olinadi.", "t": "mtb", "id": "sv-93", "src": "savdo"}, {"n": 94, "q": "Savdo maydoni nima?", "k": "xizmat ko‘rsatish maydoni, xaridor, kv.m", "a": "<b>Savdo maydoni<\/b> – do‘konning tovarlar namoyish qilinadigan, sotiladigan va <b>xaridor<\/b>larga xizmat ko‘rsatiladigan qismi bo‘lib, <b>kv.m<\/b>da o‘lchanadi. Unga savdo zallari, uskunalar egallagan maydon, kassa uzellari va xaridorlar harakatlanadigan yo‘laklar kiradi, ya’ni bu <b>xizmat ko‘rsatish maydoni<\/b>dir. Omborxona, ma’muriy, maishiy va texnik xonalar savdo maydoniga kirmaydi. Savdo maydoni asosida 1 kv.m ga to‘g‘ri keladigan tovar aylanmasi (<b>T / S<\/b>) va aholining savdo maydoni bilan ta’minlanganligi (1000 aholiga kv.m) hisoblanadi.", "t": "mtb", "id": "sv-94", "src": "savdo"}, {"n": 95, "q": "Ombor maydoni va hajmi qanday hisoblanadi?", "k": "uzunlik × kenglik, balandlik, kub metr", "a": "Ombor maydoni – tovarlarni saqlash uchun mo‘ljallangan xonalar maydoni bo‘lib, <b>uzunlik × kenglik<\/b> ko‘paytmasi bilan kv.m da hisoblanadi: <b>S = a · b<\/b>. Ombor hajmi maydonni saqlash <b>balandlik<\/b>iga ko‘paytirish orqali <b>kub metr<\/b>da aniqlanadi: <b>V = a · b · h<\/b>. Umumiy maydondan tashqari, tovar bevosita joylashtiriladigan foydali (yuk) maydoni va uning umumiy maydondagi ulushi – maydondan foydalanish koeffitsienti hisoblanadi. Hajm ko‘rsatkichi ayniqsa sovutgichli va baland stellajli omborlar sig‘imini baholashda muhim. Bu ko‘rsatkichlar zaxiralarni joylashtirish imkoniyatini baholashga xizmat qiladi.", "t": "mtb", "id": "sv-95", "src": "savdo"}, {"n": 96, "q": "Savdo obyektlarining o‘tkazish qobiliyati nima?", "k": "xaridorlar soni, vaqt, sig‘im", "a": "<b>O‘tkazish qobiliyati<\/b> – savdo obyektining ma’lum <b>vaqt<\/b> birligida (soat, kun) xizmat ko‘rsatishi mumkin bo‘lgan maksimal <b>xaridorlar soni<\/b>. Do‘kon uchun u ish joylari (kassa uzellari) soni va bitta xaridorga xizmat ko‘rsatish vaqtiga bog‘liq: <b>P = n · t ish / t xizmat<\/b>, bu yerda n – ish joylari soni, t ish – ish vaqti, t xizmat – bir xaridorga sarflanadigan vaqt. Umumiy ovqatlanish korxonalarida o‘tkazish qobiliyati o‘rinlar soni (<b>sig‘im<\/b>) va o‘rinlarning aylanishi bilan o‘lchanadi. Haqiqiy xizmat ko‘rsatilgan xaridorlar sonining o‘tkazish qobiliyatiga nisbati obyektdan foydalanish darajasini ko‘rsatadi.", "t": "mtb", "id": "sv-96", "src": "savdo"}, {"n": 97, "q": "Aholining savdo tarmog‘i bilan ta’minlanganligi qanday baholanadi?", "k": "aholi, do‘konlar soni, savdo maydoni", "a": "Aholining savdo tarmog‘i bilan ta’minlanganligi savdo tarmog‘i zichligi ko‘rsatkichlari orqali baholanadi. Birinchidan, 1000 (yoki 10 000) <b>aholi<\/b>ga to‘g‘ri keladigan <b>do‘konlar soni<\/b>: <b>Zd = do‘konlar soni / aholi soni · 1000<\/b>. Ikkinchidan, 1000 aholiga to‘g‘ri keladigan <b>savdo maydoni<\/b> (kv.m): <b>Zs = S / aholi soni · 1000<\/b>. Teskari ko‘rsatkich – bitta do‘konga to‘g‘ri keladigan aholi soni. Umumiy ovqatlanishda 1000 aholiga o‘rinlar soni hisoblanadi. Olingan ko‘rsatkichlar me’yorlar bilan, hududlar va davrlar bo‘yicha taqqoslanadi.", "t": "mtb", "id": "sv-97", "src": "savdo"}, {"n": 98, "q": "Muomala xarajatlari nima?", "k": "savdo xarajatlari, transport, saqlash, ish haqi", "a": "<b>Muomala xarajatlari<\/b> – tovarlarni ishlab chiqaruvchidan iste’molchiga yetkazish jarayonida savdo korxonalari qiladigan, pul ko‘rinishidagi barcha <b>savdo xarajatlari<\/b>. Ularga tovarlarni <b>transport<\/b>da tashish, <b>saqlash<\/b>, saralash va qadoqlash xarajatlari, xodimlarning <b>ish haqi<\/b> va ijtimoiy ajratmalar, bino ijarasi, energiya, amortizatsiya, reklama, kredit foizlari va tabiiy yo‘qotishlar kiradi. Muomala xarajatlari summa va tovar aylanmasiga nisbatan nisbiy daraja (foizda) bilan tavsiflanadi. Ular savdo foydasi va narxlar darajasiga bevosita ta’sir qiladi.", "t": "xarajat", "id": "sv-98", "src": "savdo"}, {"n": 99, "q": "Muomala xarajatlari va realizatsiya xarajatlari o‘rtasidagi farqni tushuntiring.", "k": "muomala – savdo, realizatsiya – sotish bilan bog‘liq", "a": "<b>Muomala xarajatlari<\/b> – <b>savdo<\/b> korxonalarining tovarlarni sotib olish, tashish, saqlash va xaridorga sotish bo‘yicha barcha xarajatlari; ular savdo faoliyatining asosiy xarajati hisoblanadi. <b>Realizatsiya xarajatlari<\/b> esa ishlab chiqaruvchi korxonalarning o‘z mahsulotini <b>sotish bilan bog‘liq<\/b> xarajatlari: qadoqlash, yuklash, transport, reklama, sotuv xodimlari haqi. Boshqacha aytganda, muomala xarajatlari savdo tarmog‘ida, realizatsiya xarajatlari ishlab chiqarish korxonasida yuzaga keladi. Realizatsiya xarajatlari mahsulotning to‘liq tannarxiga kiradi, muomala xarajatlari esa savdo ustamasi (yalpi daromad) hisobidan qoplanadi.", "t": "xarajat", "id": "sv-99", "src": "savdo"}, {"n": 100, "q": "Muomala xarajatlarining tarkibini sanab bering.", "k": "transport, ish haqi, ijara, saqlash, reklama", "a": "Muomala xarajatlarining asosiy moddalari: tovarlarni tashish uchun <b>transport<\/b> xarajatlari; xodimlarning <b>ish haqi<\/b> va unga ijtimoiy ajratmalar; bino, inshoot va jihozlar <b>ijara<\/b>si; asosiy vositalar amortizatsiyasi va ta’mirlash xarajatlari. Shuningdek, tovarlarni <b>saqlash<\/b>, saralash va qadoqlash xarajatlari; elektr energiya, isitish va kommunal to‘lovlar; <b>reklama<\/b> va marketing xarajatlari; kredit foizlari; tovarlarning tabiiy kamayishi va yo‘qotishlari kiradi. Tarkibni o‘rganish uchun har bir moddaning umumiy xarajatlardagi ulushi (tuzilma nisbiy miqdori) hisoblanadi va bazis davr bilan taqqoslanadi.", "t": "xarajat", "id": "sv-100", "src": "savdo"}, {"n": 101, "q": "Muomala xarajatlarining nisbiy darajasi qanday hisoblanadi?", "k": "tovar aylanmasi, xarajat", "a": "Muomala xarajatlarining nisbiy darajasi <b>xarajat<\/b>lar summasining <b>tovar aylanmasi<\/b>ga nisbatan foizi bilan hisoblanadi: <b>U = MX / T · 100<\/b>, bu yerda MX – muomala xarajatlari summasi, T – tovar aylanmasi. U har 100 so‘mlik tovar aylanmasiga necha so‘m xarajat to‘g‘ri kelishini ko‘rsatadi. Masalan, MX = 15 mln so‘m, T = 300 mln so‘m bo‘lsa, U = 5%. Nisbiy daraja turli hajmdagi korxonalar va davrlarni taqqoslash imkonini beradi; uning pasayishi savdo samaradorligi oshganini bildiradi. Darajaning o‘zgarishi (U1 − U0) foiz punktlarda ifodalanadi.", "t": "xarajat", "id": "sv-101", "src": "savdo"}, {"n": 102, "q": "Muomala xarajatlarining yalpi daromaddagi darajasi nima?", "k": "yalpi daromad, xarajat", "a": "Muomala xarajatlarining <b>yalpi daromad<\/b>dagi darajasi xarajatlar summasining yalpi daromadga (savdo ustamasi summasiga) nisbatini ko‘rsatadi: <b>U yd = MX / YaD · 100<\/b>. U har 100 so‘mlik yalpi daromadning qancha qismi <b>xarajat<\/b>larni qoplashga ketishini bildiradi, qolgan qismi esa foydani tashkil etadi. Masalan, yalpi daromad 40 mln so‘m, xarajatlar 30 mln so‘m bo‘lsa, daraja 75% ga, foyda ulushi esa 25% ga teng. Bu ko‘rsatkich qancha past bo‘lsa, savdo korxonasining rentabelligi shuncha yuqori bo‘ladi.", "t": "xarajat", "id": "sv-102", "src": "savdo"}, {"n": 103, "q": "Tejam va ortiqcha sarf qanday aniqlanadi?", "k": "farq, haqiqiy – reja, tejam, ortiqcha", "a": "Xarajatlarning <b>tejam<\/b>i yoki <b>ortiqcha<\/b> sarfi haqiqiy va reja (yoki bazis) ko‘rsatkichlari o‘rtasidagi <b>farq<\/b> sifatida aniqlanadi. Mutlaq farq: ΔMX = MX haqiqiy − MX reja. Tovar aylanmasi hajmi o‘zgarganini hisobga olish uchun nisbiy darajalar farqi qo‘llaniladi: <b>Tejam (ortiqcha sarf) = (U1 − U0) · T1 / 100<\/b>, bu yerda U1 va U0 – <b>haqiqiy – reja<\/b> (bazis) xarajat darajalari, T1 – haqiqiy tovar aylanmasi. Natija manfiy bo‘lsa – tejam, musbat bo‘lsa – ortiqcha sarf. Masalan, daraja 5,2% dan 4,8% ga tushib, T1 = 500 mln so‘m bo‘lsa: (4,8 − 5,2) · 500 / 100 = −2 mln so‘m tejam.", "t": "xarajat", "id": "sv-103", "src": "savdo"}, {"n": 104, "q": "Shartli-doimiy va o‘zgaruvchan xarajatlar nima?", "k": "hajmga bog‘liq emas, hajmga bog‘liq", "a": "<b>Shartli-doimiy xarajatlar<\/b> – summasi tovar aylanmasi <b>hajmga bog‘liq emas<\/b> yoki juda kam bog‘liq bo‘lgan xarajatlar: ijara, amortizatsiya, boshqaruv xodimlari maoshi, isitish, qo‘riqlash. <b>O‘zgaruvchan xarajatlar<\/b> esa tovar aylanmasi <b>hajmga bog‘liq<\/b> holda o‘zgaradi: transport, qadoqlash, saqlash, sotuvchilarning ishbay ish haqi, tabiiy yo‘qotishlar. Tovar aylanmasi oshganda shartli-doimiy xarajatlarning nisbiy darajasi kamayadi, o‘zgaruvchan xarajatlarning darajasi esa deyarli o‘zgarmaydi. Shuning uchun xarajatlar <b>MX = a + b · T<\/b> ko‘rinishida ifodalanadi, bu yerda a – shartli-doimiy, b · T – o‘zgaruvchan qism.", "t": "xarajat", "id": "sv-104", "src": "savdo"}, {"n": 105, "q": "Muomala xarajatlari statistikasining vazifalari nimalardan iborat?", "k": "hajm, tarkib, daraja, dinamika, omil", "a": "Muomala xarajatlari statistikasining vazifalari: xarajatlarning mutlaq <b>hajm<\/b>ini (summasini) va moddalar bo‘yicha <b>tarkib<\/b>ini aniqlash; tovar aylanmasiga nisbatan nisbiy <b>daraja<\/b>sini (<b>U = MX / T · 100<\/b>) hisoblash. Xarajatlar summasi va darajasining <b>dinamika<\/b>sini o‘rganish, rejaning bajarilishini, tejam yoki ortiqcha sarfni baholash. Xarajatlarga ta’sir etuvchi <b>omil<\/b>larni (tovar aylanmasi hajmi va tarkibi, narxlar, mehnat unumdorligi) indeks va korrelyatsion usullar bilan tahlil qilish. Shuningdek, xarajatlarni kamaytirish zaxiralarini aniqlash va ularni prognoz qilish.", "t": "xarajat", "id": "sv-105", "src": "savdo"}, {"n": 106, "q": "Xarajatlar darajasining o‘zgarishiga qanday omillar ta’sir qiladi?", "k": "tovar aylanmasi, narx, tarkib, mehnat unumdorligi", "a": "Xarajatlar darajasiga ta’sir etuvchi asosiy omillar: <b>tovar aylanmasi<\/b> hajmi – u oshganda shartli-doimiy xarajatlarning nisbiy darajasi kamayadi. Tovar aylanmasining <b>tarkib<\/b>i – xarajat darajasi yuqori bo‘lgan tovarlar (masalan, tez buziladigan mahsulotlar) ulushi oshsa, o‘rtacha daraja ko‘tariladi. <b>Narx<\/b>lar – tovar narxlari oshsa, aylanma summasi ko‘payib, daraja nominal pasayadi; transport tariflari va ijara narxlari oshsa, xarajatlar ko‘payadi. <b>Mehnat unumdorligi<\/b> oshishi bir birlik tovar aylanmasiga to‘g‘ri keladigan ish haqi xarajatlarini kamaytiradi. Bundan tashqari, tovar aylanish tezligi va savdoni tashkil etish ham ta’sir qiladi.", "t": "xarajat", "id": "sv-106", "src": "savdo"}, {"n": 107, "q": "Xarajatlarni kamaytirish zaxiralarini sanang.", "k": "transport, mehnat unumdorligi, zaxira", "a": "Muomala xarajatlarini kamaytirish zaxiralari: <b>transport<\/b> xarajatlarini qisqartirish – tovarlarni to‘g‘ridan-to‘g‘ri (tranzit) yetkazish, marshrutlarni optimallashtirish, transport sig‘imidan to‘liq foydalanish. <b>Mehnat unumdorligi<\/b>ni oshirish – zamonaviy savdo texnologiyalari, o‘z-o‘ziga xizmat ko‘rsatish va avtomatlashtirish orqali bir birlik tovar aylanmasiga ish haqi xarajatlarini kamaytirish. Tovar aylanishini tezlashtirib, ortiqcha <b>zaxira<\/b>larni qisqartirish – saqlash xarajatlari va kredit foizlarini kamaytiradi. Shuningdek, tabiiy yo‘qotishlarni kamaytirish, energiyani tejash va maydonlardan samarali foydalanish ham muhim zaxiralardir.", "t": "xarajat", "id": "sv-107", "src": "savdo"}, {"n": 108, "q": "Savdo samaradorligi nima?", "k": "natija, xarajat, samara, foyda", "a": "<b>Savdo samaradorligi<\/b> – savdo faoliyati <b>natija<\/b>sining unga sarflangan <b>xarajat<\/b>lar yoki resurslarga nisbati bilan o‘lchanadigan iqtisodiy kategoriya: <b>Samaradorlik = Natija / Xarajat (resurs)<\/b>. Bunda natija (<b>samara<\/b>) sifatida tovar aylanmasi, yalpi daromad yoki <b>foyda<\/b> olinadi. Masalan, xarajatlar rentabelligi = foyda / muomala xarajatlari · 100, mehnat unumdorligi = tovar aylanmasi / xodimlar soni. Samaradorlik bir xil resurs bilan ko‘proq natija olish yoki bir xil natijaga kamroq xarajat bilan erishish darajasini ko‘rsatadi. U iqtisodiy va ijtimoiy samaradorlikka bo‘linadi.", "t": "samara", "id": "sv-108", "src": "savdo"}, {"n": 109, "q": "Samaradorlik va samara tushunchalari o‘rtasidagi farqni tushuntiring.", "k": "samara – natija, samaradorlik – nisbat", "a": "<b>Samara<\/b> – faoliyatning mutlaq <b>natija<\/b>si, masalan, olingan foyda, tovar aylanmasi yoki yalpi daromad summasi; u mutlaq miqdorlarda (so‘m) ifodalanadi. <b>Samaradorlik<\/b> esa samaraning unga erishish uchun sarflangan resurs yoki xarajatlarga <b>nisbat<\/b>i: <b>E = Samara / Xarajat<\/b>; u nisbiy ko‘rsatkich (foiz, koeffitsient) hisoblanadi. Samaraning katta bo‘lishi har doim yuqori samaradorlikni bildirmaydi: masalan, foyda oshgan, lekin xarajatlar undan tezroq oshgan bo‘lsa, samaradorlik pasayadi. Shu sababli korxonalarni taqqoslashda mutlaq samara emas, samaradorlik ko‘rsatkichlari ishlatiladi.", "t": "samara", "id": "sv-109", "src": "savdo"}, {"n": 110, "q": "Savdo samaradorligi ko‘rsatkichlari tizimiga nimalar kiradi?", "k": "foyda, rentabellik, unumdorlik, xarajat", "a": "Savdo samaradorligi ko‘rsatkichlari tizimiga quyidagilar kiradi: umumlashtiruvchi ko‘rsatkichlar – <b>foyda<\/b> summasi va <b>rentabellik<\/b> (tovar aylanmasi rentabelligi <b>P / T · 100<\/b>, xarajatlar rentabelligi P / MX · 100, aktivlar rentabelligi). Mehnat resurslaridan foydalanish – mehnat <b>unumdorlik<\/b>i (T / ō) va 1 so‘m ish haqiga to‘g‘ri keladigan tovar aylanmasi. Asosiy vositalardan foydalanish – fond qaytimi (T / asosiy fondlar), 1 kv.m savdo maydoniga tovar aylanmasi. Aylanma mablag‘lardan foydalanish – tovar aylanish tezligi va vaqti. <b>Xarajat<\/b> ko‘rsatkichlari – muomala xarajatlari darajasi (MX / T · 100) va 1 so‘m xarajatga to‘g‘ri keladigan foyda.", "t": "samara", "id": "sv-110", "src": "savdo"}, {"n": 111, "q": "Ijtimoiy samaradorlik nima?", "k": "aholi ehtiyoji, xizmat sifati, qulaylik", "a": "<b>Ijtimoiy samaradorlik<\/b> – savdoning <b>aholi ehtiyoji<\/b>ni qondirish darajasi va xaridorlar uchun yaratilgan sharoitlar bilan baholanadigan samara. U <b>xizmat sifati<\/b> (assortiment kengligi, tovarlar sifati, xodimlar madaniyati) va xarid qilish <b>qulaylik<\/b>i (do‘konlarning yaqinligi, ish vaqti, navbatlarning yo‘qligi, xaridga sarflanadigan vaqt) orqali ifodalanadi. Ko‘rsatkichlari: aholining savdo tarmog‘i bilan ta’minlanganligi, aholi jon boshiga tovar aylanmasi, talabning qondirilish darajasi, so‘rovnomalar asosidagi xaridorlar mamnunligi. Ijtimoiy samaradorlik iqtisodiy samaradorlik bilan birgalikda baholanadi.", "t": "samara", "id": "sv-111", "src": "savdo"}, {"n": 112, "q": "Iqtisodiy samaradorlik nima?", "k": "foyda, xarajat, resurs, natija", "a": "<b>Iqtisodiy samaradorlik<\/b> – savdo faoliyatining iqtisodiy <b>natija<\/b>si (tovar aylanmasi, yalpi daromad, <b>foyda<\/b>) bilan unga sarflangan <b>resurs<\/b>lar yoki <b>xarajat<\/b>lar o‘rtasidagi nisbat. Umumiy formula: <b>E = Natija / Resurs (xarajat)<\/b>. Asosiy ko‘rsatkichlari: rentabellik (foyda / xarajatlar · 100), mehnat unumdorligi, fond qaytimi, tovar aylanish tezligi, muomala xarajatlari darajasi. Samaradorlikning oshishi bir xil resurslar bilan ko‘proq natija olish yoki shu natijaga kamroq xarajat bilan erishishni bildiradi. U korxona raqobatbardoshligi va moliyaviy barqarorligining asosiy mezonidir.", "t": "samara", "id": "sv-112", "src": "savdo"}, {"n": 113, "q": "Resurs yondashuvi va xarajat yondashuvi o‘rtasidagi farqni tushuntiring.", "k": "sarflangan resurs, qilingan xarajat, samaradorlik", "a": "<b>Samaradorlik<\/b>ni baholashda ikki yondashuv qo‘llaniladi. <b>Resurs yondashuvi<\/b>da natija faoliyatga jalb etilgan (<b>sarflangan resurs<\/b>) zaxiralarga – asosiy fondlar qiymati, aylanma mablag‘lar, xodimlar soni, savdo maydoniga nisbatan olinadi: masalan, fond qaytimi T / Fo, mehnat unumdorligi T / ō. <b>Xarajat yondashuvi<\/b>da natija davr mobaynida joriy <b>qilingan xarajat<\/b>larga – muomala xarajatlari, ish haqi fondi, amortizatsiyaga nisbatan hisoblanadi: masalan, xarajatlar rentabelligi P / MX · 100. Resurs yondashuvi mavjud resurslardan foydalanish darajasini, xarajat yondashuvi esa joriy xarajatlarning qaytimini ko‘rsatadi.", "t": "samara", "id": "sv-113", "src": "savdo"}, {"n": 114, "q": "To‘g‘ri va teskari samaradorlik ko‘rsatkichlari nima?", "k": "natija, resurs, samaradorlik", "a": "<b>To‘g‘ri samaradorlik ko‘rsatkichlari<\/b> <b>natija<\/b>ni <b>resurs<\/b> yoki xarajatga bo‘lish orqali topiladi va bir birlik resursga qancha natija to‘g‘ri kelishini ko‘rsatadi: <b>E = N / R<\/b> (masalan, mehnat unumdorligi T / ō, fond qaytimi T / Fo). Ular qancha katta bo‘lsa, <b>samaradorlik<\/b> shuncha yuqori. <b>Teskari ko‘rsatkichlar<\/b> resursni natijaga bo‘lish orqali hisoblanadi va bir birlik natijaga qancha resurs sarflanganini ko‘rsatadi: <b>e = R / N<\/b> (masalan, mehnat sig‘imi ō / T, fond sig‘imi Fo / T, xarajat darajasi MX / T). Teskari ko‘rsatkich qancha kichik bo‘lsa, samaradorlik shuncha yuqori; ular o‘zaro teskari: E · e = 1.", "t": "samara", "id": "sv-114", "src": "savdo"}, {"n": 115, "q": "Foyda va rentabellik o‘rtasidagi farqni izohlang.", "k": "foyda, rentabellik, summa, foiz", "a": "<b>Foyda<\/b> – savdo faoliyatining mutlaq moliyaviy natijasi bo‘lib, daromaddan xarajatlarni ayirish orqali topiladi va <b>summa<\/b>da (so‘mda) ifodalanadi: P = YaD − MX. <b>Rentabellik<\/b> esa foydaning tovar aylanmasi, xarajatlar yoki aktivlarga nisbati bo‘lib, nisbiy ko‘rsatkich sifatida <b>foiz<\/b>da ifodalanadi: <b>R = P / T · 100<\/b> (yoki P / MX · 100). Foyda faoliyat hajmini, rentabellik esa samaradorlik darajasini ko‘rsatadi. Katta korxona ko‘p foyda olsa ham kichik korxonaga nisbatan past rentabellikka ega bo‘lishi mumkin, shuning uchun korxonalarni rentabellik bo‘yicha taqqoslash to‘g‘riroq.", "t": "samara", "id": "sv-115", "src": "savdo"}, {"n": 116, "q": "Samaradorlikni o‘rganishda indeks usuli qanday qo‘llaniladi?", "k": "dinamika, taqqoslash, indeks", "a": "Samaradorlik ko‘rsatkichlarining <b>dinamika<\/b>si va korxonalar, hududlar bo‘yicha <b>taqqoslash<\/b> <b>indeks<\/b> usuli yordamida amalga oshiriladi: masalan, mehnat unumdorligi indeksi Iw = W1 / W0, rentabellik indeksi IR = R1 / R0. Indeks usuli natijaviy ko‘rsatkich o‘zgarishini omillarga ajratish imkonini beradi. Masalan, T = ō · W bo‘lgani uchun <b>IT = Iō · IW<\/b>; foyda P = T · r (r – tovar aylanmasi rentabelligi) uchun ΔP(T) = (T1 − T0) · r0, ΔP(r) = (r1 − r0) · T1. O‘zgaruvchan va doimiy tarkibli indekslar orqali korxonalar tarkibi o‘zgarishining o‘rtacha samaradorlikka ta’siri aniqlanadi.", "t": "samara", "id": "sv-116", "src": "savdo"}, {"n": 117, "q": "Korrelyatsion-regression tahlilning samaradorlikni o‘rganishdagi ahamiyati nimada?", "k": "bog‘liqlik, ta’sir, model, prognoz", "a": "Korrelyatsion-regression tahlil samaradorlik ko‘rsatkichlari (foyda, rentabellik, mehnat unumdorligi) bilan omillar o‘rtasidagi <b>bog‘liqlik<\/b>ning zichligi va shaklini aniqlaydi. Korrelyatsiya koeffitsienti (r) bog‘lanish kuchini, determinatsiya koeffitsienti (r²) natija variatsiyasining qancha qismi omillar <b>ta’sir<\/b>i bilan tushuntirilishini ko‘rsatadi. Regressiya <b>model<\/b>i, masalan, <b>ŷ = a + b1x1 + b2x2<\/b>, har bir omil (savdo maydoni, xodimlar soni, aylanish tezligi) bir birlikka o‘zgarganda natija qanchaga o‘zgarishini o‘lchaydi. Model asosida samaradorlikni oshirish zaxiralari aniqlanadi va kelgusi davr ko‘rsatkichlari <b>prognoz<\/b> qilinadi.", "t": "samara", "id": "sv-117", "src": "savdo"}, {"n": 118, "q": "Tashqi savdo statistikasining predmeti nima?", "k": "eksport, import, tashqi savdo, bojxona", "a": "<b>Tashqi savdo<\/b> statistikasining predmeti – mamlakatning boshqa davlatlar bilan tovar va xizmatlar ayirboshlashi, ya’ni <b>eksport<\/b> va <b>import<\/b> oqimlarining hajmi, tarkibi, geografik yo‘nalishi va dinamikasini miqdoriy jihatdan o‘rganish. U tashqi savdo aylanmasi, saldosi, eksport-import narx va fizik hajm indekslari, savdo shartlari kabi ko‘rsatkichlarni hisoblaydi. Tovarlar bo‘yicha asosiy axborot manbai – <b>bojxona<\/b> deklaratsiyalari asosida yuritiladigan bojxona statistikasi; xizmatlar bo‘yicha korxonalar hisobotlari va to‘lov balansi ma’lumotlaridan foydalaniladi. Statistika BMTning xalqaro metodologik standartlariga muvofiq yuritiladi.", "t": "tashqi", "id": "sv-118", "src": "savdo"}, {"n": 119, "q": "Eksport va import tushunchalarini izohlang.", "k": "eksport, import, mamlakat chegarasi doirasida mahsulot sotish, sotib olish", "a": "<b>Eksport<\/b> – mamlakatda ishlab chiqarilgan yoki qayta ishlangan tovar va xizmatlarni chet elga olib chiqib, xorijiy xaridorlarga <b>sotish<\/b>. <b>Import<\/b> – xorijiy tovar va xizmatlarni mamlakatga olib kirish, ya’ni chet eldan <b>sotib olish<\/b>. Statistikada tovar <b>mamlakat chegarasi<\/b>ni (bojxona chegarasini) kesib o‘tgan paytda eksport yoki import sifatida qayd etiladi; <b>mamlakat chegarasi doirasida mahsulot sotish<\/b> esa ichki savdo hisoblanadi. Eksport odatda FOB, import esa CIF narxlarida baholanadi. Reeksport (import qilingan tovarni qayta ishlamasdan chet elga chiqarish) va reimport alohida hisobga olinadi.", "t": "tashqi", "id": "sv-119", "src": "savdo"}, {"n": 120, "q": "Tashqi savdo aylanmasi qanday hisoblanadi?", "k": "eksport, import, tashqi savdo aylanmasi", "a": "<b>Tashqi savdo aylanmasi<\/b> – ma’lum davrda mamlakat <b>eksport<\/b>i va <b>import<\/b>i qiymatlarining yig‘indisi: <b>TSA = E + I<\/b>. U mamlakat tashqi iqtisodiy aloqalarining umumiy hajmini ko‘rsatadi va odatda AQSh dollarida ifodalanadi; eksport FOB, import CIF narxlarida hisobga olinadi. Masalan, 1-topshiriq ma’lumotlarida 2025-yil uchun eksport 33,8 mlrd dollar, import 47,4 mlrd dollar, demak, aylanma 33,8 + 47,4 = 81,2 mlrd dollar. Shu asosda tashqi savdo saldosi (E − I), eksport va importning aylanmadagi ulushi, aylanma dinamikasi va mamlakatlar bo‘yicha tarkibi hisoblanadi.", "t": "tashqi", "id": "sv-120", "src": "savdo"}, {"n": 121, "q": "Tashqi savdo saldosi nima?", "k": "eksport, import, musbat, manfiy.", "a": "<p><b>Tashqi savdo saldosi<\/b> — eksport va import qiymatlari o‘rtasidagi farq: <b>Saldo = E − I<\/b>. Agar <b>eksport<\/b> <b>import<\/b>dan katta bo‘lsa, saldo <b>musbat<\/b> (aktiv, profitsit): mamlakat sotib olganidan ko‘proq sotgan. Agar import eksportdan oshsa, saldo <b>manfiy<\/b> (passiv, defitsit) bo‘ladi. Masalan, E = 33,8 mlrd $, I = 47,4 mlrd $ bo‘lsa, saldo = −13,6 mlrd $ (manfiy). Saldo tashqi savdo muvozanatini va uning to‘lov balansiga ta’sirini baholashda ishlatiladi.<\/p>", "t": "tashqi", "id": "sv-121", "src": "savdo"}, {"n": 122, "q": "Eksportning importni qoplash koeffitsienti qanday aniqlanadi?", "k": "import, eksport, eksportning importni qoplash koeffitsienti.", "a": "<p><b>Eksportning importni qoplash koeffitsienti<\/b> — eksport qiymatining import qiymatiga nisbati: <b>K = E / I · 100%<\/b>. U <b>import<\/b> xarajatlarining qancha qismi <b>eksport<\/b> tushumi hisobidan qoplanayotganini ko‘rsatadi. K > 100% bo‘lsa, eksport importni to‘liq qoplaydi (saldo musbat); K < 100% bo‘lsa, qoplamaydi (saldo manfiy). Masalan, 33,8 / 47,4 · 100 ≈ 71,3%: importning 71,3% i eksport hisobidan qoplangan.<\/p>", "t": "tashqi", "id": "sv-122", "src": "savdo"}, {"n": 123, "q": "Tashqi savdo kvotalari nima?", "k": "YaIM, import, eksport, foiz.", "a": "<p><b>Tashqi savdo kvotalari<\/b> iqtisodiyotning tashqi savdoga bog‘liqlik (ochiqlik) darajasini ko‘rsatadi va <b>YaIM<\/b>ga nisbatan <b>foiz<\/b>da hisoblanadi:<\/p><ul><li><b>eksport kvotasi = E / YaIM · 100%<\/b> — yaratilgan mahsulotning qancha qismi eksportga chiqarilishi;<\/li><li><b>import kvotasi = I / YaIM · 100%<\/b> — ichki ehtiyojning importga bog‘liqligi;<\/li><li><b>tashqi savdo kvotasi = (E + I) / YaIM · 100%<\/b> — umumiy ochiqlik (ba’zi darsliklarda (E + I)/2 / YaIM · 100%).<\/li><\/ul><p>Kvota qancha yuqori bo‘lsa, iqtisodiyot tashqi bozorga shuncha ko‘p bog‘liq.<\/p>", "t": "tashqi", "id": "sv-123", "src": "savdo"}, {"n": 124, "q": "FOB va CIF narxlari o‘rtasidagi farqni tushuntiring.", "k": "tovarni mamlakat ichida tashish, eksport protseduralari, portga yetkazish, kelishilgan kema bortiga tovarni topshirish, FOB, tannarx, sug‘urta va yuk tashish, CIF.", "a": "<p><b>FOB<\/b> (Free On Board — “bortda erkin”) narxi tovar qiymatiga eksport qiluvchi mamlakat ichidagi xarajatlarni qo‘shadi: <b>tovarni mamlakat ichida tashish<\/b>, <b>eksport protseduralari<\/b> (bojxona rasmiylashtiruvi), <b>portga yetkazish<\/b> va <b>kelishilgan kema bortiga tovarni topshirish<\/b>; shundan keyin xatar xaridorga o‘tadi. <b>CIF<\/b> (Cost, Insurance, Freight) narxi = <b>tannarx<\/b> (tovar qiymati) + <b>sug‘urta va yuk tashish<\/b> (fraxt), ya’ni tovar import qiluvchi mamlakat portigacha yetkaziladi: <b>CIF = FOB + sug‘urta + fraxt<\/b>. Shuning uchun CIF > FOB. Statistikada eksport FOB, import esa CIF narxlarida baholanadi.<\/p>", "t": "tashqi", "id": "sv-124", "src": "savdo"}, {"n": 125, "q": "Tashqi savdo statistikasining axborot manbalarini sanang.", "k": "bojxona deklaratsiyasi, bank, hisobot.", "a": "<p>Tashqi savdo statistikasining asosiy axborot manbalari:<\/p><ul><li><b>bojxona deklaratsiyasi<\/b> — asosiy manba: tovar nomi va kodi, miqdori, qiymati, hamkor mamlakat;<\/li><li><b>bank<\/b> ma’lumotlari — eksport-import bo‘yicha to‘lovlar, valyuta tushumi, to‘lov balansi;<\/li><li>korxonalarning statistik <b>hisobot<\/b>lari — deklaratsiyada to‘liq aks etmaydigan operatsiyalar va xizmatlar bo‘yicha;<\/li><li>qo‘shimcha manbalar: maxsus tekshiruvlar, hamkor mamlakatlar va xalqaro tashkilotlar ma’lumotlari (“oyna” statistikasi).<\/li><\/ul>", "t": "tashqi", "id": "sv-125", "src": "savdo"}, {"n": 126, "q": "Tashqi savdo shartlari (Terms of Trade) nima?", "k": "eksport narxi, import narxi, indeks.", "a": "<p><b>Tashqi savdo shartlari<\/b> (Terms of Trade) — <b>eksport narxi<\/b> va <b>import narxi<\/b> o‘zgarishining nisbati: <b>ToT = eksport narx indeksi / import narx indeksi · 100<\/b>. ToT > 100 bo‘lsa, shartlar yaxshilangan: bir birlik eksport evaziga ko‘proq import tovar olish mumkin. ToT < 100 bo‘lsa, shartlar yomonlashgan. Masalan, eksport narxlari 5% ga, import narxlari 10% ga oshsa: 105 / 110 · 100 ≈ 95,5 — shartlar taxminan 4,5% ga yomonlashgan. Narx <b>indeks<\/b>lari odatda Paashe formulasi bo‘yicha hisoblanadi.<\/p>", "t": "tashqi", "id": "sv-126", "src": "savdo"}, {"n": 127, "q": "Tashqi savdo statistikasining zamonaviy yo‘nalishlarini sanang.", "k": "raqamli savdo, xizmatlar, elektron tijorat.", "a": "<p>Tashqi savdo statistikasining zamonaviy yo‘nalishlari:<\/p><ul><li><b>raqamli savdo<\/b> — raqamli buyurtma qilinadigan va raqamli yetkaziladigan savdoni o‘lchash;<\/li><li><b>xizmatlar<\/b> savdosi statistikasi — transport, turizm, IT, moliyaviy xizmatlar (EBOPS tasnifi bo‘yicha);<\/li><li><b>elektron tijorat<\/b> — transchegaraviy onlayn savdo va kichik pochta jo‘natmalarini hisobga olish;<\/li><li>qo‘shilgan qiymat bo‘yicha savdo (TiVA) va global qiymat zanjirlari;<\/li><li>bojxona, bank va soliq ma’lumotlarini integratsiyalash, Big Data, tezkor statistika.<\/li><\/ul>", "t": "tashqi", "id": "sv-127", "src": "savdo"}, {"n": 128, "q": "Bojxona statistikasi nima?", "k": "bojxona ma’lumotlari, tashqi savdo, deklaratsiya.", "a": "<p><b>Bojxona statistikasi<\/b> — bojxona chegarasi orqali o‘tadigan tovarlar va transport vositalari haqidagi <b>bojxona ma’lumotlari<\/b>ni yig‘ish, qayta ishlash, tahlil qilish va e’lon qilish tizimi. Uning asosiy manbasi — bojxona yuk <b>deklaratsiya<\/b>si. U <b>tashqi savdo<\/b> hajmi, tovar tarkibi, geografiyasi va dinamikasini aks ettiradi, shuningdek bojxona to‘lovlari tushumi va nazorat natijalari haqida ma’lumot beradi. Bojxona statistikasi tashqi savdo siyosatini ishlab chiqish va to‘lov balansini tuzish uchun asos bo‘ladi.<\/p>", "t": "tashqi", "id": "sv-128", "src": "savdo"}, {"n": 129, "q": "Bojxona statistikasining asosiy maqsadlarini sanang.", "k": "nazorat, tahlil, siyosat, statistika.", "a": "<p>Bojxona statistikasining asosiy maqsadlari:<\/p><ul><li>tashqi savdo ustidan davlat <b>nazorat<\/b>ini ta’minlash, bojxona to‘lovlarini to‘g‘ri undirish;<\/li><li>eksport va import hajmi, tarkibi, dinamikasini <b>tahlil<\/b> qilish;<\/li><li>tashqi iqtisodiy, tarif va valyuta <b>siyosat<\/b>ini ishlab chiqish uchun ma’lumot berish;<\/li><li>rasmiy tashqi savdo <b>statistika<\/b>si va to‘lov balansini shakllantirish, xalqaro tashkilotlarga ma’lumot taqdim etish;<\/li><li>kontrabanda va xatarlarni aniqlash.<\/li><\/ul>", "t": "tashqi", "id": "sv-129", "src": "savdo"}, {"n": 130, "q": "Bojxona statistikasining ikki yo‘nalishini tushuntiring.", "k": "tashqi savdo statistikasi, maxsus bojxona statistikasi.", "a": "<p>Bojxona statistikasi ikki yo‘nalishda yuritiladi:<\/p><ul><li><b>tashqi savdo statistikasi<\/b> — bojxona deklaratsiyalari asosida tovarlar eksporti va importining hajmi, tarkibi, geografiyasi va narxlarini o‘rganadi; natijalar rasmiy tashqi savdo statistikasi sifatida e’lon qilinadi va iqtisodiy tahlil hamda siyosat uchun xizmat qiladi;<\/li><li><b>maxsus bojxona statistikasi<\/b> — bojxona organlarining o‘z faoliyatini aks ettiradi: rasmiylashtirilgan deklaratsiyalar soni, undirilgan bojxona to‘lovlari, transport vositalari va yo‘lovchilar oqimi, huquqbuzarliklar va musodara qilingan tovarlar; u bojxona ishini boshqarish uchun ishlatiladi.<\/li><\/ul>", "t": "tashqi", "id": "sv-130", "src": "savdo"}, {"n": 131, "q": "Bojxona statistikasi ko‘rsatkichlari tizimiga nimalar kiradi?", "k": "eksport, import, qiymat, miqdor, mamlakat.", "a": "<p>Bojxona statistikasi ko‘rsatkichlari tizimi:<\/p><ul><li><b>eksport<\/b> va <b>import<\/b> hajmi, tashqi savdo aylanmasi, saldo;<\/li><li><b>qiymat<\/b> ko‘rsatkichlari — statistik qiymat (FOB/CIF), bojxona qiymati, AQSh dollarida va so‘mda;<\/li><li>natural <b>miqdor<\/b> (tonna, dona, litr) va o‘rtacha narxlar;<\/li><li><b>mamlakat<\/b> bo‘yicha ko‘rsatkichlar — kelib chiqish, jo‘natish va belgilangan mamlakat, geografik tarkib;<\/li><li>TIF TN kodlari bo‘yicha tovar tarkibi, bojxona rejimi, transport turi;<\/li><li>undirilgan bojxona to‘lovlari, dinamika va tarkib ko‘rsatkichlari.<\/li><\/ul>", "t": "tashqi", "id": "sv-131", "src": "savdo"}, {"n": 132, "q": "Bojxona deklaratsiyasi nima?", "k": "rasmiy hujjat, tovar, boj, ma’lumot.", "a": "<p><b>Bojxona deklaratsiyasi<\/b> — deklarant (tovar egasi yoki bojxona brokeri) tomonidan bojxona organiga yozma yoki elektron shaklda taqdim etiladigan <b>rasmiy hujjat<\/b>. Unda <b>tovar<\/b> va uni olib o‘tish haqidagi <b>ma’lumot<\/b> qayd etiladi: tovar nomi va TIF TN kodi, miqdori, bojxona qiymati, kelib chiqish mamlakati, bojxona rejimi, jo‘natuvchi va qabul qiluvchi. Uning asosida <b>boj<\/b>, QQS, aksiz va boshqa bojxona to‘lovlari hisoblanadi. Deklaratsiya tashqi savdo statistikasining asosiy birlamchi manbasidir.<\/p>", "t": "tashqi", "id": "sv-132", "src": "savdo"}, {"n": 133, "q": "TIF TN nima?", "k": "tovar nomenklaturasi, kod, tasniflash.", "a": "<p><b>TIF TN<\/b> — Tashqi iqtisodiy faoliyat tovar nomenklaturasi; Jahon bojxona tashkilotining Uyg‘unlashtirilgan tizimi (Harmonized System, HS) asosida tuzilgan <b>tovar nomenklaturasi<\/b>. Har bir tovarga raqamli <b>kod<\/b> beriladi: dastlabki 2 raqam — guruh, 4 raqam — tovar pozitsiyasi, 6 raqam — subpozitsiya (xalqaro darajada bir xil); O‘zbekistonda 10 xonali kod milliy darajada batafsillashtirilgan. HS tovarlarni 21 bo‘lim va 97 guruh bo‘yicha <b>tasniflash<\/b>ga asoslanadi. TIF TN boj stavkalarini qo‘llash, tarif tartibga solish va tashqi savdo statistikasini yuritish uchun ishlatiladi.<\/p>", "t": "tashqi", "id": "sv-133", "src": "savdo"}, {"n": 134, "q": "Bojxona qiymatini aniqlashning 6 usulini sanang.", "k": "shartnoma qiymati, bir xil tovar, o‘xshash tovar, qiymatlarni qo‘shish, ayirish, zaxira.", "a": "<p>JST (GATT VII-modda) qoidalari va O‘zbekiston Bojxona kodeksiga ko‘ra bojxona qiymati 6 usulda aniqlanadi:<\/p><ul><li>1) olib kiriladigan tovar bo‘yicha bitim qiymati (<b>shartnoma qiymati<\/b>) usuli — asosiy usul;<\/li><li>2) <b>bir xil tovar<\/b>lar bilan bitim qiymati usuli;<\/li><li>3) <b>o‘xshash tovar<\/b>lar bilan bitim qiymati usuli;<\/li><li>4) qiymatni <b>ayirish<\/b> (chegirish) usuli — import mamlakatida sotish narxidan xarajatlar, foyda va to‘lovlar ayiriladi;<\/li><li>5) qiymatlarni <b>qo‘shish<\/b> (hisoblangan qiymat) usuli — ishlab chiqarish xarajatlari + foyda + yetkazish xarajatlari;<\/li><li>6) <b>zaxira<\/b> (rezerv) usuli — oldingi usullarni moslashtirib qo‘llash.<\/li><\/ul><p>Usullar ketma-ket qo‘llanadi: oldingisi imkonsiz bo‘lsagina keyingisiga o‘tiladi (4- va 5-usullar tartibi deklarant iltimosiga ko‘ra almashtirilishi mumkin).<\/p>", "t": "tashqi", "id": "sv-134", "src": "savdo"}, {"n": 135, "q": "TIF TN ni talqin qilishning 6 ta umumiy qoidasini sanang.", "k": "sarlavha, bo‘lim, izoh, asosiy xususiyat, analogiya, kod.", "a": "<p>TIF TN (HS) ni talqin qilishning 6 ta asosiy qoidasi:<\/p><ul><li>1) bo‘lim, guruh va kichik guruh <b>sarlavha<\/b>lari faqat qulaylik uchun; tasniflash tovar pozitsiyasi matni va tegishli <b>bo‘lim<\/b> yoki guruh <b>izoh<\/b>lariga ko‘ra amalga oshiriladi;<\/li><li>2) tugallanmagan yoki yig‘ilmagan tovar, agar tayyor tovarning <b>asosiy xususiyat<\/b>iga ega bo‘lsa, tayyor tovar kabi tasniflanadi; materialga havola uning aralashmalariga ham taalluqli;<\/li><li>3) tovar bir nechta pozitsiyaga mos kelsa: eng aniq tavsifli pozitsiya; aralashma va to‘plamlar — asosiy xususiyat beruvchi komponent bo‘yicha; aks holda — tartib bo‘yicha oxirgi pozitsiya;<\/li><li>4) boshqa qoidalar bilan tasniflab bo‘lmaydigan tovar eng o‘xshash tovar pozitsiyasiga (<b>analogiya<\/b>) kiritiladi;<\/li><li>5) g‘iloflar, qutilar va qadoq tovar bilan birga tasniflanadi;<\/li><li>6) subpozitsiyalar darajasida tasniflash ularning matni va izohlari bo‘yicha, faqat bir darajadagi subpozitsiyalarni taqqoslab yakuniy <b>kod<\/b> aniqlanadi.<\/li><\/ul>", "t": "tashqi", "id": "sv-135", "src": "savdo"}, {"n": 136, "q": "Bojxona statistikasida tovarlarni tasniflash nima uchun muhim?", "k": "boj stavkasi, statistika, nazorat, kod.", "a": "<p>Tovarning to‘g‘ri TIF TN <b>kod<\/b>i <b>boj stavkasi<\/b>, QQS va aksiz stavkalari, imtiyozlar va cheklovlarni belgilaydi: noto‘g‘ri kod bojxona to‘lovlarining kam yoki ortiqcha undirilishiga olib keladi. Yagona tasniflash xalqaro taqqoslanadigan <b>statistika<\/b>ni ta’minlaydi — eksport va import tovar tarkibi bo‘yicha to‘g‘ri guruhlanadi. Shuningdek, u bojxona <b>nazorat<\/b>i, litsenziyalash, kvotalar va xatarlarni boshqarish uchun asos bo‘ladi. Shu sababli tasniflash sifati bojxona statistikasining ishonchliligini belgilaydi.<\/p>", "t": "tashqi", "id": "sv-136", "src": "savdo"}, {"n": 137, "q": "Bojxona statistikasining zamonaviy yo‘nalishlarini sanang.", "k": "elektron deklaratsiya, risk tahlili, raqamli bojxona.", "a": "<p>Bojxona statistikasining zamonaviy yo‘nalishlari:<\/p><ul><li><b>elektron deklaratsiya<\/b> — deklaratsiyalarni masofadan, qog‘ozsiz topshirish va avtomatik tekshirish;<\/li><li><b>risk tahlili<\/b> (xatarlarni boshqarish tizimi) — nazoratni yuqori xatarli yuklarga yo‘naltirish;<\/li><li><b>raqamli bojxona<\/b> — “yagona darcha”, elektron hujjat aylanishi, idoralararo avtomatik ma’lumot almashinuvi;<\/li><li>Big Data va sun’iy intellekt yordamida qiymat va tasniflashni tahlil qilish;<\/li><li>elektron tijorat jo‘natmalarini hisobga olish, xorijiy bojxona xizmatlari bilan ma’lumot almashish.<\/li><\/ul>", "t": "tashqi", "id": "sv-137", "src": "savdo"}, {"n": 138, "q": "Savdo statistikasining predmeti va metodi.", "k": "savdo qonuniyatlari, predmet, statistik usullar, metod.", "a": "<p><b>Savdo statistikasi<\/b> — iqtisodiy statistikaning tarmog‘i. Uning <b>predmet<\/b>i — savdo sohasidagi ommaviy hodisa va jarayonlarning miqdoriy tomoni, ularning sifat mazmuni bilan uzviy bog‘liq holda, muayyan joy va vaqt sharoitida. U <b>savdo qonuniyatlari<\/b>ni ochib beradi: tovar aylanmasi hajmi, tarkibi va dinamikasi, tovar zaxiralari, narxlar, savdo tarmog‘i, mehnat, xarajatlar va samaradorlik. Obyekti — savdo korxonalari, chakana va ulgurji savdo, bozorlar.<\/p><p>Savdo statistikasining <b>metod<\/b>i — <b>statistik usullar<\/b> majmui, uch bosqichda qo‘llanadi:<\/p><ul><li>statistik kuzatish — birlamchi ma’lumotlarni yig‘ish (hisobot, ro‘yxatga olish, tanlama kuzatish);<\/li><li>jamlash va guruhlash — ma’lumotlarni tartiblash, jadval va qatorlar tuzish;<\/li><li>tahlil — mutlaq, nisbiy, o‘rtacha miqdorlar, indekslar, dinamika qatorlari, balans va korrelyatsion-regression usullar.<\/li><\/ul><p>Predmet “nimani o‘rganadi?”, metod esa “qanday o‘rganadi?” savoliga javob beradi.<\/p>", "t": "predmet", "id": "sv-138", "src": "savdo"}, {"n": 139, "q": "Savdoda statistik tadqiqotlarning vazifalari va usullari.", "k": "tahlil, prognoz, kuzatish, indeks.", "a": "<p>Savdoda statistik tadqiqotlarning asosiy vazifalari:<\/p><ul><li>tovar aylanmasi hajmi, tarkibi va dinamikasini aniqlash;<\/li><li>tovar zaxiralari, ta’minlanganlik va aylanish tezligini baholash;<\/li><li>narxlar o‘zgarishi va aholi talabini o‘rganish;<\/li><li>savdo tarmog‘i, mehnat resurslari, xarajatlar va samaradorlikni <b>tahlil<\/b> qilish;<\/li><li>rivojlanishni <b>prognoz<\/b> qilish va boshqaruv qarorlari uchun ma’lumot berish.<\/li><\/ul><p>Usullari: <b>kuzatish<\/b> (hisobot, maxsus tekshirish, tanlama, anketa so‘rovi); guruhlash; nisbiy va o‘rtacha miqdorlar; <b>indeks<\/b> usuli; dinamika qatorlari va trend; balans usuli; korrelyatsion-regression tahlil. Masalan, <b>Ipq = Ip · Iq<\/b> bog‘lanishi tovar aylanmasi o‘zgarishining qancha qismi narx, qanchasi fizik hajm hisobiga ekanini ko‘rsatadi.<\/p>", "t": "predmet", "id": "sv-139", "src": "savdo"}, {"n": 140, "q": "Savdo statistikasi ko‘rsatkichlari tizimi.", "k": "absolyut, nisbiy, o‘rtacha, indeks.", "a": "<p>Savdo statistikasi ko‘rsatkichlari tizimi — savdo faoliyatini har tomonlama tavsiflovchi o‘zaro bog‘liq ko‘rsatkichlar majmui. Shakli bo‘yicha:<\/p><ul><li><b>absolyut<\/b> ko‘rsatkichlar — tovar aylanmasi summasi, zaxiralar, xodimlar soni, savdo maydoni, xarajatlar summasi (so‘m, dona, kv. m);<\/li><li><b>nisbiy<\/b> ko‘rsatkichlar — dinamika, tuzilma, reja bajarilishi, intensivlik (jon boshiga aylanma, xarajatlar darajasi, %);<\/li><li><b>o‘rtacha<\/b> ko‘rsatkichlar — o‘rtacha zaxira, o‘rtacha narx, o‘rtacha ish haqi, bir xodimga aylanma;<\/li><li><b>indeks<\/b>lar — tovar aylanmasi, narx va fizik hajm indekslari.<\/li><\/ul><p>Mazmuni bo‘yicha bloklar: tovar aylanmasi, zaxiralar, narxlar, moddiy-texnika baza, mehnat, muomala xarajatlari, samaradorlik va tashqi savdo. Ko‘rsatkichlar bir-birini to‘ldiradi, masalan: zaxira (kunlarda) = o‘rtacha zaxira / bir kunlik aylanma.<\/p>", "t": "predmet", "id": "sv-140", "src": "savdo"}, {"n": 141, "q": "Savdo statistikasining axborot bazasi.", "k": "hisobot, kuzatish, bojxona, bank.", "a": "<p>Savdo statistikasining axborot bazasi quyidagi manbalardan shakllanadi:<\/p><ul><li>korxonalarning statistik <b>hisobot<\/b>lari (tovar aylanmasi, zaxiralar, mehnat, moliya), buxgalteriya va kassa ma’lumotlari;<\/li><li>maxsus tashkil etilgan <b>kuzatish<\/b>lar — savdo tarmog‘ini ro‘yxatga olish, bozorlarda narx kuzatuvi, tanlama va anketa so‘rovlari, uy xo‘jaliklari tekshiruvi;<\/li><li><b>bojxona<\/b> ma’lumotlari — eksport va import deklaratsiyalari;<\/li><li><b>bank<\/b> ma’lumotlari — naqdsiz to‘lovlar, to‘lov terminallari, valyuta operatsiyalari;<\/li><li>ma’muriy manbalar — soliq organlari (onlayn nazorat-kassa mashinalari), registrlar, elektron tijorat platformalari, Big Data.<\/li><\/ul><p>Ma’lumotlar to‘liq, ishonchli, o‘z vaqtida va taqqoslanadigan bo‘lishi kerak; O‘zbekistonda ularni Statistika agentligi umumlashtiradi.<\/p>", "t": "predmet", "id": "sv-141", "src": "savdo"}, {"n": 142, "q": "Tovar aylanmasining mohiyati va ahamiyati. Tovar aylanmasining asosiy kategoriyalari, tovar harakati bosqichlari (bo‘g‘inliligi).", "k": "sotish, bosqich, ulgurji, chakana, iste’molchi.", "a": "<p><b>Tovar aylanmasi<\/b> — tovarlarni pulga ayirboshlash (<b>sotish<\/b>) jarayoni va uning qiymat hajmi; u ishlab chiqarishni iste’mol bilan bog‘laydi. Ahamiyati: aholi ehtiyojining qondirilishi, savdo korxonasi daromadi va iqtisodiyot holatini ko‘rsatadi.<\/p><p>Asosiy kategoriyalar:<\/p><ul><li><b>ulgurji<\/b> tovar aylanmasi — tovarni korxonalarga qayta sotish yoki ishlab chiqarish uchun sotish;<\/li><li><b>chakana<\/b> tovar aylanmasi — tovarni yakuniy <b>iste’molchi<\/b>ga (aholiga) sotish;<\/li><li>yalpi aylanma — barcha bo‘g‘inlardagi sotuvlar yig‘indisi; sof aylanma — har bir tovar faqat bir marta hisobga olinadi.<\/li><\/ul><p>Tovar harakati <b>bosqich<\/b>lari (bo‘g‘inliligi): ishlab chiqaruvchi → ulgurji savdo → chakana savdo → iste’molchi. <b>Bo‘g‘inlilik koeffitsienti = yalpi tovar aylanmasi / sof tovar aylanmasi<\/b>: tovar iste’molchiga yetguncha o‘rtacha necha marta sotilishini ko‘rsatadi. Uning pasayishi tovar harakati yo‘li qisqarganini va xarajatlar tejalishini bildiradi.<\/p>", "t": "aylanma", "id": "sv-142", "src": "savdo"}, {"n": 143, "q": "Ulgurji tovar aylanmasi tushunchasi va uning turlari.", "k": "korxonalararo, vositachi, yirik partiya.", "a": "<p><b>Ulgurji tovar aylanmasi<\/b> — tovarlarni <b>yirik partiya<\/b>larda qayta sotish yoki ishlab chiqarish ehtiyoji uchun sotish. Bu <b>korxonalararo<\/b> savdo: tovar hali yakuniy iste’molga o‘tmaydi. Ulgurji savdo ishlab chiqaruvchi va chakana savdo o‘rtasida <b>vositachi<\/b> vazifasini bajaradi.<\/p><p>Turlari:<\/p><ul><li>sotish yo‘nalishi bo‘yicha: chakana savdo tarmog‘iga sotish; korxona va tashkilotlarga ishlab chiqarish va ijtimoiy ehtiyojlar uchun sotish; eksportga sotish;<\/li><li>tashkil etilish shakli bo‘yicha: <b>ombor<\/b> orqali aylanma (tovar ulgurji baza omboridan o‘tadi) va <b>tranzit<\/b> aylanma (tovar ishlab chiqaruvchidan to‘g‘ridan-to‘g‘ri xaridorga jo‘natiladi; ulgurji tashkilot hisob-kitobda ishtirok etishi yoki etmasligi mumkin);<\/li><li>bo‘g‘inlar bo‘yicha: birinchi va keyingi bo‘g‘in ulgurji sotish, tizim ichidagi ulgurji sotish.<\/li><\/ul><p>Ulgurji aylanma sotilgan tovarlarning ulgurji narxlarida hisobga olinadi.<\/p>", "t": "aylanma", "id": "sv-143", "src": "savdo"}, {"n": 144, "q": "Ulgurji savdo dinamikasi va tovarlarning bir tekis sotilishini statistik tahlil qilish.", "k": "dinamika, notekislik, o‘zgarish, koeffitsient.", "a": "<p>Ulgurji savdo <b>dinamika<\/b>si dinamika qatorlari ko‘rsatkichlari bilan o‘rganiladi: mutlaq o‘sish, o‘sish va qo‘shimcha o‘sish sur’atlari, 1% o‘sishning mutlaq qiymati, o‘rtacha o‘sish sur’ati (geometrik o‘rtacha), trend va mavsumiylik indekslari.<\/p><p>Tovarlarning bir tekis sotilishi (yetkazib berilishi) davrlar (kun, hafta, oy) bo‘yicha sotuvning <b>notekislik<\/b>ini o‘lchash orqali baholanadi:<\/p><ul><li>o‘rtacha kvadratik tafovut <b>σ = √(Σ(x − x̄)² / n)<\/b> — sotuvning o‘rtachadan absolyut <b>o‘zgarish<\/b>i;<\/li><li>notekislik (variatsiya) <b>koeffitsient<\/b>i <b>V = σ / x̄ · 100%<\/b>;<\/li><li>bir tekislik koeffitsienti = 100% − V;<\/li><li>reja (shartnoma) bajarilishi foizi va ritmlilik koeffitsienti.<\/li><\/ul><p>V qancha kichik bo‘lsa, sotish shuncha bir tekis. Masalan, V = 12% bo‘lsa, bir tekislik koeffitsienti 88%.<\/p>", "t": "aylanma", "id": "sv-144", "src": "savdo"}, {"n": 145, "q": "Chakana tovar aylanmasi tushunchasi va tarkibi. O‘zbekiston Respublikasida chakana tovar aylanmasini barcha sotish kanallari bo‘yicha aniqlash.", "k": "aholi, kanal, do‘kon, bozor, onlayn.", "a": "<p><b>Chakana tovar aylanmasi<\/b> — iste’mol tovarlarini <b>aholi<\/b>ga shaxsiy (oilaviy) iste’mol uchun naqd pul, bank kartasi va boshqa to‘lov vositalari orqali sotish; ijtimoiy muassasalarga (kasalxona, maktab va h.k.) sotish ham kiradi. Tarkibi: oziq-ovqat va nooziq-ovqat tovarlari; mulk shakllari va savdo turlari bo‘yicha.<\/p><p>O‘zbekistonda chakana tovar aylanmasi barcha sotish <b>kanal<\/b>lari bo‘yicha aniqlanadi:<\/p><ul><li>yuridik shaxslar — savdo korxonalarining <b>do‘kon<\/b>lari, savdo markazlari, shoxobchalari (hisobotlar asosida);<\/li><li>kichik korxonalar va yakka tartibdagi tadbirkorlar (tanlama kuzatish asosida);<\/li><li>dehqon <b>bozor<\/b>lari va buyum bozorlarida sotuv (bozorlar kuzatuvi);<\/li><li><b>onlayn<\/b> savdo — internet-do‘konlar va elektron tijorat platformalari.<\/li><\/ul><p>Bu ma’lumotlar hisobot, tanlama kuzatish va ma’muriy manbalar (soliq, onlayn kassa) asosida birlashtirilib, jami chakana aylanma va uning jon boshiga darajasi hisoblanadi.<\/p>", "t": "aylanma", "id": "sv-145", "src": "savdo"}, {"n": 146, "q": "Chakana tovar aylanmasining tovar tarkibini o‘rganish. Chakana tovar aylanmasini tahlil qilishda qo‘llaniladigan statistik usullar.", "k": "guruhlash, ulush, indeks, dinamika.", "a": "<p>Chakana tovar aylanmasining tovar tarkibi — undagi tovar guruhlari (oziq-ovqat va nooziq-ovqat; go‘sht, sut, kiyim, texnika va h.k.) salmog‘i. U <b>guruhlash<\/b> va tuzilma nisbiy miqdorlari orqali o‘rganiladi: <b>ulush = guruh aylanmasi / jami aylanma · 100%<\/b>.<\/p><p>Tahlil usullari:<\/p><ul><li>guruhlash — tovar, hudud, mulk shakli, savdo turi bo‘yicha; tuzilma siljishlarini baholash;<\/li><li>nisbiy va o‘rtacha miqdorlar — jon boshiga, bir do‘konga, bir xodimga aylanma;<\/li><li><b>indeks<\/b> usuli — <b>Ipq = Ip · Iq<\/b>: aylanma o‘zgarishini narx va fizik hajm omillariga ajratish;<\/li><li><b>dinamika<\/b> qatorlari — o‘sish sur’atlari, trend, mavsumiylik indekslari;<\/li><li>korrelyatsion-regression tahlil — aylanmaning daromad, narx, aholi soniga bog‘liqligi.<\/li><\/ul><p>Masalan, oziq-ovqat ulushining kamayishi aholi daromadlari oshayotganini bildirishi mumkin (Engel qonuniyati).<\/p>", "t": "aylanma", "id": "sv-146", "src": "savdo"}, {"n": 147, "q": "Umumiy ovqatlanish tovar aylanmasi statistikasi.", "k": "restoran, oshxona, sotish, xizmat.", "a": "<p>Umumiy ovqatlanish tovar aylanmasi — <b>restoran<\/b>, kafe, <b>oshxona<\/b>, bar va boshqa korxonalarning o‘z mahsuloti (tayyor taomlar) hamda sotib olingan tovarlarini aholiga <b>sotish<\/b> hajmi va ovqatlanish <b>xizmat<\/b>lari. Bu sohada ishlab chiqarish, sotish va iste’molni tashkil etish funksiyalari birlashgan.<\/p><p>O‘rganiladigan ko‘rsatkichlar:<\/p><ul><li>umumiy ovqatlanish aylanmasi hajmi va tarkibi — o‘z mahsuloti va sotib olingan tovarlar ulushi;<\/li><li>korxonalar soni, turi va o‘rinlar soni; 1000 aholiga o‘rinlar soni;<\/li><li>bir o‘ringa, bir xodimga aylanma; o‘rinlardan foydalanish (aylanish) koeffitsienti;<\/li><li>aylanma dinamikasi, narx va fizik hajm indekslari, ustama darajasi.<\/li><\/ul><p>Ma’lumotlar korxonalar hisoboti va tanlama kuzatishlardan olinadi; umumiy ovqatlanish aylanmasi chakana tovar aylanmasi tarkibida yoki alohida ko‘rsatiladi.<\/p>", "t": "aylanma", "id": "sv-147", "src": "savdo"}, {"n": 148, "q": "Tovar zaxiralari statistikasining tushunchasi va vazifalari.", "k": "zaxira, hajm, aylanish, ta’minlanganlik.", "a": "<p><b>Tovar zaxiralari<\/b> — muayyan sanada savdo korxonalari, omborlar va yo‘lda turgan, sotish uchun mo‘ljallangan tovarlar. Ular savdo jarayonining uzluksizligini ta’minlaydi. Zaxira moment ko‘rsatkich bo‘lib, natural va qiymat (so‘m) birliklarida hamda kunlarda ifodalanadi.<\/p><p>Tovar zaxiralari statistikasining vazifalari:<\/p><ul><li>zaxiralarning sana bo‘yicha <b>hajm<\/b>i, tarkibi va joylashuvini aniqlash;<\/li><li>davr uchun o‘rtacha zaxirani hisoblash va dinamikasini o‘rganish;<\/li><li>savdoning zaxiralar bilan <b>ta’minlanganlik<\/b>ini (kunlarda) va normativga mosligini baholash;<\/li><li>zaxiralar <b>aylanish<\/b> tezligi (marta) va vaqtini (kunlarda) hisoblash;<\/li><li>ortiqcha yoki yetishmaydigan zaxiralarni aniqlash, ularning moliyaviy natijalarga ta’sirini tahlil qilish.<\/li><\/ul>", "t": "zaxira", "id": "sv-148", "src": "savdo"}, {"n": 149, "q": "Savdo tashkilotlarida tovar zaxiralarining tasnifi, hisobga olish usullari va statistik hisoboti.", "k": "joriy, mavsumiy, sug‘urta, inventarizatsiya.", "a": "<p>Tovar zaxiralarining tasnifi:<\/p><ul><li>vazifasi bo‘yicha: <b>joriy<\/b> (kundalik savdoni ta’minlovchi), <b>mavsumiy<\/b> (mavsumiy ishlab chiqarish yoki iste’mol uchun to‘planadigan), <b>sug‘urta<\/b> (kafolat, uzilishlarga qarshi) zaxiralar;<\/li><li>joylashuvi bo‘yicha: chakana savdoda, ulgurji omborlarda, yo‘ldagi tovarlar;<\/li><li>tovar guruhlari bo‘yicha.<\/li><\/ul><p>Hisobga olish usullari: <b>inventarizatsiya<\/b> — zaxirani muayyan sanaga natural sanab, narxlarda baholash (eng ishonchli usul); balans usuli — <b>zaxira (oxir) = zaxira (bosh) + kirim − chiqim<\/b>; tezkor buxgalteriya va elektron ombor (kassa) hisobi. Zaxiralar chakana yoki xarid narxlarida baholanadi.<\/p><p>Statistik hisobot: korxonalar davriy hisobotlarida tovar aylanmasi bilan birga davr oxiridagi tovar zaxiralarini ko‘rsatadi; shular asosida zaxira (kunlarda) va aylanish ko‘rsatkichlari hisoblanadi.<\/p>", "t": "zaxira", "id": "sv-149", "src": "savdo"}, {"n": 150, "q": "Davr uchun o‘rtacha tovar zaxiralarini hisoblash.", "k": "xronologik o‘rtacha, arifmetik.", "a": "<p>Tovar zaxirasi moment ko‘rsatkich bo‘lgani uchun davr o‘rtachasi ma’lumotlar qaysi sanalarga berilganiga qarab hisoblanadi:<\/p><ul><li>faqat davr boshi va oxiri ma’lum bo‘lsa — oddiy <b>arifmetik<\/b> o‘rtacha: <b>Z̄ = (Z1 + Z2) / 2<\/b>;<\/li><li>teng oraliqli sanalar (masalan, oy boshlari) bo‘yicha — <b>xronologik o‘rtacha<\/b>: <b>Z̄ = (½Z1 + Z2 + … + Zn−1 + ½Zn) / (n − 1)<\/b>;<\/li><li>teng bo‘lmagan oraliqlar bo‘yicha — tortilgan xronologik o‘rtacha: <b>Z̄ = Σ(Z̄i · ti) / Σti<\/b>, bu yerda Z̄i — qo‘shni ikki sana o‘rtachasi, ti — oraliq davomiyligi;<\/li><li>oylik o‘rtachalar ma’lum bo‘lsa — ularning oddiy arifmetik o‘rtachasi (chorak uchun /3, yil uchun /12).<\/li><\/ul><p>Masalan, 1.01 — 40, 1.02 — 44, 1.03 — 46, 1.04 — 42 mln so‘m: Z̄ = (20 + 44 + 46 + 21) / 3 ≈ 43,7 mln so‘m.<\/p>", "t": "zaxira", "id": "sv-150", "src": "savdo"}, {"n": 151, "q": "Tovar zaxiralari dinamikasini statistik tahlil qilish.", "k": "o‘sish, sur’at, trend.", "a": "<p>Tovar zaxiralari dinamikasi moment qatorlar asosida o‘rganiladi. Hisoblanadigan ko‘rsatkichlar:<\/p><ul><li>mutlaq <b>o‘sish<\/b>: zanjirli Δ = Zi − Zi−1, bazisli Δ = Zi − Z0;<\/li><li>o‘sish <b>sur’at<\/b>i: T = Zi / Zi−1 · 100%; qo‘shimcha o‘sish sur’ati = T − 100%;<\/li><li>1% qo‘shimcha o‘sishning mutlaq qiymati = Δ / qo‘shimcha o‘sish sur’ati (%);<\/li><li>o‘rtacha daraja — xronologik o‘rtacha; o‘rtacha o‘sish sur’ati — geometrik o‘rtacha: <b>T̄ = (Zn / Z1)^(1/(n−1))<\/b>;<\/li><li><b>trend<\/b> — sirpanuvchi o‘rtacha yoki analitik tekislash (ŷ = a + bt), mavsumiylik indekslari.<\/li><\/ul><p>Zaxiralar dinamikasi tovar aylanmasi dinamikasi bilan taqqoslanadi: zaxiralar o‘sish sur’ati aylanma o‘sish sur’atidan yuqori bo‘lsa, aylanish sekinlashadi va ortiqcha zaxira to‘planadi; aksincha bo‘lsa, aylanish tezlashadi.<\/p>", "t": "zaxira", "id": "sv-151", "src": "savdo"}, {"n": 152, "q": "Savdo jarayonining tovar zaxiralari bilan ta’minlanganligini statistik baholash.", "k": "kun, normativ, ta’minlanganlik.", "a": "<p>Savdoning tovar zaxiralari bilan ta’minlanganligi zaxira necha <b>kun<\/b>lik savdoga yetishini ko‘rsatadi: <b>zaxira (kunlarda) = Z / m<\/b>, bu yerda Z — sanadagi (yoki o‘rtacha) zaxira, m = davrdagi tovar aylanmasi / davrdagi kunlar soni — bir kunlik o‘rtacha aylanma.<\/p><p>Haqiqiy <b>ta’minlanganlik<\/b> zaxiraning <b>normativ<\/b> (me’yoriy) darajasi bilan taqqoslanadi:<\/p><ul><li>normativdan farq (kunlarda) = haqiqiy kunlar − normativ kunlar;<\/li><li>summada: ortiqcha (+) yoki yetishmayotgan (−) zaxira = kunlardagi farq × m;<\/li><li>normativga nisbatan foiz = haqiqiy kunlar / normativ kunlar · 100%.<\/li><\/ul><p>Normativdan ortiq zaxira mablag‘larning muzlashi va saqlash xarajatlari oshishiga, kam zaxira esa tanqislik va sotuv yo‘qotilishiga olib keladi. Ta’minlanganlik tovar guruhlari bo‘yicha alohida baholanadi. Masalan, Z = 90 mln so‘m, oylik aylanma 450 mln so‘m (30 kun): m = 15 mln so‘m, zaxira = 6 kunlik.<\/p>", "t": "zaxira", "id": "sv-152", "src": "savdo"}, {"n": 153, "q": "Tovar zaxiralarining aylanma tezligi ko‘rsatkichlari.", "k": "aylanish koeffitsienti, kun, marta.", "a": "<p>Tovar zaxiralarining aylanish tezligi ikki o‘zaro teskari ko‘rsatkich bilan o‘lchanadi:<\/p><ul><li><b>aylanish koeffitsienti<\/b> (aylanishlar soni, <b>marta<\/b>): <b>n = T / Z̄<\/b>, bu yerda T — davrdagi tovar aylanmasi, Z̄ — o‘rtacha zaxira; davr mobaynida zaxira necha marta yangilanganini ko‘rsatadi;<\/li><li>bir aylanish davomiyligi (<b>kun<\/b>larda): <b>t = Z̄ / m = Z̄ · D / T<\/b>, bu yerda m = T / D — bir kunlik aylanma, D — davrdagi kunlar (yil 360, chorak 90, oy 30);<\/li><li>bog‘lanish: <b>t = D / n<\/b>, n = D / t.<\/li><\/ul><p>Koeffitsientning oshishi va kunlarning kamayishi aylanish tezlashganini bildiradi. Dinamikasi indekslar bilan o‘rganiladi: aylanish tezligi indeksi In = n1 / n0, aylanish vaqti indeksi It = t1 / t0. Masalan, T = 3600 mln, Z̄ = 300 mln so‘m: n = 12 marta, t = 360 / 12 = 30 kun.<\/p>", "t": "zaxira", "id": "sv-153", "src": "savdo"}, {"n": 154, "q": "Tovar aylanma tezligining savdo faoliyati foydaliligiga ta’sirini statistik o‘rganish.", "k": "tezlik, foyda, mablag‘, samaradorlik.", "a": "<p>Aylanish <b>tezlik<\/b>i oshganda bir xil tovar aylanmasini kamroq zaxira va aylanma <b>mablag‘<\/b> bilan ta’minlash mumkin: saqlash xarajatlari, kredit foizlari, tabiiy yo‘qotishlar kamayadi, <b>foyda<\/b> va rentabellik oshadi.<\/p><p>Statistik o‘rganish usullari:<\/p><ul><li>aylanish tezlashishi (sekinlashishi) natijasida bo‘shagan (qo‘shimcha jalb etilgan) mablag‘: <b>ΔZ = (t1 − t0) · m1<\/b>; manfiy natija — bo‘shagan mablag‘;<\/li><li>guruhlash — korxonalarni aylanish kunlari bo‘yicha guruhlab, guruhlar bo‘yicha rentabellik va xarajatlar darajasini taqqoslash;<\/li><li>korrelyatsion-regression tahlil — foyda (rentabellik) bilan aylanish koeffitsienti o‘rtasidagi bog‘lanish zichligi va regressiya tenglamasi;<\/li><li>indeks usuli — foyda o‘zgarishini aylanma hajmi, aylanish tezligi va xarajatlar omillariga ajratish.<\/li><\/ul><p>Natijalar savdo faoliyati <b>samaradorlik<\/b>ini oshirish zaxiralarini aniqlashga xizmat qiladi.<\/p>", "t": "zaxira", "id": "sv-154", "src": "savdo"}, {"n": 155, "q": "Xaridor talabi tushunchasi, talabning asosiy kategoriyalari.", "k": "talab, ehtiyoj, tovar, narx.", "a": "<p><b>Xaridor talabi<\/b> — xaridorlarning to‘lov qobiliyati bilan ta’minlangan, bozorda muayyan <b>narx<\/b>da ma’lum <b>tovar<\/b>larni sotib olishga bo‘lgan <b>ehtiyoj<\/b>i. Ehtiyoj kengroq tushuncha: talab — ehtiyojning pul bilan ta’minlangan qismi.<\/p><p>Talabning asosiy kategoriyalari:<\/p><ul><li>qondirilgan (realizatsiya qilingan) talab — haqiqatda sotilgan tovarlar hajmi (tovar aylanmasi);<\/li><li>qondirilmagan talab — tovar yo‘qligi yoki assortiment mos kelmasligi sababli amalga oshmagan xaridlar;<\/li><li>shakllanayotgan (yangi) talab — yangi tovarlarga paydo bo‘layotgan talab;<\/li><li>yashirin va kechiktirilgan talab;<\/li><li>xarakteri bo‘yicha: kundalik, davriy, mavsumiy, impulsiv talab.<\/li><\/ul><p>Talab = qondirilgan + qondirilmagan talab. Statistika talabni do‘konlardagi hisob, xaridorlar so‘rovi, uy xo‘jaliklari byudjeti tekshiruvlari va elastiklik koeffitsientlari orqali o‘rganadi.<\/p>", "t": "narx", "id": "sv-155", "src": "savdo"}, {"n": 156, "q": "Talab elastiklik koeffitsiyentini hisoblash metodikasi va uning iqtisodiy mazmuni.", "k": "talab o‘zgarishi / narx o‘zgarishi, elastiklik.", "a": "<p>Talab <b>elastiklik<\/b> koeffitsienti talab hajmining narx (yoki daromad) o‘zgarishiga sezgirligini ko‘rsatadi: narx 1% ga o‘zgarganda talab necha foizga o‘zgaradi.<\/p><p><b>E = talab o‘zgarishi (%) / narx o‘zgarishi (%) = (Δq / q) : (Δp / p)<\/b>.<\/p><p>Hisoblash metodikasi:<\/p><ul><li>ikki davr bo‘yicha: E = ((q1 − q0) / q0) : ((p1 − p0) / p0);<\/li><li>ko‘p kuzatuvlar bo‘yicha — regressiya orqali: darajali modelda ln q = a + b·ln p, bunda b — elastiklik; chiziqli ŷ = a + bx da E = b · x̄ / ȳ;<\/li><li>daromad bo‘yicha elastiklik: E = (Δq / q) : (Δx / x), x — daromad.<\/li><\/ul><p>Iqtisodiy mazmuni: |E| > 1 — talab elastik (narx pasaysa tushum oshadi), |E| < 1 — noelastik (zaruriy tovarlar), |E| = 1 — birlik elastiklik. Narx bo‘yicha elastiklik odatda manfiy. Masalan, narx 10% oshib, talab 5% kamaysa: E = −5 / 10 = −0,5 — talab noelastik.<\/p>", "t": "narx", "id": "sv-156", "src": "savdo"}, {"n": 157, "q": "Savdoning moddiy-texnika bazasi statistikasining vazifalari va ko‘rsatkichlar tizimi.", "k": "bino, jihoz, maydon, hajm.", "a": "<p>Savdoning moddiy-texnika bazasi (MTB) — savdo jarayoni uchun zarur <b>bino<\/b>, inshoot, <b>jihoz<\/b>, transport va boshqa asosiy vositalar majmui: do‘konlar, omborlar, sovutgich kameralari, savdo uskunalari.<\/p><p>Statistika vazifalari:<\/p><ul><li>savdo obyektlari (do‘kon, shoxobcha, ombor) soni, turi va joylashuvini aniqlash;<\/li><li>savdo va ombor <b>maydon<\/b>i, omborlar <b>hajm<\/b>i (kub m), texnik jihozlanganlikni o‘rganish;<\/li><li>aholining savdo tarmog‘i bilan ta’minlanganligini baholash;<\/li><li>asosiy vositalar holati, harakati va foydalanish samaradorligini tahlil qilish.<\/li><\/ul><p>Ko‘rsatkichlar tizimi: obyektlar soni va harakati balansi; jami va savdo maydoni (kv. m); 1000 aholiga savdo maydoni va do‘konlar soni; o‘tkazish qobiliyati; asosiy vositalar qiymati; <b>fond qaytimi = tovar aylanmasi / asosiy vositalar o‘rtacha qiymati<\/b>; fond sig‘imi; 1 kv. m maydonga aylanma; mehnatning fond bilan qurollanganligi.<\/p>", "t": "mtb", "id": "sv-157", "src": "savdo"}, {"n": 158, "q": "Tarmoq asosiy vositalarini statistik o‘rganish.", "k": "asosiy vosita, eskirish, yangilash, fond.", "a": "<p><b>Asosiy vosita<\/b>lar — savdo jarayonida uzoq muddat (bir yildan ortiq) qatnashib, qiymatini asta-sekin o‘tkazadigan bino, inshoot, uskuna va transport vositalari. Ular to‘liq boshlang‘ich qiymat va qoldiq qiymat (boshlang‘ich qiymat − <b>eskirish<\/b>) bo‘yicha baholanadi.<\/p><p>O‘rganiladigan ko‘rsatkichlar:<\/p><ul><li>asosiy fondlar balansi: <b>fond (oxir) = fond (bosh) + kirim − chiqim<\/b>;<\/li><li>holati: eskirish koeffitsienti = eskirish summasi / boshlang‘ich qiymat · 100%; yaroqlilik koeffitsienti = 100% − eskirish koeffitsienti;<\/li><li>harakati: <b>yangilash<\/b> koeffitsienti = yil davomida kiritilgan yangi fondlar / yil oxiridagi fondlar · 100%; chiqib ketish koeffitsienti = chiqarilgan fondlar / yil boshidagi fondlar · 100%;<\/li><li>foydalanish: <b>fond<\/b> qaytimi = tovar aylanmasi / asosiy fondlarning o‘rtacha yillik qiymati; fond sig‘imi = 1 / fond qaytimi; fond bilan qurollanganlik = fondlar / xodimlar soni.<\/li><\/ul><p>Fond qaytimining oshishi asosiy vositalardan samaraliroq foydalanilayotganini bildiradi.<\/p>", "t": "mtb", "id": "sv-158", "src": "savdo"}, {"n": 159, "q": "Savdo tashkilotlarining soni, tarkibi va hajmini tahlil qilish.", "k": "soni, turi, hajmi, tarkib.", "a": "<p>Savdo tashkilotlari statistikasi tarmoqning <b>soni<\/b>, <b>turi<\/b>, <b>hajmi<\/b> va <b>tarkib<\/b>ini o‘rganadi. Ma’lumotlar korxonalar registri, savdo tarmog‘ini ro‘yxatga olish va hisobotlardan olinadi.<\/p><p>Tahlil yo‘nalishlari:<\/p><ul><li>soni va harakati — obyektlar balansi: davr oxiridagi soni = boshidagi soni + ochilganlar − yopilganlar; dinamika ko‘rsatkichlari;<\/li><li>tarkibi — guruhlash: turi (do‘kon, kiosk, savdo markazi, supermarket), ixtisoslashuvi, mulk shakli, hudud bo‘yicha; tuzilma ulushlari (%);<\/li><li>hajmi (kattaligi) — tovar aylanmasi, savdo maydoni, xodimlar soni bo‘yicha guruhlash (kichik, o‘rta, yirik); bir tashkilotga o‘rtacha aylanma, maydon, xodimlar soni;<\/li><li>ta’minlanganlik — 1000 (10 000) aholiga obyektlar soni va savdo maydoni.<\/li><\/ul><p>Natijalar savdo tarmog‘ini rivojlantirish va joylashtirishni rejalashtirishda qo‘llaniladi.<\/p>", "t": "mtb", "id": "sv-159", "src": "savdo"}, {"n": 160, "q": "Tashkilotlarning o‘tkazish qobiliyati (sig‘imi) ko‘rsatkichlari va ularni statistik tahlil qilish.", "k": "sig‘im, xaridor, maydon, vaqt.", "a": "<p>O‘tkazish qobiliyati (<b>sig‘im<\/b>) — savdo obyekti ma’lum <b>vaqt<\/b> (soat, kun) ichida xizmat ko‘rsatishi mumkin bo‘lgan maksimal <b>xaridor<\/b>lar soni. U savdo <b>maydon<\/b>i, ishchi o‘rinlar (kassa, sotuvchi) soni, xizmat ko‘rsatish usuli va ish rejimiga bog‘liq.<\/p><p>Ko‘rsatkichlar:<\/p><ul><li>do‘kon uchun: soatlik o‘tkazish qobiliyati = ishchi o‘rinlar soni × bir o‘rinda 1 soatda xizmat ko‘rsatiladigan xaridorlar; kunlik = soatlik × ish soatlari;<\/li><li>umumiy ovqatlanish uchun: o‘rinlar soni; kunlik o‘tkazish qobiliyati = o‘rinlar soni × o‘rinning kunlik aylanishi;<\/li><li>foydalanish koeffitsienti = haqiqatda xizmat ko‘rsatilgan xaridorlar / o‘tkazish qobiliyati · 100%;<\/li><li>1 kv. m maydonga xaridorlar soni, 1000 aholiga o‘rinlar soni.<\/li><\/ul><p>Tahlilda haqiqiy yuklama sig‘im bilan taqqoslanadi, kun va soatlar bo‘yicha notekislik (eng yuqori yuklama soatlari) o‘rganiladi: past foydalanish ortiqcha quvvatni, juda yuqori foydalanish esa navbat va xizmat sifati pasayishini bildiradi.<\/p>", "t": "mtb", "id": "sv-160", "src": "savdo"}, {"n": 161, "q": "Savdo va umumiy ovqatlanish tarmog‘idagi tashkilotlarning zichligini statistik o‘rganish.", "k": "zichlik, aholi, maydon, soni.", "a": "<p>Savdo va umumiy ovqatlanish tarmog‘ining <b>zichlik<\/b>i — tashkilotlarning hudud va <b>aholi<\/b>ga nisbatan joylashuv darajasi; u aholining tarmoq bilan ta’minlanganligi va xizmat qulayligini ko‘rsatadi. Intensivlik nisbiy miqdorlari bilan hisoblanadi:<\/p><ul><li>aholi bo‘yicha zichlik = obyektlar <b>soni<\/b> / aholi soni · 1000 — 1000 aholiga do‘konlar (oshxonalar) soni;<\/li><li>hudud bo‘yicha zichlik = obyektlar soni / hudud <b>maydon<\/b>i (masalan, 100 kv. km ga);<\/li><li>1000 aholiga savdo maydoni (kv. m) va umumiy ovqatlanishda o‘rinlar soni;<\/li><li>bitta obyektga to‘g‘ri keladigan aholi soni (teskari ko‘rsatkich) va o‘rtacha xizmat radiusi.<\/li><\/ul><p>Ko‘rsatkichlar hududlar (viloyat, shahar va qishloq) bo‘yicha taqqoslanadi, normativlar bilan solishtiriladi va dinamikada o‘rganiladi. Masalan, 250 ta do‘kon va 50 ming aholi: 250 / 50 000 · 1000 = 5 ta do‘kon har 1000 aholiga.<\/p>", "t": "mtb", "id": "sv-161", "src": "savdo"}, {"n": 162, "q": "Savdoning tashkiliy shakllari, ixtisoslashuvi va universallashtirilishini o‘rganish.", "k": "ixtisoslashuv, universal, tashkiliy shakl.", "a": "<p>Savdoning <b>tashkiliy shakl<\/b>lari: statsionar savdo (do‘kon, savdo markazi, supermarket, gipermarket), kichik chakana tarmoq (kiosk, chodir), ko‘chma savdo, bozor savdosi, savdo tarmoqlari (chain), franchayzing, masofaviy va onlayn savdo.<\/p><p><b>Ixtisoslashuv<\/b> — korxonaning muayyan tovar guruhi (masalan, faqat kiyim yoki maishiy texnika) savdosiga yo‘naltirilishi; <b>universal<\/b>lashuv — bir obyektda keng assortimentdagi turli tovarlarning sotilishi.<\/p><p>Statistik o‘rganish:<\/p><ul><li>tashkilotlarni shakli, tovar ixtisosi va universal/ixtisoslashgan turi bo‘yicha guruhlash, ulushlarini aniqlash;<\/li><li>ixtisoslashuv darajasi = asosiy (ixtisos) tovar guruhi aylanmasi / jami aylanma · 100%;<\/li><li>guruhlar bo‘yicha bir obyektga, 1 kv. m ga, bir xodimga aylanma, xarajatlar darajasi va rentabellikni taqqoslash;<\/li><li>dinamikada tuzilma siljishlarini kuzatish (masalan, supermarket va onlayn savdo ulushining o‘sishi).<\/li><\/ul>", "t": "mtb", "id": "sv-162", "src": "savdo"}, {"n": 163, "q": "Savdoda mehnat statistikasining vazifalari, ko‘rsatkichlar tizimi va axborot manbalari.", "k": "xodim, ish haqi, unumdorlik, hisobot.", "a": "<p>Savdoda mehnat statistikasi savdo tashkilotlari <b>xodim<\/b>larining soni, tarkibi, harakati, ish vaqti, <b>unumdorlik<\/b>i va <b>ish haqi<\/b>ni o‘rganadi.<\/p><p>Vazifalari: xodimlar soni va tarkibini aniqlash; kadrlar harakatini baholash; ish vaqtidan foydalanishni tahlil qilish; mehnat unumdorligi darajasi va dinamikasini o‘lchash; ish haqi fondi va o‘rtacha ish haqini aniqlash; unumdorlik va ish haqi o‘sish sur’atlari nisbatini baholash.<\/p><p>Ko‘rsatkichlar tizimi:<\/p><ul><li>ro‘yxatdagi va o‘rtacha ro‘yxatdagi xodimlar soni, tarkibi (lavozim, jins, yosh, malaka);<\/li><li>qabul, bo‘shash, qo‘nimsizlik koeffitsientlari;<\/li><li>ish vaqti fondlari va ulardan foydalanish koeffitsientlari;<\/li><li>bir xodimga tovar aylanmasi, mehnat sig‘imi;<\/li><li>ish haqi fondi va o‘rtacha ish haqi.<\/li><\/ul><p>Axborot manbalari: mehnat bo‘yicha statistik <b>hisobot<\/b>, ish vaqti tabeli, kadrlar va buxgalteriya hujjatlari, ishchi kuchi tanlama tekshiruvlari.<\/p>", "t": "mehnat", "id": "sv-163", "src": "savdo"}, {"n": 164, "q": "Ro‘yxat tarkibi tushunchasi, xodimlarning davr uchun o‘rtacha sonini hisoblash ko‘rsatkichlari va usullari.", "k": "ro‘yxat, o‘rtacha son, xronologik.", "a": "<p><b>Ro‘yxat<\/b> tarkibi — muayyan sanada korxonada mehnat shartnomasi bo‘yicha doimiy, mavsumiy va vaqtinchalik ishlayotgan barcha xodimlar, shu jumladan ishga chiqmaganlar (kasallik, ta’til, xizmat safari). Ro‘yxatdagi son — moment ko‘rsatkich.<\/p><p>Davr uchun <b>o‘rtacha son<\/b>ni hisoblash usullari:<\/p><ul><li>oy uchun: o‘rtacha ro‘yxatdagi son = oyning har bir kalendar kunidagi ro‘yxat soni yig‘indisi / oydagi kalendar kunlar (dam olish kunlari oldingi ish kunidagi son bilan olinadi);<\/li><li>kishi-kunlar orqali: (ishlangan + ishlanmagan kishi-kunlar) / kalendar kunlar;<\/li><li>teng oraliqli sanalar bo‘yicha — <b>xronologik<\/b> o‘rtacha: <b>S̄ = (½S1 + S2 + … + ½Sn) / (n − 1)<\/b>;<\/li><li>chorak (yil) uchun — oylik o‘rtachalar yig‘indisi / 3 (/ 12).<\/li><\/ul><p>Shuningdek, o‘rtacha ishga chiqqanlar soni = ishga chiqqan kishi-kunlar / ish kunlari soni hisoblanadi.<\/p>", "t": "mehnat", "id": "sv-164", "src": "savdo"}, {"n": 165, "q": "Mehnat kontingenti harakati va tarkibini tahlil qilish.", "k": "qabul, bo‘shatish, tarkib, harakat.", "a": "<p>Mehnat kontingenti <b>harakat<\/b>i — davr mobaynida xodimlarni ishga <b>qabul<\/b> qilish va <b>bo
