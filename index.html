\/td><td>640,8<\/td><\/tr><tr><td>Moliyaviy xizmatlar<\/td><td>72,4<\/td><\/tr><tr><td>Boshqa xizmatlar<\/td><td>416,1<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har bir xizmat turining umumiy eksportdagi ulushini (%) hisoblang.<\/li><li>Tarkibdagi eng katta va eng kichik ulushga ega bo‘lgan xizmat turlarini aniqlang.<\/li><li>Xizmatlar eksporti tarkibining diversifikatsiya darajasini baholang.<\/li><li>Tarkibiy tahlil asosida xulosa yozing.<\/li><\/ol>", "cond_raw": "", "sol": "<p>Jami: 2 794,3 + 3 519,0 + 640,8 + 72,4 + 416,1 = <b>7 442,6 mln $<\/b>. Ulush d<sub>i<\/sub> = y<sub>i<\/sub> / Σy · 100.<\/p><table><tr><th>Xizmat turi<\/th><th>mln $<\/th><th>Ulush d<sub>i<\/sub>, %<\/th><th>d<sub>i<\/sub>²<\/th><\/tr><tr><td>Transport<\/td><td>2 794,3<\/td><td>37,5<\/td><td>1 409,6<\/td><\/tr><tr><td>Safarlar (turizm)<\/td><td>3 519,0<\/td><td>47,3<\/td><td>2 235,6<\/td><\/tr><tr><td>Telekommunikatsiya va IT<\/td><td>640,8<\/td><td>8,6<\/td><td>74,1<\/td><\/tr><tr><td>Moliyaviy xizmatlar<\/td><td>72,4<\/td><td>1,0<\/td><td>0,9<\/td><\/tr><tr><td>Boshqa xizmatlar<\/td><td>416,1<\/td><td>5,6<\/td><td>31,3<\/td><\/tr><tr><th>Jami<\/th><th>7 442,6<\/th><th>100,0<\/th><th>3 752<\/th><\/tr><\/table><p><b>2.<\/b> Eng katta ulush — safarlar (turizm) 47,3%; eng kichik — moliyaviy xizmatlar 1,0%.<\/p><p><b>3.<\/b> Herfindal–Hirshman indeksi: HHI = Σd<sub>i<\/sub>² = <b>3 752<\/b> (&gt; 2500 ⇒ yuqori konsentratsiya (past diversifikatsiya)). Ikki yetakchi tur (turizm + transport) = 84,8%.<\/p><p><b>4. Xulosa:<\/b> xizmatlar eksporti ikki an’anaviy tur — turizm va transportga (84,8%) tayanadi; zamonaviy IT (8,6%) va moliyaviy (1,0%) xizmatlar ulushi kichik. Diversifikatsiya past, bu yuqori qo‘shilgan qiymatli xizmatlarni rivojlantirish zarurligini ko‘rsatadi.<\/p>", "ans": "Jami 7 442,6 mln $; turizm 47,3%, transport 37,5%, IT 8,6%, boshqa 5,6%, moliyaviy 1,0%. HHI = 3 752 — konsentratsiya yuqori, diversifikatsiya past.", "t": "tashqi", "id": "stp-62", "src": "savdo"}, {"n": 63, "title": "Eksport tarkibi va konsentratsiyasi", "cond": "<p>Quyidagi jadvalda 2025-yilda mamlakat eksportining tarkibi berilgan:<\/p><table><tr><th>Tovar/xizmat turi<\/th><th>Qiymat (mln $)<\/th><\/tr><tr><td>Oziq-ovqat mahsulotlari<\/td><td>1 686,5<\/td><\/tr><tr><td>Sanoat mahsulotlari<\/td><td>10 010,1<\/td><\/tr><tr><td>Yoqilg‘i<\/td><td>1 202,6<\/td><\/tr><tr><td>Xizmatlar<\/td><td>4 017,8<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har bir toifaning umumiy eksportdagi ulushini (%) aniqlang.<\/li><li>Struktura konsentratsiyasini baholang.<\/li><li>Qaysi sektor ustun ekanini aniqlang.<\/li><li>Mamlakat eksportining iqtisodiy yo‘nalishi haqida xulosa chiqaring.<\/li><\/ol>", "cond_raw": "", "sol": "<p>Jami eksport: 1 686,5 + 10 010,1 + 1 202,6 + 4 017,8 = <b>16 917,0 mln $<\/b>.<\/p><table><tr><th>Toifa<\/th><th>mln $<\/th><th>Ulush, %<\/th><th>d<sub>i<\/sub>²<\/th><\/tr><tr><td>Oziq-ovqat mahsulotlari<\/td><td>1 686,5<\/td><td>10,0<\/td><td>99,4<\/td><\/tr><tr><td>Sanoat mahsulotlari<\/td><td>10 010,1<\/td><td>59,2<\/td><td>3 501,3<\/td><\/tr><tr><td>Yoqilg‘i<\/td><td>1 202,6<\/td><td>7,1<\/td><td>50,5<\/td><\/tr><tr><td>Xizmatlar<\/td><td>4 017,8<\/td><td>23,8<\/td><td>564,1<\/td><\/tr><tr><th>Jami<\/th><th>16 917,0<\/th><th>100,0<\/th><th>4 215<\/th><\/tr><\/table><p><b>2.<\/b> HHI = Σd<sub>i<\/sub>² = <b>4 215<\/b> (&gt; 2500) ⇒ yuqori konsentratsiya (past diversifikatsiya). Eng katta ulush CR<sub>1<\/sub> = 59,2%.<\/p><p><b>3.<\/b> Ustun sektor — sanoat mahsulotlari (59,2%); keyingi o‘rinda xizmatlar (23,8%).<\/p><p><b>4. Xulosa:<\/b> eksport sanoatga yo‘naltirilgan: sanoat mahsulotlari eksportning qariyb 59% ini beradi, xizmatlar 24%, oziq-ovqat 10%, yoqilg‘i 7%. Xomashyo (yoqilg‘i) ulushi kichik — ijobiy, lekin bitta sektorga bog‘liqlik yuqori.<\/p>", "ans": "Jami 16 917,0 mln $; sanoat 59,2%, xizmatlar 23,8%, oziq-ovqat 10,0%, yoqilg‘i 7,1%. HHI = 4 215 — yuqori konsentratsiya, eksport sanoatga yo‘naltirilgan.", "t": "tashqi", "id": "stp-63", "src": "savdo"}, {"n": 64, "title": "Eksportning geografik konsentratsiyasi", "cond": "<p>2025-yilda ayrim mamlakatlarga eksport hajmi quyidagicha bo‘lgan:<\/p><table><tr><th>Mamlakat<\/th><th>Eksport (mln $)<\/th><\/tr><tr><td>Panama<\/td><td>265,7<\/td><\/tr><tr><td>Tunis<\/td><td>1 318,5<\/td><\/tr><tr><td>Kuba<\/td><td>128,8<\/td><\/tr><tr><td>Kot-d’Ivuar<\/td><td>28,5<\/td><\/tr><tr><td>Chad<\/td><td>2,1<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Har bir mamlakatning umumiy eksportdagi ulushini (%) hisoblang.<\/li><li>Eng katta 2 ta mamlakat ulushi asosida konsentratsiya darajasini aniqlang.<\/li><li>Eksport geografik diversifikatsiyasini baholang.<\/li><li>Savdo hamkorlari tarkibi bo‘yicha xulosa yozing.<\/li><\/ol>", "cond_raw": "", "sol": "<p>Jami: 265,7 + 1 318,5 + 128,8 + 28,5 + 2,1 = <b>1 743,6 mln $<\/b>.<\/p><table><tr><th>Mamlakat<\/th><th>mln $<\/th><th>Ulush, %<\/th><th>d<sub>i<\/sub>²<\/th><\/tr><tr><td>Panama<\/td><td>265,7<\/td><td>15,2<\/td><td>232,2<\/td><\/tr><tr><td>Tunis<\/td><td>1 318,5<\/td><td>75,6<\/td><td>5 718,3<\/td><\/tr><tr><td>Kuba<\/td><td>128,8<\/td><td>7,4<\/td><td>54,6<\/td><\/tr><tr><td>Kot-d’Ivuar<\/td><td>28,5<\/td><td>1,6<\/td><td>2,7<\/td><\/tr><tr><td>Chad<\/td><td>2,1<\/td><td>0,1<\/td><td>0,0<\/td><\/tr><tr><th>Jami<\/th><th>1 743,6<\/th><th>100,0<\/th><th>6 008<\/th><\/tr><\/table><p><b>2.<\/b> Konsentratsiya koeffitsienti CR<sub>2<\/sub> = Tunis + Panama = 75,6 + 15,2 = <b>90,9%<\/b> — juda yuqori konsentratsiya.<\/p><p><b>3.<\/b> HHI = <b>6 008<\/b> (&gt; 2500) ⇒ geografik diversifikatsiya past.<\/p><p><b>4. Xulosa:<\/b> eksportning 76% i bitta hamkorga (Tunis) to‘g‘ri keladi; Kot-d’Ivuar va Chad ulushi juda kichik. Bitta bozorga qaramlik xavfi yuqori — hamkorlar tarkibini kengaytirish lozim.<\/p>", "ans": "Jami 1 743,6 mln $; Tunis 75,6%, Panama 15,2%, Kuba 7,4%, Kot-d’Ivuar 1,6%, Chad 0,1%. CR<sub>2<\/sub> = 90,9%, HHI = 6 008 — diversifikatsiya past.", "t": "tashqi", "id": "stp-64", "src": "savdo"}, {"n": 65, "title": "Turizm xizmatlari importi dinamikasi", "cond": "<p>Quyidagi jadvalda turizm xizmatlari importi hajmi berilgan:<\/p><table><tr><th>Yil<\/th><th>Safarlar (mlrd $)<\/th><\/tr><tr><td>2019<\/td><td>1 241,1<\/td><\/tr><tr><td>2020<\/td><td>1 313,0<\/td><\/tr><tr><td>2021<\/td><td>1 255,8<\/td><\/tr><tr><td>2022<\/td><td>1 422,1<\/td><\/tr><tr><td>2023<\/td><td>1 609,8<\/td><\/tr><tr><td>2024<\/td><td>2 143,1<\/td><\/tr><tr><td>2025<\/td><td>3 519,0<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Zanjirli o‘sish sur’atlarini hisoblang.<\/li><li>Har yil uchun mutlaq o‘sishni aniqlang.<\/li><li>Eng yuqori o‘sish qaysi davrda kuzatilganini aniqlang.<\/li><li>Turizm xizmatlari rivojlanish trendini izohlang.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>Formulalar:<\/b> Δ<sub>z<\/sub> = y<sub>i<\/sub> − y<sub>i−1<\/sub>; T<sub>z<\/sub> = y<sub>i<\/sub> / y<sub>i−1<\/sub> · 100; K<sub>z<\/sub> = T<sub>z<\/sub> − 100.<\/p><table><tr><th>Yil<\/th><th>Import<\/th><th>Δ<sub>z<\/sub><\/th><th>T<sub>z<\/sub>, %<\/th><th>K<sub>z<\/sub>, %<\/th><\/tr><tr><td>2019<\/td><td>1 241,1<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2020<\/td><td>1 313,0<\/td><td>+71,9<\/td><td>105,8<\/td><td>+5,8<\/td><\/tr><tr><td>2021<\/td><td>1 255,8<\/td><td>−57,2<\/td><td>95,6<\/td><td>−4,4<\/td><\/tr><tr><td>2022<\/td><td>1 422,1<\/td><td>+166,3<\/td><td>113,2<\/td><td>+13,2<\/td><\/tr><tr><td>2023<\/td><td>1 609,8<\/td><td>+187,7<\/td><td>113,2<\/td><td>+13,2<\/td><\/tr><tr><td>2024<\/td><td>2 143,1<\/td><td>+533,3<\/td><td>133,1<\/td><td>+33,1<\/td><\/tr><tr><td>2025<\/td><td>3 519,0<\/td><td>+1 375,9<\/td><td>164,2<\/td><td>+64,2<\/td><\/tr><\/table><p><b>3.<\/b> Eng yuqori o‘sish — <b>2025-yilda<\/b> (2024-yilga nisbatan): T = 164,2%, Δ = +1 375,9. Yagona pasayish — 2021-yil (95,6%).<\/p><p>O‘rtacha yillik o‘sish sur’ati: T̄ = ⁶√(3519,0 / 1241,1) · 100 = <b>119,0%<\/b>; o‘rtacha mutlaq o‘sish = (3519,0 − 1241,1) / 6 = 379,7.<\/p><p><i>Izoh: manbada birlik “mlrd $” deb berilgan; 62-topshiriqda xuddi shu 3519,0 qiymati mln $ da — ehtimol mln $. Sur’atlar birlikka bog‘liq emas.<\/i><\/p><p><b>4. Trend:<\/b> 2021-yildagi pasayishdan (pandemiya ta’siri) so‘ng import tezlashib o‘smoqda: 2023-yil +13,2%, 2024-yil +33,1%, 2025-yil +64,2%. Trend o‘suvchi va tezlanuvchi (eksponensial xarakterga yaqin).<\/p>", "ans": "Eng yuqori o‘sish 2025-yilda: +1 375,9 (164,2%); yagona pasayish 2021-yilda. 2019–2025-yillarda o‘rtacha yillik o‘sish 119,0%; trend o‘suvchi va tezlashuvchi.", "t": "tashqi", "id": "stp-65", "src": "savdo"}, {"n": 66, "title": "MDH davlatlari eksport tarkibi", "cond": "<p>MDH davlatlarining eksport ko‘rsatkichi (2025-y.)<\/p><table><tr><th>Mamlakatlar<\/th><th>Eksport mln AQSH doll.<\/th><th>Ulushi, %<\/th><\/tr><tr><td>Ozarbayjon<\/td><td>25 992,0<\/td><td><\/td><\/tr><tr><td>Armaniston<\/td><td>13 216,9<\/td><td><\/td><\/tr><tr><td>O‘zbekiston (1-qator)<\/td><td>39 510,1<\/td><td><\/td><\/tr><tr><td>Qozog‘iston<\/td><td>78 979,4<\/td><td><\/td><\/tr><tr><td>Qirg‘iziston<\/td><td>4 922,3<\/td><td><\/td><\/tr><tr><td>Moldova<\/td><td>3 014,5<\/td><td><\/td><\/tr><tr><td>Rossiya<\/td><td>433 634,0<\/td><td><\/td><\/tr><tr><td>Tojikiston<\/td><td>1 422,9<\/td><td><\/td><\/tr><tr><td>O‘zbekiston<\/td><td>19 626,1<\/td><td><\/td><\/tr><tr><th>Jami<\/th><th>617 318,2<\/th><th><\/th><\/tr><\/table><p>Aniqlang:<\/p><ol><li>MDH mamlakatlari bo‘yicha eksport ulushini aniqlang.<\/li><li>Olingan natijalar bo‘yicha xulosalar qiling.<\/li><\/ol>", "cond_raw": "", "sol": "<p>Ulush d<sub>i<\/sub> = Eksport<sub>i<\/sub> / Jami · 100. Tekshiruv: qatorlar yig‘indisi = <b>620 318,2<\/b> mln $, jadvaldagi “Jami” esa 617 318,2 (farq 3 000,0). Ulushlar yig‘indisi 100% bo‘lishi uchun qatorlar yig‘indisi (620 318,2) asos qilib olindi.<\/p><table><tr><th>Mamlakat<\/th><th>mln $<\/th><th>Ulush, %<\/th><\/tr><tr><td>Ozarbayjon<\/td><td>25 992,0<\/td><td>4,19<\/td><\/tr><tr><td>Armaniston<\/td><td>13 216,9<\/td><td>2,13<\/td><\/tr><tr><td>O‘zbekiston (1-qator)<\/td><td>39 510,1<\/td><td>6,37<\/td><\/tr><tr><td>Qozog‘iston<\/td><td>78 979,4<\/td><td>12,73<\/td><\/tr><tr><td>Qirg‘iziston<\/td><td>4 922,3<\/td><td>0,79<\/td><\/tr><tr><td>Moldova<\/td><td>3 014,5<\/td><td>0,49<\/td><\/tr><tr><td>Rossiya<\/td><td>433 634,0<\/td><td>69,91<\/td><\/tr><tr><td>Tojikiston<\/td><td>1 422,9<\/td><td>0,23<\/td><\/tr><tr><td>O‘zbekiston<\/td><td>19 626,1<\/td><td>3,16<\/td><\/tr><tr><th>Jami<\/th><th>620 318,2<\/th><th>100,00<\/th><\/tr><\/table><p><i>Izoh: manbada “O‘zbekiston” ikki marta yozilgan; birinchi qator hajmi bo‘yicha Belarusga mos keladi (ehtimol xato). Hisob jadvaldagi tartibda bajarildi; O‘zbekiston uchun oxirgi qator olindi. Manbadagi “Jami” qatorlar yig‘indisidan 3 000,0 ga farq qiladi — jadvaldagi xato.<\/i><\/p><p><b>Xulosa:<\/b> MDH eksportida Rossiya keskin ustun (69,9%); keyingi o‘rinlarda Qozog‘iston (12,7%) va O‘zbekiston (1-qator) (6,4%). Uchta yetakchi mamlakat ulushi 89,0%. O‘zbekiston ulushi 3,16% (5-o‘rin). Tarkib yuqori darajada konsentratsiyalashgan.<\/p>", "ans": "Rossiya 69,9%, Qozog‘iston 12,7%, O‘zbekiston (1-qator) 6,4%; O‘zbekiston 3,16%. MDH eksporti Rossiyada yuqori konsentratsiyalashgan.", "t": "tashqi", "id": "stp-66", "src": "savdo"}, {"n": 67, "title": "MDH davlatlari import tarkibi", "cond": "<p>MDH davlatlarining import ko‘rsatkichi (2025-y.)<\/p><table><tr><th>Mamlakatlar<\/th><th>Import mln AQSH doll.<\/th><th>Ulushi, %<\/th><\/tr><tr><td>Ozarbayjon<\/td><td>17 167,1<\/td><td><\/td><\/tr><tr><td>Armaniston<\/td><td>15 411,9<\/td><td><\/td><\/tr><tr><td>O‘zbekiston (1-qator)<\/td><td>44 220,6<\/td><td><\/td><\/tr><tr><td>Qozog‘iston<\/td><td>61 765,4<\/td><td><\/td><\/tr><tr><td>Qirg‘iziston<\/td><td>11 414,9<\/td><td><\/td><\/tr><tr><td>Moldova<\/td><td>8 633,4<\/td><td><\/td><\/tr><tr><td>Rossiya<\/td><td>301 548,1<\/td><td><\/td><\/tr><tr><td>Tojikiston<\/td><td>5 936,3<\/td><td><\/td><\/tr><tr><td>O‘zbekiston<\/td><td>33 160,0<\/td><td><\/td><\/tr><tr><th>Jami<\/th><th>499 257,7<\/th><th><\/th><\/tr><\/table><p>Aniqlang:<\/p><ol><li>MDH mamlakatlari bo‘yicha import ulushini aniqlang.<\/li><li>Olingan natijalar bo‘yicha xulosalar qiling.<\/li><\/ol>", "cond_raw": "", "sol": "<p>Ulush d<sub>i<\/sub> = Import<sub>i<\/sub> / Jami · 100. Tekshiruv: qatorlar yig‘indisi = 499 257,7 mln $ (jami 499 257,7 bilan mos).<\/p><table><tr><th>Mamlakat<\/th><th>mln $<\/th><th>Ulush, %<\/th><\/tr><tr><td>Ozarbayjon<\/td><td>17 167,1<\/td><td>3,44<\/td><\/tr><tr><td>Armaniston<\/td><td>15 411,9<\/td><td>3,09<\/td><\/tr><tr><td>O‘zbekiston (1-qator)<\/td><td>44 220,6<\/td><td>8,86<\/td><\/tr><tr><td>Qozog‘iston<\/td><td>61 765,4<\/td><td>12,37<\/td><\/tr><tr><td>Qirg‘iziston<\/td><td>11 414,9<\/td><td>2,29<\/td><\/tr><tr><td>Moldova<\/td><td>8 633,4<\/td><td>1,73<\/td><\/tr><tr><td>Rossiya<\/td><td>301 548,1<\/td><td>60,40<\/td><\/tr><tr><td>Tojikiston<\/td><td>5 936,3<\/td><td>1,19<\/td><\/tr><tr><td>O‘zbekiston<\/td><td>33 160,0<\/td><td>6,64<\/td><\/tr><tr><th>Jami<\/th><th>499 257,7<\/th><th>100,00<\/th><\/tr><\/table><p><i>Izoh: manbada “O‘zbekiston” ikki marta yozilgan; birinchi qator hajmi bo‘yicha Belarusga mos keladi (ehtimol xato). Hisob jadvaldagi tartibda bajarildi; O‘zbekiston uchun oxirgi qator olindi.<\/i><\/p><p><b>Xulosa:<\/b> MDH importida Rossiya keskin ustun (60,4%); keyingi o‘rinlarda Qozog‘iston (12,4%) va O‘zbekiston (1-qator) (8,9%). Uchta yetakchi mamlakat ulushi 81,6%. O‘zbekiston ulushi 6,64% (4-o‘rin). Tarkib yuqori darajada konsentratsiyalashgan.<\/p>", "ans": "Rossiya 60,4%, Qozog‘iston 12,4%, O‘zbekiston (1-qator) 8,9%; O‘zbekiston 6,64%. MDH importi Rossiyada yuqori konsentratsiyalashgan.", "t": "tashqi", "id": "stp-67", "src": "savdo"}, {"n": 68, "title": "Bojxona postlari: rejaning bajarilishi", "cond": "<p>O‘zbekiston bojxona postlari bo‘yicha QQS yig‘imi ma’lumotlari (shartli ravishda 2025-yil uchun, mln so‘m):<\/p><table><tr><th>Bojxona postlari<\/th><th>Bazis davr<\/th><th>Reja topshirig‘i<\/th><th>Hisobot davri<\/th><\/tr><tr><td>Toshkent-Aero<\/td><td>185 000<\/td><td>195 000<\/td><td>201 500<\/td><\/tr><tr><td>Toshkent-Tovar<\/td><td>142 000<\/td><td>150 000<\/td><td>154 800<\/td><\/tr><tr><td>Samarqand<\/td><td>98 000<\/td><td>105 000<\/td><td>108 600<\/td><\/tr><tr><td>Andijon<\/td><td>87 500<\/td><td>92 000<\/td><td>95 100<\/td><\/tr><tr><td>Termiz<\/td><td>76 400<\/td><td>81 000<\/td><td>83 650<\/td><\/tr><tr><td>Navoiy<\/td><td>69 300<\/td><td>72 000<\/td><td>74 800<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Bojxona postlari bo‘yicha QQS yig‘imi rejasining bajarilish darajasini aniqlang.<\/li><li>Hisoblangan ma’lumotlar bo‘yicha xulosalar qiling.<\/li><\/ol>", "cond_raw": "", "sol": "<p><b>Formulalar:<\/b> reja topshirig‘i nisbiy miqdori = Reja / Bazis · 100; reja bajarilishi = Hisobot / Reja · 100; dinamika = Hisobot / Bazis · 100. Bog‘lanish: dinamika = reja topshirig‘i · reja bajarilishi.<\/p><p>Masalan, Toshkent-Aero: reja bajarilishi = 201 500 / 195 000 · 100 = 103,3%.<\/p><table><tr><th>Post<\/th><th>Bazis<\/th><th>Reja<\/th><th>Hisobot<\/th><th>Reja topshirig‘i, %<\/th><th>Reja bajarilishi, %<\/th><th>Dinamika, %<\/th><th>Rejadan ortiq, mln so‘m<\/th><\/tr><tr><td>Toshkent-Aero<\/td><td>185 000<\/td><td>195 000<\/td><td>201 500<\/td><td>105,4<\/td><td>103,3<\/td><td>108,9<\/td><td>+6 500<\/td><\/tr><tr><td>Toshkent-Tovar<\/td><td>142 000<\/td><td>150 000<\/td><td>154 800<\/td><td>105,6<\/td><td>103,2<\/td><td>109,0<\/td><td>+4 800<\/td><\/tr><tr><td>Samarqand<\/td><td>98 000<\/td><td>105 000<\/td><td>108 600<\/td><td>107,1<\/td><td>103,4<\/td><td>110,8<\/td><td>+3 600<\/td><\/tr><tr><td>Andijon<\/td><td>87 500<\/td><td>92 000<\/td><td>95 100<\/td><td>105,1<\/td><td>103,4<\/td><td>108,7<\/td><td>+3 100<\/td><\/tr><tr><td>Termiz<\/td><td>76 400<\/td><td>81 000<\/td><td>83 650<\/td><td>106,0<\/td><td>103,3<\/td><td>109,5<\/td><td>+2 650<\/td><\/tr><tr><td>Navoiy<\/td><td>69 300<\/td><td>72 000<\/td><td>74 800<\/td><td>103,9<\/td><td>103,9<\/td><td>107,9<\/td><td>+2 800<\/td><\/tr><tr><th>Jami<\/th><th>658 200<\/th><th>695 000<\/th><th>718 450<\/th><th>105,6<\/th><th>103,4<\/th><th>109,2<\/th><th>+23 450<\/th><\/tr><\/table><p>Tekshiruv (jami): 1,0559 · 1,0337 = 1,0915.<\/p><p><b>Xulosa:<\/b> barcha postlarda reja ortig‘i bilan bajarilgan; jami bo‘yicha 103,4% (rejadan +23 450 mln so‘m). Eng yuqori bajarilish — Navoiy (103,9%), eng pasti — Toshkent-Tovar (103,2%). QQS yig‘imi bazisga nisbatan 9,2% ga o‘sgan.<\/p>", "ans": "Jami reja bajarilishi 103,4% (+23 450 mln so‘m), barcha postlarda 103–104% atrofida; eng yuqori Navoiy (103,9%). Bazisga nisbatan o‘sish 109,2%.", "t": "tashqi", "id": "stp-68", "src": "savdo"}, {"n": 69, "title": "Egri chiziqli bog‘lanish: parabola va korrelyatsiya indeksi", "cond": "<p>Oilalar bo‘yicha jon boshiga to‘g‘ri keladigan daromad va iste’mol qilingan non mahsulotlari to‘g‘risida quyidagi ma’lumotlar keltirilgan:<\/p><table><tr><th>Jon boshiga o‘rtacha oylik daromad, mln so‘m<\/th><th>2 gacha<\/th><th>2–4<\/th><th>4–6<\/th><th>6–8<\/th><th>8 va yuqori<\/th><\/tr><tr><td>Non mahsulotlari iste’moli, kg<\/td><td>10<\/td><td>14<\/td><td>18<\/td><td>13<\/td><td>12<\/td><\/tr><\/table><p>Jon boshiga to‘g‘ri keladigan o‘rtacha daromad va iste’mol qilingan non mahsulotlari o‘rtasidagi o‘zaro bog‘lanishning analitik ifodasini tuzing va bog‘lanish zichligini aniqlang.<\/p>", "cond_raw": "", "sol": "<p>Interval o‘rtalari: x = 1; 3; 5; 7; 9 (ochiq intervallar 0–2 va 8–10 deb olindi). Iste’mol avval o‘sib, keyin kamayadi ⇒ bog‘lanish <b>egri chiziqli<\/b>, ikkinchi tartibli parabola tanlanadi: ŷ = a + bx + cx².<\/p><table><tr><th>x<\/th><th>y<\/th><th>x²<\/th><th>x³<\/th><th>x⁴<\/th><th>xy<\/th><th>x²y<\/th><th>ŷ<\/th><th>(y − ŷ)²<\/th><th>(y − ȳ)²<\/th><\/tr><tr><td>1<\/td><td>10<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>10<\/td><td>10<\/td><td>10,09<\/td><td>0,007<\/td><td>11,56<\/td><\/tr><tr><td>3<\/td><td>14<\/td><td>9<\/td><td>27<\/td><td>81<\/td><td>42<\/td><td>126<\/td><td>14,46<\/td><td>0,209<\/td><td>0,36<\/td><\/tr><tr><td>5<\/td><td>18<\/td><td>25<\/td><td>125<\/td><td>625<\/td><td>90<\/td><td>450<\/td><td>16,11<\/td><td>3,556<\/td><td>21,16<\/td><\/tr><tr><td>7<\/td><td>13<\/td><td>49<\/td><td>343<\/td><td>2401<\/td><td>91<\/td><td>637<\/td><td>15,06<\/td><td>4,232<\/td><td>0,16<\/td><\/tr><tr><td>9<\/td><td>12<\/td><td>81<\/td><td>729<\/td><td>6561<\/td><td>108<\/td><td>972<\/td><td>11,29<\/td><td>0,510<\/td><td>1,96<\/td><\/tr><tr><th>Σ 25<\/th><th>67<\/th><th>165<\/th><th>1225<\/th><th>9669<\/th><th>341<\/th><th>2195<\/th><th>67,00<\/th><th>8,514<\/th><th>35,20<\/th><\/tr><\/table><p><b>Normal tenglamalar sistemasi:<\/b><br>na + bΣx + cΣx² = Σy ⇒ 5a + 25b + 165c = 67<br>aΣx + bΣx² + cΣx³ = Σxy ⇒ 25a + 165b + 1225c = 341<br>aΣx² + bΣx³ + cΣx⁴ = Σx²y ⇒ 165a + 1225b + 9669c = 2195<\/p><p>Yechim: a = 6,882, b = 3,543, c = −0,3393 ⇒ <b>ŷ = 6,882 + 3,543x − 0,3393x²<\/b>.<\/p><p>Maksimum nuqta: x = −b / 2c = 5,22 mln so‘m — shu daromadgacha non iste’moli o‘sadi, keyin kamayadi.<\/p><p><b>Bog‘lanish zichligi — korrelyatsiya indeksi:<\/b> ȳ = 67 / 5 = 13,4; R = √(1 − Σ(y − ŷ)² / Σ(y − ȳ)²) = √(1 − 8,514 / 35,20) = <b>0,871<\/b>; R² = 0,758.<\/p><p>Taqqoslash uchun chiziqli korrelyatsiya koeffitsienti r = 0,160 — chiziqli model bog‘lanishni deyarli ko‘rsatmaydi.<\/p><p><i>Izoh: shartda “o‘rtacha yillik daromad” deyilgan, jadvalda esa oylik daromad berilgan; jadval ma’lumotlari ishlatildi.<\/i><\/p><p><b>Xulosa:<\/b> daromad ~5,2 mln so‘mgacha oshganda non iste’moli ortadi, undan yuqori daromadda kamayadi (non boshqa mahsulotlar bilan almashtiriladi). R = 0,87 — bog‘lanish o‘rtacha zichlikda; non iste’moli variatsiyasining 75,8% i daromad bilan izohlanadi.<\/p>", "ans": "Parabola ŷ = 6,882 + 3,543x − 0,3393x² (maksimum x ≈ 5,22 mln so‘m). Korrelyatsiya indeksi R = 0,871, R² = 0,758; chiziqli r = 0,160 — bog‘lanish egri chiziqli.", "t": "umumiy", "id": "stp-69", "src": "savdo"}, {"n": 70, "title": "Chiziqli regressiya va korrelyatsiya", "cond": "<p>Savdo korxonasida sotilgan tovarlar hajmi va tovar birligiga to‘g‘ri keladigan sotish xarajatlari haqida quyidagi ma’lumotlar keltirilgan:<\/p><table><tr><th>Sotilgan tovarlar hajmi, ming dona<\/th><th>3,5<\/th><th>4,0<\/th><th>5,5<\/th><th>6,0<\/th><th>6,5<\/th><th>7,5<\/th><th>8,0<\/th><\/tr><tr><td>Tovar birligiga sotish xarajati, ming so‘m<\/td><td>3,1<\/td><td>3,0<\/td><td>2,9<\/td><td>2,7<\/td><td>2,5<\/td><td>2,4<\/td><td>2,2<\/td><\/tr><\/table><p>Aniqlang:<\/p><ol><li>Sotilgan tovarlar hajmi va tovar birligiga to‘g‘ri keladigan sotish xarajatlari o‘rtasidagi bog‘liqlik shaklini;<\/li><li>Bog‘lanish zichligini;<\/li><li>Determinatsiya koeffitsiyentini va korrelyatsiya indeksini.<\/li><\/ol>", "cond_raw": "", "sol": "<p>x — sotilgan hajm (omil), y — birlik xarajati (natija). Hajm ortishi bilan y bir tekis kamayadi ⇒ teskari, chiziqli shaklga yaqin bog‘lanish: ŷ = a + bx.<\/p><table><tr><th>x<\/th><th>y<\/th><th>x²<\/th><th>xy<\/th><th>y²<\/th><th>ŷ<\/th><th>(y − ŷ)²<\/th><\/tr><tr><td>3,5<\/td><td>3,1<\/td><td>12,25<\/td><td>10,85<\/td><td>9,61<\/td><td>3,142<\/td><td>0,0018<\/td><\/tr><tr><td>4,0<\/td><td>3,0<\/td><td>16,00<\/td><td>12,00<\/td><td>9,00<\/td><td>3,045<\/td><td>0,0021<\/td><\/tr><tr><td>5,5<\/td><td>2,9<\/td><td>30,25<\/td><td>15,95<\/td><td>8,41<\/td><td>2,755<\/td><td>0,0211<\/td><\/tr><tr><td>6,0<\/td><td>2,7<\/td><td>36,00<\/td><td>16,20<\/td><td>7,29<\/td><td>2,658<\/td><td>0,0018<\/td><\/tr><tr><td>6,5<\/td><td>2,5<\/td><td>42,25<\/td><td>16,25<\/td><td>6,25<\/td><td>2,561<\/td><td>0,0037<\/td><\/tr><tr><td>7,5<\/td><td>2,4<\/td><td>56,25<\/td><td>18,00<\/td><td>5,76<\/td><td>2,368<\/td><td>0,0011<\/td><\/tr><tr><td>8,0<\/td><td>2,2<\/td><td>64,00<\/td><td>17,60<\/td><td>4,84<\/td><td>2,271<\/td><td>0,0050<\/td><\/tr><tr><th>Σ 41,0<\/th><th>18,8<\/th><th>257,00<\/th><th>106,85<\/th><th>51,16<\/th><th>18,800<\/th><th>0,0365<\/th><\/tr><\/table><p><b>1. Parametrlar (EKKU):<\/b> b = (nΣxy − ΣxΣy) / (nΣx² − (Σx)²) = (7 · 106,85 − 41,0 · 18,8) / (7 · 257,00 − 41,0²) = <b>−0,1936<\/b>; a = ȳ − bx̄ = 2,6857 − (−0,1936) · 5,8571 = <b>3,8199<\/b>.<br><b>ŷ = 3,820 − 0,194x<\/b>: hajm 1 ming donaga oshsa, birlik xarajati o‘rtacha 0,194 ming so‘mga kamayadi. Elastiklik E = b · x̄ / ȳ = −0,42.<\/p><p><b>2. Zichlik — chiziqli korrelyatsiya koeffitsienti:<\/b> r = (nΣxy − ΣxΣy) / √((nΣx² − (Σx)²)(nΣy² − (Σy)²)) = <b>−0,972<\/b> — teskari, juda zich bog‘lanish.<\/p><p><b>3.<\/b> Determinatsiya koeffitsienti: r² = <b>0,945<\/b> (94,5%). Korrelyatsiya indeksi: R = √(1 − Σ(y − ŷ)² / Σ(y − ȳ)²) = √(1 − 0,0365 / 0,6686) = <b>0,972<\/b> (chiziqli modelda R = |r|).<\/p><p>Taqqoslash: giperbola ŷ = a + b/x uchun ŷ = 1,750 + 5,051/x, R = 0,915 — chiziqli modeldan past, shuning uchun chiziqli shakl tanlanadi.<\/p><p><b>Xulosa:<\/b> sotuv hajmi oshishi bilan birlik xarajati kamayadi (shartli-doimiy xarajatlar tejami). Birlik xarajati variatsiyasining 94,5% i sotilgan hajm bilan izohlanadi.<\/p>", "ans": "ŷ = 3,820 − 0,194x; r = −0,972 (teskari, juda zich), r² = 0,945, korrelyatsiya indeksi R = 0,972. Hajm oshsa birlik xarajati kamayadi.", "t": "umumiy", "id": "stp-70", "src": "savdo"}, {"n": 1, "part": 2, "title": "O‘zgaruvchilar turi va o‘lchov shkalasi", "cond": "<p>Quyidagi o‘zgaruvchilarning har birini aniqlang: (a) kategorik yoki miqdoriy; (b) o‘lchov shkalasi (nominal, tartib, interval, nisbiy); (c) miqdoriy bo‘lsa — diskret yoki uzluksiz.<\/p><table><tr><th>№<\/th><th>O‘zgaruvchi<\/th><\/tr><tr><td>1<\/td><td>Viloyat nomi<\/td><\/tr><tr><td>2<\/td><td>Oylik ish haqi, ming so‘m<\/td><\/tr><tr><td>3<\/td><td>Ta’lim darajasi (o‘rta / o‘rta maxsus / oliy)<\/td><\/tr><tr><td>4<\/td><td>Oiladagi bolalar soni<\/td><\/tr><tr><td>5<\/td><td>Havo harorati, °C<\/td><\/tr><tr><td>6<\/td><td>Mijozlar qoniqishi bahosi (1 dan 5 gacha shkala)<\/td><\/tr><tr><td>7<\/td><td>Ish staji, yil<\/td><\/tr><tr><td>8<\/td><td>Korxonaning STIR raqami<\/td><\/tr><\/table>", "sol": "<table><tr><th>№<\/th><th>O‘zgaruvchi<\/th><th>(a) Turi<\/th><th>(b) Shkala<\/th><th>(c) Diskret / uzluksiz<\/th><\/tr><tr><td>1<\/td><td>Viloyat nomi<\/td><td>kategorik<\/td><td>nominal<\/td><td>—<\/td><\/tr><tr><td>2<\/td><td>Oylik ish haqi<\/td><td>miqdoriy<\/td><td>nisbiy<\/td><td>uzluksiz<\/td><\/tr><tr><td>3<\/td><td>Ta’lim darajasi<\/td><td>kategorik<\/td><td>tartib<\/td><td>—<\/td><\/tr><tr><td>4<\/td><td>Oiladagi bolalar soni<\/td><td>miqdoriy<\/td><td>nisbiy<\/td><td>diskret<\/td><\/tr><tr><td>5<\/td><td>Havo harorati, °C<\/td><td>miqdoriy<\/td><td>interval (absolyut nol yo‘q)<\/td><td>uzluksiz<\/td><\/tr><tr><td>6<\/td><td>Qoniqish bahosi (1–5)<\/td><td>kategorik (tartibli)<\/td><td>tartib<\/td><td>—<\/td><\/tr><tr><td>7<\/td><td>Ish staji, yil<\/td><td>miqdoriy<\/td><td>nisbiy<\/td><td>uzluksiz (butun yillarda sanalsa — diskret)<\/td><\/tr><tr><td>8<\/td><td>STIR raqami<\/td><td>kategorik (identifikator)<\/td><td>nominal<\/td><td>—<\/td><\/tr><\/table><p><b>Qoida:<\/b> nominal — faqat nomlash (=, ≠); tartib — tartiblash mumkin (&lt;, &gt;), lekin farqlar teng emas; interval — farqlar ma’noli, ammo absolyut nol yo‘q (20 °C 10 °C dan “ikki marta issiq” emas); nisbiy — absolyut nol bor, nisbatlar ma’noli (10 mln 5 mln dan 2 marta ko‘p).<\/p><p>STIR raqamlardan iborat bo‘lsa ham, u bilan arifmetik amal ma’nosiz — bu faqat identifikator, ya’ni nominal belgi.<\/p>", "ans": "Nominal: viloyat nomi, STIR; tartib: ta’lim darajasi, qoniqish bahosi; interval: harorat (°C); nisbiy: ish haqi, bolalar soni (diskret), ish staji.", "t": "asos", "status": "ok", "note": "", "id": "sm-1", "src": "stat"}, {"n": 2, "part": 2, "title": "O‘rtacha, mediana va moda (chetki qiymat ta’siri)", "cond": "<p>Korxonaning 10 nafar xodimi oylik ish haqi (mln so‘m): 5; 5; 5; 5; 5; 5; 5; 5; 7; 48 (oxirgisi — direktor).<\/p><p>a) O‘rtacha, mediana va modani toping.<\/p><p>b) Reklama bukletida “bizda o‘rtacha ish haqi 9,5 mln so‘m” deb yozildi. Bu xulosa nega chalg‘ituvchi? Qaysi ko‘rsatkich “odatiy” ish haqini yaxshiroq ifodalaydi?<\/p>", "sol": "<p><b>a)<\/b> O‘rtacha: x̄ = Σx / n = (8·5 + 7 + 48) / 10 = 95 / 10 = <b>9,5 mln so‘m<\/b>.<\/p><p>Mediana: n = 10 (juft), tartiblangan qatorda 5- va 6-qiymatlar: Me = (5 + 5) / 2 = <b>5 mln so‘m<\/b>.<\/p><p>Moda: eng ko‘p takrorlangan qiymat (8 marta) — <b>Mo = 5 mln so‘m<\/b>.<\/p><p><b>b)<\/b> 10 xodimdan 9 nafari 5–7 mln so‘m oladi; faqat direktorning 48 mln so‘mlik maoshi (chetki qiymat) o‘rtachani 9,5 mln ga ko‘taradi. Natijada xodimlarning 90 foizi “o‘rtacha”dan kam oladi — e’lon chalg‘ituvchi. Taqsimot o‘ngga kuchli og‘ishgan (x̄ &gt; Me = Mo), shuning uchun “odatiy” ish haqini <b>mediana<\/b> (va moda) yaxshiroq ifodalaydi.<\/p>", "ans": "x̄ = 9,5 mln, Me = Mo = 5 mln so‘m. Bitta chetki qiymat o‘rtachani sun’iy oshiradi; odatiy ish haqini mediana (5 mln so‘m) ko‘rsatadi.", "t": "ortacha", "status": "ok", "note": "", "id": "sm-2", "src": "stat"}, {"n": 3, "part": 2, "title": "O‘sish sur’atlari va o‘rtacha yillik o‘sish", "cond": "<p>Eksport hajmi 2023-yilda 2022-yilga nisbatan 20% ga oshdi, 2024-yilda esa 2023-yilga nisbatan 20% ga kamaydi.<\/p><p>a) 2024-yil darajasi 2022-yilga nisbatan necha foiz o‘zgargan?<\/p><p>b) O‘sish sur’atlarining oddiy arifmetik o‘rtachasi (0%) bu holatda nega noto‘g‘ri xulosa beradi? c) Ikki yillik o‘rtacha yillik o‘sish sur’atini toping.<\/p>", "sol": "<p><b>a)<\/b> 2022-yil darajasini 100 deb olamiz: 2023-yil = 100 · 1,20 = 120; 2024-yil = 120 · 0,80 = 96.<\/p><p>2024/2022 = 96 / 100 · 100% = 96% → eksport <b>4% ga kamaygan<\/b> (zanjir koeffitsientlari ko‘paytmasi: 1,20 · 0,80 = 0,96).<\/p><p><b>b)<\/b> +20% va −20% ning arifmetik o‘rtachasi 0% “daraja o‘zgarmadi” degan xulosani beradi, lekin aslida daraja 4% tushgan. Sabab: −20% kattaroq baza (120) dan olinadi. O‘sish sur’atlari qo‘shilmaydi, balki <b>ko‘paytiriladi<\/b>, shuning uchun o‘rtacha sur’at geometrik o‘rtacha bilan topiladi.<\/p><p><b>c)<\/b> T̄ = √(K₁ · K₂) = √(1,20 · 0,80) = √0,96 = 0,9798 → o‘rtacha yillik o‘sish sur’ati 97,98%, qo‘shimcha o‘sish sur’ati <b>-2,02%<\/b>.<\/p><p>Tekshiruv: 100 · 0,9798² = 96 ✓<\/p>", "ans": "Ikki yilda eksport 4% ga kamaygan; o‘rtacha yillik o‘sish sur’ati geometrik o‘rtacha bo‘yicha ≈ 97,98%, ya’ni yiliga ≈ −2,02%.", "t": "dinamika", "status": "ok", "note": "", "id": "sm-3", "src": "stat"}, {"n": 4, "part": 2, "title": "Sterdjess formulasi va teng intervalli guruhlash", "cond": "<p>30 ta savdo korxonasining oylik tovar aylanmasi (mln so‘m) bo‘yicha ma’lumotlar berilgan:<\/p><p>12,4; 18,1; 25,3; 9,8; 14,6; 31,2; 22,7; 16,9; 27,5; 11,3; 19,8; 35,4; 23,1; 13,7; 28,9; 17,2; 21,5; 10,6; 33,0; 24,8; 15,4; 20,3; 29,6; 12,9; 18,8; 26,4; 14,1; 22,0; 30,5; 19,2.<\/p><p>a) Sterdjess formulasi bo‘yicha guruhlar sonini aniqlang.<\/p><p>b) Teng intervalli guruhlash tuzing (interval kengligi 4,5; birinchi guruhning quyi chegarasi — 9,0; yuqori chegara kiritilmaydi): chastota, ulush (%) va jamg‘arma chastotalarni hisoblang.<\/p><p>c) Xulosa yozing: tovar aylanmasi asosan qaysi oraliqda to‘plangan?<\/p>", "sol": "<p><b>a)<\/b> Sterdjess formulasi: k = 1 + 3,322 · lg n = 1 + 3,322 · lg 30 = 1 + 3,322 · 1,4771 = 5,91 ≈ <b>6 ta guruh<\/b>.<\/p><p>(Tekshiruv: (x<sub>max<\/sub> − x<sub>min<\/sub>) / k = (35,4 − 9,8) / 6 ≈ 4,27; shartdagi h = 4,5 bilan 6 ta interval 9,0–36,0 ni, ya’ni barcha qiymatlarni qamraydi.)<\/p><p><b>b)<\/b> Intervallar: 9,0 dan boshlab har biri 4,5 ga; yuqori chegara guruhga kiritilmaydi [a; b).<\/p><table><tr><th>Tovar aylanmasi, mln so‘m<\/th><th>Chastota f<\/th><th>Ulush, %<\/th><th>Jamg‘arma chastota<\/th><th>Jamg‘arma ulush, %<\/th><\/tr><tr><td>9,0 – 13,5<\/td><td>5<\/td><td>16,7<\/td><td>5<\/td><td>16,7<\/td><\/tr><tr><td>13,5 – 18,0<\/td><td>6<\/td><td>20,0<\/td><td>11<\/td><td>36,7<\/td><\/tr><tr><td>18,0 – 22,5<\/td><td>7<\/td><td>23,3<\/td><td>18<\/td><td>60,0<\/td><\/tr><tr><td>22,5 – 27,0<\/td><td>5<\/td><td>16,7<\/td><td>23<\/td><td>76,7<\/td><\/tr><tr><td>27,0 – 31,5<\/td><td>5<\/td><td>16,7<\/td><td>28<\/td><td>93,3<\/td><\/tr><tr><td>31,5 – 36,0<\/td><td>2<\/td><td>6,7<\/td><td>30<\/td><td>100,0<\/td><\/tr><tr><td><b>Jami<\/b><\/td><td><b>30<\/b><\/td><td><b>100,0<\/b><\/td><td><\/td><td><\/td><\/tr><\/table><p><b>c)<\/b> Eng ko‘p korxona (modal guruh) 18,0–22,5 mln so‘m oralig‘ida: 7 ta (23,3%). 13,5–27,0 mln so‘m oralig‘ida 18 ta korxona (60,0%) joylashgan; 31,5 dan yuqori guruhda atigi 2 ta korxona bor.<\/p>", "ans": "Guruhlar soni 6; chastotalar: 5, 6, 7, 5, 5, 2. Tovar aylanmasi asosan 13,5–27,0 mln so‘m oralig‘ida to‘plangan (60%), modal guruh 18,0–22,5 mln so‘m.", "t": "asos", "status": "fixed", "note": "Original stated the intervals but never counted frequencies, shares or cumulative values (b) and gave no conclusion (c); added: f = 5, 6, 7, 5, 5, 2.", "id": "sm-4", "src": "stat"}, {"n": 5, "part": 2, "title": "Nisbiy miqdorlar: dinamika, tuzilma, koordinatsiya", "cond": "<p>O‘zbekistonda tashqi savdo aylanmasi to‘g‘risida ma’lumotlar (mlrd AQSh dollari):<\/p><table><tr><th>Ko‘rsatkich<\/th><th>2015-yil<\/th><th>2023-yil<\/th><\/tr><tr><td>Eksport<\/td><td>12,5<\/td><td>19,3<\/td><\/tr><tr><td>Import<\/td><td>12,4<\/td><td>30,7<\/td><\/tr><tr><td>Tashqi savdo aylanmasi<\/td><td>24,9<\/td><td>50,0<\/td><\/tr><\/table><p>Dinamika, tuzilma va koordinatsiya nisbiy miqdorlarini aniqlang, savdo balansini hisoblang va xulosa yozing.<\/p>", "sol": "<p><b>1) Dinamika nisbiy miqdori<\/b> = joriy daraja / bazis daraja · 100%:<\/p><p>eksport: 19,3 / 12,5 · 100 = <b>154,4%<\/b> (+54,4%); import: 30,7 / 12,4 · 100 = <b>247,6%<\/b> (+147,6%); aylanma: 50,0 / 24,9 · 100 = <b>200,8%<\/b> (≈ 2 marta).<\/p><p><b>2) Tuzilma nisbiy miqdori<\/b> = qism / butun · 100%:<\/p><table><tr><th>Yil<\/th><th>Eksport ulushi<\/th><th>Import ulushi<\/th><\/tr><tr><td>2015<\/td><td>50,2%<\/td><td>49,8%<\/td><\/tr><tr><td>2023<\/td><td>38,6%<\/td><td>61,4%<\/td><\/tr><\/table><p><b>3) Koordinatsiya nisbiy miqdori<\/b> (eksport / import · 100%): 2015 — 12,5 / 12,4 = <b>100,8%<\/b>; 2023 — 19,3 / 30,7 = <b>62,9%<\/b> (har 100 dollar importga 62,9 dollar eksport).<\/p><p><b>4) Savdo balansi (saldo)<\/b> = E − I: 2015: 12,5 − 12,4 = <b>+0,1<\/b> mlrd $; 2023: 19,3 − 30,7 = <b>-11,4<\/b> mlrd $.<\/p>", "ans": "Import (+147,6%) eksportdan (+54,4%) ancha tez o‘sgan: eksport ulushi 50,2% dan 38,6% ga tushgan, saldo +0,1 dan −11,4 mlrd dollarga o‘zgarib, manfiy savdo balansi chuqurlashgan.", "t": "asos", "status": "ok", "note": "", "id": "sm-5", "src": "stat"}, {"n": 6, "part": 2, "title": "Tortilgan o‘rtacha tannarx va tarkibiy siljish", "cond": "<p>Ikki korxona bo‘yicha “A” mahsulotning bir donasi tannarxi va ishlab chiqarilgan miqdori:<\/p><table><tr><th>Korxona<\/th><th>I chorak: tannarx, ming so‘m<\/th><th>I chorak: ishlab chiqarildi, ming dona<\/th><th>II chorak: tannarx, ming so‘m<\/th><th>II chorak: ishlab chiqarildi, ming dona<\/th><\/tr><tr><td>1<\/td><td>70<\/td><td>6<\/td><td>65<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>110<\/td><td>4<\/td><td>108<\/td><td>6<\/td><\/tr><\/table><p>a) Har bir chorak uchun mahsulotning o‘rtacha tannarxini aniqlang.<\/p><p>b) Har ikkala korxonada tannarx pasayganiga qaramay, o‘rtacha tannarx ortishining sababini tushuntiring.<\/p>", "sol": "<p><b>a)<\/b> O‘rtacha tannarx — tortilgan arifmetik o‘rtacha: x̄ = Σ(z·q) / Σq.<\/p><p>I chorak: (70·6 + 110·4) / (6 + 4) = (420 + 440) / 10 = <b>86,0 ming so‘m<\/b>.<\/p><p>II chorak: (65·4 + 108·6) / (4 + 6) = (260 + 648) / 10 = <b>90,8 ming so‘m<\/b>.<\/p><p><b>b)<\/b> Har bir korxonada tannarx pasaygan (70 → 65; 110 → 108), ammo ishlab chiqarish tarkibi o‘zgargan: qimmat tannarxli 2-korxonaning ulushi 40% dan (4/10) 60% ga (6/10) oshgan, arzon 1-korxonaniki 60% dan 40% ga tushgan. Ana shu <b>tarkibiy siljish<\/b> ta’siri yig‘ma o‘rtachani 86 dan 90,8 ga ko‘targan (Simpson paradoksi ko‘rinishi).<\/p>", "ans": "O‘rtacha tannarx 86 dan 90,8 ming so‘mga oshgan, chunki ishlab chiqarish qimmat tannarxli korxona tomon siljigan, garchi har ikki korxonada tannarx kamaygan bo‘lsa ham.", "t": "ortacha", "status": "ok", "note": "", "id": "sm-6", "src": "stat"}, {"n": 7, "part": 2, "title": "O‘rtacha reja bajarilishi foizi (arifmetik va garmonik o‘rtacha)", "cond": "<p>Birlashmaning to‘rt korxonasi bo‘yicha ikkinchi chorak ma’lumotlari:<\/p><table><tr><th>Korxona<\/th><th>1) Reja, mln so‘m<\/th><th>2) Amalda, mln so‘m<\/th><th>3) Reja bajarilishi, %<\/th><\/tr><tr><td>I<\/td><td>400<\/td><td>400<\/td><td>100,0<\/td><\/tr><tr><td>II<\/td><td>405<\/td><td>408<\/td><td>100,7<\/td><\/tr><tr><td>III<\/td><td>410<\/td><td>405<\/td><td>98,8<\/td><\/tr><tr><td>IV<\/td><td>420<\/td><td>434<\/td><td>103,3<\/td><\/tr><\/table><p>Birlashma bo‘yicha o‘rtacha reja bajarilishi foizini aniqlang: a) 1 va 2-ustunlar bo‘yicha; b) 1 va 3-ustunlar bo‘yicha; c) 2 va 3-ustunlar bo‘yicha. Har holda qaysi o‘rtacha formulasi ishlatiladi?<\/p>", "sol": "<p><b>a) 1 va 2-ustunlar<\/b> (reja va amalda ma’lum) — oddiy nisbat: x̄ = ΣAmal / ΣReja · 100 = 1647 / 1635 · 100 = <b>100,73%<\/b>.<\/p><p><b>b) 1 va 3-ustunlar<\/b> (reja va foiz ma’lum) — reja bilan tortilgan <b>arifmetik<\/b> o‘rtacha: x̄ = Σ(Reja · x) / ΣReja = (400·100,0 + 405·100,7 + 410·98,8 + 420·103,3) / 1635 = 164 677,5 / 1635 = <b>100,72%<\/b>.<\/p><p><b>c) 2 va 3-ustunlar<\/b> (amal va foiz ma’lum) — amal bilan tortilgan <b>garmonik<\/b> o‘rtacha: x̄ = ΣAmal / Σ(Amal / x) = 1647 / (400/1,000 + 408/1,007 + 405/0,988 + 434/1,033) = 1647 / 1 635,22 = <b>100,72%<\/b>.<\/p><p>Uchala usul bir xil natija beradi (kichik farq 3-ustundagi foizlar yaxlitlangani sababli). Qoida: tortish vazni sifatida maxraj (reja) ma’lum bo‘lsa — arifmetik, surat (amal) ma’lum bo‘lsa — garmonik o‘rtacha.<\/p>", "ans": "Birlashma bo‘yicha reja ≈ 100,7% bajarilgan (1647 / 1635); reja ma’lum bo‘lsa arifmetik, amalda ma’lum bo‘lsa garmonik tortilgan o‘rtacha qo‘llanadi.", "t": "ortacha", "status": "ok", "note": "", "id": "sm-7", "src": "stat"}, {"n": 8, "part": 2, "title": "Variatsiya ko‘rsatkichlari (oddiy qator)", "cond": "<p>Filialning 10 ta kunlik savdo tushumi (mln so‘m): 12; 15; 14; 10; 18; 20; 16; 15; 13; 17.<\/p><p>a) Variatsion kenglik, o‘rtacha chiziqli tafovut, dispersiya (bosh to‘plam va tanlanma), standart chetlanish va variatsiya koeffitsientini hisoblang.<\/p><p>b) To‘plam bir jinslimi? Xulosa yozing.<\/p>", "sol": "<p><b>a)<\/b> x̄ = Σx / n = 150 / 10 = <b>15 mln so‘m<\/b>.<\/p><table><tr><th>x<\/th><th>x − x̄<\/th><th>|x − x̄|<\/th><th>(x − x̄)²<\/th><\/tr><tr><td>12<\/td><td>-3<\/td><td>3<\/td><td>9<\/td><\/tr><tr><td>15<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>14<\/td><td>-1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>10<\/td><td>-5<\/td><td>5<\/td><td>25<\/td><\/tr><tr><td>18<\/td><td>3<\/td><td>3<\/td><td>9<\/td><\/tr><tr><td>20<\/td><td>5<\/td><td>5<\/td><td>25<\/td><\/tr><tr><td>16<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>15<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>13<\/td><td>-2<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>17<\/td><td>2<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td><b>Σ = 150<\/b><\/td><td>0<\/td><td><b>22<\/b><\/td><td><b>78<\/b><\/td><\/tr><\/table><p>Variatsion kenglik: R = x<sub>max<\/sub> − x<sub>min<\/sub> = 20 − 10 = <b>10 mln so‘m<\/b>.<\/p><p>O‘rtacha chiziqli tafovut: d̄ = Σ|x − x̄| / n = 22 / 10 = <b>2,2<\/b>.<\/p><p>Dispersiya: bosh to‘plam σ² = Σ(x − x̄)² / n = 78 / 10 = <b>7,8<\/b>; tanlanma s² = 78 / (n − 1) = 78 / 9 = <b>8,67<\/b>.<\/p><p>Standart chetlanish: σ = √7,8 = <b>2,79<\/b>; s = √8,67 = <b>2,94<\/b> mln so‘m.<\/p><p>Variatsiya koeffitsienti: V = σ / x̄ · 100% = 2,79 / 15 · 100 = <b>18,6%<\/b> (tanlanma s bo‘yicha 19,6%).<\/p><p><b>b)<\/b> V &lt; 33% → to‘plam <b>bir jinsli<\/b>, o‘rtacha (15 mln so‘m) uni yaxshi ifodalaydi.<\/p>", "ans": "x̄ = 15; R = 10; d̄ = 2,2; σ² = 7,8 (s² = 8,67); σ = 2,79 (s = 2,94); V ≈ 18,6% &lt; 33% — kunlik tushum bir jinsli.", "t": "ortacha", "status": "fixed", "note": "Sum of squared deviations is 78, not 82, so variance 7,8 / 8,67 (not 8,2 / 9,11), σ 2,79 / s 2,94 (not 2,86 / 3,02), V 18,6% (not 19,1%); conclusion unchanged.", "id": "sm-8", "src": "stat"}, {"n": 9, "part": 2, "title": "Intervalli qator: o‘rtacha, variatsiya, moda, mediana", "cond": "<p>Bitta detalga ishlov berishga sarflangan vaqt bo‘yicha ishchilar taqsimoti:<\/p><table><tr><th>Vaqt sarfi, minut<\/th><th>4–5<\/th><th>5–6<\/th><th>6–7<\/th><th>7–8<\/th><th>8–9<\/th><th>9–10<\/th><th>10–11<\/th><\/tr><tr><td>Ishchilar soni, kishi<\/td><td>8<\/td><td>18<\/td><td>23<\/td><td>30<\/td><td>12<\/td><td>6<\/td><td>3<\/td><\/tr><\/table><p>Hisoblang: a) o‘rtacha vaqt sarfi; b) dispersiya, standart chetlanish va variatsiya koeffitsienti; c) moda va mediana. Xulosa yozing.<\/p>", "sol": "<p>Interval o‘rtalari x′ (masalan, 4–5 → 4,5) olinadi, interval kengligi h = 1 minut.<\/p><table><tr><th>Vaqt, min<\/th><th>x′<\/th><th>f<\/th><th>x′·f<\/th><th>(x′ − x̄)²·f<\/th><th>Jamg‘arma S<\/th><\/tr><tr><td>4–5<\/td><td>4,5<\/td><td>8<\/td><td>36,0<\/td><td>50,00<\/td><td>8<\/td><\/tr><tr><td>5–6<\/td><td>5,5<\/td><td>18<\/td><td>99,0<\/td><td>40,50<\/td><td>26<\/td><\/tr><tr><td>6–7<\/td><td>6,5<\/td><td>23<\/td><td>149,5<\/td><td>5,75<\/td><td>49<\/td><\/tr><tr><td>7–8<\/td><td>7,5<\/td><td>30<\/td><td>225,0<\/td><td>7,50<\/td><td>79<\/td><\/tr><tr><td>8–9<\/td><td>8,5<\/td><td>12<\/td><td>102,0<\/td><td>27,00<\/td><td>91<\/td><\/tr><tr><td>9–10<\/td><td>9,5<\/td><td>6<\/td><td>57,0<\/td><td>37,50<\/td><td>97<\/td><\/tr><tr><td>10–11<\/td><td>10,5<\/td><td>3<\/td><td>31,5<\/td><td>36,75<\/td><td>100<\/td><\/tr><tr><td><b>Jami<\/b><\/td><td><\/td><td><b>100<\/b><\/td><td><b>700,0<\/b><\/td><td><b>205,00<\/b><\/td><td><\/td><\/tr><\/table><p><b>a)<\/b> x̄ = Σx′f / Σf = 700,0 / 100 = <b>7,00 minut<\/b>.<\/p><p><b>b)<\/b> σ² = Σ(x′ − x̄)²f / Σf = 205,00 / 100 = <b>2,05<\/b>; σ = √2,05 = <b>1,43 minut<\/b>; V = σ / x̄ · 100% = 1,43 / 7,00 · 100 = <b>20,5%<\/b>.<\/p><p><b>c)<\/b> Moda: modal interval 7–8 (f = 30 eng katta). Mo = x₀ + h · (f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) / [(f<sub>Mo<\/sub> − f<sub>Mo−1<\/sub>) + (f<sub>Mo<\/sub> − f<sub>Mo+1<\/sub>)] = 7 + 1 · (30 − 23) / [(30 − 23) + (30 − 12)] = 7 + 7/25 = <b>7,28 minut<\/b>.<\/p><p>Mediana: Σf / 2 = 50; jamg‘arma chastota 50 dan birinchi oshadigan interval — 7–8 (S = 79). Me = x₀ + h · (Σf/2 − S<sub>Me−1<\/sub>) / f<sub>Me<\/sub> = 7 + 1 · (50 − 49) / 30 = <b>7,03 minut<\/b>.<\/p>", "ans": "O‘rtacha vaqt sarfi 7,0 minut, σ ≈ 1,43 minut, V ≈ 20,5% (&lt; 33%, to‘plam bir jinsli). Mo ≈ 7,28 va Me ≈ 7,03 o‘rtachaga yaqin — taqsimot simmetrikka yaqin.", "t": "ortacha", "status": "rewritten", "note": "Original contained only a generic template with no numbers; solved fully (x̄ = 7,0; σ² = 2,05; σ = 1,43; V = 20,5%; Mo = 7,28; Me = 7,03).", "id": "sm-9", "src": "stat"}, {"n": 10, "part": 2, "title": "O‘rtacha, mediana va variatsiya koeffitsienti (chetki qiymat)", "cond": "<p>11 ta korxonaning xodimlar soni (kishi): 14; 16; 17; 18; 19; 20; 21; 22; 23; 25; 48. a) O‘rtacha va medianani toping.<\/p><p>b) Variatsiya koeffitsiyentini hisoblang<\/p>", "sol": "<p><b>a)<\/b> x̄ = Σx / n = 243 / 11 = <b>22,09 kishi<\/b>. Mediana: n = 11 (toq), tartiblangan qatorning (11 + 1)/2 = 6-hadi — <b>Me = 20 kishi<\/b>. 48 kishilik chetki qiymat o‘rtachani mediana(20)dan yuqoriga tortadi.<\/p><p><b>b)<\/b> Σ(x − x̄)² = 840,91; σ = √(840,91 / 11) = √76,45 = <b>8,74<\/b> kishi (tanlanma: s = √(840,91 / 10) = 9,17).<\/p><p>V = σ / x̄ · 100% = 8,74 / 22,09 · 100 = <b>39,6%<\/b> (s bo‘yicha 41,5%).<\/p><p>Taqqoslash uchun: 48 ni chiqarib tashlasak x̄ = 19,5, σ = 3,20, V = 16,4% — bitta chetki qiymat variatsiyani ikki barobardan ko‘proq oshiradi.<\/p>", "ans": "x̄ ≈ 22,09, Me = 20 kishi; σ ≈ 8,74, V ≈ 39,6% (&gt; 33%) — to‘plam bir jinsli emas, bunga asosan bitta chetki qiymat (48) sabab (usiz V ≈ 16,4%).", "t": "ortacha", "status": "fixed", "note": "Mean and median were right but part (b) was not computed; added σ = 8,74 (s = 9,17) and V = 39,6% (41,5% with s).", "id": "sm-10", "src": "stat"}, {"n": 11, "part": 2, "title": "Normal taqsimot: ehtimollarni topish", "cond": "<p>Talabalarning statistika fanidan to‘plagan bali normal taqsimlangan: μ = 70, σ = 10. a) Talabaning bali 85 dan yuqori bo‘lish ehtimoli qancha?<\/p><p>b) Bal 60 dan 80 gacha bo‘lgan talabalar ulushini toping.<\/p>", "sol": "<p><b>a)<\/b> z = (x − μ) / σ = (85 − 70) / 10 = 1,5. P(X &gt; 85) = 1 − Φ(1,5) = 1 − 0,9332 = <b>0,0668<\/b> ≈ <b>6,68%<\/b>.<\/p><p><b>b)<\/b> z₁ = (60 − 70) / 10 = −1; z₂ = (80 − 70) / 10 = +1. P(60 &lt; X &lt; 80) = Φ(1) − Φ(−1) = 0,8413 − 0,1587 = <b>0,6827<\/b> ≈ <b>68,27%<\/b> (empirik qoidaning “68%” qismi).<\/p>", "ans": "Talabalarning ≈ 6,68% i 85 dan yuqori, ≈ 68,27% i 60–80 bal oralig‘ida to‘playdi.", "t": "taqsimot", "status": "ok", "note": "", "id": "sm-11", "src": "stat"}, {"n": 12, "part": 2, "title": "Normal taqsimot: empirik qoida va kvantil", "cond": "<p>Korxona ishchilarining oylik ish haqi normal taqsimlangan: μ = 6 500 ming so‘m, σ = 500 ming so‘m. Ishchilar soni 1 000 nafar.<\/p><p>a) Ish haqi 5 500 dan 7 500 gacha bo‘lgan ishchilar sonini empirik qoida va aniq normal taqsimot bo‘yicha baholang.<\/p><p>b) Ish haqi 7 000 dan yuqori bo‘lgan ishchilar ulushini toping.<\/p><p>c) Eng kam ish haqi oluvchi 5 foiz ishchining yuqori chegarasini aniqlang.<\/p>", "sol": "<p><b>a)<\/b> z₁ = (5500 − 6500) / 500 = −2; z₂ = (7500 − 6500) / 500 = +2, ya’ni μ ± 2σ oralig‘i.<\/p><p>Empirik qoida: ≈ 95% → 0,95 · 1000 ≈ <b>950 kishi<\/b>. Aniq normal taqsimot: Φ(2) − Φ(−2) = 0,9545 → 954,5 ≈ <b>954–955 kishi<\/b>.<\/p><p><b>b)<\/b> z = (7000 − 6500) / 500 = 1; P(X &gt; 7000) = 1 − Φ(1) = 1 − 0,8413 = <b>0,1587<\/b> ≈ <b>15,87%<\/b> (≈ 159 kishi).<\/p><p><b>c)<\/b> Pastki 5% uchun z<sub>0,05<\/sub> = −1,645: x = μ + z·σ = 6500 − 1,645 · 500 = <b>5 677,5 ming so‘m<\/b>.<\/p>", "ans": "μ ± 2σ (5 500–7 500) oralig‘ida ≈ 950 (aniq: ≈ 954) ishchi; 7 000 dan yuqori ≈ 15,87%; eng kam oluvchi 5% ishchining yuqori chegarasi ≈ 5 677,5 ming so‘m.", "t": "taqsimot", "status": "ok", "note": "", "id": "sm-12", "src": "stat"}, {"n": 13, "part": 2, "title": "Tanlanma ko‘rsatkichlari va empirik qoida bo‘yicha normallikni tekshirish", "cond": "<p>15 ta do‘konning kunlik tushumi (mln so‘m): 52; 55; 57; 58; 59; 60; 60; 61; 62; 62; 63; 64; 66; 68; 75.<\/p><p>a) O‘rtacha, mediana va standart chetlanishni (tanlanma) toping.<\/p><p>b) Qiymatlarning qancha ulushi x̄ ± s va x̄ ± 2s oraliqlarga tushadi? Normal taqsimot bilan solishtiring.<\/p><p>c) Normallik haqida xulosa chiqaring va qo‘shimcha qanday tekshiruvlarni tavsiya etasiz?<\/p>", "sol": "<p><b>a)<\/b> x̄ = Σx / n = 922 / 15 = <b>61,47 mln so‘m<\/b>; Me = tartiblangan qatorning 8-hadi = <b>61 mln so‘m<\/b>.<\/p><p>s = √[Σ(x − x̄)² / (n − 1)] = √(429,73 / 14) = √30,70 = <b>5,54 mln so‘m<\/b>.<\/p><p><b>b)<\/b> x̄ ± s = [55,93; 67,01] → bu oraliqqa 11 ta qiymat tushadi: 11/15 = <b>73,3%<\/b> (normalda ≈ 68%).<\/p><p>x̄ ± 2s = [50,39; 72,55] → 14 ta qiymat: 14/15 = <b>93,3%<\/b> (normalda ≈ 95%). Tashqarida faqat 75 qoladi (z = (75 − 61,47) / 5,54 ≈ 2,44).<\/p><p><b>c)<\/b> x̄ ≈ Me (61,47 va 61) va ulushlar (73,3% va 93,3%) 68–95 qoidasiga yaqin — taqsimot taxminan normal. Lekin 75 qiymati o‘ng tomonda chetki kuzatuv bo‘lib, musbat assimetriya beradi (A ≈ 0,70). n = 15 kichik bo‘lgani uchun qo‘shimcha tekshiruvlar tavsiya etiladi: gistogramma va “quti-mo‘ylov” (boxplot) grafigi, Q–Q grafik, assimetriya va ekstsess koeffitsientlari, Shapiro–Uilk testi.<\/p>", "ans": "x̄ ≈ 61,47, Me = 61, s ≈ 5,54 mln so‘m; x̄ ± s ichida 73,3%, x̄ ± 2s ichida 93,3% qiymat — normalga yaqin, ammo 75 chetki qiymati sababli yengil o‘ng assimetriya bor.", "t": "taqsimot", "status": "rewritten", "note": "Original contained only a generic template with no numbers; solved fully (x̄ = 61,47; Me = 61; s = 5,54; 73,3% within ±s, 93,3% within ±2s).", "id": "sm-13", "src": "stat"}, {"n": 14, "part": 3, "title": "Binomial taqsimot va normal yaqinlashuv", "cond": "<p>Bank mijozlarining 30 foizi muddatli omonat ochadi (muvaffaqiyat ehtimoli p = 0,3). a) 10 nafar mijozdan aynan 3 nafari omonat ochish ehtimolini toping. b) 100 nafar mijozdan 35 va undan ko‘pi omonat ochish ehtimolini normal yaqinlashuv yordamida baholang va aniq binomial natija bilan solishtiring. c) 100 nafar mijoz uchun o’rtacha va standart chetlanishni toping.<\/p>", "sol": "<p><b>a)<\/b> X ~ Bin(10; 0,3): P(X = 3) = C(10,3)·0,3³·0,7⁷ = 120·0,027·0,08235 = <b>0,2668<\/b>.<\/p><p><b>b)<\/b> n = 100: μ = np = 30; σ = √(np(1 − p)) = √21 = 4,583. Uzluksizlik tuzatmasi bilan: P(X ≥ 35) ≈ P(Z ≥ (34,5 − 30)/4,583) = P(Z ≥ 0,982) = <b>0,1631<\/b>.<\/p><p>Aniq binomial natija: P(X ≥ 35) = Σₖ₌₃₅¹⁰⁰ C(100,k)·0,3ᵏ·0,7¹⁰⁰⁻ᵏ = <b>0,1629<\/b>. Farq 0,0002 — normal yaqinlashuv juda yaxshi (np = 30 va n(1 − p) = 70 ≥ 5).<\/p><p><b>c)<\/b> μ = np = <b>30<\/b> mijoz; σ = √(np(1 − p)) = <b>4,58<\/b> mijoz.<\/p>", "ans": "P(X = 3) ≈ 0,267; 100 mijozdan kamida 35 tasi omonat ochish ehtimoli ≈ 0,163 (normal yaqinlashuv 0,163); μ = 30, σ ≈ 4,58.", "t": "taqsimot", "status": "fixed", "note": "Numbers were correct but the exact binomial value asked in b) was missing: P(X ≥ 35) = 0,1629 vs normal 0,1631.", "id": "sm-14", "src": "stat"}, {"n": 15, "part": 2, "title": "Tanlash usullarini aniqlash", "cond": "<p>Universitet talabalarini so‘rovdan o‘tkazishda quyidagi tanlash usullari qo‘llangan. Har birining nomini aniqlang, ehtimolli yoki ehtimolsizligini ayting va xulosalarni bosh to‘plamga tarqatish mumkinligini baholang:<\/p><table><tr><th>№<\/th><th>Vaziyat<\/th><\/tr><tr><td>a<\/td><td>8 000 talabaning ro‘yxatidan tasodifiy sonlar jadvali yordamida 400 nafar tanlandi.<\/td><\/tr><tr><td>b<\/td><td>Alifbo bo‘yicha ro‘yxatdagi har 20-talaba so‘raldi.<\/td><\/tr><tr><td>c<\/td><td>Talabalar kurslar bo‘yicha guruhlandi va har kursdan uning ulushiga mutanosib tasodifiy tanlandi.<\/td><\/tr><tr><td>d<\/td><td>10 ta yotoqxonadan tasodifan 2 tasi tanlandi va ularning barcha talabalari so‘raldi.<\/td><\/tr><tr><td>e<\/td><td>Kutubxona oldidan o‘tgan dastlabki 100 nafar talaba so‘raldi.<\/td><\/tr><tr><td>f<\/td><td>Intervyuer aynan 50 nafar erkak va 50 nafar ayolni topishi shart qilib belgilandi.<\/td><\/tr><\/table>", "sol": "<table><tr><th><\/th><th>Usul nomi<\/th><th>Ehtimolli / ehtimolsiz<\/th><th>Bosh to‘plamga tarqatish<\/th><\/tr><tr><td>a<\/td><td>Oddiy tasodifiy tanlash<\/td><td>ehtimolli<\/td><td>Ha — eng to‘g‘ri asos<\/td><\/tr><tr><td>b<\/td><td>Mexanik (tizimli) tanlash, qadam k = 20<\/td><td>ehtimolli (start tasodifiy bo‘lsa)<\/td><td>Ha, ro‘yxatda davriylik bo‘lmasa<\/td><\/tr><tr><td>c<\/td><td>Tipik (qatlamli, mutanosib) tanlash<\/td><td>ehtimolli<\/td><td>Ha — reprezentativligi eng yuqori<\/td><\/tr><tr><td>d<\/td><td>Seriyali (uyali, klasterli) tanlash<\/td><td>ehtimolli<\/td><td>Ha, lekin xatosi kattaroq (yotoqxonalar o‘xshash bo‘lmasligi mumkin)<\/td><\/tr><tr><td>e<\/td><td>Qulaylik bo‘yicha (tasodifiy bo‘lmagan) tanlash<\/td><td>ehtimolsiz<\/td><td>Yo‘q — kutubxonaga boradiganlar tizimli farq qiladi<\/td><\/tr><tr><td>f<\/td><td>Kvotali tanlash<\/td><td>ehtimolsiz<\/td><td>Yo‘q — kvota ichida tanlov intervyuerga bog‘liq<\/td><\/tr><\/table><p>Ehtimolli usullarda har bir birlikning tanlanishi ehtimoli ma’lum, shuning uchun reprezentativlik xatosini hisoblab, xulosani bosh to‘plamga tarqatish mumkin. Ehtimolsiz usullarda (e, f) tanlanma xatosini baholab bo‘lmaydi va siljish (bias) xavfi yuqori.<\/p>", "ans": "a, b, c, d — ehtimolli (oddiy tasodifiy, mexanik, tipik, seriyali); e — qulaylik, f — kvotali (ehtimolsiz). Bosh to‘plamga ishonchli tarqatish faqat ehtimolli usullarda mumkin.", "t": "tanlanma", "status": "ok", "note": "", "id": "sm-15", "src": "stat"}, {"n": 16, "part": 2, "title": "Tanlanma o‘rtacha xatosi, chegaraviy xato va ishonch chegaralari", "cond": "<p>5 000 ta korxonadan 100 tasi tanlab kuzatildi. Oylik ishlab chiqarish hajmi bo‘yicha tanlanma o‘rtachasi 240 mln so‘m, tanlanma standart chetlanishi 40 mln so‘m.<\/p><p>a) Takroriy va notakroriy tanlash uchun o‘rtacha (standart) xatoni hisoblang.<\/p><p>b) 95% ishonch darajasi (z = 1,96) bilan chegaraviy xatoni toping va bosh to‘plam o‘rtachasi chegaralarini aniqlang.<\/p><p>c) Barcha 5 000 korxona bo‘yicha jami ishlab chiqarish hajmi qanday oraliqda bo‘ladi?<\/p>", "sol": "<p><b>a)<\/b> Takroriy tanlash: μ = s / √n = 40 / √100 = <b>4,00 mln so‘m<\/b>.<\/p><p>Notakroriy tanlash: μ = √[s²/n · (1 − n/N)] = √[1600/100 · (1 − 100/5000)] = √(16 · 0,98) = <b>3,96 mln so‘m<\/b>.<\/p><p><b>b)<\/b> Chegaraviy xato Δ = z · μ: takroriy Δ = 1,96 · 4 = <b>7,84<\/b> → x̄ ± Δ = [<b>232,16; 247,84<\/b>] mln so‘m; notakroriy Δ = 1,96 · 3,96 = <b>7,76<\/b> → [<b>232,24; 247,76<\/b>] mln so‘m.<\/p><p><b>c)<\/b> Jami hajm = N · x̄ = 5000 · 240 = 1 200 000 mln so‘m (1,2 trln so‘m). Ishonch oralig‘i: N · (x̄ ± Δ) = [1 160 800; 1 239 200] mln so‘m (takroriy); [1 161 194; 1 238 806] mln so‘m (notakroriy).<\/p>", "ans": "μ = 4,0 (takroriy) va ≈ 3,96 (notakroriy) mln so‘m; 95% ishonch bilan bosh o‘rtacha ≈ 232,2–247,8 mln so‘m, 5 000 korxonaning jami hajmi ≈ 1,161–1,239 trln so‘m.", "t": "tanlanma", "status": "ok", "note": "", "id": "sm-16", "src": "stat"}, {"n": 17, "part": 3, "title": "Ulush uchun ishonch oralig‘i: nuqsonli mahsulot", "cond": "<p>400 ta mahsulot tanlab tekshirilganda 56 tasi nuqsonli chiqdi. Partiya 10 000 ta mahsulotdan iborat. a) Nuqsonli mahsulotlar ulushi uchun tanlanma ulushi va standart xatoni toping. b) 95% va 99% ishonch darajalarida chegaraviy xatoni hisoblang. c) Partiyadagi nuqsonli mahsulotlar sonini 95% ishonch bilan baholang.<\/p>", "sol": "<p><b>a)<\/b> w = 56/400 = <b>0,14<\/b> (14%); μ = √(w(1 − w)/n) = √(0,14·0,86/400) = <b>0,0173<\/b>.<\/p><p><b>b)<\/b> 95%: Δ = 1,96·0,0173 = <b>0,0340<\/b> → [0,106; 0,174]. 99%: Δ = 2,576·0,0173 = <b>0,0447<\/b> → [0,0953; 0,1847].<\/p><p><b>c)<\/b> 10 000·[0,106; 0,174] → taxminan <b>1 060 – 1 740 dona<\/b> nuqsonli mahsulot.<\/p><p><i>Izoh: notakroriy tanlash tuzatmasi bilan (n/N = 0,04) μ = 0,0170, Δ₉₅ = 0,0333 → taxminan 1 067 – 1 733 dona.<\/i><\/p>", "ans": "Nuqsonli mahsulot ulushi 14%; 95% ishonch bilan partiyadagi nuqsonli mahsulotlar soni taxminan 1 060 – 1 740 dona.", "t": "tanlanma", "status": "ok", "note": "", "id": "sm-17", "src": "stat"}, {"n": 18, "part": 2, "title": "Zarur tanlanma hajmini aniqlash", "cond": "<p>Tadqiqotchi tanlanma hajmini rejalashtirmoqda (95% ishonch, z = 1,96).<\/p><p>a) O‘rtacha oylik xarajat bo‘yicha σ ≈ 12 ming so‘m, ruxsat etilgan xato Δ = 2 ming so‘m. Zarur n qancha?<\/p><p>b) Ulushni baholash uchun Δ = 0,04. Oldindan ulush noma’lum bo‘lsa, zarur n qancha? c) Agar oldingi tadqiqotdan p ≈ 0,20 ma’lum bo‘lsa-chi? Natijalarni solishtiring va xulosa yozing.<\/p>", "sol": "<p><b>a)<\/b> O‘rtacha uchun: n = (z·σ / Δ)² = (1,96 · 12 / 2)² = 11,76² = 138,30 → yuqoriga yaxlitlab <b>n = 139<\/b>.<\/p><p><b>b)<\/b> Ulush noma’lum bo‘lsa eng “xavfli” p = 0,5 olinadi (p(1 − p) = 0,25 maksimal): n = z²·p(1 − p) / Δ² = 1,96² · 0,25 / 0,04² = 600,25 → <b>n = 601<\/b>.<\/p><p><b>c)<\/b> p ≈ 0,20 bo‘lsa: n = 1,96² · 0,20 · 0,80 / 0,04² = 384,16 → <b>n = 385<\/b>.<\/p><p>Hajm har doim yuqoriga yaxlitlanadi, aks holda belgilangan aniqlik ta’minlanmaydi.<\/p>", "ans": "Zarur hajm: o‘rtacha uchun 139; ulush uchun p noma’lum bo‘lsa 601, p ≈ 0,2 ma’lum bo‘lsa 385 — oldindan ma’lumot tanlanmani ≈ 36% ga qisqartiradi.", "t": "tanlanma", "status": "ok", "note": "", "id": "sm-18", "src": "stat"}, {"n": 19, "part": 2, "title": "Kichik tanlanma: t-taqsimot bo‘yicha ishonch intervali", "cond": "<p>12 nafar talabaning haftalik mustaqil o‘qish vaqti (soat): 14; 18; 12; 20; 16; 15; 22; 13; 17; 19; 11; 16. Ma’lumotlar normal taqsimotdan olingan deb hisoblang.<\/p><p>a) Tanlanma o‘rtachasi va standart chetlanishini toping.<\/p><p>b) Bosh to‘plam o‘rtachasi uchun 95% ishonch intervalini t-taqsimot yordamida quring (t₀,₉₇₅ ; df=11 = 2,201).<\/p><p>c) Natijani iqtisodiy-ijtimoiy jihatdan izohlang.<\/p>", "sol": "<p><b>a)<\/b> x̄ = Σx / n = 193 / 12 = <b>16,08 soat<\/b>.<\/p><p>s = √[Σ(x − x̄)² / (n − 1)] = √(120,92 / 11) = √10,99 = <b>3,32 soat<\/b>.<\/p><p><b>b)<\/b> Standart xato: SE = s / √n = 3,32 / √12 = 0,957. Chegaraviy xato: Δ = t · SE = 2,201 · 0,957 = 2,11.<\/p><p>95% ishonch intervali: x̄ ± Δ = 16,08 ± 2,11 → <b>[13,98; 18,19] soat<\/b>.<\/p><p><b>c)<\/b> 95% ishonch bilan aytish mumkinki, barcha talabalarning o‘rtacha haftalik mustaqil o‘qish vaqti taxminan 14,0 dan 18,2 soatgacha (kuniga ≈ 2–2,6 soat). Interval nisbatan keng, chunki tanlanma kichik (n = 12) va t-koeffitsient z = 1,96 dan katta.<\/p>", "ans": "x̄ ≈ 16,08 soat, s ≈ 3,32 soat; bosh o‘rtacha uchun 95% ishonch intervali ≈ [13,98; 18,19] soat.", "t": "tanlanma", "status": "rewritten", "note": "Original contained only a generic template with no numbers; solved fully (x̄ = 16,08; s = 3,32; 95% CI [13,98; 18,19]).", "id": "sm-19", "src": "stat"}, {"n": 20, "part": 2, "title": "Turli ishonch darajalarida ishonch intervallari", "cond": "<p>25 ta uy xo‘jaligi so‘rovida oylik oziq-ovqat xarajatining o‘rtachasi 7 450 ming so‘m, tanlanma standart chetlanishi 620 ming so‘m bo‘ldi.<\/p><p>a) 90%, 95% va 99% ishonch intervallarini hisoblang.<\/p><p>b) Ishonch darajasi oshganda interval kengligi qanday o‘zgaradi va nima uchun? Aniqlik va ishonch o‘rtasidagi kelishuvni tushuntiring.<\/p>", "sol": "<p><b>a)<\/b> σ noma’lum, n = 25 → t-taqsimot, df = n − 1 = 24. Standart xato: SE = s / √n = 620 / √25 = 620 / 5 = <b>124 ming so‘m<\/b>.<\/p><p>Interval: x̄ ± t · SE.<\/p><table><tr><th>Ishonch darajasi<\/th><th>t (df = 24)<\/th><th>Δ = t · 124<\/th><th>Interval, ming so‘m<\/th><th>Kenglik<\/th><\/tr><tr><td>90%<\/td><td>1,711<\/td><td>212,16<\/td><td>[7 237,84; 7 662,16]<\/td><td>424,33<\/td><\/tr><tr><td>95%<\/td><td>2,064<\/td><td>255,94<\/td><td>[7 194,06; 7 705,94]<\/td><td>511,87<\/td><\/tr><tr><td>99%<\/td><td>2,797<\/td><td>346,83<\/td><td>[7 103,17; 7 796,83]<\/td><td>693,66<\/td><\/tr><\/table><p><b>b)<\/b> Ishonch darajasi oshgani sari kritik qiymat t kattalashadi (1,711 → 2,064 → 2,797), shuning uchun interval kengayadi (424 → 512 → 694 ming so‘m). Kelishuv: ko‘proq ishonch — kamroq aniqlik (kengroq oraliq). Bir vaqtda ham ishonchni, ham aniqlikni oshirishning yagona yo‘li — tanlanma hajmini (n) ko‘paytirish.<\/p>", "ans": "SE = 124 ming so‘m; 90%: [7 237,8; 7 662,2], 95%: [7 194,1; 7 705,9], 99%: [7 103,2; 7 796,8] ming so‘m — ishonch darajasi oshsa interval kengayadi.", "t": "tanlanma", "status": "rewritten", "note": "Original contained only a generic template with no numbers; solved fully with t (df = 24): 90% [7 237,8; 7 662,2], 95% [7 194,1; 7 705,9], 99% [7 103,2; 7 796,8].", "id": "sm-20", "src": "stat"}, {"n": 21, "part": 2, "title": "Kichik tanlanma: ishonch intervali va zarur hajm", "cond": "<p>Kichik tanlanma: n = 16, x̄ = 320, s = 48 (ming dona).<\/p><p>a) 95% ishonch intervalini t-taqsimot bo‘yicha toping (t₀,₉₇₅ ; df=15 = 2,131).<\/p><p>b) Chegaraviy xato 10 dan oshmasligi uchun zarur n ni z-yaqinlashuv (z=1,96, σ ≈ s) bilan baholang. c) n = 16 dan 64 gacha oshirilsa, interval kengligi taxminan necha baravar kamayadi?<\/p>", "sol": "<p><b>a)<\/b> SE = s / √n = 48 / √16 = 48 / 4 = 12. Δ = t · SE = 2,131 · 12 = 25,572. Interval: 320 ± 25,57 → <b>[294,43; 345,57] ming dona<\/b>.<\/p><p><b>b)<\/b> n = (z · σ / Δ)² = (1,96 · 48 / 10)² = 9,408² = 88,51 → <b>n = 89<\/b>.<\/p><p><b>c)<\/b> Interval kengligi 1/√n ga mutanosib: √(64/16) = √4 = 2 → kenglik taxminan <b>2 baravar<\/b> kamayadi (aniqrog‘i yana biroz ko‘proq, chunki df ortishi bilan t ham kichrayadi: 2,131 → ≈ 1,998).<\/p>", "ans": "95% ishonch intervali ≈ [294,43; 345,57] ming dona; Δ ≤ 10 uchun n = 89 kerak; n 4 barobar oshsa interval ≈ 2 barobar torayadi.", "t": "tanlanma", "status": "ok", "note": "", "id": "sm-21", "src": "stat"}, {"n": 22, "part": 3, "title": "Ulush uchun ishonch oralig‘i: mijozlar qoniqishi", "cond": "<p>Bank 600 nafar mijozdan so‘rov o‘tkazdi: 366 nafari xizmat sifatidan qoniqqanini bildirdi. a) Qoniqqanlar ulushi uchun 95% ishonch intervalini quring (z=1,96).<\/p>", "sol": "<p>w = 366/600 = <b>0,61<\/b>; μ = √(w(1 − w)/n) = √(0,61·0,39/600) = <b>0,01991<\/b>.<\/p><p>Δ = 1,96·0,01991 = <b>0,0390<\/b>; 95% ishonch oralig‘i: 0,61 ± 0,0390 → <b>[0,571; 0,649]<\/b>.<\/p>", "ans": "Bank mijozlarining 57,1% dan 64,9% gachasi xizmat sifatidan qoniqqan (95% ishonch bilan).", "t": "tanlanma", "status": "ok", "note": "", "id": "sm-22", "src": "stat"}, {"n": 23, "part": 2, "title": "Bir o‘rtacha uchun chap tomonlama t-test", "cond": "<p>Ishchilarning o‘rtacha oylik ish haqi 6 000 ming so‘m deb e’lon qilingan. 36 nafar ishchidan tanlanma olinganda x̄ = 5 820 ming so‘m, s = 540 ming so‘m chiqdi. Ish haqi e’londan past deb hisoblash uchun asos bormi? (α = 0,05)<\/p><p>a) H₀ va H₁ ni yozing (chap tomonlama test).<\/p><p>b) t-statistikani hisoblang, kritik qiymat (df = 35, t₀,₀₅ = −1,690) bilan solishtiring va p-qiymatni toping. c) Qaror va xulosani yozing; I tur xato nimani bildiradi?<\/p>", "sol": "<p><b>a)<\/b> H₀: μ = 6000 (μ ≥ 6000); H₁: μ &lt; 6000 (chap tomonlama).<\/p><p><b>b)<\/b> t = (x̄ − μ₀) / (s / √n) = (5820 − 6000) / (540 / √36) = −180 / 90 = <b>-2,00<\/b>, df = 35.<\/p><p>Kritik qiymat t<sub>kr<\/sub> = −1,690. t = −2,00 &lt; −1,690 → kritik sohaga tushdi. p-qiymat = P(t₃₅ &lt; −2,00) ≈ <b>0,027<\/b> (&lt; 0,05).<\/p><p><b>c)<\/b> Qaror: H₀ rad etiladi. 5% ahamiyatlilik darajasida o‘rtacha ish haqi e’lon qilingan 6 000 ming so‘mdan past ekanligiga statistik asos bor. I tur xato bu yerda — aslida o‘rtacha 6 000 ming so‘m bo‘lsa ham, “past” deb noto‘g‘ri xulosa chiqarish; uning ehtimoli α = 0,05.<\/p>", "ans": "t = −2,00 &lt; −1,690, p ≈ 0,027 &lt; 0,05 → H₀ rad etiladi: o‘rtacha ish haqi e’londan (6 000) statistik jihatdan past.", "t": "gipoteza", "status": "fixed", "note": "Part (b) asked for the p-value, which was missing; added p ≈ 0,027 (one-tailed, df = 35). Test and decision were correct.", "id": "sm-23", "src": "stat"}, {"n": 24, "part": 2, "title": "Ulush uchun ikki tomonlama z-test", "cond": "<p>Bank “kredit arizalarining 80 foizi 3 kun ichida ko‘rib chiqiladi” deb da’vo qiladi. 250 ta arizadan tanlab olinganda 190 tasi 3 kun ichida ko‘rib chiqilgan (α = 0,05).<\/p><p>a) Gipotezalarni (ikki tomonlama) yozing.<\/p><p>b) z-statistikani va p-qiymatni hisoblang.<\/p><p>c) Qaror qabul qiling va ishonch oralig‘i bilan tekshiring.<\/p>", "sol": "<p><b>a)<\/b> H₀: p = 0,80; H₁: p ≠ 0,80 (ikki tomonlama).<\/p><p><b>b)<\/b> p̂ = 190 / 250 = <b>0,76<\/b>. z = (p̂ − p₀) / √[p₀(1 − p₀) / n] = (0,76 − 0,80) / √(0,8 · 0,2 / 250) = −0,04 / 0,0253 = <b>-1,581<\/b>.<\/p><p>p-qiymat = 2 · P(Z &lt; −1,581) = 2 · 0,0569 = <b>0,114<\/b>.<\/p><p><b>c)<\/b> p = 0,114 &gt; 0,05 (yoki |z| = 1,58 &lt; 1,96) → <b>H₀ rad etilmaydi<\/b>. Tekshiruv: 95% interval p̂ ± 1,96 · √[p̂(1 − p̂)/n] = 0,76 ± 1,96 · 0,0270 = [<b>0,707; 0,813<\/b>] — 0,80 ni o‘z ichiga oladi, xulosa bir xil.<\/p>", "ans": "z ≈ −1,58, p ≈ 0,114 &gt; 0,05 → bankning “80%” da’vosini rad etishga asos yo‘q; 95% interval [0,707; 0,813] 0,80 ni qamraydi.", "t": "gipoteza", "status": "ok", "note": "", "id": "sm-24", "src": "stat"}, {"n": 25, "part": 2, "title": "I va II tur xatolar, kritik chegara (o‘ng tomonlama z-test)", "cond": "<p>Qadoqlash dastgohi paketlarni o‘rtacha 500 g ga to‘ldirishi kerak (σ = 20 g, n = 25). H₀: μ = 500, H₁: μ &gt; 500 (α = 0,05, o‘ng tomonlama z-test).<\/p><p>a) I va II tur xatolarni ushbu vaziyat uchun so‘z bilan ifodalang.<\/p><p>b) Qarorning kritik chegarasini x̄ bo‘yicha toping.<\/p>", "sol": "<p><b>a)<\/b> <b>I tur xato<\/b> (ehtimoli α = 0,05): dastgoh aslida o‘rtacha 500 g to‘ldirayotgan bo‘lsa ham, “ortiqcha to‘ldiryapti” deb xulosa qilish (keraksiz sozlash/to‘xtatish). <b>II tur xato<\/b> (ehtimoli β): dastgoh aslida 500 g dan ko‘p to‘ldirayotgan bo‘lsa ham, buni aniqlamay H₀ ni qabul qilish (ortiqcha mahsulot sarfi davom etadi).<\/p><p><b>b)<\/b> SE = σ / √n = 20 / √25 = 4 g. O‘ng tomonlama test, z<sub>0,05<\/sub> = 1,645: x̄<sub>kr<\/sub> = μ₀ + z · SE = 500 + 1,645 · 4 = <b>506,58 g<\/b>.<\/p><p>Qaror qoidasi: x̄ &gt; 506,58 g bo‘lsa H₀ rad etiladi; x̄ ≤ 506,58 g bo‘lsa rad etilmaydi.<\/p>", "ans": "Kritik chegara x̄ = 506,58 g: tanlanma o‘rtachasi bundan katta bo‘lsa, dastgoh ortiqcha to‘ldiryapti degan xulosa (α = 0,05) chiqariladi.", "t": "gipoteza", "status": "ok", "note": "", "id": "sm-25", "src": "stat"}, {"n": 26, "part": 2, "title": "p-qiymat bo‘yicha qaror qabul qilish", "cond": "<p>To‘rtta mustaqil test natijalari bo‘yicha p-qiymatni toping va α = 0,05 hamda α = 0,01 darajalarida qaror qabul qiling.<\/p><table><tr><th>№<\/th><th>Test natijasi<\/th><\/tr><tr><td>1<\/td><td>t = 2,31; df = 24; ikki tomonlama<\/td><\/tr><tr><td>2<\/td><td>z = −1,20; chap tomonlama<\/td><\/tr><tr><td>3<\/td><td>t = 1,80; df = 15; o‘ng tomonlama<\/td><\/tr><tr><td>4<\/td><td>z = 2,70; ikki tomonlama<\/td><\/tr><\/table>", "sol": "<p>Qoida: <b>p ≤ α bo‘lsa H₀ rad etiladi<\/b>, p &gt; α bo‘lsa rad etilmaydi. Ikki tomonlama testda bir tomon ehtimoli 2 ga ko‘paytiriladi.<\/p><table><tr><th>№<\/th><th>Test<\/th><th>Formula<\/th><th>p-qiymat<\/th><th>α = 0,05<\/th><th>α = 0,01<\/th><\/tr><tr><td>1<\/td><td>t = 2,31; df = 24; ikki tomonlama<\/td><td>p = 2·P(t₂₄ &gt; 2,31)<\/td><td>0,0298<\/td><td>H₀ rad etiladi<\/td><td>rad etilmaydi<\/td><\/tr><tr><td>2<\/td><td>z = −1,20; chap tomonlama<\/td><td>p = P(Z &lt; −1,20)<\/td><td>0,1151<\/td><td>rad etilmaydi<\/td><td>rad etilmaydi<\/td><\/tr><tr><td>3<\/td><td>t = 1,80; df = 15; o‘ng tomonlama<\/td><td>p = P(t₁₅ &gt; 1,80)<\/td><td>0,0460<\/td><td>H₀ rad etiladi<\/td><td>rad etilmaydi<\/td><\/tr><tr><td>4<\/td><td>z = 2,70; ikki tomonlama<\/td><td>p = 2·P(Z &gt; 2,70)<\/td><td>0,0069<\/td><td>H₀ rad etiladi<\/td><td>H₀ rad etiladi<\/td><\/tr><\/table><p>Jadval bilan tekshirish: 1) t<sub>0,025;24<\/sub> = 2,064 &lt; 2,31 &lt; t<sub>0,005;24<\/sub> = 2,797; 2) |−1,20| &lt; 1,645; 3) t<sub>0,05;15<\/sub> = 1,753 &lt; 1,80 &lt; t<sub>0,01;15<\/sub> = 2,602; 4) 2,70 &gt; 2,576 (z<sub>0,005<\/sub>).<\/p>", "ans": "1-test (p ≈ 0,030) va 3-test (p ≈ 0,046) faqat α = 0,05 da ahamiyatli; 2-test (p ≈ 0,115) hech qaysi darajada ahamiyatli emas; 4-test (p ≈ 0,007) ikkala darajada ham ahamiyatli.", "t": "gipoteza", "status": "rewritten", "note": "Original contained only a generic template with no p-values; computed p ≈ 0,030; 0,115; 0,046; 0,007 with decisions at α = 0,05 and 0,01.", "id": "sm-26", "src": "stat"}, {"n": 27, "part": 2, "title": "Ikki mustaqil o‘rtachani taqqoslash (Welch t-testi)", "cond": "<p>Ikki filialning kunlik savdo hajmi (mln so‘m) bo‘yicha tanlanma ma’lumotlari: A filial n = 15, x̄= 48,2, s = 6,4; B filial — n = 12, x̄= 44,1, s = 8,2. Dispersiyalar teng deb hisoblanmaydi (α = 0,05).<\/p><p>a) H₀: μ_A = μ_B; H₁: μ_A ≠ μ_B. t-statistikasi va erkinlik darajasini hisoblang.<\/p><p>b) p-qiymat bo‘yicha qaror qabul qiling.<\/p><p>c) μ_A − μ_B uchun 95% ishonch intervalini quring va natijani izohlang.<\/p>", "sol": "<p><b>a)<\/b> SE = √(s₁²/n₁ + s₂²/n₂) = √(6,4²/15 + 8,2²/12) = √(2,731 + 5,603) = √8,334 = 2,887.<\/p><p>t = (x̄<sub>A<\/sub> − x̄<sub>B<\/sub>) / SE = (48,2 − 44,1) / 2,887 = 4,1 / 2,887 = <b>1,42<\/b>.<\/p><p>Welch erkinlik darajasi: df = (s₁²/n₁ + s₂²/n₂)² / [(s₁²/n₁)²/(n₁ − 1) + (s₂²/n₂)²/(n₂ − 1)] = 69,46 / (0,533 + 2,854) = <b>20,5<\/b> ≈ 20.<\/p><p><b>b)<\/b> Ikki tomonlama p-qiymat = 2 · P(t &gt; 1,42) ≈ <b>0,17<\/b> &gt; 0,05 (kritik t<sub>0,025;20<\/sub> ≈ 2,086 &gt; 1,42) → <b>H₀ rad etilmaydi<\/b>.<\/p><p><b>c)<\/b> 95% interval: (x̄<sub>A<\/sub> − x̄<sub>B<\/sub>) ± t · SE = 4,1 ± 2,083 · 2,887 = 4,1 ± 6,01 → <b>[-1,91; 10,11] mln so‘m<\/b>. Interval 0 ni o‘z ichiga oladi — bu testning xulosasini tasdiqlaydi.<\/p>", "ans": "t ≈ 1,42, df ≈ 20,5, p ≈ 0,17 &gt; 0,05 — filiallarning o‘rtacha savdosi o‘rtasidagi 4,1 mln so‘mlik farq statistik ahamiyatli emas; 95% interval [−1,9; 10,1] 0 ni qamraydi.", "t": "gipoteza", "status": "ok", "note": "", "id": "sm-27", "src": "stat"}, {"n": 28, "part": 2, "title": "Bog‘liq (juft) tanlanmalar uchun t-test", "cond": "<p>8 nafar xodimning malaka oshirish kursigacha va undan keyingi mehnat unumdorligi (birlik/kun):<\/p><table><tr><th>Xodim<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><\/tr><tr><td>Kursdan oldin<\/td><td>62<\/td><td>58<\/td><td>70<\/td><td>65<\/td><td>60<\/td><td>72<\/td><td>68<\/td><td>64<\/td><\/tr><tr><td>Kursdan keyin<\/td><td>68<\/td><td>61<\/td><td>75<\/td><td>66<\/td><td>67<\/td><td>78<\/td><td>70<\/td><td>69<\/td><\/tr><\/table><p>a) Farqlar (d = keyin − oldin), ularning o‘rtachasi va standart chetlanishini toping.<\/p><p>b) Juft t-test: H₀: μ_d = 0; H₁: μ_d &gt; 0 (α = 0,05). Qaror qabul qiling.<\/p><p>c) μ_d uchun 95% ishonch intervalini quring.<\/p>", "sol": "<table><tr><th>Xodim<\/th><th>Oldin<\/th><th>Keyin<\/th><th>d<\/th><th>(d − d̄)²<\/th><\/tr><tr><td>1<\/td><td>62<\/td><td>68<\/td><td>6<\/td><td>2,641<\/td><\/tr><tr><td>2<\/td><td>58<\/td><td>61<\/td><td>3<\/td><td>1,891<\/td><\/tr><tr><td>3<\/td><td>70<\/td><td>75<\/td><td>5<\/td><td>0,391<\/td><\/tr><tr><td>4<\/td><td>65<\/td><td>66<\/td><td>1<\/td><td>11,391<\/td><\/tr><tr><td>5<\/td><td>60<\/td><td>67<\/td><td>7<\/td><td>6,891<\/td><\/tr><tr><td>6<\/td><td>72<\/td><td>78<\/td><td>6<\/td><td>2,641<\/td><\/tr><tr><td>7<\/td><td>68<\/td><td>70<\/td><td>2<\/td><td>5,641<\/td><\/tr><tr><td>8<\/td><td>64<\/td><td>69<\/td><td>5<\/td><td>0,391<\/td><\/tr><tr><td><b>Σ<\/b><\/td><td><\/td><td><\/td><td><b>35<\/b><\/td><td><b>31,875<\/b><\/td><\/tr><\/table><p><b>a)<\/b> d̄ = Σd / n = 35 / 8 = <b>4,375<\/b>; s<sub>d<\/sub> = √[Σ(d − d̄)² / (n − 1)] = √(31,875 / 7) = √4,554 = <b>2,134<\/b>.<\/p><p><b>b)<\/b> H₀: μ<sub>d<\/sub> = 0; H₁: μ<sub>d<\/sub> &gt; 0. SE = s<sub>d<\/sub> / √n = 2,134 / √8 = 0,754; t = d̄ / SE = 4,375 / 0,754 = <b>5,80<\/b>, df = 7.<\/p><p>Kritik qiymat t<sub>0,05;7<\/sub> = 1,895. t = 5,80 &gt; 1,895 (p ≈ 0,0003) → <b>H₀ rad etiladi<\/b>: kursdan keyin unumdorlik ishonchli oshgan.<\/p><p><b>c)<\/b> 95% interval: d̄ ± t<sub>0,025;7<\/sub> · SE = 4,375 ± 2,365 · 0,754 = 4,375 ± 1,78 → <b>[2,59; 6,16] birlik/kun<\/b>.<\/p><p>Juft testning afzalligi: har bir xodim o‘zi bilan taqqoslanadi, shaxsiy farqlar chiqarib tashlanadi va test kuchliroq bo‘ladi.<\/p>", "ans": "d̄ = 4,375, s_d ≈ 2,13; t ≈ 5,80 &gt; 1,895 (p &lt; 0,001) — malaka oshirish kursi unumdorlikni o‘rtacha 2,6–6,2 birlik/kun ga oshirgan (95% ishonch).", "t": "gipoteza", "status": "fixed", "note": "Differences and mean (4,375) were right but s_d, t, decision and CI were missing; added s_d = 2,134, t = 5,80, p ≈ 0,0003, 95% CI [2,59; 6,16].", "id": "sm-28", "src": "stat"}, {"n": 29, "part": 2, "title": "Bir omilli dispersion tahlil (ANOVA)", "cond": "<p>Paxta hosildorligi (s/ga) uch xil o‘g‘it turi qo‘llangan beshtadan dalada kuzatilgan:<\/p><table><tr><th>O‘g‘it<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td>A<\/td><td>28<\/td><td>31<\/td><td>30<\/td><td>29<\/td><td>32<\/td><\/tr><tr><td>B<\/td><td>33<\/td><td>35<\/td><td>34<\/td><td>36<\/td><td>32<\/td><\/tr><tr><td>C<\/td><td>30<\/td><td>29<\/td><td>31<\/td><td>28<\/td><td>30<\/td><\/tr><\/table><p>a) Guruh o‘rtachalari va umumiy o‘rtachani toping.<\/p><p>b) ANOVA jadvalini to‘ldiring.<\/p><p>c) Determinatsiya koeffitsienti η² ni toping va izohlang.<\/p>", "sol": "<p><b>a)<\/b> Guruh o‘rtachalari: x̄<sub>A<\/sub> = 150 / 5 = <b>30,0<\/b>; x̄<sub>B<\/sub> = 170 / 5 = <b>34,0<\/b>; x̄<sub>C<\/sub> = 148 / 5 = <b>29,6<\/b> s/ga. Umumiy o‘rtacha: x̄ = 468 / 15 = <b>31,2<\/b> s/ga.<\/p><p><b>b)<\/b> H₀: μ<sub>A<\/sub> = μ<sub>B<\/sub> = μ<sub>C<\/sub>; H₁: kamida bitta o‘rtacha farq qiladi.<\/p><p>SS<sub>guruhlararo<\/sub> = Σ n<sub>j<\/sub>(x̄<sub>j<\/sub> − x̄)² = 5·[(30 − 31,2)² + (34 − 31,2)² + (29,6 − 31,2)²] = 5 · (1,44 + 7,84 + 2,56) = <b>59,2<\/b>.<\/p><p>SS<sub>ichki<\/sub> = Σ(x − x̄<sub>j<\/sub>)² = 10,0 (A) + 10,0 (B) + 5,2 (C) = <b>25,2<\/b>; SS<sub>umumiy<\/sub> = 59,2 + 25,2 = <b>84,4<\/b>.<\/p><table><tr><th>Variatsiya manbai<\/th><th>SS<\/th><th>df<\/th><th>MS = SS/df<\/th><th>F<\/th><th>F<sub>kr<\/sub> (0,05)<\/th><\/tr><tr><td>Guruhlararo (o‘g‘it)<\/td><td>59,2<\/td><td>2<\/td><td>29,6<\/td><td><b>14,10<\/b><\/td><td>3,89<\/td><\/tr><tr><td>Guruh ichida (qoldiq)<\/td><td>25,2<\/td><td>12<\/td><td>2,1<\/td><td><\/td><td><\/td><\/tr><tr><td>Umumiy<\/td><td>84,4<\/td><td>14<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><p>F = 14,10 &gt; F<sub>kr<\/sub>(2; 12) = 3,89 (p ≈ 0,0007) → <b>H₀ rad etiladi<\/b>: o‘g‘it turi hosildorlikka ta’sir qiladi.<\/p><p><b>c)<\/b> η² = SS<sub>guruhlararo<\/sub> / SS<sub>umumiy<\/sub> = 59,2 / 84,4 = <b>0,701<\/b> → hosildorlik variatsiyasining ≈ 70,1% i o‘g‘it turiga bog‘liq (η = √η² ≈ 0,84 — kuchli bog‘lanish).<\/p>", "ans": "F ≈ 14,10 &gt; 3,89 — o‘g‘it turlari bo‘yicha hosildorlik farqi ahamiyatli (eng yuqori B: 34 s/ga); η² ≈ 0,70, ya’ni variatsiyaning ≈ 70% i o‘g‘it turi bilan izohlanadi.", "t": "gipoteza", "status": "rewritten", "note": "Original contained only a generic template with no numbers; solved fully (means 30 / 34 / 29,6; F = 14,10 > 3,89; η² = 0,701).", "id": "sm-29", "src": "stat"}, {"n": 30, "part": 2, "title": "Dispersiyalarni qo‘shish qoidasi va korrelyatsion nisbat", "cond": "<p>Uch guruh fermer xo‘jaliklarining hosildorligi (s/ga) bo‘yicha guruh ma’lumotlari:<\/p><table><tr><th>Guruh<\/th><th>Xo‘jaliklar soni<\/th><th>Guruh o‘rtachasi<\/th><th>Guruh ichidagi dispersiya<\/th><\/tr><tr><td>1<\/td><td>20<\/td><td>30<\/td><td>16<\/td><\/tr><tr><td>2<\/td><td>30<\/td><td>36<\/td><td>25<\/td><\/tr><tr><td>3<\/td><td>50<\/td><td>40<\/td><td>36<\/td><\/tr><\/table><p>a) Guruhlar ichidagi dispersiyalarning o‘rtachasini (σ̄²_ichki) hisoblang.<\/p><p>b) Guruhlararo dispersiyani toping.<\/p><p>c) Dispersiyalarni qo‘shish qoidasi bo‘yicha umumiy dispersiyani aniqlang.<\/p><p>d) Empirik determinatsiya koeffitsienti va korrelyatsion nisbat η ni toping. Xulosa yozing.<\/p>", "sol": "<p><b>a)<\/b> Guruh ichidagi dispersiyalarning o‘rtachasi: σ̄²<sub>ichki<\/sub> = Σσ²<sub>j<\/sub>n<sub>j<\/sub> / Σn<sub>j<\/sub> = (16·20 + 25·30 + 36·50) / 100 = (320 + 750 + 1800) / 100 = <b>28,70<\/b>.<\/p><p><b>b)<\/b> Umumiy o‘rtacha: x̄ = Σx̄<sub>j<\/sub>n<sub>j<\/sub> / Σn<sub>j<\/sub> = (30·20 + 36·30 + 40·50) / 100 = 3680 / 100 = <b>36,8<\/b> s/ga.<\/p><p>Guruhlararo dispersiya: δ² = Σ(x̄<sub>j<\/sub> − x̄)²n<sub>j<\/sub> / Σn<sub>j<\/sub> = [(30 − 36,8)²·20 + (36 − 36,8)²·30 + (40 − 36,8)²·50] / 100 = (924,8 + 19,2 + 512) / 100 = <b>14,56<\/b>.<\/p><p><b>c)<\/b> Dispersiyalarni qo‘shish qoidasi: σ²<sub>umumiy<\/sub> = σ̄²<sub>ichki<\/sub> + δ² = 28,7 + 14,56 = <b>43,26<\/b>.<\/p><p><b>d)<\/b> Empirik determinatsiya koeffitsienti: η² = δ² / σ² = 14,56 / 43,26 = <b>0,337<\/b> (33,7%); empirik korrelyatsion nisbat: η = √η² = <b>0,580<\/b>.<\/p>", "ans": "σ̄²_ichki = 28,7; δ² = 14,56; σ² = 43,26; η² ≈ 0,337, η ≈ 0,58 — hosildorlik variatsiyasining ≈ 33,7% i guruhlash belgisiga bog‘liq, bog‘lanish o‘rtacha kuchli (sezilarli).", "t": "boglanish", "status": "rewritten", "note": "Original contained only a generic template with no numbers; solved fully (σ̄² = 28,7; δ² = 14,56; σ² = 43,26; η² = 0,337; η = 0,58).", "id": "sm-30", "src": "stat"}, {"n": 31, "part": 3, "title": "χ² mustaqillik testi: jins va to‘lov usuli", "cond": "<p>Mijozlarning to‘lov usulini tanlashi jinsga bog‘liqmi? 400 nafar mijoz so‘rovi natijalari:<\/p><table><tr><th>Jins<\/th><th>Naqd pul<\/th><th>Plastik karta<\/th><th>Mobil ilova<\/th><th>Jami<\/th><\/tr><tr><td>Erkak<\/td><td>48<\/td><td>72<\/td><td>60<\/td><td>180<\/td><\/tr><tr><td>Ayol<\/td><td>32<\/td><td>78<\/td><td>110<\/td><td>220<\/td><\/tr><tr><td>Jami<\/td><td>80<\/td><td>150<\/td><td>170<\/td><td>400<\/td><\/tr><\/table><p>a) H₀ va H₁ ni yozing, kutilayotgan chastotalarni hisoblang.<\/p><p>b) χ² statistika, erkinlik darajasi va p-qiymatni toping (α = 0,05; kritik χ²₀,₀₅;₂ = 5,991).<\/p>", "sol": "<p><b>a)<\/b> H₀: to‘lov usulini tanlash jinsga bog‘liq emas (mustaqil). H₁: bog‘liq.<\/p><p>Kutilayotgan chastotalar: Eᵢⱼ = (satr jami·ustun jami)/n. Masalan, E(erkak, naqd) = 180·80/400 = 36.<\/p><table><tr><th>Jins<\/th><th>Naqd pul: O / E / (O−E)²/E<\/th><th>Plastik karta: O / E / (O−E)²/E<\/th><th>Mobil ilova: O / E / (O−E)²/E<\/th><\/tr><tr><td>Erkak<\/td><td>48 / 36,0 / 4,000<\/td><td>72 / 67,5 / 0,300<\/td><td>60 / 76,5 / 3,559<\/td><\/tr><tr><td>Ayol<\/td><td>32 / 44,0 / 3,273<\/td><td>78 / 82,5 / 0,245<\/td><td>110 / 93,5 / 2,912<\/td><\/tr><\/table><p><b>b)<\/b> χ² = Σ(O − E)²/E = 4,000 + 0,300 + 3,559 + 3,273 + 0,245 + 2,912 = <b>14,29<\/b>; df = (r − 1)(c − 1) = (2 − 1)(3 − 1) = <b>2<\/b>.<\/p><p>p-qiymat = P(χ²₂ ≥ 14,29) ≈ <b>0,0008<\/b>. χ² = 14,29 &gt; 5,991 va p &lt; 0,05 → <b>H₀ rad etiladi<\/b>.<\/p>", "ans": "χ² = 14,29 &gt; 5,991 (p ≈ 0,0008): to‘lov usuli jinsga bog‘liq. Ayollar mobil ilovani kutilganidan ko‘p (110 ga qarshi 93,5), erkaklar naqd pulni ko‘proq (48 ga qarshi 36) tanlaydi.", "t": "gipoteza", "status": "fixed", "note": "χ² was wrong: original 12,98, correct 14,29 (p ≈ 0,0008); conclusion (reject H₀) unchanged; p-value was missing. Data table came from the source’s example 30 block.", "id": "sm-31", "src": "stat"}, {"n": 32, "part": 2, "title": "χ² moslik testi: filiallar bo‘yicha mijozlar", "cond": "<p>Bank to‘rtta filialga mijozlar oqimi teng taqsimlanadi deb hisoblaydi. 120 nafar yangi mijoz filiallar bo‘yicha taqsimlanishi: 38; 25; 31; 26.<\/p><p>a) Gipotezalarni yozing va kutilayotgan chastotalarni toping.<\/p><p>b) χ² statistikani hisoblang va qaror qabul qiling (α = 0,05; kritik χ²₀,₀₅;₃ = 7,815).<\/p>", "sol": "<p><b>a)<\/b> H₀: mijozlar filiallar bo‘yicha teng taqsimlanadi (p₁ = p₂ = p₃ = p₄ = 0,25). H₁: taqsimot teng emas.<\/p><p>Kutilayotgan chastota: E = n·p = 120·0,25 = 30 (har bir filial uchun).<\/p><table><tr><th>Filial<\/th><th>O<\/th><th>E<\/th><th>O − E<\/th><th>(O − E)²/E<\/th><\/tr><tr><td>1<\/td><td>38<\/td><td>30<\/td><td>8<\/td><td>2,133<\/td><\/tr><tr><td>2<\/td><td>25<\/td><td>30<\/td><td>-5<\/td><td>0,833<\/td><\/tr><tr><td>3<\/td><td>31<\/td><td>30<\/td><td>1<\/td><td>0,033<\/td><\/tr><tr><td>4<\/td><td>26<\/td><td>30<\/td><td>-4<\/td><td>0,533<\/td><\/tr><tr><td>Jami<\/td><td>120<\/td><td>120<\/td><td>0<\/td><td>3,533<\/td><\/tr><\/table><p><b>b)<\/b> χ² = Σ(O − E)²/E = (64 + 25 + 1 + 16)/30 = <b>3,53<\/b>; df = k − 1 = 4 − 1 = 3.<\/p><p>χ² = 3,53 &lt; χ²kr = 7,815 (p ≈ 0,32 &gt; 0,05) → <b>H₀ rad etilmaydi<\/b>.<\/p>", "ans": "χ² = 3,53 &lt; 7,815 (p ≈ 0,32): mijozlar oqimi filiallar bo‘yicha teng taqsimlangan degan farazni rad etishga asos yo‘q, farqlar tasodifiy.", "t": "gipoteza", "status": "rewritten", "note": "Original had only a generic placeholder with no calculation; correct χ² = 3,53 < 7,815, H₀ not rejected.", "id": "sm-32", "src": "stat"}, {"n": 33, "part": 3, "title": "Fexner koeffitsienti", "cond": "<p>10 ta do‘konda reklama xarajatlari (x, mln so‘m) va oylik sotuv hajmi (y, mln so‘m):<\/p><table><tr><th>Do‘kon<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><th>10<\/th><\/tr><tr><td>x<\/td><td>10<\/td><td>12<\/td><td>15<\/td><td>18<\/td><td>20<\/td><td>22<\/td><td>25<\/td><td>28<\/td><td>30<\/td><td>34<\/td><\/tr><tr><td>y<\/td><td>52<\/td><td>50<\/td><td>58<\/td><td>57<\/td><td>66<\/td><td>61<\/td><td>70<\/td><td>68<\/td><td>77<\/td><td>75<\/td><\/tr><\/table><p>a) x̄ va ȳ ni toping, har bir juftlik uchun chetlanish ishoralarini aniqlang.<\/p><p>b) Fexner koeffitsienti K = (C − H)/(C + H) ni hisoblang.<\/p><p>c) Xulosa yozing.<\/p>", "sol": "<p><b>a)<\/b> x̄ = 214/10 = <b>21,4<\/b>; ȳ = 634/10 = <b>63,4<\/b>.<\/p><table><tr><th>Do‘kon<\/th><th>x<\/th><th>y<\/th><th>x − x̄ ishorasi<\/th><th>y − ȳ ishorasi<\/th><th>Natija<\/th><\/tr><tr><td>1<\/td><td>10<\/td><td>52<\/td><td>−<\/td><td>−<\/td><td>C (mos)<\/td><\/tr><tr><td>2<\/td><td>12<\/td><td>50<\/td><td>−<\/td><td>−<\/td><td>C (mos)<\/td><\/tr><tr><td>3<\/td><td>15<\/td><td>58<\/td><td>−<\/td><td>−<\/td><td>C (mos)<\/td><\/tr><tr><td>4<\/td><td>18<\/td><td>57<\/td><td>−<\/td><td>−<\/td><td>C (mos)<\/td><\/tr><tr><td>5<\/td><td>20<\/td><td>66<\/td><td>−<\/td><td>+<\/td><td>H (mos emas)<\/td><\/tr><tr><td>6<\/td><td>22<\/td><td>61<\/td><td>+<\/td><td>−<\/td><td>H (mos emas)<\/td><\/tr><tr><td>7<\/td><td>25<\/td><td>70<\/td><td>+<\/td><td>+<\/td><td>C (mos)<\/td><\/tr><tr><td>8<\/td><td>28<\/td><td>68<\/td><td>+<\/td><td>+<\/td><td>C (mos)<\/td><\/tr><tr><td>9<\/td><td>30<\/td><td>77<\/td><td>+<\/td><td>+<\/td><td>C (mos)<\/td><\/tr><tr><td>10<\/td><td>34<\/td><td>75<\/td><td>+<\/td><td>+<\/td><td>C (mos)<\/td><\/tr><\/table><p><b>b)<\/b> C = 8, H = 2; K = (C − H)/(C + H) = (8 − 2)/10 = <b>0,6<\/b>.<\/p><p><b>c)<\/b> K musbat va 0,5 dan katta — reklama xarajatlari va sotuv hajmi o‘rtasida to‘g‘ri, sezilarli bog‘lanish bor (faqat 5- va 6-do‘konlarda ishoralar mos kelmaydi).<\/p>", "ans": "Fexner koeffitsienti K = 0,6: reklama xarajatlari oshgan sari sotuv hajmi ham oshish tendensiyasiga ega (to‘g‘ri bog‘lanish).", "t": "boglanish", "status": "ok", "note": "Correct (x̄ = 21,4, ȳ = 63,4, C = 8, H = 2, K = 0,6); its data table had been merged into example 32 and is restored here.", "id": "sm-33", "src": "stat"}, {"n": 34, "part": 2, "title": "Spirman rang korrelyatsiyasi", "cond": "<p>8 ta hudud bo‘yicha aholi jon boshiga o‘rtacha daromad (x) va iste’mol xarajati (y), ming so‘m:<\/p><table><tr><th>Hudud<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><\/tr><tr><td>x<\/td><td>3200<\/td><td>2800<\/td><td>4100<\/td><td>3600<\/td><td>2500<\/td><td>3900<\/td><td>3000<\/td><td>4500<\/td><\/tr><tr><td>y<\/td><td>2900<\/td><td>2700<\/td><td>3300<\/td><td>3400<\/td><td>2300<\/td><td>3100<\/td><td>2800<\/td><td>3800<\/td><\/tr><\/table><p>a) Har bir qator bo‘yicha ranglarni aniqlang va rang farqlari d ni hisoblang.<\/p><p>b) Spirman koeffitsienti ρ = 1 − 6Σd²/(n(n²−1)) ni toping.<\/p><p>c) Ahamiyatliligini t = ρ√((n−2)/(1−ρ²)) bo‘yicha tekshiring (df = 6; kritik t₀,₀₂₅ = 2,447).<\/p>", "sol": "<p><b>a)<\/b> Har bir qatorda qiymatlar o‘sish tartibida ranglanadi (eng kichigi — 1-rang):<\/p><table><tr><th>Hudud<\/th><th>x<\/th><th>Rx<\/th><th>y<\/th><th>Ry<\/th><th>d = Rx − Ry<\/th><th>d²<\/th><\/tr><tr
